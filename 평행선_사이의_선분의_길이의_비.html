<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>평행선 사이의 선분의 길이의 비</title>
<style>
:root{
  --ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#9090b0;
  --indigo:#4f46e5;--indigo-l:#e0e7ff;--indigo-ll:#eef2ff;
  --green:#16a34a;--green-l:#dcfce7;--green-ll:#F0FDF4;
  --orange:#e05a20;--red:#dc2626;--red-l:#fee2e2;
  --r:12px;--shadow:0 2px 12px rgba(26,26,46,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--indigo-ll);color:var(--ink);min-height:100vh;padding-bottom:60px}
.seg{text-decoration:overline;text-decoration-thickness:1.2px}
.parasym{display:inline-block;transform:skewX(-16deg);font-weight:400}
.hdr{background:var(--indigo);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}
.hdr-title{font-size:16px;font-weight:700}
.main{max-width:1200px;margin:0 auto;padding:20px 16px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:var(--r);border:1px solid #e0e7ff;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.key-q{font-size:15.5px;font-weight:800;text-decoration:underline;text-decoration-color:var(--indigo);text-decoration-thickness:2.5px;text-underline-offset:3px}

.split-layout{display:flex;gap:18px;align-items:flex-start}
.split-left{flex:0 0 480px;position:sticky;top:16px}
.split-right{flex:1 1 auto;min-width:0}
@media (max-width:980px){
  .split-layout{display:block}
  .split-left{position:static;width:100%;margin-bottom:14px}
}

.draw-toolbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.draw-toolbar-label{font-size:12px;color:var(--ink3);font-weight:700;margin-right:2px}
.mode-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink);font-family:inherit}
.mode-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.color-swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #d8ddfb;cursor:pointer;padding:0;flex-shrink:0}
.color-swatch.active{box-shadow:0 0 0 2.5px var(--indigo)}
.eraser-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink);font-family:inherit}
.eraser-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.draw-wrap{position:relative;margin-bottom:10px}
.svg-wrap{background:#fbfcff;border-radius:10px 10px 0 0;border:1px solid #eee;border-bottom:none}
.svg-wrap svg{width:100%;height:auto;display:block;touch-action:none}
.scratch-area{height:90px;background:#fbfcff;border:1px dashed #d8ddfb;border-top:none;border-radius:0 0 10px 10px}
.ink-canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.vlabel{font-size:14px;font-weight:800;text-anchor:middle}
.vlabel-sm{font-size:11.5px;font-weight:800;text-anchor:middle}
.linelabel{font-size:13px;font-weight:800;text-anchor:middle;fill:#9098b5}
.sidecurve{fill:none;stroke:#9098b5;stroke-width:1.4;stroke-dasharray:4 3}
.edgelen{font-size:12px;font-weight:700;text-anchor:middle;fill:#4a5568}

.panel-title{font-weight:800;font-size:15px;color:var(--indigo);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--indigo);color:#fff;font-size:12px;font-weight:800}
.proof-block{background:#fbfcff;border:1.5px solid var(--indigo-l);border-radius:10px;padding:14px;margin:10px 0;font-size:14.5px;line-height:2.3}
.blank{display:inline-block;width:52px;border:none;border-bottom:2px solid var(--indigo);background:transparent;text-align:center;font-weight:700;font-size:14px;font-family:inherit;padding:2px 4px;margin:0 2px;color:var(--indigo)}
.blank:focus{outline:none;border-bottom-color:#3730a3;background:var(--indigo-ll)}
.blank.correct{border-bottom-color:var(--green);background:var(--green-ll);color:#14532d}
.blank.wrong{border-bottom-color:var(--red);background:var(--red-l);color:var(--red)}
.btn{border:none;border-radius:12px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.btn:hover{background:#4338ca}
.btn:disabled{opacity:.4;cursor:default}
.btn-check{background:var(--green)}
.btn-check:hover{background:#128a3e}
.btn-primary{background:var(--indigo)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.feedback{text-align:center;font-size:13.5px;font-weight:700;min-height:20px;margin-top:8px}
.feedback.success{color:var(--green)}
.feedback.error{color:var(--red)}
.summary-box{background:var(--indigo-ll);border:1.5px solid var(--indigo-l);border-radius:10px;padding:16px;text-align:center;font-size:15px;font-weight:700;color:var(--indigo);line-height:2}

.stage-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.stage-tab{flex:1;max-width:160px;padding:9px 6px;border-radius:10px;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink3);background:#fff;border:1.5px solid #e0e7ff}
.stage-tab.active{color:#fff;background:var(--indigo);border-color:var(--indigo)}
.stage-tab.done{color:#fff;background:var(--green);border-color:var(--green)}
.progress{text-align:center;font-weight:800;color:var(--indigo);font-size:13px;margin-bottom:8px}
.qtext{font-size:14.5px;font-weight:700;line-height:1.7;margin-bottom:10px;text-align:center}
.answer-block{background:#fbfcff;border:1.5px solid var(--indigo-l);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:13.5px;line-height:2.4;text-align:center}

.done-wrap{text-align:center;padding:24px 10px}
.done-icon{font-size:48px;margin-bottom:10px}
.done-score{font-size:30px;font-weight:800;color:var(--indigo);margin:8px 0}
.done-score.fail{color:var(--red)}
.primary-btn{padding:11px 26px;border-radius:8px;background:var(--indigo);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;margin-right:8px}
.restart-btn{padding:11px 26px;border-radius:8px;background:var(--ink);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px 20px;max-width:360px;text-align:center;box-shadow:0 8px 32px rgba(26,26,46,0.25)}
.modal-icon{font-size:34px;margin-bottom:8px}
.modal-text{font-size:14px;line-height:1.7;color:var(--ink);font-weight:600;margin-bottom:16px}
.modal-btn{border:none;border-radius:10px;padding:10px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.modal-btn:hover{background:#4338ca}
</style>
</head>
<body>

<div class="hdr">
  <a href="index.html" id="hubBackLink" style="background:rgba(255,255,255,.2);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;">← 학습 선택 목록으로 돌아가기</a>
  <span class="hdr-title">평행선 사이의 선분의 길이의 비</span>
  <button id="adminBtn" onclick="openAdminModal()" style="margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;cursor:pointer;font-family:inherit">🔐 관리자 모드</button>
</div>
<script>document.getElementById('hubBackLink').href = 'index.html' + location.search;</script>

<div class="main">

  <div class="screen active" id="scProve">
    <div class="split-layout">
      <div class="split-left card">
        <div class="draw-toolbar">
          <span class="draw-toolbar-label">✏️ 계산 연습장:</span>
          <button class="mode-btn" id="provePenBtn" onclick="drawSetMode('prove','pen')">✏️ 펜(필기)</button>
          <button class="color-swatch active" style="background:#1a1a2e" onclick="drawSelectColor('prove','#1a1a2e',this)" title="검정"></button>
          <button class="color-swatch" style="background:#dc2626" onclick="drawSelectColor('prove','#dc2626',this)" title="빨강"></button>
          <button class="color-swatch" style="background:#2563eb" onclick="drawSelectColor('prove','#2563eb',this)" title="파랑"></button>
          <button class="color-swatch" style="background:#16a34a" onclick="drawSelectColor('prove','#16a34a',this)" title="초록"></button>
          <button class="color-swatch" style="background:#eab308" onclick="drawSelectColor('prove','#eab308',this)" title="노랑"></button>
        </div>
        <div class="draw-toolbar">
          <button class="eraser-btn" id="proveEraserBtn" onclick="drawToggleEraser('prove')">🧽 지우개</button>
          <button class="mode-btn active" id="provePointerBtn" onclick="drawSetMode('prove','pointer')">🖱️ 마우스(도형 조작)</button>
        </div>
        <div class="draw-wrap" id="proveDrawWrap">
          <div class="svg-wrap"><svg id="proveSvg" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg"></svg></div>
          <div class="scratch-area"></div>
          <canvas id="proveInk" class="ink-canvas"></canvas>
        </div>
        <div class="btn-row" id="proveMoveRow">
          <button class="btn" id="proveMoveBtn" onclick="proveAnimateCase()" style="background:var(--red)">↔️ 직선 q 움직이기</button>
          <button class="btn" id="proveResetBtn" onclick="proveResetLine()" style="background:#fff;color:var(--red);border:1.5px solid var(--red);display:none">↩️ 제자리로</button>
        </div>
      </div>
      <div class="split-right card">
        <div id="provePanel"></div>
      </div>
    </div>
  </div>

  <div class="screen" id="scQuiz">
    <div class="concept" style="background:#fff;border-left:3px solid var(--indigo);border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:14px;font-size:13px;color:var(--ink);line-height:1.8">
      <strong>정리:</strong> 세 직선 l<span class="parasym">∥</span>m<span class="parasym">∥</span>n이 두 직선 p, q와 만나는 점을 각각 A,B,C / D,E,F라고 하면 <span class="seg">AB</span>:<span class="seg">BC</span>=<span class="seg">DE</span>:<span class="seg">EF</span>예요.
    </div>
    <div class="stage-tabs" id="stageTabs"></div>
    <div class="split-layout">
      <div class="split-left card">
        <div class="draw-toolbar">
          <span class="draw-toolbar-label">✏️ 계산 연습장:</span>
          <button class="mode-btn active" id="quizPenBtn" onclick="drawSetMode('quiz','pen')">✏️ 펜(필기)</button>
          <button class="color-swatch active" style="background:#1a1a2e" onclick="drawSelectColor('quiz','#1a1a2e',this)" title="검정"></button>
          <button class="color-swatch" style="background:#dc2626" onclick="drawSelectColor('quiz','#dc2626',this)" title="빨강"></button>
          <button class="color-swatch" style="background:#2563eb" onclick="drawSelectColor('quiz','#2563eb',this)" title="파랑"></button>
          <button class="color-swatch" style="background:#16a34a" onclick="drawSelectColor('quiz','#16a34a',this)" title="초록"></button>
          <button class="color-swatch" style="background:#eab308" onclick="drawSelectColor('quiz','#eab308',this)" title="노랑"></button>
        </div>
        <div class="draw-toolbar">
          <button class="eraser-btn" id="quizEraserBtn" onclick="drawToggleEraser('quiz')">🧽 지우개</button>
          <button class="mode-btn" id="quizPointerBtn" onclick="drawSetMode('quiz','pointer')">🖱️ 마우스(도형 조작)</button>
        </div>
        <div class="draw-wrap" id="quizDrawWrap">
          <div class="svg-wrap"><svg id="quizSvg" viewBox="0 0 440 360" xmlns="http://www.w3.org/2000/svg"></svg></div>
          <div class="scratch-area"></div>
          <canvas id="quizInk" class="ink-canvas"></canvas>
        </div>
        <div class="act-hint" style="font-size:12px;color:var(--ink3);text-align:center;margin-bottom:8px">증명에서처럼, 직선 q를 평행하게 옮겨서 점 A를 지나게 하면 힌트가 될 거예요.</div>
        <div class="btn-row">
          <button class="btn" id="quizMoveBtn" onclick="quizAnimateLine()" style="background:var(--red)">↔️ 직선 평행이동 보기</button>
          <button class="btn" id="quizResetBtn" onclick="quizResetLine()" style="background:#fff;color:var(--red);border:1.5px solid var(--red);display:none">↩️ 제자리로</button>
        </div>
      </div>
      <div class="split-right card">
        <div class="progress" id="quizProgress">유형1 · 1 / 3</div>
        <div class="qtext" id="quizQtext">다음 그림에서 x의 값을 구하시오.</div>
        <div class="answer-block">
          x = <input class="blank" id="qAnsX" inputmode="numeric">
        </div>
        <div class="btn-row"><button class="btn" id="quizCheckBtn" onclick="quizCheck()">확인</button></div>
        <div class="feedback" id="quizFb"></div>
      </div>
    </div>
  </div>

  <div class="screen" id="scStageResult">
    <div class="card">
      <div class="done-wrap">
        <div class="done-icon" id="srIcon">🎉</div>
        <div id="srTitle" style="font-weight:800;font-size:16px"></div>
        <div class="done-score" id="srScore"></div>
        <div id="srMsg" style="color:var(--ink2)"></div>
        <button class="primary-btn" id="srNextBtn" onclick="srNext()">다음으로</button>
        <button class="restart-btn" id="srRetryBtn" onclick="srRetry()" style="display:none">🔄 이 유형 다시 풀기</button>
      </div>
    </div>
  </div>

  <div class="screen" id="scDone">
    <div class="card">
      <div class="done-wrap">
        <div class="done-icon">🏁</div>
        <h2>학습 완료!</h2>
        <p style="color:var(--ink2);margin-top:8px">평행선 사이의 선분의 길이의 비에 대한 증명과 유형1·유형2 문제를 모두 통과했어요.</p>
        <button class="primary-btn" onclick="finishToHub()">✅ 학습 완료</button>
        <button class="restart-btn" onclick="location.reload()">🔄 처음부터 다시</button>
      </div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="adminPwModal">
  <div class="modal-box">
    <div class="modal-icon">🔐</div>
    <div class="modal-text">관리자 비밀번호를 입력하세요</div>
    <input type="password" id="adminPwInput" class="blank" style="width:160px;margin-bottom:10px" onkeydown="if(event.key==='Enter')checkAdminPassword()">
    <div id="adminPwErr" style="color:var(--red);font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:4px"></div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="modal-btn" onclick="checkAdminPassword()">확인</button>
      <button class="modal-btn" style="background:#9090b0" onclick="document.getElementById('adminPwModal').classList.remove('show')">취소</button>
    </div>
  </div>
</div>
<div id="adminPanel" style="display:none;position:fixed;bottom:16px;right:16px;width:320px;max-height:70vh;overflow-y:auto;background:#fff;border:2px solid var(--indigo);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(26,26,46,0.3);z-index:40;font-size:12px;line-height:1.75">
  <div style="font-weight:800;color:var(--indigo);margin-bottom:8px">🔐 관리자 모드</div>
  <div id="adminPanelBody"></div>
  <button onclick="document.getElementById('adminPanel').style.display='none'" style="margin-top:8px;background:none;border:none;color:var(--ink3);font-size:11px;cursor:pointer;text-decoration:underline;font-family:inherit">숨기기</button>
</div>

<script>

  let _db=null;
  try{
    firebase.initializeApp({
      apiKey: "AIzaSyDUFYrqaVL12fZ7ZhExVyyjLWSE_XJ_bHs",
      authDomain: "nd-deogi-math-hub.firebaseapp.com",
      projectId: "nd-deogi-math-hub",
      storageBucket: "nd-deogi-math-hub.firebasestorage.app",
      messagingSenderId: "414096731864",
      appId: "1:414096731864:web:a799f9450859c498b6b1ad"

      .catch(err=>console.warn('hub complete log failed', err));
  };
})();
function finishToHub(){ document.getElementById('hubBackLink').click(); }
</script>
<script>
/* ════════════════════════════════
   공용 기하 헬퍼
════════════════════════════════ */
function dist(p,q){ return Math.hypot(p[0]-q[0],p[1]-q[1]); }
function lerp(p,q,t){ return [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t]; }
function unitVec(from,to){ const dx=to[0]-from[0],dy=to[1]-from[1],l=Math.hypot(dx,dy)||1; return [dx/l,dy/l]; }
function bboxCenterOf(pts){ const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); return [(Math.min(...xs)+Math.max(...xs))/2, (Math.min(...ys)+Math.max(...ys))/2]; }
function bboxSizeOf(pts){ const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); return { w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys) }; }
function outwardLabel(p, centroid, d){ const dx=p[0]-centroid[0], dy=p[1]-centroid[1], len=Math.hypot(dx,dy)||1; return [p[0]+dx/len*d, p[1]+dy/len*d]; }
function ptsToStr(pts){ return pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' '); }
function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function sideLabelSVGAt(p1, p2, centroid, value, bulge, t, color){
  t = (t===undefined)?0.5:t;
  const mid=[p1[0]+(p2[0]-p1[0])*t, p1[1]+(p2[1]-p1[1])*t];
  const ex=p2[0]-p1[0], ey=p2[1]-p1[1], elen=Math.hypot(ex,ey)||1;
  let dx=-ey/elen, dy=ex/elen;
  const toMid=[mid[0]-centroid[0], mid[1]-centroid[1]];
  if(dx*toMid[0]+dy*toMid[1] < 0){ dx=-dx; dy=-dy; }
  const ctrl=[mid[0]+dx*bulge, mid[1]+dy*bulge];
  const labelPt=[mid[0]+dx*(bulge+12), mid[1]+dy*(bulge+12)];
  const strokeAttr = color ? ` style="stroke:${color}"` : '';
  const fillAttr = color ? ` style="fill:${color}"` : '';
  return `<path class="sidecurve"${strokeAttr} d="M ${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Q ${ctrl[0].toFixed(1)} ${ctrl[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}"></path>`+
    `<text class="edgelen"${fillAttr} x="${labelPt[0].toFixed(1)}" y="${labelPt[1].toFixed(1)}">${value}</text>`;
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function numMatches(v, expected, tol){ return isFinite(v) && Math.abs(v-expected) < (tol||0.05); }
function normText(v){ return String(v||'').trim().replace(/\s+/g,''); }
function tokenizeSeg(s){
  const tokens = [];
  for(let i=0;i<s.length;i++){
    let tok = s[i];
    if(s[i+1]==="'"){ tok+="'"; i++; }
    tokens.push(tok);
  }
  return tokens;
}
function sameSeg(v, correct){
  const nv = normText(v).toUpperCase().replace(/′/g,"'");
  const nc = normText(correct).toUpperCase().replace(/′/g,"'");
  if(nv===nc) return true;
  return tokenizeSeg(nv).slice().reverse().join('')===nc;
}
function fitGeoToCanvas(g, targetCx, targetCy, maxW, maxH){
  const keys = Object.keys(g).filter(k=>Array.isArray(g[k]));
  const pts = keys.map(k=>g[k]);
  const sz=bboxSizeOf(pts), cen=bboxCenterOf(pts);
  const scale=Math.min(1, maxW/sz.w, maxH/sz.h);
  const out={};
  Object.keys(g).forEach(k=>{
    if(Array.isArray(g[k])){ const p=g[k]; out[k]=[targetCx+(p[0]-cen[0])*scale, targetCy+(p[1]-cen[1])*scale]; }
    else out[k]=g[k];
  });
  return out;
}

/* 세 평행선 l,m,n을 두 직선 p(A,B,C), q(D,E,F)가 가로지르는 구조의 공용 기하 */
function buildParallelGeo(A, D, rp, rq, dyLM, dyMN){
  const B=[A[0]+rp*dyLM, A[1]+dyLM], C=[B[0]+rp*dyMN, B[1]+dyMN];
  const E=[D[0]+rq*dyLM, D[1]+dyLM], F=[E[0]+rq*dyMN, E[1]+dyMN];
  const vec=[A[0]-D[0], A[1]-D[1]];
  const Ep=[E[0]+vec[0], E[1]+vec[1]], Fp=[F[0]+vec[0], F[1]+vec[1]];
  return {A,B,C,D,E,F,Ep,Fp, rq};
}
/* l,m,n 기준선 + p,q(및 옵션으로 q') 렌더링. opts:{showQPrime, fadeQ, labels:{AB,BC,DE,EF}(값 또는 null→숫자표시안함), given:{AB,BC,DE,EF}(true/false, false면 x로 표시)} */
function drawParallelLines(g, extra, opts){
  opts = opts||{};
  const Y_L=g.A[1], Y_M=g.B[1], Y_N=g.C[1];
  const xs=[g.A[0],g.B[0],g.C[0],g.D[0],g.E[0],g.F[0]];
  if(opts.showQPrime){ xs.push(g.Ep[0],g.Fp[0]); }
  const minX=Math.min(...xs)-50, maxX=Math.max(...xs)+40;
  let html='';
  [['l',Y_L],['m',Y_M],['n',Y_N]].forEach(([nm,y])=>{
    html += `<line x1="${minX.toFixed(1)}" y1="${y.toFixed(1)}" x2="${maxX.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#c7cdf5" stroke-width="1.6"></line>`;
    html += `<text class="linelabel" x="${(minX-14).toFixed(1)}" y="${(y+4).toFixed(1)}">${nm}</text>`;
  });
  // p (A-B-C) : indigo, 항상 실선 100% 보임
  html += `<line x1="${g.A[0].toFixed(1)}" y1="${g.A[1].toFixed(1)}" x2="${g.C[0].toFixed(1)}" y2="${g.C[1].toFixed(1)}" stroke="#4f46e5" stroke-width="2.4"></line>`;
  // q (D-E-F) : orange, fadeQ면 반투명
  html += `<line x1="${g.D[0].toFixed(1)}" y1="${g.D[1].toFixed(1)}" x2="${g.F[0].toFixed(1)}" y2="${g.F[1].toFixed(1)}" stroke="#e05a20" stroke-width="2.4" opacity="${opts.fadeQ?0.4:1}"></line>`;
  if(opts.showQPrime){
    html += `<line x1="${g.A[0].toFixed(1)}" y1="${g.A[1].toFixed(1)}" x2="${g.Fp[0].toFixed(1)}" y2="${g.Fp[1].toFixed(1)}" stroke="#dc2626" stroke-width="2.4"></line>`;
  }
  const pts=[['A',g.A,'#4f46e5'],['B',g.B,'#4f46e5'],['C',g.C,'#4f46e5'],['D',g.D,'#e05a20'],['E',g.E,'#e05a20'],['F',g.F,'#e05a20']];
  pts.forEach(([nm,pt,c])=>{
    const op = (opts.fadeQ && (nm==='D'||nm==='E'||nm==='F')) ? 0.45 : 1;
    html += `<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="3.2" fill="${c}" opacity="${op}"></circle>`;
    const dir = (nm==='A'||nm==='D') ? -1 : 1;
    html += `<text class="vlabel" x="${(pt[0]+ (nm==='D'||nm==='E'||nm==='F'?14:-14)).toFixed(1)}" y="${(pt[1]-6).toFixed(1)}" fill="${c}" opacity="${op}">${nm}</text>`;
  });
  if(opts.showQPrime){
    [['E′',g.Ep],['F′',g.Fp]].forEach(([nm,pt])=>{
      html += `<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="3.2" fill="#dc2626"></circle>`;
      html += `<text class="vlabel" x="${(pt[0]+14).toFixed(1)}" y="${(pt[1]-6).toFixed(1)}" fill="#dc2626">${nm}</text>`;
    });
  }
  if(opts.labels){
    const cen = bboxCenterOf([g.A,g.B,g.C,g.D,g.E,g.F]);
    const L = opts.labels;
    if(L.AB!=null) html += sideLabelSVGAt(g.A,g.B,cen,L.AB,10,0.5,'#4f46e5');
    if(L.BC!=null) html += sideLabelSVGAt(g.B,g.C,cen,L.BC,10,0.5,'#4f46e5');
    if(L.DE!=null) html += sideLabelSVGAt(g.D,g.E,cen,L.DE,10,0.5,'#e05a20');
    if(L.EF!=null) html += sideLabelSVGAt(g.E,g.F,cen,L.EF,10,0.5,'#e05a20');
  }
  return html + (extra||'');
}

const drawSt = {};
function drawGetSt(key){ if(!drawSt[key]) drawSt[key]={ color:'#1a1a2e', erasing:false, drawing:false, lastX:0, lastY:0, mode:'pointer' }; return drawSt[key]; }
function drawSetMode(key, mode){
  const d = drawGetSt(key);
  d.mode = mode;
  document.getElementById(key+'PenBtn').classList.toggle('active', mode==='pen');
  document.getElementById(key+'PointerBtn').classList.toggle('active', mode==='pointer');
  document.getElementById(key+'Ink').style.pointerEvents = (mode==='pointer') ? 'none' : 'auto';
}
function drawSetupCanvas(key){
  const wrap = document.getElementById(key+'DrawWrap');
  const canvas = document.getElementById(key+'Ink');
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width*dpr));
  canvas.height = Math.max(1, Math.round(rect.height*dpr));
  canvas.style.width = rect.width+'px';
  canvas.style.height = rect.height+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
  drawUpdateCursor(key);
}
function drawCanvasPoint(key, evt){
  const canvas = document.getElementById(key+'Ink');
  const rect = canvas.getBoundingClientRect();
  return { x: evt.clientX-rect.left, y: evt.clientY-rect.top };
}
const drawBound = {};
function drawBindOnce(key){
  if(drawBound[key]) return;
  drawBound[key]=true;
  const canvas = document.getElementById(key+'Ink');
  const d = drawGetSt(key);
  canvas.addEventListener('pointerdown', evt=>{
    d.drawing=true; canvas.setPointerCapture(evt.pointerId);
    const p=drawCanvasPoint(key,evt); d.lastX=p.x; d.lastY=p.y;
  });
  canvas.addEventListener('pointermove', evt=>{
    if(!d.drawing) return;
    const p=drawCanvasPoint(key,evt);
    const ctx=canvas.getContext('2d');
    ctx.beginPath(); ctx.moveTo(d.lastX,d.lastY); ctx.lineTo(p.x,p.y);
    if(d.erasing){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=24; }
    else{ ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=d.color; ctx.lineWidth=3; }
    ctx.stroke();
    d.lastX=p.x; d.lastY=p.y;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(evtName=>canvas.addEventListener(evtName, ()=>{ d.drawing=false; }));
  window.addEventListener('resize', ()=>{
    const scr = key==='prove' ? 'scProve' : 'scQuiz';
    if(document.getElementById(scr).classList.contains('active')) drawSetupCanvas(key);
  });
  drawSetMode(key, d.mode);
}
function drawSelectColor(key, color, btn){
  const d=drawGetSt(key); d.color=color; d.erasing=false; d.lastColorBtn=btn;
  const scr = key==='prove' ? '#scProve' : '#scQuiz';
  document.querySelectorAll(scr+' .color-swatch').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById(key+'EraserBtn').classList.remove('active');
  drawUpdateCursor(key);
}
function drawToggleEraser(key){
  const d=drawGetSt(key);
  const scr = key==='prove' ? '#scProve' : '#scQuiz';
  if(d.erasing){
    d.erasing=false;
    document.getElementById(key+'EraserBtn').classList.remove('active');
    const btn = d.lastColorBtn || document.querySelector(scr+' .color-swatch');
    if(btn) btn.classList.add('active');
  } else {
    d.erasing=true;
    document.querySelectorAll(scr+' .color-swatch').forEach(b=>b.classList.remove('active'));
    document.getElementById(key+'EraserBtn').classList.add('active');
  }
  drawUpdateCursor(key);
}
function drawMakeCursorURL(draw, size){
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  draw(c.getContext('2d'), size);
  return c.toDataURL('image/png');
}
function drawUpdateCursor(key){
  const canvas = document.getElementById(key+'Ink');
  if(!canvas) return;
  const d = drawGetSt(key);
  if(d.erasing){
    const size=26, r=11;
    const url = drawMakeCursorURL((cx)=>{
      cx.beginPath(); cx.arc(size/2,size/2,r,0,Math.PI*2);
      cx.fillStyle='rgba(255,255,255,0.4)'; cx.fill();
      cx.lineWidth=2; cx.strokeStyle='#333a4d'; cx.stroke();
    }, size);
    canvas.style.cursor = `url(${url}) ${size/2} ${size/2}, cell`;
  } else {
    const size=34;
    const url = drawMakeCursorURL((cx)=>{
      cx.save(); cx.translate(18,18); cx.rotate(135*Math.PI/180);
      cx.fillStyle=d.color; cx.fillRect(-4,-14,8,16);
      cx.fillStyle='#f4c98c'; cx.beginPath(); cx.moveTo(-4,2); cx.lineTo(4,2); cx.lineTo(0,11); cx.closePath(); cx.fill();
      cx.fillStyle='#333a4d'; cx.beginPath(); cx.moveTo(-1.4,7.5); cx.lineTo(1.4,7.5); cx.lineTo(0,11); cx.closePath(); cx.fill();
      cx.restore();
    }, size);
    canvas.style.cursor = `url(${url}) 10 10, crosshair`;
  }
}

const ADMIN_HASH = 'fb9e692b52ad41cd666f83c8175df90569d48192d531e9c94285929bc116891a';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ════════════════════════════════
   증명 파트 — l∥m∥n, p(A,B,C)·q(D,E,F)가 가로지를 때 AB:BC=DE:EF
   케이스1(기본형: p,q의 교점이 l보다 바깥쪽) / 케이스2(교차형: 교점이 l,m 사이)
════════════════════════════════ */
const PROVE_Y_L=60, PROVE_Y_M=170, PROVE_Y_N=280, PROVE_dyLM=PROVE_Y_M-PROVE_Y_L, PROVE_dyMN=PROVE_Y_N-PROVE_Y_M;
const CASE_RP = [null, -0.5, -0.5]; // index 1,2 — 직선 p는 왼쪽 아래 방향
const CASE_RQ = [null, 1.0, -1.1];
function caseRawGeo(caseIdx){
  const rp=CASE_RP[caseIdx], rq=CASE_RQ[caseIdx];
  let A=[70,PROVE_Y_L], D;
  if(caseIdx===1){ D=[A[0]+80, PROVE_Y_L]; }
  else { const gap=0.5*PROVE_dyLM*(rp-rq); D=[A[0]+gap, PROVE_Y_L]; }
  return buildParallelGeo(A, D, rp, rq, PROVE_dyLM, PROVE_dyMN);
}
const proveSt = { caseIdx:1, g:null, animFrac:0, revealed:false };
function proveRenderFrame(){
  const g = proveSt.g;
  const html = drawParallelLines(g, '', { showQPrime:proveSt.animFrac>=1, fadeQ:proveSt.animFrac>=1 });
  document.getElementById('proveSvg').innerHTML = html;
}
function proveRenderAnimFrame(t){
  const g = proveSt.g;
  const Dt = [g.D[0]+(g.A[0]-g.D[0])*t, g.D[1]];
  const Et = [Dt[0]+g.rq*PROVE_dyLM, Dt[1]+PROVE_dyLM];
  const Ft = [Et[0]+g.rq*PROVE_dyMN, Et[1]+PROVE_dyMN];
  let html = drawParallelLines(g, '', { showQPrime:false, fadeQ:t>0.02 });
  html += `<line x1="${Dt[0].toFixed(1)}" y1="${Dt[1].toFixed(1)}" x2="${Ft[0].toFixed(1)}" y2="${Ft[1].toFixed(1)}" stroke="#dc2626" stroke-width="2.4"></line>`;
  html += `<circle cx="${Et[0].toFixed(1)}" cy="${Et[1].toFixed(1)}" r="3.2" fill="#dc2626"></circle>`;
  html += `<circle cx="${Ft[0].toFixed(1)}" cy="${Ft[1].toFixed(1)}" r="3.2" fill="#dc2626"></circle>`;
  document.getElementById('proveSvg').innerHTML = html;
}
function viewBoxForGeo(g, pad){
  pad = pad||95;
  const xs=[g.A[0],g.B[0],g.C[0],g.D[0],g.E[0],g.F[0],g.Ep[0],g.Fp[0]];
  const ys=[g.A[1],g.B[1],g.C[1],g.D[1],g.E[1],g.F[1],g.Ep[1],g.Fp[1]];
  const minX=Math.min(...xs)-pad, maxX=Math.max(...xs)+pad;
  const minY=Math.min(...ys)-pad, maxY=Math.max(...ys)+pad+20;
  return `${minX.toFixed(0)} ${minY.toFixed(0)} ${(maxX-minX).toFixed(0)} ${(maxY-minY).toFixed(0)}`;
}

    <p class="key-q">왼쪽의 "직선 q 움직이기" 버튼을 눌러, q와 평행하면서 점 A를 지나는 직선 q′을 그려보세요. "제자리로" 버튼으로 몇 번이든 다시 움직여볼 수 있어요.</p>

function proveAnimateCase(){
  document.getElementById('proveMoveBtn').disabled=true;
  const t0=performance.now();
  function frame(now){
    const t=Math.min(1,(now-t0)/700);
    proveSt.animFrac = t;

    if(t<1) requestAnimationFrame(frame);

      proveSt.animFrac=1; proveRenderFrame();

      document.getElementById('proveMoveBtn').style.display='';

function pvCheckS3(btn){
  const ok1 = normText(document.getElementById('ps3_1').value)==='평행';
  const ok2 = normText(document.getElementById('ps3_2').value)==='평행사변형';
  const ok3 = sameSeg(document.getElementById('ps3_3').value, 'DE');
  const ok4 = sameSeg(document.getElementById('ps3_4').value, 'EF');
  [['ps3_1',ok1],['ps3_2',ok2],['ps3_3',ok3],['ps3_4',ok4]].forEach(([id,ok])=>{

  });

  if(ok1&&ok2&&ok3&&ok4){
    fb.className='feedback success'; fb.textContent='맞아요!';
    btn.disabled=true;

  } else {
    fb.className='feedback error'; fb.textContent='l∥m, q∥q′이라는 사실을 이용해서 두 사각형의 대변 관계를 다시 살펴보세요.';
  }
}
function proveStep4(){
  appendProvePanel(`
    <div class="proof-block">
      따라서 <span class="seg">AB</span>:<span class="seg">BC</span>=(<input class="blank" id="ps4_1" style="width:40px">):(<input class="blank" id="ps4_2" style="width:40px">)이다.

}
function pvCheckS4(btn){
  const ok1 = sameSeg(document.getElementById('ps4_1').value, 'DE');
  const ok2 = sameSeg(document.getElementById('ps4_2').value, 'EF');
  [['ps4_1',ok1],['ps4_2',ok2]].forEach(([id,ok])=>{
    document.getElementById(id).classList.toggle('correct',ok); document.getElementById(id).classList.toggle('wrong',!ok);
  });
  const fb = document.getElementById('pvfb4');
  if(ok1&&ok2){
    fb.className='feedback success'; fb.textContent='맞아요! 증명이 완성됐어요.';
    btn.disabled=true;
    if(proveSt.caseIdx===1){
      appendProvePanel(`<div class="btn-row"><button class="btn btn-primary" onclick="proveShowCase(2)">케이스2도 확인해보기 →</button></div>`);
    } else {
      appendProvePanel(`<div class="btn-row"><button class="btn btn-primary" onclick="summaryShowCase(1)">정리로 넘어가기 →</button></div>`);

  } else {
    fb.className='feedback error'; fb.textContent='바로 앞 단계에서 구한 AE′, E′F′의 값을 다시 확인해보세요.';

/* ════════════════════════════════
   정리 파트 — 같은 그림+애니메이션, 결론만 간단히 빈칸
════════════════════════════════ */
function summaryShowCase(caseIdx){
  proveSt.caseIdx = caseIdx;
  proveSt.g = caseRawGeo(caseIdx);
  proveSt.animFrac = 0;
  proveSt.revealed = false;
  document.getElementById('proveSvg').setAttribute('viewBox', viewBoxForGeo(proveSt.g));
  proveRenderFrame();
  proveShowBtnsReset();
  document.getElementById('proveMoveBtn').onclick = summaryAnimateCase;
  provePanel(`
    <div class="panel-title"><span class="step-badge">정리</span>케이스${caseIdx} 다시 확인하기</div>
    <p class="key-q">직선 q를 움직여 q′을 만들어보고, 이 경우에도 성립하는 비례식을 완성해보세요. "제자리로" 버튼으로 몇 번이든 다시 움직여볼 수 있어요.</p>
  `);
}
function summaryAnimateCase(){
  document.getElementById('proveMoveBtn').disabled=true;
  const t0=performance.now();
  function frame(now){
    const t=Math.min(1,(now-t0)/700);
    proveSt.animFrac = t;
    proveRenderAnimFrame(easeInOut(t));
    if(t<1) requestAnimationFrame(frame);
    else {
      proveSt.animFrac=1; proveRenderFrame();
      document.getElementById('proveMoveBtn').style.display='none';
      document.getElementById('proveResetBtn').style.display='';
      document.getElementById('proveResetBtn').disabled=false;
      if(!proveSt.revealed){ proveSt.revealed=true; summaryStep(); }
    }
  }
  requestAnimationFrame(frame);
}
function summaryStep(){
  appendProvePanel(`
    <div class="proof-block">
      <span class="seg">AB</span>:<span class="seg">BC</span>=(<input class="blank" id="sm_1" style="width:40px">):(<input class="blank" id="sm_2" style="width:40px">)이다.
    </div>
    <div class="btn-row"><button class="btn btn-check" onclick="summaryCheck(this)">확인</button></div>
    <div class="feedback" id="smfb"></div>
  `);
}
function summaryCheck(btn){
  const ok1 = sameSeg(document.getElementById('sm_1').value, 'DE');
  const ok2 = sameSeg(document.getElementById('sm_2').value, 'EF');
  [['sm_1',ok1],['sm_2',ok2]].forEach(([id,ok])=>{
    document.getElementById(id).classList.toggle('correct',ok); document.getElementById(id).classList.toggle('wrong',!ok);
  });
  const fb = document.getElementById('smfb');
  if(ok1&&ok2){
    fb.className='feedback success'; fb.textContent='맞아요!';
    btn.disabled=true;
    if(proveSt.caseIdx===1){
      appendProvePanel(`<div class="btn-row"><button class="btn btn-primary" onclick="summaryShowCase(2)">케이스2도 확인해보기 →</button></div>`);
    } else {
      document.getElementById('proveMoveRow').style.display='none';
      appendProvePanel(`
        <div class="summary-box">
          세 직선 l, m, n이 서로 평행하고,<br>두 직선 p, q가 이 세 직선과 만나서 생기는 점을 각각 A,B,C / D,E,F라고 하면<br>
          <span class="seg">AB</span>:<span class="seg">BC</span>=<span class="seg">DE</span>:<span class="seg">EF</span><br>
          <b style="font-size:13px">(평행선 사이의 선분의 길이의 비)</b>
        </div>
        <div class="btn-row"><button class="btn btn-primary" onclick="goToQuiz()">문제 풀어보기 →</button></div>
      `);
    }
  } else {
    fb.className='feedback error'; fb.textContent='방금 전 증명에서 AE′, E′F′가 각각 어떤 변과 같았는지 다시 떠올려보세요.';
  }
}
function goToProve(){
  showScreen('scProve');
  window.scrollTo({top:0, behavior:'smooth'});
  drawBindOnce('prove'); drawSetupCanvas('prove');
  proveShowCase(1);
}

/* ════════════════════════════════
   문제 풀(pool) — 유형1(기본형)/유형2(교차형), AB:BC=DE:EF에서 4개 중 1개를 미지수로
════════════════════════════════ */
const QUIZ_RP = 0.3;
function buildQuizGeo(AB,BC,k,crossing){
  const UNIT=9;
  const dyAB = AB*UNIT/Math.sqrt(1+QUIZ_RP*QUIZ_RP);
  const dyBC = BC*UNIT/Math.sqrt(1+QUIZ_RP*QUIZ_RP);
  const magRq = Math.sqrt(k*k*(1+QUIZ_RP*QUIZ_RP)-1);
  const rq = crossing ? -magRq : magRq;
  const A=[300,60];
  let D;
  if(crossing){
    const gap = 0.5*dyAB*(QUIZ_RP-rq);
    D=[A[0]+gap, A[1]];
  } else {
    D=[A[0]+dyAB*0.6, A[1]];
  }
  return buildParallelGeo(A, D, QUIZ_RP, rq, dyAB, dyBC);
}
function buildQuizEntry(AB,BC,k,unk,crossing){
  const DE = +(k*AB).toFixed(2), EF = +(k*BC).toFixed(2);
  return { AB,BC,DE,EF,k,unk,crossing, g: buildQuizGeo(AB,BC,k,crossing) };
}
function makePool(crossing){
  const ABBC = [[8,12],[9,15],[6,10],[7,14],[10,16],[12,18]];
  const KS = [1.2,1.4,1.6];
  const UNKS = ['AB','BC','DE','EF'];
  const pool=[];
  ABBC.forEach(([AB,BC],i)=>{
    KS.forEach((k,j)=>{
      const unk = UNKS[(i+j)%4];
      pool.push(buildQuizEntry(AB,BC,k,unk,crossing));
    });
  });
  return pool;
}
const POOL1 = makePool(false);
const POOL2 = makePool(true);
function geoQ(e){ return fitGeoToCanvas(e.g, 225, 170, 250, 210); }
function drawQuiz(e){
  const g = geoQ(e);
  const vals = { AB:e.AB, BC:e.BC, DE:e.DE, EF:e.EF };
  const labels = {
    AB: e.unk==='AB' ? 'x' : vals.AB,
    BC: e.unk==='BC' ? 'x' : vals.BC,
    DE: e.unk==='DE' ? 'x' : vals.DE,
    EF: e.unk==='EF' ? 'x' : vals.EF
  };
  // viewBox는 fitGeoToCanvas 기준 480x340 고정 (문제 풀 공통)
  return drawParallelLines(g, '', { labels });
}
function answerQ(e){ return { x: e[e.unk] }; }

function quizRenderAnimFrame(entry, param){
  const g = geoQ(entry);
  const dyLM=g.B[1]-g.A[1], dyMN=g.C[1]-g.B[1];
  const Dt = [g.D[0]+(g.A[0]-g.D[0])*param, g.D[1]];
  const Et = [Dt[0]+g.rq*dyLM, Dt[1]+dyLM];
  const Ft = [Et[0]+g.rq*dyMN, Et[1]+dyMN];
  let html = drawQuiz(entry);
  if(param>0.02){
    html = html.replace('stroke="#e05a20" stroke-width="2.4"></line>', 'stroke="#e05a20" stroke-width="2.4" opacity="0.4"></line>');
  }
  html += `<line x1="${Dt[0].toFixed(1)}" y1="${Dt[1].toFixed(1)}" x2="${Ft[0].toFixed(1)}" y2="${Ft[1].toFixed(1)}" stroke="#dc2626" stroke-width="2.4"></line>`;
  html += `<circle cx="${Et[0].toFixed(1)}" cy="${Et[1].toFixed(1)}" r="3.2" fill="#dc2626"></circle>`;
  html += `<circle cx="${Ft[0].toFixed(1)}" cy="${Ft[1].toFixed(1)}" r="3.2" fill="#dc2626"></circle>`;
  document.getElementById('quizSvg').innerHTML = html;
}
function quizAnimateLine(){
  const entry = st.cur.entry;
  document.getElementById('quizMoveBtn').disabled=true;
  const t0=performance.now();
  function frame(now){
    const t=Math.min(1,(now-t0)/700);
    quizRenderAnimFrame(entry, easeInOut(t));
    if(t<1) requestAnimationFrame(frame);
    else {
      quizRenderAnimFrame(entry, 1);
      document.getElementById('quizMoveBtn').style.display='none';
      document.getElementById('quizResetBtn').style.display='';
      document.getElementById('quizResetBtn').disabled=false;
    }
  }
  requestAnimationFrame(frame);
}
function quizResetLine(){
  const entry = st.cur.entry;
  document.getElementById('quizResetBtn').disabled=true;
  const t0=performance.now();
  function frame(now){
    const t=Math.min(1,(now-t0)/700);
    quizRenderAnimFrame(entry, 1-easeInOut(t));
    if(t<1) requestAnimationFrame(frame);
    else {
      document.getElementById('quizSvg').innerHTML = drawQuiz(entry);
      document.getElementById('quizResetBtn').style.display='none';
      document.getElementById('quizMoveBtn').style.display='';
      document.getElementById('quizMoveBtn').disabled=false;
    }
  }
  requestAnimationFrame(frame);
}

const TYPES = [
  { key:'1', label:'기본형', pool:POOL1, answer:answerQ },
  { key:'2', label:'교차형', pool:POOL2, answer:answerQ }
];

/* ════════════════════════════════
   레벨-C 진행 — 유형1→2 순차 통과, 유형마다 3문제 중 2개 이상, 떨어진 유형만 재도전
════════════════════════════════ */
const st = { stageIdx:0, idx:0, correct:0, questions:[], cur:null, curAns:null, stageScores:[null,null] };
function updateStageTabs(){
  const labels=['유형1(기본형)','유형2(교차형)'];
  let html='';
  labels.forEach((l,i)=>{
    let cls='stage-tab';
    if(st.stageScores[i] && st.stageScores[i].pass) cls+=' done';
    else if(i===st.stageIdx) cls+=' active';
    html+=`<div class="${cls}">${l}</div>`;
  });
  document.getElementById('stageTabs').innerHTML = html;
}
function buildStageQuestions(stageIdx){
  const type = TYPES[stageIdx];
  const picks = shuffle(type.pool).slice(0,3);
  return picks.map(entry=>({ type, entry }));
}
function goToQuiz(){
  showScreen('scQuiz');
  window.scrollTo({top:0, behavior:'smooth'});
  drawBindOnce('quiz'); drawSetupCanvas('quiz');
  startStage(0);
}
function startStage(stageIdx){
  st.stageIdx = stageIdx; st.idx=0; st.correct=0;
  st.questions = buildStageQuestions(stageIdx);
  updateStageTabs();
  showScreen('scQuiz');
  quizNext();
}
function quizNext(){
  st.idx++;
  if(st.idx>st.questions.length){ stageFinish(); return; }
  st.cur = st.questions[st.idx-1];
  renderCurrentQuestion();
}
function renderCurrentQuestion(){
  const type = st.cur.type, entry = st.cur.entry;
  st.curAns = type.answer(entry);
  document.getElementById('quizProgress').textContent = `유형${type.key} · ${st.idx||1} / ${st.questions?st.questions.length:3}`;
  document.getElementById('quizQtext').textContent = '다음 그림에서 x의 값을 구하시오.';
  document.getElementById('quizSvg').setAttribute('viewBox', '0 0 440 360');
  document.getElementById('quizSvg').innerHTML = drawQuiz(entry);
  document.getElementById('quizMoveBtn').style.display='';
  document.getElementById('quizMoveBtn').disabled=false;
  document.getElementById('quizResetBtn').style.display='none';
  document.getElementById('qAnsX').value=''; document.getElementById('qAnsX').classList.remove('correct','wrong');
  document.getElementById('quizCheckBtn').disabled=false;
  document.getElementById('quizFb').textContent='';
  drawSetupCanvas('quiz');
}
function quizCheck(){
  const vx = parseFloat(document.getElementById('qAnsX').value);
  const ok = numMatches(vx, st.curAns.x, 0.05);
  document.getElementById('qAnsX').classList.toggle('correct',ok); document.getElementById('qAnsX').classList.toggle('wrong',!ok);
  const fb = document.getElementById('quizFb');
  if(ok){
    fb.className='feedback success'; fb.textContent='정답이에요!';
    st.correct++;
    document.getElementById('quizCheckBtn').disabled=true;
    setTimeout(quizNext, 1300);
  } else {
    fb.className='feedback error'; fb.textContent='❌ x값이 틀렸어요. 다시 확인해서 고쳐보세요.';
  }
}
function stageFinish(){
  const total = st.questions.length, pass = st.correct>=2;
  st.stageScores[st.stageIdx] = { correct:st.correct, total, pass };
  updateStageTabs();
  const type = TYPES[st.stageIdx];
  document.getElementById('srIcon').textContent = pass?'🎉':'💪';
  document.getElementById('srTitle').textContent = `유형${type.key}(${type.label}) 결과`;
  document.getElementById('srScore').textContent = `${st.correct} / ${total}`;
  document.getElementById('srScore').classList.toggle('fail', !pass);
  document.getElementById('srMsg').textContent = pass ? '통과했어요!' : '3문제 중 2문제 이상 맞아야 통과해요.';
  document.getElementById('srRetryBtn').style.display = pass ? 'none' : 'inline-block';
  document.getElementById('srNextBtn').textContent = !pass ? '다시 도전하기' : (st.stageIdx<TYPES.length-1 ? `유형${TYPES[st.stageIdx+1].key}로 →` : '결과 보기 →');
  showScreen('scStageResult');
}
function srRetry(){ startStage(st.stageIdx); }
function srNext(){
  if(!st.stageScores[st.stageIdx].pass){ startStage(st.stageIdx); return; }
  if(st.stageIdx < TYPES.length-1){ startStage(st.stageIdx+1); }
  else {
    showScreen('scDone');
    if(window._reportHubComplete) window._reportHubComplete();
  }
}

goToProve();
</script>
