<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사건은 무엇일까?</title>
<style>
:root{
  --ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#9090b0;
  --indigo:#4f46e5;--indigo-l:#e0e7ff;--indigo-ll:#eef2ff;
  --green:#16a34a;--green-l:#dcfce7;--green-ll:#F0FDF4;
  --orange:#e05a20;--orange-l:#ffedd5;--red:#dc2626;--red-l:#fee2e2;
  --r:12px;--shadow:0 2px 12px rgba(26,26,46,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--indigo-ll);color:var(--ink);min-height:100vh;padding-bottom:60px}
.hdr{background:var(--indigo);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}
.hdr-title{font-size:16px;font-weight:700}
.main{max-width:1200px;margin:0 auto;padding:20px 16px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:var(--r);border:1px solid #e0e7ff;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
/* 강조 3단계: ① 핵심 질문(.key-q, 한 블록에 1개) ② 핵심어(.kw, 문단에 1~2개) ③ 보충(.sub) — 밑줄은 핵심 질문 안의 .em에만 */
.key-q{display:block;font-size:17px;font-weight:800;line-height:1.7;color:var(--ink);background:#fffbeb;border:1.5px solid #fcd34d;border-left:6px solid #f59e0b;border-radius:10px;padding:9px 14px 10px;margin:10px 0}
.key-q::before{content:'❓ 질문';display:block;font-size:11.5px;font-weight:800;color:#b45309;margin-bottom:1px}
.key-q.task::before{content:'✏️ 해 보기'}
.key-q .em{text-decoration:underline;text-decoration-color:#f59e0b;text-decoration-thickness:3px;text-underline-offset:4px}
.kw{font-weight:800;color:#be123c}
.sub{font-size:12.5px;color:var(--ink3);font-weight:600}
.reread{animation:rereadFlash 1.2s ease-out 2}
@keyframes rereadFlash{0%{box-shadow:0 0 0 5px #f59e0b;background-color:#fef3c7}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.lock-note{display:inline-block;margin-top:4px;font-size:12.5px;color:#b45309;background:#fef3c7;border-radius:8px;padding:2px 10px}
.ans-tag{font-size:12px;font-weight:800;color:#fff;background:var(--red);border-radius:8px;padding:2px 8px}
.variant-banner{background:#fef3c7;border:1.5px solid #fcd34d;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;color:#92400e;margin-bottom:8px}

.split-layout{display:flex;gap:18px;align-items:flex-start}
.split-left{flex:0 0 440px;position:sticky;top:16px}
.split-right{flex:1 1 auto;min-width:0}
@media (max-width:980px){
  .split-layout{display:block}
  .split-left{position:static;width:100%;margin-bottom:14px}
  .split-left.board-sticky{position:sticky;top:0;z-index:5;max-height:46vh;overflow-y:auto}
}

/* 단계 표시 */
.stepper{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.stepper .st{padding:5px 11px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12px;font-weight:700;color:var(--ink3)}
.stepper .st.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.stepper .st.done{background:var(--green-l);color:#14532d;border-color:var(--green)}

/* 왼쪽: 실험 + 결과 칩 보드 */
.exp-head{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;font-weight:700;line-height:1.6;margin-bottom:12px}
.exp-badge{flex-shrink:0;background:var(--ink);color:#fff;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:12px;margin-top:2px}
.board{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px 10px;background:#fbfcff;border:1.5px dashed #d8ddfb;border-radius:12px}
.board.flash{animation:boardFlash 1s ease-out}
@keyframes boardFlash{0%{box-shadow:0 0 0 5px #f59e0b;border-color:#f59e0b}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.chip{border:2px solid #d8ddfb;border-radius:12px;background:#fff;padding:7px 8px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--ink2);transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.chip.sel{border-color:var(--indigo);background:var(--indigo-l);color:var(--indigo);box-shadow:0 0 0 2px var(--indigo)}
.chip.lock{border-color:var(--orange);background:var(--orange-l);color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.chip.ok{border-color:var(--green);background:var(--green-l);color:#14532d;box-shadow:0 0 0 2px var(--green)}
.chip.static{cursor:default}
.chip.static:hover{transform:none}
.chip .big{font-size:26px;line-height:1.1}
.menu-board{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.menu-group{display:flex;flex-direction:column;align-items:center;gap:8px}
.menu-group .mg-title{font-size:12px;font-weight:800;padding:2px 14px;border-radius:10px;color:#fff}
.menu-group .mg-items{display:flex;gap:8px}
.board-tip{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-top:8px}

/* 도입 */
.news-card{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.news-card .tag{font-size:11px;font-weight:800;color:#b45309}
.news-card .headline{font-size:16px;font-weight:800;margin:4px 0}
.news-card .body{font-size:12.5px;color:var(--ink2);line-height:1.6}
.math-card{background:var(--indigo-ll);border:1.5px solid var(--indigo-l);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.math-card .tag{font-size:11px;font-weight:800;color:var(--indigo)}
.math-card .headline{font-size:16px;font-weight:800;margin:4px 0}
.roller{text-align:center;background:#fbfcff;border:1.5px dashed #d8ddfb;border-radius:12px;padding:12px}
.roll-hist{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:30px;margin-top:8px}
.roll-hist .h{opacity:.9}
.roll-hist .h.even{outline:2.5px solid var(--indigo);outline-offset:1px;border-radius:6px}
.roll-stat{font-size:12.5px;font-weight:700;color:var(--ink2);margin-top:6px}

/* 오른쪽 */
.panel-title{font-weight:800;font-size:15px;color:var(--indigo);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.step-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--indigo);color:#fff;font-size:12px;font-weight:800;flex-shrink:0}
.qblock{border-top:1px dashed #e0e7ff;padding-top:12px;margin-top:12px}
.qblock:first-child{border-top:none;padding-top:0;margin-top:0}
.lead{font-size:14px;line-height:1.8;color:var(--ink2);margin-bottom:8px}
.evt-card{display:inline-block;background:#fff;border:2px solid var(--indigo);border-radius:10px;padding:8px 14px;font-size:15px;font-weight:800;color:var(--indigo);margin:6px 0}
.count-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px;font-weight:700}
.blank{display:inline-block;width:64px;border:none;border-bottom:2px solid var(--indigo);background:transparent;text-align:center;font-weight:700;font-size:15px;font-family:inherit;padding:2px 4px;margin:0 2px;color:var(--indigo)}
.blank:focus{outline:none;border-bottom-color:#3730a3;background:var(--indigo-ll)}
.blank.correct{border-bottom-color:var(--green);background:var(--green-ll);color:#14532d}
.blank.wrong{border-bottom-color:var(--red);background:var(--red-l);color:var(--red)}
.choice-col{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.choice-btn{padding:9px 16px;border-radius:10px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);font-family:inherit;text-align:left;line-height:1.5}
.choice-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.choice-btn.correct{background:var(--green);color:#fff;border-color:var(--green)}
.choice-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.choice-btn:disabled{cursor:default}
.choice-btn.check::before{content:'☐ ';}
.choice-btn.check.active::before{content:'☑ ';}
.btn{border:none;border-radius:12px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.btn:hover{background:#4338ca}
.btn:disabled{opacity:.4;cursor:default}
.btn-check{background:var(--green)}
.btn-check:hover{background:#15803d}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.feedback{text-align:center;font-size:13.5px;font-weight:700;min-height:20px;margin-top:8px;line-height:1.6}
.feedback.success{color:var(--green)}
.feedback.error{color:var(--red)}
.note-box{background:var(--green-ll);border:1.5px solid #bbf7d0;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.85;margin-top:10px}
.def-box{background:var(--indigo-ll);border:2px solid var(--indigo);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.9;margin-top:12px}
.modal-overlay.termpop{background:rgba(26,26,46,0.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.term-box{max-width:480px;width:100%}
.term-tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--indigo);border-radius:10px;padding:2px 10px;margin-bottom:8px}
.term-box .def-box{margin-top:0;text-align:left}
.term-box .def-box .blank{font-size:15px;color:#be123c}
.def-box.term-wait{visibility:hidden}
.def-box u{text-decoration-color:#f59e0b;text-decoration-thickness:3px;text-underline-offset:4px}
.def-box b.term{color:#be123c}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:13.5px;font-weight:700}
.flow .fbox{background:#fff;border:1.5px solid #d8ddfb;border-radius:8px;padding:6px 10px;text-align:center;line-height:1.5}
.flow .fbox small{display:block;font-size:11px;color:var(--ink3)}
.flow .arrow{color:var(--ink3);font-size:18px}

/* 교과서식 3칸 표 */
.tb3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.tb3 .col{border:2px solid #a5d8e6;border-radius:10px;overflow:hidden;background:#fff}
.tb3 .col .th{background:#a5d8e6;font-weight:800;font-size:13px;text-align:center;padding:5px}
.tb3 .col .td{padding:12px 8px;text-align:center;font-size:14px;font-weight:700;min-height:64px;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.evt-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
.evt-table th{background:#e0f2f7;border:1px solid #b6dbe6;padding:6px;font-weight:800}
.evt-table td{border:1px solid #d6e9ef;padding:7px 8px;text-align:center;font-weight:600;vertical-align:middle}
.evt-table td.left{text-align:left}
.evt-table tr.newrow td{animation:rowIn .6s ease-out}
@keyframes rowIn{0%{background:#fef9c3}100%{background:transparent}}

/* 분류하기 */
.cls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 10px;border:1.5px solid #e0e7ff;border-radius:10px;margin-bottom:8px;background:#fff}
.cls-row.wrong{border-color:var(--red);background:var(--red-l)}
.cls-row.right{border-color:var(--green);background:var(--green-ll)}
.cls-row .ct{flex:1 1 220px;font-size:14px;font-weight:700}
.cls-row .cb{display:flex;gap:6px}
.cls-row .cb .choice-btn{padding:5px 11px;font-size:12.5px}
.hint-card{background:#fff;border:1.5px solid #d8ddfb;border-radius:12px;padding:14px;font-size:13.5px;line-height:1.9}
.hint-card .hq{font-weight:800;color:var(--indigo)}

/* 정리 */
.sum-line{font-size:15px;line-height:2.4}
.pick{display:inline-flex;gap:4px;vertical-align:middle;flex-wrap:wrap}
.pick .choice-btn{padding:3px 11px;font-size:13.5px}
.slot{display:inline-block;min-width:70px;border-bottom:2px solid var(--indigo);text-align:center;font-weight:800;color:var(--indigo);padding:0 6px}
.slot.filled{color:#be123c;border-bottom-color:var(--green)}

.progress{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-bottom:6px}
.level-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.level-tab{padding:7px 16px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.level-tab.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.level-tab.done{background:var(--green-l);color:#14532d;border-color:var(--green)}

.result-wrap{text-align:center;padding:24px 10px}
.result-icon{font-size:48px;margin-bottom:10px}
.result-score{font-size:22px;font-weight:800;color:var(--indigo);margin:8px 0}
.primary-btn{padding:11px 26px;border-radius:8px;background:var(--indigo);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;margin-right:8px}
.restart-btn{padding:11px 26px;border-radius:8px;background:var(--ink);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px 20px;max-width:420px;text-align:center;box-shadow:0 8px 32px rgba(26,26,46,0.25)}
.modal-icon{font-size:34px;margin-bottom:8px}
.modal-text{font-size:14px;line-height:1.7;color:var(--ink);font-weight:600;margin-bottom:16px}
.modal-btn{border:none;border-radius:10px;padding:10px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
</style>
</head>
<body>

<div class="hdr">
  <a href="index.html" id="hubBackLink" style="background:rgba(255,255,255,.2);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;">← 학습 선택 목록으로 돌아가기</a>
  <span class="hdr-title">사건은 무엇일까?</span>
  <button id="adminBtn" onclick="openAdminModal()" style="margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;cursor:pointer;font-family:inherit">🔐 관리자 모드</button>
</div>
<script>
document.getElementById('hubBackLink').href = 'index.html' + location.search;
(function(){
  var _hb = document.getElementById('hubBackLink');
  var _urlNum = new URLSearchParams(location.search).get('num');
  var _isPreview = !_urlNum || _urlNum === '99'; // 관리자 미리보기(파라미터 없음 또는 99번) 때는 나가기 경고 안 띄움
  _hb.addEventListener('click', function(e){
    if(!_isPreview && !window._activityDone && !confirm('아직 다 끝내지 않았어요! 지금 나가면 처음부터 다시 해야 해요. 그래도 나갈까요?')){
      e.preventDefault();
    }
  });
  if(!_isPreview){
    window.addEventListener('beforeunload', function(e){
      if(!window._activityDone){ e.preventDefault(); e.returnValue=''; }
    });
  }
})();
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const s = { cls:p.get('cls'), num:p.get('num'), name:p.get('name'), id:p.get('id')||'event-meaning' };
  let _db=null;
  try{
    firebase.initializeApp({
      apiKey: "AIzaSyDUFYrqaVL12fZ7ZhExVyyjLWSE_XJ_bHs",
      authDomain: "nd-deogi-math-hub.firebaseapp.com",
      projectId: "nd-deogi-math-hub",
      storageBucket: "nd-deogi-math-hub.firebasestorage.app",
      messagingSenderId: "414096731864",
      appId: "1:414096731864:web:a799f9450859c498b6b1ad"
    });
    _db = firebase.firestore();
  }catch(e){ console.warn('hub firebase init:', e); }
  let _reported=false;
  window._reportHubComplete = function(){
    window._activityDone = true;
    if(_reported || !_db || !s.cls || !s.num) return;
    _reported=true;
    window._pendingQuizComplete = _db.collection('classStudents').doc(String(s.cls)).collection('students').doc(String(s.num))
      .set({ name: s.name||'', itemsOpened: firebase.firestore.FieldValue.arrayUnion(s.id), quizSolveCount: firebase.firestore.FieldValue.increment(1), lastActive: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true})
      .catch(err=>console.warn('hub complete log failed', err));
  };
  // 완료 기록이 서버에 닿기 전에 페이지를 떠나지 않도록 잠깐 기다렸다가 이동
  document.getElementById('hubBackLink').addEventListener('click', function(e){
    if(!window._pendingQuizComplete) return;
    e.preventDefault();
    const href = this.href;
    Promise.race([window._pendingQuizComplete.catch(()=>{}), new Promise(r=>setTimeout(r,800))]).then(()=>{ location.href = href; });
  });
})();
function finishToHub(){ document.getElementById('hubBackLink').click(); }
</script>

<div class="main">

  <div class="stepper" id="stepper"></div>

  <div class="screen active" id="scAct">
    <div class="split-layout">
      <div class="split-left card" id="actLeft"></div>
      <div class="split-right card"><div id="actRight"></div></div>
    </div>
  </div>

  <div class="screen" id="scSummary">
    <div class="card" style="max-width:760px;margin:0 auto">
      <div id="summaryArea"></div>
    </div>
  </div>

  <div class="screen" id="scPractice">
    <div class="level-tabs" id="levelTabs"></div>
    <div class="split-layout">
      <div class="split-left card board-sticky" id="pgLeft"></div>
      <div class="split-right card">
        <div class="progress" id="pgProgress"></div>
        <div id="pgArea"></div>
      </div>
    </div>
  </div>

  <div class="screen" id="scLevelResult">
    <div class="card">
      <div class="result-wrap">
        <div class="result-icon" id="lrIcon">🎉</div>
        <h2 id="lrTitle">통과했어요!</h2>
        <div class="result-score" id="lrScore">3 / 4</div>
        <p id="lrMsg" style="color:var(--ink2)"></p>
        <button class="restart-btn" id="lrRetryBtn" onclick="lrRetry()" style="display:none">🔄 다시 도전하기</button>
        <button class="primary-btn" id="lrNextBtn" onclick="lrNext()">다음 →</button>
      </div>
    </div>
  </div>

  <div class="screen" id="scDone">
    <div class="card">
      <div class="result-wrap">
        <div class="result-icon">🏁</div>
        <h2>학습 완료!</h2>
        <p style="color:var(--ink2);margin-top:8px;line-height:1.8">사건과 경우의 수의 뜻을 여러 가지 실험으로 알아보고, 문제풀이까지 모두 마쳤어요.</p>
        <div class="result-score" id="doneStat" style="font-size:17px"></div>
        <button class="primary-btn" onclick="finishToHub()">✅ 학습 완료</button>
        <button class="restart-btn" onclick="location.reload()">🔄 처음부터 다시</button>
      </div>
    </div>
  </div>

</div>

<!-- 용어 팝업: 파란 정리 상자의 핵심 용어를 써야 닫힘 -->
<div class="modal-overlay termpop" id="termModal">
  <div class="modal-box term-box" id="termBox"></div>
</div>

<div class="modal-overlay" id="adminPwModal">
  <div class="modal-box">
    <div class="modal-icon">🔐</div>
    <div class="modal-text">관리자 비밀번호를 입력하세요</div>
    <input type="password" id="adminPwInput" class="blank" style="width:160px;margin-bottom:10px" onkeydown="if(event.key==='Enter')checkAdminPassword()">
    <div id="adminPwErr" style="color:var(--red);font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:4px"></div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="modal-btn" onclick="checkAdminPassword()">확인</button>

  <button onclick="document.getElementById('adminPanel').style.display='none'" style="margin-top:8px;background:none;border:none;color:var(--ink3);font-size:11px;cursor:pointer;text-decoration:underline;font-family:inherit">숨기기</button>

<script>
/* ════════════════════════════════
   공용 헬퍼
════════════════════════════════ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function $(id){ return document.getElementById(id); }
function setFb(id, ok, msg){ const fb=$(id); fb.className='feedback '+(ok?'success':'error'); fb.innerHTML=msg; }
function parseCount(s){ const m=String(s||'').replace(/\s+/g,'').match(/^(\d+)(가지|개)?$/); return m?parseInt(m[1],10):null; }
function sameSet(a,b){ if(a.size!==b.size) return false; for(const v of a) if(!b.has(v)) return false; return true; }

/* ════════════════════════════════
   읽기 확인 · 찍기 방지
   - readGate: 질문이 뜨고 읽을 시간도 안 지나 고르면 채점하지 않고 질문을 다시 보게 함
   - wrongLock: 틀리면 몇 초 동안 잠그고(틀릴수록 길게) 보기 순서를 다시 섞음
   - firstTry: 질문마다 첫 시도만 기록 → 완료 화면에 '한 번에 맞힌 질문' 표시
════════════════════════════════ */
const GUARD = { on:true };            // 검증 스크립트에서만 끔
const LOCK_SECS = [3,5,8];
const stat = { seen:{}, total:0, first:0 };
const shown = {}, tries = {};
function firstTry(qid, ok){ if(qid in stat.seen) return; stat.seen[qid]=ok; stat.total++; if(ok) stat.first++; }
function flashRef(ref){
  const el = typeof ref==='string' ? $(ref) : ref;
  if(!el) return;
  el.classList.remove('reread'); void el.offsetWidth; el.classList.add('reread');
}
function markShown(qid, blockId){
  const el = $(blockId);
  const len = el ? el.textContent.replace(/\s+/g,'').length : 40;
  shown[qid] = { t:Date.now(), need:Math.min(4000, Math.max(1500, len*25)), block:blockId };
}
function readGate(qid, fbId){
  const s = shown[qid];
  if(!GUARD.on || !s || Date.now()-s.t >= s.need) return true;
  setFb(fbId,false,'✋ 잠깐! 질문을 끝까지 읽고 골라 봐요.');
  const kq = document.querySelector('#'+s.block+' .key-q');
  if(kq) flashRef(kq);
  return false;
}
function lockSecs(qid){
  tries[qid] = (tries[qid]||0)+1;
  return GUARD.on ? LOCK_SECS[Math.min(tries[qid],LOCK_SECS.length)-1] : 0;
}
// secs초 동안 안내문에 남은 시간을 보여 준 뒤 onDone. anchor가 화면에서 사라지면(단계 이동) 멈춤
function lockTimer(secs, fbId, msg, what, anchor, onDone){
  if(!secs){ onDone(); return; }
  let left = secs;
  const paint = ()=>setFb(fbId,false,`${msg}<br><span class="lock-note">⏳ ${left}초 뒤에 ${what}</span>`);
  paint();
  const t = setInterval(()=>{
    if(!document.body.contains(anchor)){ clearInterval(t); return; }
    left--;
    if(left<=0){ clearInterval(t); onDone(); } else paint();
  }, 1000);
}
// o: {qid,row,fb,msg,refs,noShuffle,after}
function wrongLock(o){
  const row = $(o.row);
  const btns = [...row.querySelectorAll('button')];
  btns.forEach(b=>b.disabled=true);
  (o.refs||[]).forEach(flashRef);
  lockTimer(lockSecs(o.qid), o.fb, o.msg, '다시 고를 수 있어요', row, ()=>{
    btns.forEach(b=>{ b.disabled=false; b.classList.remove('wrong','active'); });
    if(!o.noShuffle) shuffle(btns).forEach(b=>b.parentNode.appendChild(b));
    setFb(o.fb,false,o.msg+'<br><span class="sub">다시 골라 보세요.</span>');
    if(o.after) o.after();
  });
}

/* ════════════════════════════════

const MENU_GROUPS = [ {name:'면', color:'#16a34a', items:['칼국수','쫄면']}, {name:'밥', color:'#e05a20', items:['김밥','비빔밥','볶음밥']} ];

function dieSVG(n,s){

    PIPS[n].map(([x,y])=>`<circle cx="${(x*s).toFixed(1)}" cy="${(y*s).toFixed(1)}" r="${(n===1?r*1.6:r).toFixed(1)}" fill="${n===1?'#dc2626':'#1a1a2e'}"/>`).join('')+`</svg>`;

const RPS_EMOJI = {'가위':'✌️','바위':'✊','보':'🖐️'};
const MENU_EMOJI = {'칼국수':'🍜','쫄면':'🍝','김밥':'🍙','비빔밥':'🥗','볶음밥':'🍛'};
function chipFace(exp,v){

  if(exp==='rps') return `<span class="big">${RPS_EMOJI[v]}</span><span>${v}</span>`;
  if(exp==='card') return `<svg width="34" height="44" viewBox="0 0 34 44" style="display:block"><rect x="1.5" y="1.5" width="31" height="41" rx="5" fill="#fff" stroke="#4a4a6a" stroke-width="1.6"/><text x="17" y="28.5" text-anchor="middle" font-size="16" font-weight="800" fill="#1a1a2e">${v}</text></svg>`;
  if(exp==='ball') return `<svg width="40" height="40" viewBox="0 0 40 40" style="display:block"><circle cx="20" cy="20" r="17.5" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/><circle cx="20" cy="20" r="10" fill="#fff"/><text x="20" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">${v}</text></svg><span>${v}번</span>`;
  if(exp==='menu') return `<span class="big">${MENU_EMOJI[v]}</span><span>${v}</span>`;
  return String(v);
}
// 경우를 글/그림으로 나열 (표에 쓰는 용도)
function casesHTML(exp, set){

  if(exp==='ball') return vals.map(v=>v+'번 공').join(', ');

/* ════════════════════════════════
   사건 목록 — 경우는 손으로 적지 않고 test 함수로 계산 (검증 스크립트에서 전체 확인)
════════════════════════════════ */
function hasAll(target, sel){ for(const v of target) if(!sel.has(v)) return false; return true; }
function primeHint(sel,target){
  if(sel.has(1)) return '1은 소수가 아니에요. 소수의 뜻을 다시 떠올려 봐요.';
  if(target.has(2) && !sel.has(2)) return '짝수 중에도 소수가 있는지 확인해 봐요.';
  return null;
}
function divHint(n){
  return function(sel,target){
    if(target.has(1) && !sel.has(1)) return '1은 모든 자연수의 약수예요. 다시 확인해 봐요.';
    if(target.has(n) && !sel.has(n)) return `${n} 자신도 ${n}의 약수예요. 다시 확인해 봐요.`;
    return null;
  };
}
function geHint(k){ return (sel,target)=> (target.has(k)&&!sel.has(k)) ? `'${k} 이상'에는 ${k}도 들어가요.` : null; }
function leHint(k){ return (sel,target)=> (target.has(k)&&!sel.has(k)) ? `'${k} 이하'에는 ${k}도 들어가요.` : null; }
function ltHint(k){ return (sel)=> sel.has(k) ? `'${k}보다 작은'에는 ${k}가 들어가지 않아요.` : null; }
function gtHint(k){ return (sel)=> sel.has(k) ? `'${k}보다 큰'에는 ${k}가 들어가지 않아요.` : null; }
const isPrime = v=> v>=2 && [...Array(v).keys()].slice(2).every(d=>v%d!==0);

const EVENTS = [

const EV_ALL_DICE = {id:'d-all', exp:'dice', text:'나올 수 있는 결과 모두', test:()=>true};
function caseSet(evt){ return new Set(OUT[evt.exp].filter(evt.test)); }
function eventsOf(exp){ return EVENTS.filter(e=>e.exp===exp); }

/* ════════════════════════════════
   결과 칩 보드 (왼쪽 패널)
════════════════════════════════ */
const boards = {};
function setBoard(key, exp, opts){
  opts = opts||{};
  boards[key] = { exp, sel:new Set(), locked: opts.locked ? new Set(opts.locked) : null, interactive: !opts.locked, done:false };
  renderBoard(key, true);
}
function renderBoard(key, flash){
  const b = boards[key];
  const left = $(key+'Left');
  left.classList.add('board-sticky');
  const chip = (v,i)=>{
    let cls='chip';
    if(b.locked){ cls += ' static'; if(b.locked.has(v)) cls+=' lock'; }
    else if(b.sel.has(v)) cls += b.done ? ' ok' : ' sel';
    if(b.done) cls+=' static';
    return `<button class="${cls}" onclick="toggleChip('${key}',${i})">${chipFace(b.exp,v)}</button>`;
  };
  let inner;
  if(b.exp==='menu'){
    inner = `<div class="menu-board">`+MENU_GROUPS.map(g=>`<div class="menu-group"><span class="mg-title" style="background:${g.color}">${g.name}</span><div class="mg-items">${g.items.map(v=>chip(v,OUT.menu.indexOf(v))).join('')}</div></div>`).join('')+`</div>`;
  } else {
    inner = OUT[b.exp].map(chip).join('');
  }
  const tip = b.locked ? '🟧 색칠된 결과를 보고 오른쪽 질문에 답해 보세요.'
            : b.done ? '✅ 확인 완료!'
            : '👆 결과를 누르면 칠해지고, 다시 누르면 지워져요.';
  left.innerHTML = `<div class="exp-head"><span class="exp-badge">실험</span><span>${EXP[b.exp].instr}</span></div>
    <div class="board" id="${key}Board">${inner}</div>
    <div class="board-tip">${tip}</div>`;
  if(flash){ const bd=$(key+'Board'); bd.classList.remove('flash'); void bd.offsetWidth; bd.classList.add('flash'); }
}
function toggleChip(key, i){
  const b = boards[key];
  if(!b || !b.interactive || b.done) return;
  const v = OUT[b.exp][i];
  if(b.sel.has(v)) b.sel.delete(v); else b.sel.add(v);
  renderBoard(key, false);
}
function judgeCases(key, evt){
  const b = boards[key];
  const target = caseSet(evt);
  const missing = [...target].filter(v=>!b.sel.has(v));
  const extra = [...b.sel].filter(v=>!target.has(v));
  if(!missing.length && !extra.length) return {ok:true, target};
  let msg = null;
  if(b.sel.size===0) msg = '먼저 왼쪽에서 사건이 일어나는 결과를 눌러 칠해 주세요.';
  if(!msg && evt.hint) msg = evt.hint(b.sel, target);
  if(!msg){
    if(extra.length && missing.length) msg = '사건에 맞지 않는 결과가 칠해져 있고, 빠진 결과도 있어요.';
    else if(extra.length) msg = '사건에 맞지 않는 결과가 칠해져 있어요.';
    else msg = '사건이 일어나는 결과 중에 빠진 것이 있어요.';
  }
  return {ok:false, msg, target};
}
// 칠하기 + 경우의 수 입력을 한 번에 확인. 정답이면 버튼·입력·보드를 잠그고 onOk 호출
// 반환: true=정답, false=오답, null=아직 덜 채움(문제풀이에서 첫 시도 실패로 치지 않음)
// qid를 주면 탐구 단계의 '한 번에 맞힌 질문'에 기록 (문제풀이는 따로 채점하므로 생략)
function checkCasesAndCount(key, evt, inpId, fbId, btn, onOk, qid){
  if(btn.disabled) return null;   // 이미 통과한 단계는 다시 이어붙이지 않음
  const inp = $(inpId);
  const r = judgeCases(key, evt);
  const fail = ()=>{ if(qid) firstTry(qid,false); return false; };
  if(boards[key].sel.size===0){ setFb(fbId,false,r.msg); return null; }
  if(!r.ok){ setFb(fbId,false,'❌ '+r.msg); return fail(); }
  const raw = inp.value.trim();
  if(raw===''){ setFb(fbId,false,'칠한 결과는 맞아요! 이제 경우의 수를 입력해 주세요.'); return null; }
  const n = parseCount(raw);
  if(n===null){ inp.classList.add('wrong'); setFb(fbId,false,'경우의 수는 숫자로 입력해 주세요. (예: 2)'); return fail(); }
  if(n!==r.target.size){ inp.classList.add('wrong'); setFb(fbId,false,'❌ 칠한 결과는 맞아요! 칠한 결과가 몇 개인지 다시 세어 봐요.'); return fail(); }
  if(qid) firstTry(qid,true);
  inp.classList.remove('wrong'); inp.classList.add('correct'); inp.disabled = true;
  btn.disabled = true;
  boards[key].done = true; renderBoard(key, false);
  onOk(r.target);
  return true;
}

/* ════════════════════════════════
   용어 팝업 — 파란 정리 상자를 핵심 용어 빈칸으로 먼저 띄우고, 써야 닫힘.
   틀리면 "다시 한 번 생각해 보세요!"만 (정답 공개 없음). 닫히면 화면의 상자가 나타남.
════════════════════════════════ */
let termCfg = null, termTimer = null;
function normTerm(s){ return String(s||'').replace(/[\s'"‘’“”.,!]/g,''); }
function termAfter(cfg, delay){
  clearTimeout(termTimer);
  termTimer = setTimeout(()=>{ if($(cfg.box)) openTermPop(cfg); }, delay==null ? 700 : delay);
}
function openTermPop(cfg){
  termCfg = cfg;
  const w = Math.max(...cfg.ans.map(a=>a.length))*1.1 + 1.6;
  $('termBox').innerHTML = `<div class="term-tag">📘 개념 정리</div><div class="modal-text" style="margin-bottom:8px">${cfg.title}<br><span style="color:var(--ink2);font-weight:600">빈칸에 알맞은 말을 써 보세요.</span></div>
    <div class="def-box">${cfg.html.replace('[[BLANK]]', `<input class="blank" id="termInp" style="width:${w}em" autocomplete="off">`)}</div>
    <div class="feedback" id="termFb"></div>
    <div class="btn-row"><button class="modal-btn" id="termBtn" onclick="termCheck()">확인</button></div>`;
  $('termModal').classList.add('show');
  const inp = $('termInp');
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') termCheck(); });
  try{ inp.focus(); }catch(e){}
}
function closeTermPop(){ clearTimeout(termTimer); $('termModal').classList.remove('show'); termCfg = null; }
function termCheck(){
  if(!termCfg || $('termBtn').disabled) return;
  const inp = $('termInp'), raw = normTerm(inp.value);
  if(raw===''){ setFb('termFb',false,'빈칸을 채워 주세요.'); return; }
  const ok = termCfg.ans.some(a=>normTerm(a)===raw);
  firstTry(termCfg.qid, ok);
  inp.classList.toggle('wrong',!ok); inp.classList.toggle('correct',ok);
  if(!ok){ setFb('termFb',false,'❌ 다시 한 번 생각해 보세요!'); return; }
  setFb('termFb',true,'✅ 맞아요!');
  $('termBtn').disabled = true;
  const box = termCfg.box;
  setTimeout(()=>{
    closeTermPop();
    const el = $(box); if(!el) return;
    el.classList.remove('term-wait'); flashRef(el); scrollToEl(box);
  }, 600);
}

function choiceCol(name, opts){
  // opts: [{key,label}] — 화면에 넣기 전에 순서 섞기
  return `<div class="choice-col" id="${name}Row">`+shuffle(opts).map(o=>`<button class="choice-btn" data-k="${o.key}" onclick="${name}Pick('${o.key}',this)">${o.label}</button>`).join('')+`</div>`;
}
function markChoice(rowId, btn, ok){
  document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.classList.remove('active','wrong'));
  btn.classList.add(ok?'correct':'wrong');
  if(ok) document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.disabled=true);
}

const SENTENCES = [
  {t:'한 개의 주사위를 던진다.', c:'exp'},
  {t:'한 개의 동전을 던진다.', c:'exp'},
  {t:'주머니에서 공 한 개를 꺼낸다.', c:'exp'},
  {t:'카드 10장 중에서 한 장을 뽑는다.', c:'exp'},
  {t:'한 사람이 가위, 바위, 보 중에서 하나를 낸다.', c:'exp'},

  {t:'주사위는 정육면체 모양이다.', c:'none'},
  {t:'주사위의 면은 모두 6개이다.', c:'none'},
  {t:'동전은 둥근 모양이다.', c:'none'},
  {t:'주머니는 천으로 만들었다.', c:'none'},
  {t:'카드는 모두 10장이다.', c:'none'},
  {t:'가위바위보는 세 가지 손 모양으로 한다.', c:'none'}
];
const CLS_LABEL = {exp:'실험', evt:'사건', none:'둘 다 아님'};
const s3 = { rows:[], pick:{}, done:{}, used:new Set(), locked:false };
function s3RowInner(i){
  return `<span class="ct">${s3.rows[i].t}</span><span class="cb">${['exp','evt','none'].map(c=>`<button class="choice-btn" onclick="s3Pick(${i},'${c}',this)">${CLS_LABEL[c]}</button>`).join('')}</span>`;
}
function stage3(){
  curStage=3; renderStepper(); showScreen('scAct');
  const by = c=>SENTENCES.filter(s=>s.c===c);
  s3.rows = shuffle([...pickN(by('exp'),2), ...pickN(by('evt'),2), ...pickN(by('none'),2)]);
  s3.pick = {}; s3.done = {}; s3.locked = false;
  s3.used = new Set(s3.rows.map(r=>r.t));
  const left = $('actLeft'); left.classList.remove('board-sticky');
  left.innerHTML = `<div class="hint-card" id="s3Hint">

    <div><span class="hq">① 결과를 얻으려고 해 보는 일인가요?</span><br>→ 주사위를 <span class="kw">던진다</span>, 공을 <span class="kw">꺼낸다</span> … <b>실험</b></div>
    <div style="margin-top:6px"><span class="hq">② 해 본 뒤에 나오는 결과인가요?</span><br>→ 짝수의 눈이 <span class="kw">나온다</span> … <b>사건</b></div>
    <div style="margin-top:6px"><span class="hq">③ 해 보지 않아도 늘 그대로인 설명인가요?</span><br>→ 주사위의 모양, 카드의 개수 … <b>둘 다 아님</b></div>
  </div>`;
  R(`<div class="panel-title"><span class="step-badge">4</span>실험일까, 사건일까?</div>
    <p class="key-q task">각 문장이 실험인지, 사건인지, 둘 다 아닌지 골라 보자.</p>
    <p class="sub">틀린 문장은 새 문장으로 바뀌어요.</p>
    <div style="margin-top:10px">${s3.rows.map((r,i)=>`<div class="cls-row" id="s3r${i}">${s3RowInner(i)}</div>`).join('')}</div>
    <div class="btn-row"><button class="btn btn-check" id="s3Btn" onclick="s3Check()">확인</button></div>
    <div class="feedback" id="s3Fb"></div>`);
}
function s3Pick(i, c, btn){
  if($('s3Btn').disabled || s3.locked || s3.done[i]) return;
  s3.pick[i] = c;
  $('s3r'+i).classList.remove('wrong','right');
  $('s3r'+i).querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
// 틀린 줄을 새 문장으로 — 같은 문장을 다시 고르면 남은 보기만 눌러도 맞히게 되므로 바꿈 (유형은 무작위)
function s3NextSentence(){
  const fresh = SENTENCES.filter(s=>!s3.used.has(s.t));
  const onScreen = new Set(s3.rows.map(r=>r.t));
  const pool = fresh.length ? fresh : SENTENCES.filter(s=>!onScreen.has(s.t));
  const s = pickN(pool,1)[0];
  s3.used.add(s.t);
  return s;
}
function s3Check(){
  if($('s3Btn').disabled || s3.locked) return;
  const pending = s3.rows.map((r,i)=>i).filter(i=>!s3.done[i]);
  const unanswered = pending.filter(i=>!s3.pick[i]).length;
  if(unanswered){ setFb('s3Fb',false,`아직 고르지 않은 문장이 ${unanswered}개 있어요.`); return; }
  const wrongIdx = [];
  pending.forEach(i=>{
    const row = $('s3r'+i);
    if(s3.pick[i]===s3.rows[i].c){
      s3.done[i] = true; row.classList.remove('wrong'); row.classList.add('right');
      row.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
    } else {
      wrongIdx.push(i); row.classList.add('wrong');
      row.querySelector('.cb').innerHTML = `<span class="ans-tag">❌ 틀렸어요</span>`;
    }
  });
  firstTry('s3', wrongIdx.length===0);
  if(wrongIdx.length){
    s3.locked = true;
    flashRef('s3Hint');
    const msg = `❌ ${wrongIdx.length}개가 틀렸어요. 왼쪽 세 가지 질문을 떠올리며 다시 한 번 생각해 보세요!`;
    lockTimer(lockSecs('s3'), 's3Fb', msg, '틀린 문장이 새 문장으로 바뀌어요', $('s3Btn'), ()=>{
      wrongIdx.forEach(i=>{
        s3.rows[i] = s3NextSentence(); delete s3.pick[i];
        const row = $('s3r'+i); row.classList.remove('wrong'); row.innerHTML = s3RowInner(i);
      });
      s3.locked = false;
      setFb('s3Fb',false,`🔁 새 문장 ${wrongIdx.length}개가 나왔어요. 다시 골라 보세요.`);
    });
    return;
  }
  $('s3Btn').disabled = true;
  setFb('s3Fb',true,'✅ 모두 맞았어요!');
  appendR(`<div class="qblock" id="s3End">
    <div class="note-box"><span class="kw">실험</span>은 결과를 얻으려고 해 보는 일, <span class="kw">사건</span>은 그 실험에서 나오는 결과예요.</div>
    <div class="btn-row"><button class="btn" id="s3NextBtn" onclick="this.disabled=true;stage4()">다음: 여러 가지 실험 →</button></div>
  </div>`);
  scrollToEl('s3End');
}

/* ════════════════════════════════
   6단계: 거꾸로 — 경우를 보고 사건 고르기 (맞는 것 모두)
════════════════════════════════ */
const REVERSE_ITEMS = [
  { exp:'dice', set:[2,4,6], opts:['d-even','d-even2','d-ge4','d-prime','d-odd'] },
  { exp:'dice', set:[1,2,3], opts:['d-le3','d-lt4','d-div6','d-prime','d-div3'] },
  { exp:'card', set:[1,3,5,7,9], opts:['k-odd','k-nm2','k-prime','k-mul3','k-div9'] },
  { exp:'menu', set:['칼국수','쫄면'], opts:['m-noodle','m-rice','m-kal','m-nbib'] }
];
const s5 = { idx:0, pick:new Set() };
function reverseCorrectIds(item){ const t=new Set(item.set); return item.opts.filter(id=>sameSet(caseSet(EV[id]),t)); }
function stage5(){
  curStage=5; renderStepper(); showScreen('scAct');
  s5.idx = 0;
  R(`<div class="panel-title"><span class="step-badge">6</span>거꾸로 생각하기</div>
    <p class="lead">이번에는 반대로 해 봐요. 왼쪽에 <b style="color:var(--orange)">색칠된 결과</b>를 보고, 그 결과들이 나오는 사건을 찾아요.</p>
    <div id="s5Steps"></div>`);
  s5Step();
}
function s5Step(){
  const i = s5.idx, item = REVERSE_ITEMS[i];
  s5.pick = new Set();
  setBoard('act', item.exp, {locked:item.set});
  $('s5Steps').insertAdjacentHTML('beforeend', `<div class="qblock" id="s5b${i}">
    <p class="lead"><span class="step-badge">${i+1} / ${REVERSE_ITEMS.length}</span> ${EXP[item.exp].instr}</p>
    <p class="key-q task">왼쪽에 색칠된 결과들이 나오는 사건을 <span class="em">모두</span> 골라 보자.</p>
    <p class="sub">맞는 것이 하나일 수도, 여러 개일 수도 있어요.</p>
    <div class="choice-col" id="s5r${i}">${shuffle(item.opts).map(id=>`<button class="choice-btn check" data-id="${id}" onclick="s5Toggle(${i},'${id}',this)">${EV[id].text}.</button>`).join('')}</div>
    <div class="btn-row"><button class="btn btn-check" id="s5c${i}" onclick="s5Check(${i})">확인</button></div>
    <div class="feedback" id="s5f${i}"></div>
  </div>`);
  markShown('s5_'+i,'s5b'+i);
  scrollToEl('s5b'+i);
}
function s5Toggle(i, id, btn){
  if(i!==s5.idx || $('s5c'+i).disabled) return;
  if(s5.pick.has(id)){ s5.pick.delete(id); btn.classList.remove('active'); }
  else { s5.pick.add(id); btn.classList.add('active'); }
  btn.classList.remove('wrong');
}
function s5Check(i){
  if($('s5c'+i).disabled) return;
  const item = REVERSE_ITEMS[i];
  const correct = new Set(reverseCorrectIds(item));
  if(!s5.pick.size){ setFb('s5f'+i,false,'맞는 사건을 하나 이상 골라 주세요.'); return; }
  if(!readGate('s5_'+i,'s5f'+i)) return;
  const wrongPicked = [...s5.pick].filter(id=>!correct.has(id));
  const missing = [...correct].filter(id=>!s5.pick.has(id));
  firstTry('s5_'+i, !wrongPicked.length && !missing.length);
  if(wrongPicked.length || missing.length){
    $('s5c'+i).disabled = true;
    wrongLock({ qid:'s5_'+i, row:'s5r'+i, fb:'s5f'+i, refs:['actBoard'],
      msg: wrongPicked.length ? '❌ 고른 것 중에 색칠된 결과와 맞지 않는 사건이 있어요. 그 사건이 일어나는 경우를 하나씩 떠올려 봐요.' : '❌ 고른 것은 맞아요! 그런데 맞는 사건이 더 있어요.',
      after: ()=>{ s5.pick = new Set(); $('s5c'+i).disabled = false; } });
    return;
  }
  $('s5c'+i).disabled = true;
  document.querySelectorAll('#s5r'+i+' .choice-btn').forEach(b=>{ b.disabled=true; if(correct.has(b.dataset.id)) b.classList.add('correct'); });
  setFb('s5f'+i,true, correct.size>=2 ? '✅ 맞아요! 같은 결과들을 서로 다른 말로 나타낼 수도 있어요.' : '✅ 맞아요! 이번에는 맞는 사건이 하나뿐이었어요.');
  s5.idx++;
  if(s5.idx < REVERSE_ITEMS.length){ setTimeout(s5Step, 800); return; }
  $('s5Steps').insertAdjacentHTML('beforeend', `<div class="qblock" id="s5End">
    <div class="note-box">'짝수의 눈이 나온다'와 '2의 배수의 눈이 나온다'처럼, <span class="kw">말은 달라도 일어나는 경우가 같은 사건</span>도 있어요.</div>
    <div class="btn-row"><button class="btn" id="s5NextBtn" onclick="this.disabled=true;stage6()">다음: 정리하기 →</button></div>
  </div>`);
  scrollToEl('s5End');
}

════════════════════════════════ */
const SUM_BLANKS = [
  { ans:'결과', opts:['결과','행동','도구'], wrong:{'행동':'주사위를 던지는 행동은 실험이에요. 실험을 해서 얻는 것이 무엇인지 생각해 봐요.','도구':'주사위나 동전 같은 도구 자체는 사건이 아니에요.'} },
  { ans:'사건', opts:['사건','실험','경우의 수'], wrong:{'실험':'실험은 결과를 얻으려고 해 보는 일이에요.','경우의 수':'경우의 수는 가짓수, 즉 개수를 말해요.'} },
  { ans:'경우의 수', opts:['경우의 수','사건','결과'], wrong:{'사건':'가짓수(개수)를 나타내는 말이 무엇이었는지 떠올려 봐요.','결과':'가짓수(개수)를 나타내는 말이 무엇이었는지 떠올려 봐요.'} }
];
let sumIdx = 0;
function stage6(){
  curStage=6; renderStepper(); showScreen('scSummary');
  sumIdx = 0;
  $('summaryArea').innerHTML = `<div class="panel-title"><span class="step-badge">7</span>정리해 볼까요?</div>
    <p class="key-q task">빈칸에 알맞은 말을 차례로 골라 보자.</p>
    <div class="sum-line" style="margin-top:10px">
      같은 조건에서 반복할 수 있는 실험이나 관찰의 <span class="slot" id="slot0">①</span>를 <span class="slot" id="slot1">②</span>이라고 한다.<br>
      이때 사건이 일어나는 가짓수를 <span class="slot" id="slot2">③</span>라고 한다.
    </div>
    <div id="sumPickArea" style="margin-top:8px"></div>
    <div class="feedback" id="sumFb"></div>
    <div id="sumEnd"></div>`;
  sumRenderPick();
}
function sumRenderPick(){
  const b = SUM_BLANKS[sumIdx];
  $('sumPickArea').innerHTML = `<div style="font-weight:700;font-size:13.5px;margin-bottom:6px">${['①','②','③'][sumIdx]}에 들어갈 말:</div>
    <div class="pick" id="sumRow">${shuffle(b.opts).map(o=>`<button class="choice-btn" onclick="sumPick('${o}',this)">${o}</button>`).join('')}</div>`;
}
function sumPick(o, btn){
  if(btn.disabled) return;
  const b = SUM_BLANKS[sumIdx];
  firstTry('sum'+sumIdx, o===b.ans);
  if(o!==b.ans){ markChoice('sumRow',btn,false); wrongLock({qid:'sum'+sumIdx, row:'sumRow', fb:'sumFb', msg:'❌ '+b.wrong[o]}); return; }
  markChoice('sumRow',btn,true);
  const slot = $('slot'+sumIdx); slot.textContent = o; slot.classList.add('filled');
  setFb('sumFb',true,'✅ 맞아요!');
  sumIdx++;
  if(sumIdx < SUM_BLANKS.length){ setTimeout(sumRenderPick, 400); return; }
  $('sumPickArea').innerHTML = '';
  $('sumEnd').innerHTML = `
    <div class="tb3">
      <div class="col"><div class="th">사건</div><div class="td">짝수의 눈이<br>나온다.</div></div>
      <div class="col"><div class="th">사건이 일어나는 경우</div><div class="td">${casesHTML('dice',new Set([2,4,6]))}</div></div>
      <div class="col"><div class="th">경우의 수</div><div class="td" style="font-size:20px">3</div></div>
    </div>
    <div class="note-box">
      ✔ <b>실험</b>: 결과를 얻으려고 해 보는 일 (주사위를 던진다)<br>
      ✔ <b>사건</b>: 실험이나 관찰의 결과 (짝수의 눈이 나온다)<br>
      ✔ <b>사건이 일어나는 경우</b>: 그 사건에 해당하는 구체적인 결과들 (2, 4, 6)<br>
      ✔ <b>경우의 수</b>: 사건이 일어나는 가짓수 (3)
    </div>
    <div class="btn-row"><button class="btn" id="sumNextBtn" onclick="this.disabled=true;goToPractice()">문제풀이 시작 →</button></div>`;

/* ════════════════════════════════
   8단계: 문제풀이 — 레벨1(사건 주고 경우·경우의 수) → 레벨2(경우 주고 사건 고르기)
   통과: 4문제 중 3문제 이상 '첫 시도'에 정답
════════════════════════════════ */
const LEVELS = [ { key:'1', label:'레벨1', passNeeded:3, n:4 }, { key:'2', label:'레벨2', passNeeded:3, n:4 } ];
const pst = { levelIdx:0, idx:0, correct:0, order:[], firstTry:true, passedLevels:{}, l2pick:null };
// 레벨2: 정답 사건 1개 + 일어나는 경우가 서로 다른 오답 사건 3개
function buildL2Options(evt){
  const used = [caseSet(evt)];
  const out = [evt.id];
  for(const e of shuffle(eventsOf(evt.exp))){
    if(out.length>=4) break;
    const cs = caseSet(e);
    if(used.some(u=>sameSet(u,cs))) continue;
    used.push(cs); out.push(e.id);
  }
  return out;
}
function goToPractice(){
  curStage=7; renderStepper();
  startLevel(0);
}
function updateLevelTabs(){
  $('levelTabs').innerHTML = LEVELS.map((lv,i)=>{
    let cls='level-tab';
    if(i===pst.levelIdx) cls+=' active';
    else if(pst.passedLevels[i]) cls+=' done';
    return `<div class="${cls}">${lv.label}${i===0?' · 경우 찾기':' · 사건 찾기'}</div>`;
  }).join('');
}
function startLevel(levelIdx){
  pst.levelIdx = levelIdx; pst.idx=0; pst.correct=0;
  if(levelIdx===0){
    const exps = pickN(['dice','coin','rps','card','ball','menu'], 4);
    pst.order = exps.map(x=>({ evt:pickN(eventsOf(x),1)[0] }));
  } else {
    const exps = pickN(['dice','rps','card','ball','menu'], 4);
    pst.order = exps.map(x=>{ const evt=pickN(eventsOf(x),1)[0]; return { evt, opts:shuffle(buildL2Options(evt)) }; });
  }
  showScreen('scPractice');
  updateLevelTabs();
  renderPQuestion();
}
// 레벨2에서 틀리면 같은 실험의 '일어나는 경우가 다른' 사건으로 새 문제를 만듦 (찍어서 넘어갈 수 없게)
function makeL2Variant(q){
  const cur = caseSet(q.evt);
  const cands = eventsOf(q.evt.exp).filter(e=>!sameSet(caseSet(e),cur));
  const evt = pickN(cands,1)[0];
  return { evt, opts:shuffle(buildL2Options(evt)), variant:true };
}
function renderPQuestion(keepFail){
  const lv = LEVELS[pst.levelIdx];
  const q = pst.order[pst.idx];
  pst.firstTry = !keepFail; pst.l2pick = null;
  $('pgProgress').textContent = `${lv.label} · ${pst.idx+1} / ${pst.order.length}`;
  const banner = q.variant ? `<div class="variant-banner">🔁 비슷한 새 문제로 바뀌었어요. 이 문제를 맞혀야 다음으로 넘어가요. <span class="sub">(점수에는 들어가지 않아요.)</span></div>` : '';
  if(pst.levelIdx===0){
    setBoard('pg', q.evt.exp);
    $('pgArea').innerHTML = `
      <p class="lead"><b>실험:</b> ${EXP[q.evt.exp].instr}</p>
      <p class="key-q task">표의 빈칸을 알맞게 채워 보자.</p>
      <table class="evt-table"><thead><tr><th>사건</th><th>사건이 일어나는 경우</th><th>경우의 수</th></tr></thead>
        <tbody><tr><td class="left">${q.evt.text}.</td><td style="color:var(--indigo)">👈 왼쪽에서 칠하기</td><td><input class="blank" id="pgInp" style="width:52px"></td></tr></tbody></table>
      <div class="btn-row"><button class="btn btn-check" id="pgBtn" onclick="pgCheckL1()">확인</button></div>
      <div class="feedback" id="pgFb"></div>
      <div class="btn-row" id="pgNextRow"></div>`;
  } else {
    const target = caseSet(q.evt);
    setBoard('pg', q.evt.exp, {locked:[...target]});
    $('pgArea').innerHTML = `${banner}
      <p class="lead"><b>실험:</b> ${EXP[q.evt.exp].instr}<br>왼쪽에 색칠된 결과가 <span class="kw">사건이 일어나는 경우</span>예요.</p>
      <p class="key-q task">알맞은 <span class="em">사건</span>을 고르고, 경우의 수를 써 보자.</p>
      <table class="evt-table"><thead><tr><th>사건</th><th>사건이 일어나는 경우</th><th>경우의 수</th></tr></thead>
        <tbody><tr><td class="left"><div class="choice-col" id="pgRow" style="margin:0">${q.opts.map(id=>`<button class="choice-btn" style="padding:6px 10px;font-size:12.5px" onclick="pgPickL2('${id}',this)">${EV[id].text}.</button>`).join('')}</div></td>
        <td>${casesHTML(q.evt.exp,target)}</td><td><input class="blank" id="pgInp" style="width:52px"></td></tr></tbody></table>
      <div class="btn-row"><button class="btn btn-check" id="pgBtn" onclick="pgCheckL2()">확인</button></div>
      <div class="feedback" id="pgFb"></div>
      <div class="btn-row" id="pgNextRow"></div>`;
    markShown('pg','pgArea');
  }
}
function pgSolved(){
  if(pst.firstTry) pst.correct++;
  $('pgNextRow').innerHTML = `<button class="btn" id="pgNextBtn" onclick="this.disabled=true;pgNext()">${pst.idx<pst.order.length-1?'다음 문제 →':'결과 보기 →'}</button>`;
}
function pgCheckL1(){
  const q = pst.order[pst.idx];
  const ok = checkCasesAndCount('pg', q.evt, 'pgInp', 'pgFb', $('pgBtn'), ()=>{
    setFb('pgFb',true, pst.firstTry ? '✅ 정답이에요!' : '✅ 맞아요! (다시 풀어서 맞힌 문제는 점수에 들어가지 않아요.)');
    pgSolved();
  });
  if(ok===false) pst.firstTry = false;
}
function pgPickL2(id, btn){
  if($('pgBtn').disabled) return;
  pst.l2pick = id;
  document.querySelectorAll('#pgRow .choice-btn').forEach(b=>b.classList.remove('active','wrong'));
  btn.classList.add('active');
}
function pgCheckL2(){
  if($('pgBtn').disabled) return;
  const q = pst.order[pst.idx];
  const inp = $('pgInp');
  if(!pst.l2pick){ setFb('pgFb',false,'먼저 알맞은 사건을 골라 주세요.'); return; }
  const target = caseSet(q.evt);
  const pickedOk = sameSet(caseSet(EV[pst.l2pick]), target);
  const n = parseCount(inp.value);
  if(!readGate('pg','pgFb')) return;
  if(!pickedOk){
    // 틀린 이유(고른 사건이 일어나는 경우)를 보여 주고, 잠깐 뒤 비슷한 새 문제로 바꿈
    pst.firstTry = false;
    const picked = EV[pst.l2pick];
    document.querySelectorAll('#pgRow .choice-btn.active').forEach(b=>b.classList.add('wrong'));
    document.querySelectorAll('#pgRow .choice-btn').forEach(b=>{ b.disabled=true; });
    inp.disabled = true; $('pgBtn').disabled = true;
    const msg = `❌ '${picked.text}'가 일어나는 경우는 <b>${casesHTML(picked.exp,caseSet(picked))}</b>예요. 왼쪽에 색칠된 결과와 달라요.`;
    lockTimer(lockSecs('pg'+pst.levelIdx+'_'+pst.idx), 'pgFb', msg, '비슷한 새 문제로 바뀌어요', $('pgBtn'), ()=>{
      pst.order[pst.idx] = makeL2Variant(q);
      renderPQuestion(true);
    });
    return;
  }
  if(inp.value.trim()===''){ setFb('pgFb',false,'사건은 맞아요! 이제 경우의 수를 입력해 주세요.'); return; }
  if(n===null || n!==target.size){ pst.firstTry = false; inp.classList.add('wrong'); setFb('pgFb',false,'❌ 사건은 맞아요! 색칠된 결과가 몇 개인지 다시 세어 봐요.'); return; }
  inp.classList.remove('wrong'); inp.classList.add('correct'); inp.disabled = true;
  $('pgBtn').disabled = true;
  document.querySelectorAll('#pgRow .choice-btn').forEach(b=>{ b.disabled=true; });
  document.querySelector('#pgRow .choice-btn.active').classList.add('correct');
  setFb('pgFb',true, pst.firstTry ? '✅ 정답이에요!' : '✅ 맞아요! (다시 풀어서 맞힌 문제는 점수에 들어가지 않아요.)');
  pgSolved();
}
function pgNext(){
  pst.idx++;
  if(pst.idx < pst.order.length) renderPQuestion();
  else levelFinish();
}
function levelFinish(){
  const lv = LEVELS[pst.levelIdx];
  const pass = pst.correct >= lv.passNeeded;
  if(pass) pst.passedLevels[pst.levelIdx] = true;
  updateLevelTabs();
  showScreen('scLevelResult');
  $('lrIcon').textContent = pass?'🎉':'💪';
  $('lrTitle').textContent = pass ? `${lv.label} 통과!` : `${lv.label} 아쉬워요`;
  $('lrScore').textContent = `${pst.correct} / ${pst.order.length}`;
  $('lrMsg').textContent = pass ? '잘했어요! 다음으로 넘어가 볼까요?' : `한 번에 맞힌 문제가 ${lv.passNeeded}개 이상이어야 통과해요. 다시 도전해 볼까요?`;
  $('lrRetryBtn').style.display = pass ? 'none' : '';
  $('lrNextBtn').style.display = pass ? '' : 'none';
  $('lrNextBtn').textContent = (pst.levelIdx < LEVELS.length-1) ? '다음 레벨 →' : '결과 보기 →';
}
function lrRetry(){ startLevel(pst.levelIdx); }
function lrNext(){
  if(pst.levelIdx < LEVELS.length-1){ startLevel(pst.levelIdx+1); }
  else {
    curStage = STAGES.length; renderStepper();
    showScreen('scDone');
    $('doneStat').innerHTML = stat.total ? `탐구하면서 한 번에 맞힌 질문: ${stat.first} / ${stat.total}` : '';
    if(window._reportHubComplete) window._reportHubComplete();
  }
}

/* ════════════════════════════════
   관리자 모드 (SHA-256 해시 비교 — 가벼운 잠금일 뿐, 보안 장치 아님)
════════════════════════════════ */
const ADMIN_HASH = 'fb9e692b52ad41cd666f83c8175df90569d48192d531e9c94285929bc116891a';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function openAdminModal(){
  $('adminPwInput').value=''; $('adminPwErr').textContent='';
  $('adminPwModal').classList.add('show'); $('adminPwInput').focus();
}
function adminCasesText(evt){ const s=caseSet(evt); return OUT[evt.exp].filter(v=>s.has(v)).join(', ')+` → ${s.size}`; }
async function checkAdminPassword(){
  const v = $('adminPwInput').value;
  let ok=false;
  try{ ok = (await sha256Hex(v)) === ADMIN_HASH; }
  catch(e){ $('adminPwErr').textContent='이 브라우저에서는 관리자 모드를 쓸 수 없어요.'; return; }
  if(!ok){ $('adminPwErr').textContent='비밀번호가 틀렸어요.'; return; }
  $('adminPwModal').classList.remove('show');
  const expName = {dice:'주사위',coin:'동전',rps:'가위바위보',card:'카드1~10',ball:'공1~8',menu:'차림표'};
  $('adminPanelBody').innerHTML =
    '<div class="btn-row" style="justify-content:flex-start;margin:0 0 8px">'+
      STAGES.map((s,i)=>`<button class="modal-btn" style="padding:2px 8px;font-size:10.5px" onclick="adminGo(${i})">${i+1}.${s}</button>`).join('')+
      '<button class="modal-btn" style="padding:2px 8px;font-size:10.5px" onclick="adminGo(8)">레벨2</button>'+
    '</div>'+
    '<div><strong>경우의 수 입력 인정 형식</strong>: 2 (= 2가지 = 2개, 띄어쓰기 무시)</div>'+
    '<div><strong>1단계</strong>: Q1 반복할 수 없어요 / Q2 계속 확인 가능(5번 이상 던져야 채점) / Q3 나오는 결과</div>'+
    '<div><strong>2단계</strong>: 탐구1 1~6 → 6, 탐구2 3,6 → 2</div>'+
    '<div style="margin-top:6px"><strong>사건 전체 목록 (경우 → 경우의 수)</strong> — 3단계는 ★ 중 4개 랜덤, 5단계는 실험별 1개 랜덤, 문제풀이는 전체에서 랜덤</div>'+
    EVENTS.map(e=>`<div>[${expName[e.exp]}] ${e.B?'★ ':''}${e.text}: ${adminCasesText(e)}</div>`).join('')+
    '<div style="margin-top:6px"><strong>4단계 분류 (유형별 2개씩 랜덤)</strong></div>'+
    SENTENCES.map(s=>`<div>${s.t} → ${CLS_LABEL[s.c]}</div>`).join('')+
    '<div style="margin-top:6px"><strong>6단계 거꾸로 (정답 모두)</strong></div>'+
    REVERSE_ITEMS.map(it=>`<div>${it.set.join(', ')} → ${reverseCorrectIds(it).map(id=>EV[id].text).join(' / ')}</div>`).join('')+
    '<div style="margin-top:6px"><strong>7단계 정리</strong>: ① 결과 ② 사건 ③ 경우의 수</div>'+
    '<div style="margin-top:6px"><strong>레벨2</strong>: 일어나는 경우가 색칠된 결과와 같은 사건 1개만 정답(오답 3개는 경우가 서로 다르게 자동 선택)</div>'+
    '<div><strong>용어 팝업</strong>: 사건 / 경우의 수 (띄어쓰기·따옴표·마침표 무시)</div>'+
    '<div style="color:var(--red);margin-top:6px">미인정: "두 가지"처럼 한글 수사로 쓴 경우의 수</div>'+
    '<div style="margin-top:6px"><strong>정의 확인 질문</strong>: 사건 → 같은 조건에서 반복할 수 있는 실험이나 관찰 / 경우의 수 → 사건이 일어나는 가짓수</div>'+
    '<div style="margin-top:6px"><strong>찍기 방지 (실험판)</strong>: 질문이 뜬 뒤 1.5~4초 안에 고르면 채점 안 함 · 틀리면 3→5→8초 잠금 후 보기 다시 섞기 · 4단계 틀린 문장은 새 문장으로 교체(유형 무작위, 정답 공개 안 함) · 레벨2 사건 오답은 새 변형 문제</div>'+
    `<label style="display:block;margin-top:6px"><input type="checkbox" ${GUARD.on?'':'checked'} onchange="GUARD.on=!this.checked"> 시연용: 읽기 확인·잠금 끄기</label>`;
  $('adminPanel').style.display='block';
}
function adminGo(i){
  closeTermPop();
  if(i===0) stage0(); else if(i===1) stage1(); else if(i===2) stage2(); else if(i===3) stage3();
  else if(i===4) stage4(); else if(i===5) stage5(); else if(i===6) stage6();
  else if(i===7) goToPractice();
  else if(i===8){ curStage=7; renderStepper(); startLevel(1); }
}

stage0();
</script>
