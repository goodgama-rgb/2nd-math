:root{

  --violet:#7c3aed;--violet-l:#ede9fe;--violet-ll:#f5f3ff;
  --teal:#0d9488;--teal-l:#ccfbf1;--teal-ll:#f0fdfa;
  --green:#16a34a;--green-l:#dcfce7;
  --red:#dc2626;--red-l:#fee2e2;
  --r:12px;--shadow:0 2px 12px rgba(26,26,46,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#f7f7fb;color:var(--ink);min-height:100vh;padding-bottom:60px}
.hdr{background:var(--ink);color:#fff;padding:16px 24px}
.hdr-title{font-size:18px;font-weight:700}
.hdr-sub{font-size:12px;opacity:.7;margin-top:2px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px}
.sec{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.sec-title{padding:12px 18px;font-size:15px;font-weight:700;background:#f0f0f5;color:var(--ink);border-bottom:1px solid #e5e5ee}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0}
.col{padding:16px 18px}
.col+.col{border-left:1px solid #eee}
.col-h{font-size:13px;font-weight:700;margin-bottom:10px;display:inline-block;padding:3px 10px;border-radius:20px}
.col-h.inc{background:var(--violet-l);color:var(--violet)}
.col-h.circ{background:var(--teal-l);color:var(--teal)}
.sentence{font-size:14px;line-height:2.2;color:var(--ink2)}
.blank-wrap{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;vertical-align:middle;margin:0 2px}
.blank-input{text-align:center;padding:3px 8px;border-radius:6px;background:#fbfbfe;color:var(--ink);font-weight:700;border:1.5px solid #ccc;font-family:inherit;font-size:14px}
.blank-input:focus{outline:none;border-color:var(--violet)}
.blank-input.correct{background:var(--green-l);color:#14532d;border:1.5px solid var(--green)}
.blank-input.wrong{background:var(--red-l);color:var(--red);border:1.5px solid var(--red)}
.ans-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1.5px solid #d8d8e8;background:#fff;color:var(--ink3);cursor:pointer;font-family:inherit;font-weight:600;margin-left:4px}
.ans-btn:not(:disabled):hover{border-color:var(--violet);color:var(--violet)}
.ans-btn:disabled{opacity:.35;cursor:not-allowed}
.sec-grade{padding:12px 18px;text-align:right;border-top:1px solid #eee;background:#fafafd}
.grade-btn{font-size:13px;font-weight:700;padding:8px 18px;border-radius:8px;border:none;background:var(--ink);color:#fff;cursor:pointer;font-family:inherit}
.grade-btn:hover{background:#333}
.fig-box{display:flex;justify-content:center;margin-bottom:8px}
.fig-box canvas{max-width:100%;height:auto;cursor:pointer}
.match-msg{text-align:center;font-size:13px;font-weight:600;min-height:18px;margin-bottom:6px}
.match-msg.ok{color:var(--green)}
.match-msg.no{color:var(--red)}
.match-done{text-align:center;font-size:13px;font-weight:700;color:var(--green);margin-top:4px}

<script>
/* ════════════════════════════════
   공통 도형 헬퍼
════════════════════════════════ */
function drawLabel(ctx,x,y,text,color,size,weight){
  ctx.fillStyle=color;
  ctx.font=`${weight||700} ${size||13}px 'Noto Sans KR',sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,x,y);
}
function outsideLabelPos(pt, centroid, dist){
  const dx=pt.x-centroid.x, dy=pt.y-centroid.y, len=Math.hypot(dx,dy)||1;
  return {x:pt.x+dx/len*dist, y:pt.y+dy/len*dist};
}
function angleArcAt(ctx,v,p1,p2,r,color){
  const a1=Math.atan2(p1.y-v.y,p1.x-v.x);
  const a2=Math.atan2(p2.y-v.y,p2.x-v.x);
  let diff=a2-a1;
  while(diff<=-Math.PI)diff+=2*Math.PI;
  while(diff>Math.PI)diff-=2*Math.PI;
  ctx.strokeStyle=color; ctx.lineWidth=1.7;
  ctx.beginPath();
  ctx.arc(v.x,v.y,r,a1,a1+diff,diff<0);
  ctx.stroke();
}
function angleMidPoint(v,p1,p2,r){
  const a1=Math.atan2(p1.y-v.y,p1.x-v.x), a2=Math.atan2(p2.y-v.y,p2.x-v.x);
  let diff=a2-a1; while(diff<=-Math.PI)diff+=2*Math.PI; while(diff>Math.PI)diff-=2*Math.PI;
  const mid=a1+diff/2;
  return {x:v.x+r*Math.cos(mid), y:v.y+r*Math.sin(mid)};
}
function fitPointsToCanvas(pointsObj, canvasW, canvasH, pad){
  const keys=Object.keys(pointsObj);
  const xs=keys.map(k=>pointsObj[k].x), ys=keys.map(k=>pointsObj[k].y);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const bw=(maxX-minX)||1, bh=(maxY-minY)||1;
  const availW=canvasW-2*pad, availH=canvasH-2*pad;
  const scale=Math.min(availW/bw, availH/bh);
  const offX=pad-minX*scale+(availW-bw*scale)/2;
  const offY=pad-minY*scale+(availH-bh*scale)/2;
  const out={};
  keys.forEach(k=>{ out[k]={x:pointsObj[k].x*scale+offX, y:pointsObj[k].y*scale+offY}; });
  return out;
}
function midDashLabel(ctx,p1,p2,centroid,text,color,size,bow){
  const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
  const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy)||1;
  let px=-dy/len, py=dx/len;
  const toOut={x:mx-centroid.x, y:my-centroid.y};
  if(px*toOut.x+py*toOut.y<0){ px=-px; py=-py; }
  const cx=mx+px*(bow||10), cy=my+py*(bow||10);
  ctx.save();
  ctx.strokeStyle='#999'; ctx.lineWidth=1.2; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.quadraticCurveTo(cx,cy,p2.x,p2.y); ctx.stroke();
  ctx.restore();
  const lx=cx+px*11, ly=cy+py*11;
  drawLabel(ctx,lx,ly,text,color,size||12);
}
function pointInTriangle(pt,v1,v2,v3){
  function sign(p1,p2,p3){return (p1.x-p3.x)*(p2.y-p3.y)-(p2.x-p3.x)*(p1.y-p3.y);}
  const d1=sign(pt,v1,v2), d2=sign(pt,v2,v3), d3=sign(pt,v3,v1);
  const hasNeg=(d1<0)||(d2<0)||(d3<0), hasPos=(d1>0)||(d2>0)||(d3>0);
  return !(hasNeg&&hasPos);
}
// 길이가 같음을 표시하는 눈금 — 반드시 변(p1-p2)과 수직으로 그림
function tickMark(ctx,p1,p2,count,color){
  const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
  const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len, px=-uy, py=ux;
  ctx.strokeStyle=color||'#333'; ctx.lineWidth=1.6;
  const spacing=5;
  for(let i=0;i<count;i++){
    const off=(i-(count-1)/2)*spacing;
    const cx=mx+ux*off, cy=my+uy*off;
    ctx.beginPath();
    ctx.moveTo(cx-px*5, cy-py*5);
    ctx.lineTo(cx+px*5, cy+py*5);
    ctx.stroke();
  }
}
// 이등분된 각 표시 — 두 반각에 같은 기호(symbol)를 겹쳐 그림
function bisectMark(ctx,v,p1,p2,symbol,color,r){
  angleArcAt(ctx,v,p1,p2,r||12,color);
  const mid=angleMidPoint(v,p1,p2,(r||12)+9);
  drawLabel(ctx,mid.x,mid.y,symbol,color,11,700);
}
// 평행 표시 — 두 변에 같은 방향의 화살표(셰브런)를 겹쳐 그림
function parallelMark(ctx,p1,p2,color){
  const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
  const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len, px=-uy, py=ux;
  const s=6;
  ctx.strokeStyle=color; ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(mx-ux*s+px*s, my-uy*s+py*s);
  ctx.lineTo(mx+ux*s, my+uy*s);
  ctx.lineTo(mx-ux*s-px*s, my-uy*s-py*s);
  ctx.stroke();
}
function rightAngleMark(ctx,corner,p1,p2,size,color){
  const u0={x:p1.x-corner.x,y:p1.y-corner.y}, ulen=Math.hypot(u0.x,u0.y)||1, u={x:u0.x/ulen,y:u0.y/ulen};
  const v0={x:p2.x-corner.x,y:p2.y-corner.y}, vlen=Math.hypot(v0.x,v0.y)||1, v={x:v0.x/vlen,y:v0.y/vlen};
  ctx.strokeStyle=color; ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.moveTo(corner.x+u.x*size, corner.y+u.y*size);
  ctx.lineTo(corner.x+u.x*size+v.x*size, corner.y+u.y*size+v.y*size);
  ctx.lineTo(corner.x+v.x*size, corner.y+v.y*size);
  ctx.stroke();
}
function drawCircleStroke(ctx,center,radius,color,dash){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=1.2;
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(center.x,center.y,radius,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

   ① 그림 — 합동인 삼각형 찾기
════════════════════════════════ */
function computeIncenterFig(xA,xB,xC){
  const a=xB+xC, b=xC+xA, c=xA+xB;
  const B={x:0,y:0}, C={x:a,y:0};
  const Ax=(a*a+c*c-b*b)/(2*a);
  const Ay=Math.sqrt(Math.max(c*c-Ax*Ax,0.01));
  const A={x:Ax,y:-Ay};
  const per=a+b+c;
  const I={x:(a*A.x+b*B.x+c*C.x)/per, y:(a*A.y+b*B.y+c*C.y)/per};
  function pointAt(P,Q,dist){ const dx=Q.x-P.x,dy=Q.y-P.y,len=Math.hypot(dx,dy); return {x:P.x+dx/len*dist, y:P.y+dy/len*dist}; }
  const D=pointAt(A,B,xA), E=pointAt(B,C,xB), F=pointAt(A,C,xA);
  return {A,B,C,I,D,E,F};
}
function computeCircumFig(a,b,c){
  const B={x:0,y:0}, C={x:a,y:0};
  const Ax=(a*a+c*c-b*b)/(2*a);
  const Ay=Math.sqrt(Math.max(c*c-Ax*Ax,0.01));
  const A={x:Ax,y:-Ay};
  const x1=A.x,y1=A.y,x2=B.x,y2=B.y,x3=C.x,y3=C.y;
  const Dd=2*(x1*(y2-y3)+x2*(y3-y1)+x3*(y1-y2));
  const Ux=((x1*x1+y1*y1)*(y2-y3)+(x2*x2+y2*y2)*(y3-y1)+(x3*x3+y3*y3)*(y1-y2))/Dd;
  const Uy=((x1*x1+y1*y1)*(x3-x2)+(x2*x2+y2*y2)*(x1-x3)+(x3*x3+y3*y3)*(x2-x1))/Dd;
  const O={x:Ux,y:Uy};
  const D={x:(A.x+B.x)/2,y:(A.y+B.y)/2};
  const E={x:(B.x+C.x)/2,y:(B.y+C.y)/2};
  const F={x:(A.x+C.x)/2,y:(A.y+C.y)/2};
  return {A,B,C,O,D,E,F};
}
function setupMatcher(canvasId, msgId, doneId, raw, centerKey, regionDefs, validPairs, labelDrawer){
  const canvas=document.getElementById(canvasId);
  const ctx=canvas.getContext('2d');
  const F=fitPointsToCanvas(raw, canvas.width, canvas.height, 42);
  const regions={};
  Object.entries(regionDefs).forEach(([name,keys])=>{ regions[name]=keys.map(k=>F[k]); });
  const colors=['#dc2626','#2563eb','#16a34a'];
  const matchedColor={};
  let selected=null, pairsFound=0;
  const msgEl=document.getElementById(msgId), doneEl=document.getElementById(doneId);

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    Object.entries(regions).forEach(([name,pts])=>{
      if(matchedColor[name]!==undefined){
        ctx.fillStyle=colors[matchedColor[name]]+'4d';
        ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[1].x,pts[1].y); ctx.lineTo(pts[2].x,pts[2].y); ctx.closePath(); ctx.fill();
      } else if(name===selected){
        ctx.fillStyle='#fde68a99';
        ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[1].x,pts[1].y); ctx.lineTo(pts[2].x,pts[2].y); ctx.closePath(); ctx.fill();
      }
    });
    labelDrawer(ctx, F);
  }
  function findPairFor(name){
    for(const [n1,n2] of validPairs){
      if(n1===name) return n2;
      if(n2===name) return n1;
    }
    return null;
  }
  canvas.addEventListener('click', e=>{
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
    const px=(e.clientX-rect.left)*scaleX, py=(e.clientY-rect.top)*scaleY;
    let clicked=null;
    for(const [name,pts] of Object.entries(regions)){
      if(matchedColor[name]!==undefined) continue;
      if(pointInTriangle({x:px,y:py},pts[0],pts[1],pts[2])){ clicked=name; break; }
    }
    if(!clicked) return;
    if(selected===null){
      selected=clicked; msgEl.textContent=''; msgEl.className='match-msg'; draw();
    } else if(selected===clicked){
      selected=null; draw();
    } else {
      const correctPartner=findPairFor(selected);
      if(correctPartner===clicked){
        matchedColor[selected]=pairsFound; matchedColor[clicked]=pairsFound; pairsFound++;
        selected=null;
        msgEl.textContent='정답이에요! 합동인 삼각형이에요 👍'; msgEl.className='match-msg ok';
        if(pairsFound>=3){ doneEl.style.display='block'; }
      } else {
        msgEl.textContent='합동이 아니에요. 다시 선택해보세요.'; msgEl.className='match-msg no';
        selected=null;
      }
      draw();
    }
  });
  draw();
}

function gradeSection(sectionId){
  Object.entries(PROBLEMS).forEach(([pid,info])=>{

    info.blanks.forEach(bid=>{
      const inp=document.getElementById(bid+'-inp');

      inp.classList.remove('correct','wrong');
      if(val && val===inp.dataset.answer) inp.classList.add('correct');
      else inp.classList.add('wrong');

    if(btn) btn.disabled=false;

    inp.classList.remove('wrong'); inp.classList.add('correct');

// 이등변삼각형: ∠A의 이등분선=BC의 수직이등분선(D에서 만남) 위에 O,I가 있음을 보이고,
// AB의 수직이등분선도 실제로 그려서 그 교점이 O임을 함께 보여줌 (O,I는 실제 외심·내심 공식으로 계산)
function drawIsoPosFig(canvas){
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const a=100,b=130,c=130; // a=BC, b=CA, c=AB (AB=AC 이등변)
  const raw0=computeCircumFig(a,b,c); // A,B,C,O, D=mid(AB), E=mid(BC), F=mid(AC)
  const per=a+b+c;
  const I0={x:(a*raw0.A.x+b*raw0.B.x+c*raw0.C.x)/per, y:(a*raw0.A.y+b*raw0.B.y+c*raw0.C.y)/per};
  const F=fitPointsToCanvas({A:raw0.A,B:raw0.B,C:raw0.C,O:raw0.O,I:I0,Dfoot:raw0.E,Mab:raw0.D}, canvas.width, canvas.height, 30);
  const {A,B,C,O,I,Dfoot,Mab}=F;
  ctx.strokeStyle='#333'; ctx.lineWidth=1.7;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.closePath(); ctx.stroke();
  // ∠A의 이등분선(=BC의 수직이등분선), D에서 BC와 만남
  ctx.strokeStyle='#888'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(Dfoot.x,Dfoot.y); ctx.stroke();
  rightAngleMark(ctx,Dfoot,B,A,6,'#666');
  // AB의 수직이등분선: M(AB의 중점)에서 O까지
  ctx.strokeStyle='#0d9488'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(Mab.x,Mab.y); ctx.lineTo(O.x,O.y); ctx.stroke();
  rightAngleMark(ctx,Mab,A,O,6,'#666');
  // ∠B의 이등분선: B에서 내심 I까지
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=1.3;
  ctx.beginPath(); ctx.moveTo(B.x,B.y); ctx.lineTo(I.x,I.y); ctx.stroke();
  tickMark(ctx,A,B,1,'#333'); tickMark(ctx,A,C,1,'#333');
  tickMark(ctx,B,Dfoot,1,'#333'); tickMark(ctx,Dfoot,C,1,'#333');
  bisectMark(ctx,A,B,Dfoot,'○','#db2777',10); bisectMark(ctx,A,Dfoot,C,'○','#db2777',10);
  bisectMark(ctx,B,A,I,'×','#2563eb',10); bisectMark(ctx,B,I,Dfoot,'×','#2563eb',10);
  const centroid={x:(A.x+B.x+C.x)/3,y:(A.y+B.y+C.y)/3};
  drawLabel(ctx,outsideLabelPos(A,centroid,14).x,outsideLabelPos(A,centroid,14).y,'A','#333',12);
  drawLabel(ctx,outsideLabelPos(B,centroid,14).x,outsideLabelPos(B,centroid,14).y,'B','#333',12);
  drawLabel(ctx,outsideLabelPos(C,centroid,14).x,outsideLabelPos(C,centroid,14).y,'C','#333',12);
  drawLabel(ctx,Dfoot.x,Dfoot.y+13,'D','#333',11);
  ctx.fillStyle='#0d9488'; ctx.beginPath(); ctx.arc(O.x,O.y,2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7c3aed'; ctx.beginPath(); ctx.arc(I.x,I.y,2,0,Math.PI*2); ctx.fill();
  drawLabel(ctx,O.x+16,O.y-2,'O','#0d9488',11);
  drawLabel(ctx,I.x+16,I.y+2,'I','#7c3aed',11);
}
// 정삼각형: 세 중선(=각의 이등분선=대변의 수직이등분선)을 모두 그려서 한 점(O=I)에서 만남을 보임

  rightAngleMark(ctx,Mbc,B,A,6,'#666');

}

/* ════════════════════════════════

function computeIncenterFromHalfAngles(a,b){
  const fullA=2*a, fullB=2*b;
  const rad=d=>d*Math.PI/180;
  const R_BC=10;
  const fullC=180-fullA-fullB;
  const cSide=R_BC*Math.sin(rad(fullC))/Math.sin(rad(fullA));
  const B={x:0,y:0}, C={x:R_BC,y:0};
  const A={x:cSide*Math.cos(rad(fullB)), y:-cSide*Math.sin(rad(fullB))};
  const bSide=Math.hypot(A.x-C.x,A.y-C.y);
  const per=R_BC+bSide+cSide;
  const I={x:(R_BC*A.x+bSide*B.x+cSide*C.x)/per, y:(R_BC*A.y+bSide*B.y+cSide*C.y)/per};
  return {A,B,C,I};
}
function computeIncenterPtsBIC(fullA, fullB, R_BC){
  const rad=d=>d*Math.PI/180;
  const fullC=180-fullA-fullB;
  const a=R_BC;
  const c=a*Math.sin(rad(fullC))/Math.sin(rad(fullA));
  const B={x:0,y:0}, C={x:a,y:0};
  const A={x:c*Math.cos(rad(fullB)), y:-c*Math.sin(rad(fullB))};
  const b=Math.hypot(A.x-C.x,A.y-C.y);
  const per=a+b+c;
  const I={x:(a*A.x+b*B.x+c*C.x)/per, y:(a*A.y+b*B.y+c*C.y)/per};
  return {A,B,C,I};
}
function computeCirclePts(beta, gamma, R){
  const centralAB=180-2*beta, centralBC=180-2*gamma;
  const thetaA=90, thetaB=thetaA-centralAB, thetaC=thetaB-centralBC;
  function pt(theta,r){ const rad=theta*Math.PI/180; return {x:r*Math.cos(rad), y:-r*Math.sin(rad)}; }
  return { O:{x:0,y:0}, A:pt(thetaA,R), B:pt(thetaB,R), C:pt(thetaC,R) };
}
function computeInscribedPts(theta, R){
  function pt(deg,r){ const rad=deg*Math.PI/180; return {x:r*Math.cos(rad), y:-r*Math.sin(rad)}; }
  const A=pt(90,R);
  const B=pt(270-theta/2,R);
  const C=pt(270+theta/2,R);
  const O={x:0,y:0};
  return {A,B,C,O};
}

  ex1:[{y:20,z:30,x:40},{y:15,z:45,x:30},{y:25,z:35,x:30},{y:10,z:20,x:60},{y:35,z:15,x:40}],

  ex6:[{ab:5,ac:4,x:9},{ab:6,ac:5,x:11},{ab:7,ac:6,x:13},{ab:8,ac:7,x:15},{ab:9,ac:5,x:14}]
};
const EX_STATE={ ex1:{used:[],cur:null}, ex2:{used:[],cur:null}, ex3:{used:[],cur:null}, ex4:{used:[],cur:null}, ex5:{used:[],cur:null}, ex6:{used:[],cur:null} };

function pickEx(id){
  const pool=EX_POOLS[id], st=EX_STATE[id];
  if(st.used.length>=pool.length) st.used.length=0;
  let idx; do{ idx=Math.floor(Math.random()*pool.length); }while(st.used.includes(idx));
  st.used.push(idx); st.cur=pool[idx]; return st.cur;
}

const EX_RENDER={ex1:renderEx1,ex2:renderEx2,ex3:renderEx3,ex4:renderEx4,ex5:renderEx5,ex6:renderEx6};

function toggleEx(id){
  const area=document.getElementById(id+'-area');
  const opening=!area.classList.contains('show');
  area.classList.toggle('show');
  if(opening && !EX_STATE[id].cur){ pickEx(id); EX_RENDER[id](); }
}
function nextEx(id){
  pickEx(id); EX_RENDER[id]();
  document.getElementById(id+'-val').value='';
  document.getElementById(id+'-fb').textContent='';
  document.getElementById(id+'-fb').className='ex-fb';
}
function checkEx(id){
  const v=parseFloat(document.getElementById(id+'-val').value);
  const cur=EX_STATE[id].cur;
  const fb=document.getElementById(id+'-fb');
  if(isNaN(v)){ alert('숫자를 입력해주세요!'); return; }
  if(Math.abs(v-cur.x)<0.4){
    fb.textContent='정답이에요! 🎉'; fb.className='ex-fb ok';
  } else {
    fb.textContent=`아쉬워요. 정답은 ${cur.x}이에요. 다시 도전해보고 싶으면 숫자를 바꿔보세요!`; fb.className='ex-fb no';
  }
}
