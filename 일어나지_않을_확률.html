<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어떤 사건이 일어나지 않을 확률</title>
<style>
:root{
  --ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#9090b0;
  --indigo:#4f46e5;--indigo-l:#e0e7ff;--indigo-ll:#eef2ff;
  --green:#16a34a;--green-l:#dcfce7;--green-ll:#F0FDF4;
  --orange:#e05a20;--red:#dc2626;--red-l:#fee2e2;
  --bean:#7c2d12;--cream:#b45309;
  --r:12px;--shadow:0 2px 12px rgba(26,26,46,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--indigo-ll);color:var(--ink);min-height:100vh;padding-bottom:60px}
.hdr{background:var(--indigo);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}
.hdr-title{font-size:16px;font-weight:700}
.main{max-width:1200px;margin:0 auto;padding:20px 16px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:var(--r);border:1px solid #e0e7ff;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
/* 강조 3단계: ① 핵심 질문(.key-q, 한 블록에 1개) ② 핵심어(.kw, 문단에 1~2개) ③ 보충(.sub) — 밑줄은 핵심 질문 안의 .em에만 */
.key-q{display:block;font-size:17px;font-weight:800;line-height:1.7;color:var(--ink);background:#fffbeb;border:1.5px solid #fcd34d;border-left:6px solid #f59e0b;border-radius:10px;padding:9px 14px 10px;margin:10px 0}
.key-q::before{content:'❓ 질문';display:block;font-size:11.5px;font-weight:800;color:#b45309;margin-bottom:1px}
.key-q.task::before{content:'✏️ 해 보기'}
.key-q .em{text-decoration:underline;text-decoration-color:#f59e0b;text-decoration-thickness:3px;text-underline-offset:4px}
.kw{font-weight:800;color:#be123c}
.sub{font-size:12.5px;color:var(--ink3);font-weight:600}
.reread{animation:rereadFlash 1.2s ease-out 2}
@keyframes rereadFlash{0%{box-shadow:0 0 0 5px #f59e0b;background-color:#fef3c7}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.lock-note{display:inline-block;margin-top:4px;font-size:12.5px;color:#b45309;background:#fef3c7;border-radius:8px;padding:2px 10px}
.it{font-style:italic;font-family:'Times New Roman',serif;font-weight:700;font-size:1.08em}

.split-layout{display:flex;gap:18px;align-items:flex-start}
.split-left{flex:0 0 450px;position:sticky;top:16px}
.split-right{flex:1 1 auto;min-width:0}
@media (max-width:980px){
  .split-layout{display:block}
  .split-left{position:static;width:100%;margin-bottom:14px}
  .split-left.board-sticky{position:sticky;top:0;z-index:5;max-height:50vh;overflow-y:auto}
}

.stepper{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.stepper .st{padding:5px 11px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12px;font-weight:700;color:var(--ink3);font-family:inherit}
.stepper .st.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.stepper .st.done{background:var(--green-l);color:#14532d;border-color:var(--green);cursor:pointer}
.stepper .st.done:hover{box-shadow:0 0 0 2px var(--green)}
.stepper .st.viewing{background:#fef3c7;color:#92400e;border-color:#f59e0b}
.stepper .st:disabled{cursor:default}
.back-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fef3c7;border:1.5px solid #fcd34d;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px;font-weight:700;color:#92400e}
.back-banner .btn{padding:6px 14px;font-size:12.5px}

/* 왼쪽 */
.exp-head{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700;line-height:1.6;margin-bottom:10px}
.exp-badge{flex-shrink:0;background:var(--ink);color:#fff;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:12px;margin-top:2px}
.board-tip{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-top:8px}
.graph-box{background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:12px;padding:6px;margin-top:8px}
.graph-box svg{display:block;width:100%;height:auto}
.fig{background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:12px;padding:12px;margin-bottom:10px;text-align:center}
.fig-cap{font-size:13px;font-weight:800;color:var(--ink2);margin-top:8px}
.fig-dice{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cardg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:300px;margin:0 auto}
.cardg span{border:1.5px solid #4f46e5;border-radius:6px;background:#fff;font-weight:800;font-size:14px;padding:5px 0;color:var(--ink)}
.pouch{position:relative;margin:22px auto 4px;width:250px;max-width:100%;min-height:120px;background:#ead2ac;border:2.5px solid #a07a46;border-radius:42% 42% 50% 50% / 26% 26% 74% 74%;padding:28px 22px 34px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-content:center}
.pouch::before{content:'';position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:76px;height:18px;background:#ead2ac;border:2.5px solid #a07a46;border-bottom:none;border-radius:12px 12px 0 0}
.pouch::after{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:92px;height:7px;background:#b45309;border-radius:4px}
.ball{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-style:normal;color:#fff;box-shadow:inset -3px -4px 0 rgba(0,0,0,.18)}
.ball.red{background:#ef4444}.ball.blue{background:#3b82f6}.ball.q{background:#9ca3af}
.peep{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:330px;margin:0 auto}
.nl-legend{display:grid;grid-template-columns:1fr;gap:6px 10px;margin-top:8px;font-size:13px;font-weight:700;color:var(--ink2)}
.nl-legend div{display:flex;align-items:center;gap:6px;line-height:1.4}
.nl-legend .nb{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:800}
.s2-ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.s2-ctrl .btn{padding:8px 14px}
.s2-count{text-align:center;font-size:14px;font-weight:800;color:var(--ink2)}
.s2-count b{font-size:17px}
.s2-count .bn{color:var(--bean)}
.s2-count .cr{color:var(--cream)}
.s2-msg{text-align:center;font-size:13px;font-weight:800;color:var(--red);min-height:20px;margin-top:4px;border-radius:8px}
.phone{max-width:260px;margin:4px auto;border:3px solid #374151;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(26,26,46,.15)}
.ph-top{background:#1e3a8a;color:#fff;font-size:13px;font-weight:800;padding:8px 12px;display:flex;justify-content:space-between}
.ph-head{background:#dbeafe;color:#1e3a8a;text-align:center;font-weight:800;font-size:15px;padding:8px}
.phone ul{list-style:none;padding:8px 14px;min-height:150px}
.phone li{font-size:15px;font-weight:700;padding:6px 0;border-bottom:1px dashed #e5e7eb}
.phone li.sold{color:#9ca3af;text-decoration:line-through}
.ph-foot{background:#e5e7eb;color:#6b7280;text-align:center;font-weight:800;font-size:15px;padding:9px}
.ex-card{border:2px solid #fcd34d;background:#fffbeb;border-radius:12px;padding:10px 14px;margin:8px 0;line-height:1.75}
.ex-card .nm{font-size:18px;font-weight:800;color:var(--ink)}
.ex-card .mean{font-size:13.5px;color:var(--ink2);font-weight:600}
.ex-card .ev{font-size:14px;font-weight:700;margin-top:2px}
.ex-card.done{border-color:#bbf7d0;background:var(--green-ll)}

/* 오른쪽 */
.panel-title{font-weight:800;font-size:15px;color:var(--indigo);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.step-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--indigo);color:#fff;font-size:12px;font-weight:800;flex-shrink:0}
.qblock{border-top:1px dashed #e0e7ff;padding-top:12px;margin-top:12px}
.qblock:first-child{border-top:none;padding-top:0;margin-top:0}
.lead{font-size:14px;line-height:1.8;color:var(--ink2);margin-bottom:8px}
.prob-box{display:block;font-size:16.5px;font-weight:800;line-height:1.75;color:var(--ink);background:#f0fdf4;border:1.5px solid #86efac;border-left:6px solid #16a34a;border-radius:10px;padding:9px 14px 10px;margin:10px 0}
.prob-box::before{content:'📋 문제';display:block;font-size:11.5px;font-weight:800;color:#15803d;margin-bottom:1px}
.prob-box u{text-underline-offset:3px}
.count-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px;font-weight:700}
.blank{display:inline-block;width:56px;border:none;border-bottom:2px solid var(--indigo);background:transparent;text-align:center;font-weight:700;font-size:15px;font-family:inherit;padding:2px 4px;margin:0 2px;color:var(--indigo)}
.blank:focus{outline:none;border-bottom-color:#3730a3;background:var(--indigo-ll)}
.blank.correct{border-bottom-color:var(--green);background:var(--green-ll);color:#14532d}
.blank.wrong{border-bottom-color:var(--red);background:var(--red-l);color:var(--red)}
/* 분수 입력칸: 분자 / 가로선 / 분모 */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px}
.frac .blank{border:1.5px solid #a5b4fc;border-radius:6px;width:52px;height:30px;margin:1px 0;background:#fff}
.frac .blank.correct{border-color:var(--green);background:var(--green-ll)}
.frac .blank.wrong{border-color:var(--red);background:var(--red-l)}
.frac .fbar{width:100%;min-width:60px;height:2.5px;background:var(--ink);border-radius:2px;margin:2px 0}
.sfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.92em;line-height:1.15;margin:0 3px}
.sfrac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 3px}
.sfrac>span:last-child{padding:0 3px}
.fline{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;font-size:15px;font-weight:800}
.fline .lab{font-size:13px;color:var(--ink2);text-align:center;line-height:1.4}
.choice-col{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.choice-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;justify-content:center}
.choice-row .choice-btn{min-width:74px;text-align:center;font-size:16px}
.choice-btn{padding:9px 16px;border-radius:10px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);font-family:inherit;text-align:left;line-height:1.5}
.choice-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.choice-btn.correct{background:var(--green);color:#fff;border-color:var(--green)}
.choice-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.choice-btn:disabled{cursor:default}
.btn{border:none;border-radius:12px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.btn:hover{background:#4338ca}
.btn:disabled{opacity:.4;cursor:default}
.btn-check{background:var(--green)}
.btn-check:hover{background:#15803d}
.btn-soft{background:#fff;color:var(--indigo);border:1.5px solid var(--indigo)}
.btn-soft:hover{background:var(--indigo-ll)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.feedback{text-align:center;font-size:13.5px;font-weight:700;min-height:20px;margin-top:8px;line-height:1.6}
.feedback.success{color:var(--green)}
.feedback.error{color:var(--red)}
.feedback.info{color:#b45309}
.note-box{background:var(--green-ll);border:1.5px solid #bbf7d0;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.85;margin-top:10px}
.def-box{background:var(--indigo-ll);border:2px solid var(--indigo);border-radius:12px;padding:14px 16px;font-size:15px;line-height:2;margin-top:12px;text-align:left}
.def-box .dt{font-weight:800;color:var(--indigo);margin-bottom:2px}
.def-box.term-wait{visibility:hidden}
.hint-card{background:#fff;border:1.5px solid #d8ddfb;border-radius:12px;padding:14px;font-size:13.5px;line-height:1.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.chip{font-size:12.5px;font-weight:800;border-radius:14px;padding:3px 11px;background:#f3f4f6;color:var(--ink3);border:1.5px dashed #d1d5db}
.chip.on{background:var(--green-l);color:#14532d;border:1.5px solid var(--green)}
.ox-row{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1.5px solid #e0e7ff;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px;font-weight:700;line-height:1.6;background:#fff}
.ox-btns{display:flex;gap:6px;flex-shrink:0}
.ox-b{width:42px;height:36px;border-radius:9px;border:1.5px solid #d8ddfb;background:#fff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.ox-b.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.ox-b:disabled{cursor:default}
/* 용어 팝업 (빈칸 + 둘 중 하나 고르기) */
.modal-overlay.termpop{background:rgba(26,26,46,0.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal-box.term-box{max-width:660px;width:100%}
.pp-line{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:4px 0}
.pp-line .nw{white-space:nowrap}
.term-tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--indigo);border-radius:10px;padding:2px 10px;margin-bottom:8px}
.term-box .def-box{margin-top:0;line-height:2.3}
.term-box .def-box .blank{font-size:16px;color:#be123c;border:1.5px solid #a5b4fc;border-radius:6px;background:#fff;width:46px}
.pp{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle;background:#fff;border:2px dashed #a5b4fc;border-radius:10px;padding:3px}
.pp button{border:1.5px solid #d8ddfb;background:#fff;border-radius:8px;padding:3px 9px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.pp button.on{background:#be123c;color:#fff;border-color:#be123c}
.pp.wrong{border-color:var(--red);background:var(--red-l)}
.pp.correct{border-color:var(--green);background:var(--green-ll)}

.progress{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-bottom:6px}
.level-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.level-tab{padding:7px 16px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.level-tab.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.level-tab.done{background:var(--green-l);color:#14532d;border-color:var(--green)}
.try-tag{display:inline-block;font-size:12px;font-weight:800;border-radius:10px;padding:2px 10px;background:#eef2ff;color:var(--indigo);margin-bottom:6px}
.try-tag.last{background:#fef3c7;color:#92400e}

.result-wrap{text-align:center;padding:24px 10px}
.result-icon{font-size:48px;margin-bottom:10px}
.result-score{font-size:22px;font-weight:800;color:var(--indigo);margin:8px 0}
.primary-btn{padding:11px 26px;border-radius:8px;background:var(--indigo);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;margin-right:8px}
.restart-btn{padding:11px 26px;border-radius:8px;background:var(--ink);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px 20px;max-width:460px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(26,26,46,0.25);max-height:92vh;overflow-y:auto}
.modal-icon{font-size:34px;margin-bottom:8px}
.modal-text{font-size:14px;line-height:1.7;color:var(--ink);font-weight:600;margin-bottom:16px}
.modal-btn{border:none;border-radius:10px;padding:10px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
/* 이번 차시 */
.blank.dec{width:64px}
.ball.yel{background:#facc15}
.lots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:320px;margin:0 auto}
.lots i{width:12px;height:40px;border-radius:3px;background:linear-gradient(#fef3c7,#fde68a);border:1.5px solid #b45309;display:inline-block}
.coin{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;font-weight:900;font-size:15px;border:2.5px solid #a16207;box-shadow:inset -3px -3px 0 rgba(0,0,0,.12);font-style:normal}
.coin.h{background:#fde68a;color:#78350f}
.coin.t{background:#e5e7eb;color:#374151;border-color:#6b7280}
.coin.q{background:#fff;color:#9ca3af;border:2.5px dashed #9ca3af;box-shadow:none}
.roles{display:flex;gap:8px;justify-content:center}
.role{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:2px solid #c7d2fe;border-radius:10px;padding:4px 14px;min-width:84px}
.role small{font-size:11.5px;font-weight:800;color:var(--ink2)}
.role b{font-size:17px}
.help-btn{border:1.5px solid #f59e0b;background:#fffbeb;color:#92400e;border-radius:16px;padding:4px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.help-btn:hover{background:#fef3c7}
.help-pairs{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
.help-pairs .vs{font-weight:800;color:var(--ink2)}
.nm{color:#1d4ed8}.nf{color:#be185d}
.cb{color:#2563eb}.co{color:#ea580c}
@keyframes nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes popIn{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
/* 띠 */
.strip-wrap{margin:4px 0}
.strip-row{display:flex;align-items:center;gap:6px}
.strip{flex:1 1 auto;display:grid;border:2px solid #1a1a2e;border-radius:6px;overflow:hidden;background:#fff}
.cell{height:40px;display:flex;align-items:center;justify-content:center;font-size:16px;background:#f3f4f6;border-right:1px solid #fff;transition:background .25s}
.cell:last-child{border-right:none}
.cell.a{background:#3b82f6}
.cell.n{background:#fb923c}
.cell.g{background:#e5e7eb}
.cell.pop{animation:popIn .45s ease-out}
.cell.nope{animation:nope .45s;background:#fecaca}
.cell svg{background:#fff;border-radius:7px}
.strip.clickable .cell{height:54px;cursor:pointer}
.strip.clickable .cell:not(.a):hover{background:#e0e7ff}
.strip-wrap.cut .cell.a{transform:translate(-10px,-34px) rotate(-8deg);opacity:0;transition:transform .8s ease-in,opacity .8s ease-in}
.strip-lab{display:flex;margin-top:3px;font-size:13px;font-weight:800;line-height:1.3}
.strip-lab.with-eq{margin-right:50px}
.strip-lab span{text-align:center;min-width:0;padding-top:3px}
.strip-lab .la{color:#1d4ed8;border-top:2.5px solid #3b82f6}
.strip-lab .ln{color:#c2410c;border-top:2.5px solid #fb923c}
.strip-lab .la:empty{border-top-color:transparent}
.eq1{flex:0 0 44px;font-size:17px;font-weight:900;color:#16a34a;animation:popIn .4s ease-out}
.whole{position:relative;height:12px;border:2.5px solid #16a34a;border-bottom:none;border-radius:6px 6px 0 0;margin:18px 2px 4px;animation:popIn .4s ease-out}
.whole span{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:#fff;padding:0 8px;font-size:13.5px;font-weight:900;color:#16a34a;white-space:nowrap}
.legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ink2)}

.sw{display:inline-block;width:13px;height:13px;border-radius:3px}
.sw.a{background:#3b82f6}.sw.n{background:#fb923c}
.s4row{margin:6px 0 10px;text-align:left}
.s4nm{font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:2px}
.s4row .cell{height:30px}
/* 1단계 교실 */
.room-top{background:#14532d;color:#ecfdf5;font-size:12px;font-weight:800;border-radius:6px;padding:3px;margin:0 auto 8px;width:60%}
.desks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:330px;margin:0 auto}
.desk{position:relative;height:40px;border:1.5px solid #c7d2fe;border-radius:7px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);transition:background .08s}
.desk em{font-style:normal;font-size:10.5px;font-weight:800;color:#b45309;line-height:1}
.desk.me{background:#fef3c7;border:2px solid #f59e0b}
.desk.hl{background:#c7d2fe}
.desk.pick{background:#4f46e5;color:#fff;border-color:#312e81;transform:scale(1.08)}
.desk.pick em{color:#fde68a}
.tally{text-align:center;font-size:13.5px;font-weight:700;color:var(--ink2);margin-top:6px;line-height:1.7;border-radius:8px}
.tally b{font-size:16px}
/* 2단계 사진 */
.photo{background:#fffdf7;border:2px solid #e7dcc4}
.club{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.kid{position:relative;border:3px solid transparent;background:transparent;border-radius:12px;padding:3px 0;cursor:pointer;transition:border-color .2s,background .2s}
.kid img{display:block;height:112px;max-width:100%;margin:0 auto;object-fit:contain}
.kid:hover{background:#eef2ff}
.kid.found{border-color:#2563eb;background:#dbeafe}
.kid.found::after{content:'👓';position:absolute;top:-6px;right:-4px;background:#2563eb;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px}
.kid.lit{border-color:#fb923c;background:#ffedd5;animation:popIn .35s ease-out}
.kid.nope{animation:nope .45s;background:#fee2e2}
/* 4단계 생일 */
.bar.clickable{cursor:pointer}
.bar.clickable:hover rect:first-child{fill:#fed7aa}
.sumline{text-align:center;font-size:14.5px;font-weight:700;color:var(--ink);min-height:24px;margin-top:4px}
.sumline b{color:#c2410c;font-size:17px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp-i{border-radius:10px;padding:8px 10px;text-align:center;line-height:1.5}
.cmp-i b{display:block;font-size:14px}
.cmp-i span{font-size:13px;font-weight:700;color:var(--ink2)}
.cmp-i.slow{background:#fff7ed;border:1.5px solid #fdba74}
.cmp-i.fast{background:#ecfdf5;border:1.5px solid #6ee7b7}
/* 6단계 슬라이더 */
.slider{width:100%;margin:12px 0 2px;accent-color:#3b82f6;height:22px;cursor:pointer}
.s5read{text-align:center;font-size:13.5px;font-weight:700;color:var(--ink2)}
.s5read b{color:#1d4ed8;font-size:17px}
/* 7단계 동전 */
.coins{display:flex;gap:26px;justify-content:center}
.cslot{display:flex;flex-direction:column;align-items:center;gap:4px}
.cslot small{font-size:12px;font-weight:800;color:var(--ink2)}
.coin3d{perspective:300px}
.coin3d .coin{width:60px;height:60px;font-size:22px}
.coin3d.spin .coin{animation:flip .7s ease-out}

.flog{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:30px;margin-top:8px}
.case{display:inline-flex;gap:2px;padding:2px 5px;border:1px solid #e5e7eb;border-radius:8px;background:#fff}
.case .coin{width:24px;height:24px;font-size:11px;border-width:1.8px}
.tray{border:1.5px dashed #c7d2fe;border-radius:10px;padding:6px;margin-bottom:8px}
.tray-h,.bin-h{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:4px}
.tray-b,.bin-b{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:44px;align-items:center}

.three{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.tcard.x{background:#fee2e2;border-color:#f87171}

<script>
document.getElementById('hubBackLink').href = 'index.html' + location.search;
(function(){
  var _hb = document.getElementById('hubBackLink');
  var _urlNum = new URLSearchParams(location.search).get('num');
  var _isPreview = !_urlNum || _urlNum === '99'; // 관리자 미리보기(파라미터 없음 또는 99번) 때는 나가기 경고 안 띄움
  _hb.addEventListener('click', function(e){
    if(!_isPreview && !window._activityDone && !confirm('아직 다 끝내지 않았어요! 지금 나가면 처음부터 다시 해야 해요. 그래도 나갈까요?')){
      e.preventDefault();
    }
  });
  if(!_isPreview){
    window.addEventListener('beforeunload', function(e){
      if(!window._activityDone){ e.preventDefault(); e.returnValue=''; }
    });
  }
})();
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const s = { cls:p.get('cls'), num:p.get('num'), name:p.get('name'), id:p.get('id')||'prob-complement' };
  window._hubStudent = s;
  let _db=null;
  try{
    firebase.initializeApp({
      apiKey: "AIzaSyDUFYrqaVL12fZ7ZhExVyyjLWSE_XJ_bHs",
      authDomain: "nd-deogi-math-hub.firebaseapp.com",
      projectId: "nd-deogi-math-hub",
      storageBucket: "nd-deogi-math-hub.firebasestorage.app",
      messagingSenderId: "414096731864",
      appId: "1:414096731864:web:a799f9450859c498b6b1ad"
    });
    _db = firebase.firestore();
  }catch(e){ console.warn('hub firebase init:', e); }
  window._hubDb = _db;
  let _reported=false;
  window._reportHubComplete = function(){
    window._activityDone = true;
    if(_reported || !_db || !s.cls || !s.num) return;
    _reported=true;
    window._pendingQuizComplete = _db.collection('classStudents').doc(String(s.cls)).collection('students').doc(String(s.num))
      .set({ name: s.name||'', itemsOpened: firebase.firestore.FieldValue.arrayUnion(s.id), quizSolveCount: firebase.firestore.FieldValue.increment(1), lastActive: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true})
      .catch(err=>console.warn('hub complete log failed', err));
  };
  // 완료 기록이 서버에 닿기 전에 페이지를 떠나지 않도록 잠깐 기다렸다가 이동
  document.getElementById('hubBackLink').addEventListener('click', function(e){
    if(!window._pendingQuizComplete) return;
    e.preventDefault();
    const href = this.href;
    Promise.race([window._pendingQuizComplete.catch(()=>{}), new Promise(r=>setTimeout(r,800))]).then(()=>{ location.href = href; });
  });
})();
function finishToHub(){ document.getElementById('hubBackLink').click(); }
</script>

<script>
/* ════════════════════════════════
   공용 헬퍼
════════════════════════════════ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function pick1(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(lo,hi){ return lo+Math.floor(Math.random()*(hi-lo+1)); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function $(id){ return document.getElementById(id); }
function setFb(id, ok, msg){ const fb=$(id); fb.className='feedback '+(ok===true?'success':ok==='info'?'info':'error'); fb.innerHTML=msg; }
function parseCount(s){ const m=String(s||'').replace(/\s+/g,'').match(/^(\d+)(가지|개|번|명|장|회|석)?$/); return m?parseInt(m[1],10):null; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; }
function reduce(n,d){ const g=gcd(n,d)||1; return [n/g, d/g]; }
function sfrac(n,d){ return `<span class="sfrac"><span>${n}</span><span>${d}</span></span>`; }
function pval(p){ return p[1]===1 ? String(p[0]) : sfrac(p[0],p[1]); }    // 확률 값 보여 주기 (정수는 그대로)
function itp(){ return '<span class="it">p</span>'; }
function itv(c){ return `<span class="it">${c}</span>`; }
function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
// 받침에 따라 조사 고르기 (낱말, 숫자 모두)
const NUM_BATCHIM = [true,true,false,true,false,false,true,true,true,false];   // 영 일 이 삼 사 오 육 칠 팔 구
function hasBatchim(w){
  if(typeof w==='number' || /^\d+$/.test(String(w))) return NUM_BATCHIM[Number(w)%10];   // 10, 20…은 '십'으로 끝나 받침 있음
  const c = String(w).charCodeAt(String(w).length-1);
  if(c>=0xAC00 && c<=0xD7A3) return (c-0xAC00)%28!==0;
  return false;
}
function josa(w, withB, noB){ return String(w) + (hasBatchim(w)?withB:noB); }

/* ════════════════════════════════
   읽기 확인 · 찍기 방지 (앞 차시 파일들과 같은 방식)
   - readGate: 질문이 뜨고 읽을 시간도 안 지나 고르면 채점하지 않고 질문을 다시 보게 함
   - wrongLock: 틀리면 몇 초 동안 잠그고(틀릴수록 길게) 보기 순서를 다시 섞음
   - firstTry: 질문마다 첫 시도만 기록 → 완료 화면에 '한 번에 맞힌 질문' 표시
   - 틀려도 정답은 보여 주지 않음
════════════════════════════════ */
const GUARD = { on:true };            // 검증 스크립트·관리자 시연에서만 끔
const LOCK_SECS = [3,5,8];
const stat = { seen:{}, total:0, first:0 };
const shown = {}, tries = {};
function firstTry(qid, ok){ if(qid in stat.seen) return; stat.seen[qid]=ok; stat.total++; if(ok) stat.first++; }
function graded(qid, r){ if(r===false) firstTry(qid,false); return r===true; }
function flashRef(ref){
  const el = typeof ref==='string' ? $(ref) : ref;
  if(!el) return;
  el.classList.remove('reread'); void el.offsetWidth; el.classList.add('reread');
}
function markShown(qid, blockId){
  const el = $(blockId);
  const len = el ? el.textContent.replace(/\s+/g,'').length : 40;
  shown[qid] = { t:Date.now(), need:Math.min(4000, Math.max(1500, len*25)), block:blockId };
}
function readGate(qid, fbId){
  const s = shown[qid];
  if(!GUARD.on || !s || Date.now()-s.t >= s.need) return true;
  setFb(fbId,false,'✋ 잠깐! 질문을 끝까지 읽고 골라 봐요.');
  const kq = document.querySelector('#'+s.block+' .key-q');
  if(kq) flashRef(kq);
  return false;
}
function lockSecs(qid){
  tries[qid] = (tries[qid]||0)+1;
  return GUARD.on ? LOCK_SECS[Math.min(tries[qid],LOCK_SECS.length)-1] : 0;
}
// secs초 동안 안내문에 남은 시간을 보여 준 뒤 onDone. anchor가 화면에서 사라지면 멈춤
function lockTimer(secs, fbId, msg, what, anchor, onDone){
  if(!secs){ onDone(); return; }
  let left = secs;
  const paint = ()=>setFb(fbId,false,`${msg}<br><span class="lock-note">⏳ ${left}초 뒤에 ${what}</span>`);
  paint();
  const t = setInterval(()=>{
    if(!document.body.contains(anchor)){ clearInterval(t); return; }
    left--;
    if(left<=0){ clearInterval(t); onDone(); } else paint();
  }, 1000);
}
function wrongLock(o){
  const row = $(o.row);
  const btns = [...row.querySelectorAll('button')];
  btns.forEach(b=>b.disabled=true);
  lockTimer(lockSecs(o.qid), o.fb, o.msg, '다시 고를 수 있어요', row, ()=>{
    btns.forEach(b=>{ b.disabled=false; b.classList.remove('wrong','active'); });
    shuffle(btns).forEach(b=>b.parentNode.appendChild(b));
    setFb(o.fb,false,o.msg+'<br><span class="sub">다시 골라 보세요.</span>');
  });
}
// 객관식 한 문항 공통: 읽기 확인 → 첫 시도 기록 → 오답이면 잠금. 정답일 때만 true
function choiceGrade(q, btn, ok, wrongMsg){
  if(btn.disabled || !readGate(q, q+'Fb')) return false;
  firstTry(q, ok);
  markChoice(q+'Row', btn, ok);
  if(!ok){ wrongLock({qid:q, row:q+'Row', fb:q+'Fb', msg:wrongMsg}); return false; }
  return true;
}
const RETHINK = '❌ 다시 한 번 생각해 보세요!';
const UNREDUCED = '🔎 약분까지 해야 완벽한 정답이 됩니다!';

/* ════════════════════════════════
   입력칸: 숫자 · 글자 · 확률(분자/분모 따로, 정수는 위 칸에만)
════════════════════════════════ */
function choiceCol(name, opts){
  return `<div class="choice-col" id="${name}Row">`+shuffle(opts).map(o=>`<button class="choice-btn" data-k="${o.key}" onclick="${name}Pick('${o.key}',this)">${o.label}</button>`).join('')+`</div>`;
}
function markChoice(rowId, btn, ok){
  document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.classList.remove('active','wrong'));
  btn.classList.add(ok?'correct':'wrong');
  if(ok) document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.disabled=true);
}
function probHTML(p){ return `<span class="frac"><input class="blank" id="${p}N" inputmode="numeric" autocomplete="off"><span class="fbar"></span><input class="blank" id="${p}D" inputmode="numeric" autocomplete="off"></span>`; }
const PROB_NOTE = '<p class="sub">분수는 위 칸에 분자, 아래 칸에 분모를 써요.</p>';
// 확률 칸 채점: ans는 기약분수 [분자,분모] (정수면 분모 1)
// 답이 0이면 0/6, 0/1처럼 분자가 0이면 모두 정답 · 답이 1이면 6/6, 1/1처럼 분자=분모이면 모두 정답 (약분 안내 없음)
// 답이 0이나 1일 때 분모 칸을 비우고 0, 1만 써도 정답. 그 밖의 답에서 분모 칸이 비어 있으면 빈칸으로 봄
// 'ok' / 'wrong' / 'empty' / 'unreduced'
function gradeProb(p, ans){
  const nr=$(p+'N').value.trim(), dr=$(p+'D').value.trim();
  const isInt = ans[1]===1;
  if(nr==='') return 'empty';
  const n = parseCount(nr);
  if(dr===''){
    if(!isInt) return 'empty';
    return (n!==null && n===ans[0]) ? 'ok' : 'wrong';
  }
  const d = parseCount(dr);
  if(n===null || d===null || d===0 || n*ans[1]!==d*ans[0]) return 'wrong';
  if(isInt) return 'ok';
  return gcd(n,d)===1 ? 'ok' : 'unreduced';
}
function normTxt(s){ return String(s||'').replace(/[\s'"‘’“”.,!]/g,''); }
// 채점 항목: {id,val} 숫자 / {txt:id, acc:[…]} 글자 / {prob:p, ans:[n,d]} 확률
// 결과: true / false / null(빈칸) / 'unreduced'(값은 맞지만 약분 안 함 — 오답으로 치지 않음)
function checkItems(items, fbId){
  let empty=false, wrong=0, unred=null;
  const mark = (el, ok)=>{ el.classList.toggle('wrong',!ok); };
  for(const it of items){
    if(it.prob){
      const r = gradeProb(it.prob, it.ans);
      const nE=$(it.prob+'N'), dE=$(it.prob+'D');
      if(r==='empty'){ empty=true; continue; }
      if(r==='wrong'){ wrong++; mark(nE,false); mark(dE,false); continue; }
      mark(nE,true); mark(dE,true);
      if(r==='unreduced') unred = it.ans;
    } else if(it.dec){
      const el=$(it.dec); const raw=el.value.replace(/\s+/g,'');
      if(raw===''){ empty=true; continue; }
      const ok = /^\d*\.?\d+$/.test(raw) && Math.abs(parseFloat(raw)-it.val) < 1e-9; if(!ok) wrong++; mark(el, ok);
    } else if(it.txt){
      const el=$(it.txt); const raw=normTxt(el.value);
      if(raw===''){ empty=true; continue; }
      const ok = it.acc.some(a=>normTxt(a)===raw); if(!ok) wrong++; mark(el, ok);
    } else {
      const el=$(it.id); const raw=el.value.trim();
      if(raw===''){ empty=true; continue; }
      const ok = parseCount(raw)===it.val; if(!ok) wrong++; mark(el, ok);
    }
  }
  if(wrong){ setFb(fbId,false,'❌ 빨간 칸을 다시 한 번 생각해 보세요!'); return false; }
  if(empty){ setFb(fbId,false,'빈칸을 모두 채워 주세요.'); return null; }
  if(unred){ setFb(fbId,'info', UNREDUCED); return 'unreduced'; }
  items.forEach(it=>{
    const els = it.prob ? [$(it.prob+'N'),$(it.prob+'D')] : [$(it.txt||it.dec||it.id)];
    els.forEach(el=>{ el.classList.add('correct'); el.disabled=true; });
  });
  return true;
}

// SVG 안의 세로 분수 (가운데가 y)
function svgFrac(x, y, n, d, fs, color){
  const w = Math.max(String(n).length, String(d).length)*fs*0.62 + 6;
  return `<text x="${x}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${color}">${n}</text>`+
    `<line x1="${(x-w/2).toFixed(1)}" y1="${y}" x2="${(x+w/2).toFixed(1)}" y2="${y}" stroke="${color}" stroke-width="1.5"/>`+
    `<text x="${x}" y="${(y+fs-0.5).toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${color}">${d}</text>`;
}
// 0~1 수직선 + 동그라미 표지. marks:[{v, tag, color}] — 표지끼리 겹치면 위로 쌓음 (같은 자리의 값끼리만 겹쳐 쌓임)
const NL = { W:420, X0:40, X1:380, r:12, gap:28 };
function nlLayout(marks){
  const X = v=>NL.X0+(NL.X1-NL.X0)*v;
  const placed = [];
  marks.forEach(m=>{
    const px = X(m.v);
    let r=0; while(placed.some(p=>p.r===r && Math.abs(p.px-px) < NL.r*2+3)) r++;
    placed.push(Object.assign({}, m, {px, r}));
  });
  const nR = 1 + Math.max(0, ...placed.map(p=>p.r));
  const axisY = 8 + nR*NL.gap + 14;
  placed.forEach(p=>{ p.cy = axisY - 24 - p.r*NL.gap; });
  return { placed, axisY, H:axisY+40, X };
}
function nlSVG(marks){
  const { placed, axisY, H, X } = nlLayout(marks);
  let s = `<svg viewBox="0 0 ${NL.W} ${H}">`;
  s += `<line x1="${NL.X0}" y1="${axisY}" x2="${NL.X1}" y2="${axisY}" stroke="#1a1a2e" stroke-width="2.4" stroke-linecap="round"/>`;
  [[0,1],[1,2],[1,1]].forEach(([n,d])=>{
    const x = X(n/d);
    s += `<line x1="${x}" y1="${axisY-6}" x2="${x}" y2="${axisY+6}" stroke="#1a1a2e" stroke-width="2"/>`;
    s += d===1 ? `<text x="${x}" y="${axisY+24}" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a2e">${n}</text>` : svgFrac(x, axisY+20, n, d, 12, '#1a1a2e');
  });
  placed.forEach(p=>{ s += `<line x1="${p.px.toFixed(1)}" y1="${(p.cy+NL.r).toFixed(1)}" x2="${p.px.toFixed(1)}" y2="${axisY}" stroke="${p.color}" stroke-width="1.8"/>`; });
  placed.forEach(p=>{ s += `<circle cx="${p.px.toFixed(1)}" cy="${axisY}" r="5" fill="${p.color}" stroke="#fff" stroke-width="1.6"/>`; });
  placed.forEach(p=>{
    s += `<circle cx="${p.px.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="${NL.r}" fill="${p.color}" stroke="#fff" stroke-width="2"/>`+
      `<text x="${p.px.toFixed(1)}" y="${(p.cy+4.5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${p.tag}</text>`;
  });
  return s + `</svg>`;
}

/* ════════════════════════════════
   단계 이동: 마친 단계는 언제든 다시 볼 수 있음 (안 한 단계는 잠김)
════════════════════════════════ */
const STAGES = ['내가 안 뽑힐 확률은?','안경을 쓰지 않은 학생은?','띠로 나눠 볼까?','하나하나 다 셀까?','두 부분을 합치면?','비가 오지 않을 확률은?','어느 쪽을 셀까?','14칸이냐, 6칸이냐','문제풀이'];
const PRACTICE = 8;
let frontier = 0, viewing = 0;
const built = {};
let practiceScreen = 'scPractice';
function stageBox(side, i){
  const id = (side==='L'?'ls':'rs')+i;
  let el = $(id);
  if(!el){
    el = document.createElement('div'); el.id = id; el.style.display='none';
    (side==='L' ? $('actLeft') : $('actRight')).appendChild(el);
  }
  return el;
}
function R(html){ stageBox('R',frontier).innerHTML = html; }
function L(html){ stageBox('L',frontier).innerHTML = html; }
function enterStage(i){
  frontier = i; built[i] = true;
  stageBox('L',i).innerHTML=''; stageBox('R',i).innerHTML='';
  showStage(i);
}
function showStage(i){
  if(!built[i]) return;
  viewing = i;
  if(i===PRACTICE){ showScreen(practiceScreen); renderStepper(); return; }
  showScreen('scAct');
  for(let k=0;k<PRACTICE;k++){ const l=$('ls'+k), r=$('rs'+k); if(l) l.style.display = k===i?'':'none'; if(r) r.style.display = k===i?'':'none'; }
  $('backBanner').innerHTML = i<frontier ? `<div class="back-banner">👀 지난 단계를 다시 보고 있어요. <button class="btn" onclick="showStage(frontier)">지금 하던 단계로 돌아가기 →</button></div>` : '';
  renderStepper();
}
function renderStepper(){
  $('stepper').innerHTML = STAGES.map((s,i)=>{
    const cls = i===viewing ? (i<frontier?'viewing':'active') : i===frontier ? 'active' : (built[i] ? 'done' : '');
    const can = built[i] && i!==viewing;
    return `<button class="st ${cls}" ${can?`onclick="showStage(${i})" style="cursor:pointer"`:'disabled'}>${i+1}. ${s}</button>`;
  }).join('');
}
function scrollToEl(id){ const el=$(id); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),60); }
function fmtP(p){ return p[1]===1 ? String(p[0]) : p.join('/'); }
// 왼쪽 그림이 바뀌면 반짝여서 알려 줌
function flashL(id){ const el = $(id); if(el) flashRef(el); }

/* ════════════════════════════════
   질문 블록 공통
   - chkBlock: 입력칸 + 확인 버튼 (성공하면 버튼 잠그고 ok() 한 번만 실행)
   - choiceBlock: 객관식 (읽기 확인·오답 잠금·보기 섞기)
════════════════════════════════ */
const CHK = {};
function chkBlock(id, inner, items, ok, msg){
  CHK[id] = { items, ok, msg };
  return `<div class="qblock" id="${id}Block">${inner}
    <div class="btn-row"><button class="btn btn-check" id="${id}Btn" onclick="runChk('${id}')">확인</button></div>
    <div class="feedback" id="${id}Fb"></div></div>`;
}
function runChk(id){
  const c = CHK[id];
  if(!c || !$(id+'Btn') || $(id+'Btn').disabled) return;
  const items = typeof c.items==='function' ? c.items() : c.items;
  if(!graded(id, checkItems(items, id+'Fb'))) return;
  firstTry(id, true);
  $(id+'Btn').disabled = true;
  setFb(id+'Fb', true, c.msg || '✅ 맞아요!');
  c.ok();
}
function choiceBlock(id, inner, opts, good, okMsg, after){
  window[id+'Pick'] = function(k, btn){
    if(!choiceGrade(id, btn, k===good, RETHINK)) return;
    setFb(id+'Fb', true, okMsg);
    after();
  };
  return `<div class="qblock" id="${id}Block">${inner}${choiceCol(id, opts)}<div class="feedback" id="${id}Fb"></div></div>`;
}
// 오른쪽에 블록을 붙이고 엔터 키 연결, 객관식이면 읽기 시간 재기 시작
function appendQ(html, id, kind){
  stageBox('R',frontier).insertAdjacentHTML('beforeend', html);
  const b = $(id+'Block');
  if(b && kind!=='choice') b.querySelectorAll('input').forEach(x=>x.addEventListener('keydown', ev=>{ if(ev.key==='Enter') runChk(id); }));
  if(kind==='choice') markShown(id, id+'Block');
  scrollToEl(id+'Block');
}
function nextBlock(id, note, label, fn){
  stageBox('R',frontier).insertAdjacentHTML('beforeend', `<div class="qblock" id="${id}End">
    ${note ? `<div class="note-box">${note}</div>` : ''}
    <div class="btn-row"><button class="btn" id="${id}NextBtn" onclick="this.disabled=true;${fn}()">${label}</button></div></div>`);
  scrollToEl(id+'End');
}
function numIn(id){ return `<input class="blank" id="${id}" inputmode="numeric" autocomplete="off">`; }
function decHTML(id){ return `<input class="blank dec" id="${id}" inputmode="decimal" autocomplete="off">`; }
function decStr(k){ return String(k/100); }   // 65 → '0.65'
function decRago(k){ const d = decStr(k); return d + (hasBatchim(Number(d.slice(-1))) ? '이라고' : '라고'); }   // 0.8이라고 / 0.65라고

/* ════════════════════════════════
   띠 그림: 전체를 n칸으로 나누고 일어나는 칸(파랑 a) / 일어나지 않는 칸(주황 n)
════════════════════════════════ */
function stripHTML(o){
  const cells = [...Array(o.n)].map((_,i)=>{
    const k = o.kind ? o.kind(i) : '';
    return `<div class="cell ${k}" id="${o.id}c${i}"${o.click?` onclick="${o.click}(${i})"`:''}>${o.inner?o.inner(i):''}</div>`;
  }).join('');
  let s = `<div class="strip-wrap${o.cut?' cut':''}" id="${o.id}">`;
  if(o.whole) s += `<div class="whole"><span>전체 = 1</span></div>`;
  s += `<div class="strip-row"><div class="strip${o.click?' clickable':''}" style="grid-template-columns:repeat(${o.n},1fr)">${cells}</div>${o.eq?`<span class="eq1">${o.eq}</span>`:''}</div>`;
  if(o.labA!=null || o.labN!=null){
    s += `<div class="strip-lab${o.eq?' with-eq':''}"><span class="la" style="flex:${o.a} 1 0">${o.labA||''}</span><span class="ln" style="flex:${o.n-o.a} 1 0">${o.labN||''}</span></div>`;
  }
  return s + `</div>`;
}
const LEGEND = `<div class="legend"><span><i class="sw a"></i>일어나는 부분</span><span><i class="sw n"></i>일어나지 않는 부분</span></div>`;

/* ════════════════════════════════
   1단계: 내가 안 뽑힐 확률은? (생각 열기)
   우리 반 25명 중 발표자 한 명 뽑기. 내 번호는 주소의 num(1~25), 없으면 7
════════════════════════════════ */
const ME = (()=>{ const n = parseInt(new URLSearchParams(location.search).get('num'),10); return (n>=1 && n<=25) ? n : 7; })();
const S0 = { draws:0, mine:0, busy:false, last:0, until:{ running:false, n:0, rec:[] } };
// '내가 뽑힐 때까지 뽑기': 나(ME)가 나올 때까지 저절로 계속 뽑고, 몇 번 만에 뽑혔는지 기록
function untilHTML(){
  return `<div class="until" id="s0Until"><div class="btn-row" style="margin-top:6px"><button class="btn btn-until" id="untilBtn" onclick="s0Until()">${S0.until.rec.length?'⏩ 한 번 더 해 보기':'⏩ 내가 뽑힐 때까지 뽑기'}</button></div>
    <div class="until-cnt" id="untilCnt">${untilCntHTML()}</div></div>`;
}
function untilCntHTML(){
  const u = S0.until;
  let s = u.running ? `뽑는 중… <b>${u.n}</b>번째 · 아직 내가 아니에요 😮‍💨`
    : (u.rec.length ? `🎉 <b>${u.rec[u.rec.length-1]}</b>번 만에 드디어 내가 뽑혔어요!` : '');
  if(u.rec.length) s += `<div class="sub">지금까지 기록: ${u.rec.map(n=>n+'번').join(', ')}</div>`;
  return s;
}
function s0Until(){
  const u = S0.until;
  if(u.running || S0.busy || viewing!==0) return;
  u.running = true; u.n = 0;
  $('untilBtn').disabled = true; $('drawBtn').disabled = true;
  const step = ()=>{
    if(!$('untilCnt')){ u.running = false; return; }
    document.querySelectorAll('#ls0 .desk.hl').forEach(d=>d.classList.remove('hl','pick'));
    u.n++;
    const k = randInt(1,25);
    $('dk'+k).classList.add('hl');
    if(k===ME){
      $('dk'+k).classList.add('pick');
      u.running = false; u.rec.push(u.n);
      $('untilCnt').innerHTML = untilCntHTML(); flashL('untilCnt');
      $('untilBtn').disabled = false; $('untilBtn').textContent = '⏩ 한 번 더 해 보기'; $('drawBtn').disabled = false;
      if(u.rec.length===1) s0UntilDone();
      return;
    }
    $('untilCnt').innerHTML = untilCntHTML();
    setTimeout(step, u.n<8 ? 170 : 70);
  };
  step();
}
function s0UntilDone(){
  const n = S0.until.rec[0];
  setFb('s0uFb', true, `✅ ${n}번 만에 겨우 뽑혔어요! 한 번 더 해 봐도 좋아요. 그만큼 내가 뽑히는 일은 드물어요.`);
  appendQ(chkBlock('s0c',
    `<p class="key-q task">확률로 나타내 보자. <span class="em">내가 발표자로 뽑힐 확률</span>은?</p>
     <div class="fline"><span class="lab">(내가 뽑힐 확률)</span> = ${probHTML('s0cf')}</div>${PROB_NOTE}`,
    [{prob:'s0cf', ans:[1,25]}], s0cOk), 's0c');
}
function tallyHTML(){
  return `<div>뽑은 횟수 <b>${S0.draws}</b>번 · 내가 뽑힘 <b class="cb">${S0.mine}</b>번 · 안 뽑힘 <b class="co">${S0.draws-S0.mine}</b>번</div>`+
    (S0.last ? `<div class="sub">방금 뽑힌 발표자: ${S0.last}번${S0.last===ME?' — 바로 나예요! 😳':''}</div>` : '');
}
function s0Left(){
  return `<div class="exp-head"><span class="exp-badge">생각 열기</span><span>오늘 수학 시간, 발표자를 한 명 뽑아요.</span></div>
    <div class="fig"><div class="room-top">🧑‍🏫 칠판</div>
      <div class="desks">${[...Array(25)].map((_,i)=>`<div class="desk${i+1===ME?' me':''}${i+1===S0.last?' hl pick':''}" id="dk${i+1}">${i+1===ME?'<em>⭐ 나</em>':''}<b>${i+1}</b></div>`).join('')}</div>
      <div class="fig-cap">우리 반 25명 · <b style="color:#b45309">⭐ = 내 자리 (${ME}번)</b></div></div>
    <div class="btn-row" style="margin-top:0"><button class="btn" id="drawBtn" onclick="s0Draw()">🎲 발표자 뽑기</button></div>
    <div class="tally" id="s0Tally">${tallyHTML()}</div>`;
}
function stage0(){
  enterStage(0);
  S0.draws = 0; S0.mine = 0; S0.last = 0; S0.busy = false; S0.until = { running:false, n:0, rec:[] };
  L(s0Left());
  R(`<div class="panel-title"><span class="step-badge">1</span>내가 안 뽑힐 확률은?</div>
    <p class="lead">오늘 수학 시간에 발표할 사람을 뽑기로 했어요. 우리 반 25명 중에서 <b>한 명을 임의로</b> 뽑아요. 내 마음은 딱 하나예요. "제발 내가 아니었으면…" 😅</p>
    <div class="qblock" style="border-top:none" id="s0aBlock">
      <p class="key-q task">왼쪽 <span class="em">🎲 발표자 뽑기</span> 버튼을 눌러 발표자를 5번 뽑아 보자.</p>
      <p class="sub">뽑을 때마다 아래에 '내가 뽑힘'과 '안 뽑힘'이 기록돼요.</p>
    </div>`);
}
function s0Draw(){
  if(S0.busy || S0.until.running || viewing!==0) return;
  S0.busy = true; $('drawBtn').disabled = true;
  const final = randInt(1,25);
  let step = 0;
  const tick = ()=>{
    document.querySelectorAll('#ls0 .desk.hl').forEach(d=>d.classList.remove('hl','pick'));
    if(step < 12){ $('dk'+randInt(1,25)).classList.add('hl'); step++; setTimeout(tick, 50+step*10); return; }
    $('dk'+final).classList.add('hl','pick');
    S0.draws++; S0.last = final; if(final===ME) S0.mine++;
    $('s0Tally').innerHTML = tallyHTML(); flashL('s0Tally');
    S0.busy = false; $('drawBtn').disabled = false;
    if($('untilBtn')) $('untilBtn').disabled = false;
    if(S0.draws===5 && !$('s0bBlock')) s0AfterDraws();
  };
  tick();
}
function s0AfterDraws(){
  appendQ(choiceBlock('s0b',
    `<p class="lead">5번 뽑아 보니 어땠나요? 기록을 보며 생각해 봐요.</p>
     <p class="key-q">한 번 뽑을 때, <span class="em">내가 뽑히는 일</span>과 <span class="em">내가 뽑히지 않는 일</span> 중 어느 쪽이 일어나기 쉬울까?</p>`,
    [{key:'not', label:'내가 뽑히지 않는 일'}, {key:'me', label:'내가 뽑히는 일'}, {key:'same', label:'두 일이 똑같이 일어나기 쉬워요.'}],
    'not', '✅ 맞아요. 25명 중 나는 1명뿐이라, 뽑히지 않는 일이 훨씬 일어나기 쉬워요.',
    ()=>{
      $('s0Tally').insertAdjacentHTML('afterend', untilHTML()); flashL('s0Until');
      appendQ(`<div class="qblock" id="s0uBlock">
        <p class="key-q task">그럼 <span class="em">내가 뽑힐 때까지</span> 발표자를 계속 뽑아 보자. 왼쪽 ⏩ 버튼을 누르면 내가 뽑힐 때까지 저절로 뽑아요. 몇 번 만에 내가 뽑힐까?</p>
        <div class="feedback" id="s0uFb"></div></div>`, 's0u');
    }), 's0b', 'choice');
}
function s0cOk(){
  appendQ(chkBlock('s0d',
    `<p class="key-q task">이번에는 <span class="em">내가 뽑히지 않을 확률</span>을 구해 보자.</p>
     <div class="count-row">내가 뽑히지 않는 경우의 수: ${numIn('s0d1')}</div>
     <div class="fline"><span class="lab">(내가 뽑히지 않을 확률)</span> = ${probHTML('s0df')}</div>`,
    [{id:'s0d1', val:24}, {prob:'s0df', ans:[24,25]}],
    ()=>nextBlock('s0', `내가 뽑히지 않는 경우를 세려면 <b>나를 뺀 24명</b>을 모두 생각해야 했어요.<br>
      이렇게 <span class="kw">어떤 사건이 일어나지 않을 확률</span>을 더 쉽게 구하는 방법은 없을까요? 동아리, 주사위, 생일 이야기로 찾아봐요.`,
      '다음: 안경을 쓰지 않은 학생은? →', 'stage1')), 's0d');
}

/* ════════════════════════════════
   2단계: 안경을 쓰지 않은 학생은? (함께 탐구)
   사진에서 안경 쓴 학생 3명을 직접 찾아 누르기 → 3/10 → 10 − 3 → 7/10 → 10칸 띠
════════════════════════════════ */
const S1 = { found:new Set(), phase:'', lit:false, strip:false, whole:false };
function clubHTML(){
  return `<div class="club">${KIDIMG.club.map((k,i)=>{
    const cls = S1.found.has(i) ? ' found' : (S1.lit && !k.glasses ? ' lit' : '');
    return `<button class="kid${cls}" id="kid${i}" onclick="kidClick(${i})" aria-label="학생 ${i+1}"><img src="${k.src}" alt=""></button>`;
  }).join('')}</div>`;
}
function s1Strip(){
  return stripHTML({ id:'st1', n:10, a:3, kind:i=>i<3?'a':'n', inner:i=>i<3?'👓':'', whole:S1.whole,
    labA:`${sfrac(3,10)}`, labN:`${sfrac(7,10)}` });
}
function s1Left(){
  return `<div class="exp-head"><span class="exp-badge">함께 탐구</span><span>사진 동아리 학생 10명</span></div>
    <div class="fig photo" id="s1Photo">${clubHTML()}
      <div class="fig-cap" id="s1Cap">${S1.lit ? '<b style="color:#2563eb">안경 쓴 학생 3명</b> · <b style="color:#ea580c">안경 쓰지 않은 학생 7명</b>' : `찾은 안경 쓴 학생: <b>${S1.found.size}</b>명`}</div></div>
    ${S1.strip ? `<div class="fig" id="s1StripBox"><div class="fig-cap" style="margin:0 0 6px">10명을 한 줄로 세워 보면</div>${s1Strip()}${LEGEND}</div>` : ''}`;
}
function stage1(){
  enterStage(1);
  S1.found = new Set(); S1.phase = 'find'; S1.lit = false; S1.strip = false; S1.whole = false;
  L(s1Left());
  R(`<div class="panel-title"><span class="step-badge">2</span>안경을 쓰지 않은 학생은?</div>
    <div class="prob-box">어느 동아리 학생 10명 중에서 안경을 쓰고 있는 학생을 조사했더니 모두 3명이었다. 이 동아리 학생 중에서 한 명을 임의로 택하였다.</div>
    <div class="qblock" style="border-top:none" id="s1aBlock">
      <p class="key-q task">왼쪽 사진에서 <span class="em">안경을 쓴 학생 3명</span>을 찾아 모두 눌러 보자.</p>
      <div class="feedback" id="s1aFb"></div>
    </div>`);
}
function kidClick(i){
  if(S1.phase!=='find' || S1.found.has(i)) return;
  const btn = $('kid'+i);
  if(!KIDIMG.club[i].glasses){
    btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');
    setFb('s1aFb', false, '이 학생은 안경을 쓰지 않았어요. 얼굴을 잘 보고 다시 찾아봐요.');
    return;
  }
  S1.found.add(i);
  btn.classList.add('found');
  $('s1Cap').innerHTML = `찾은 안경 쓴 학생: <b>${S1.found.size}</b>명`;
  setFb('s1aFb', 'info', `👓 찾았어요! (${S1.found.size}명)`);
  if(S1.found.size===3){
    S1.phase = '';
    setFb('s1aFb', true, '✅ 안경을 쓴 학생 3명을 모두 찾았어요!');
    appendQ(chkBlock('s1b',
      `<p class="key-q task">택한 학생이 <span class="em">안경을 쓰고 있을 확률</span>을 구해 보자.</p>
       <div class="fline"><span class="lab">(안경을 쓰고 있을 확률)</span> = ${probHTML('s1bf')}</div>`,
      [{prob:'s1bf', ans:[3,10]}], s1bOk), 's1b');
  }
}
function s1bOk(){
  appendQ(choiceBlock('s1c',
    `<p class="key-q">그럼 <span class="em">안경을 쓰지 않은 학생</span>은 몇 명일까? 한 명씩 세지 않고 바로 구하는 식을 골라 보자.</p>`,
    [{key:'sub', label:'10 − 3'}, {key:'add', label:'10 + 3'}, {key:'mul', label:'10 × 3'}],
    'sub', '✅ 맞아요! 전체 10명에서 안경 쓴 3명을 빼면 <b>7명</b>이에요. 왼쪽 사진을 봐요.',
    ()=>{
      // 안경 안 쓴 7명이 차례로 켜짐
      S1.lit = true;
      let j = 0;
      KIDIMG.club.forEach((k,i)=>{ if(!k.glasses){ const d = 90*(j++); setTimeout(()=>{ const b=$('kid'+i); if(b) b.classList.add('lit'); }, d); } });
      $('s1Cap').innerHTML = '<b style="color:#2563eb">안경 쓴 학생 3명</b> · <b style="color:#ea580c">안경 쓰지 않은 학생 7명</b>';
      appendQ(chkBlock('s1d',
        `<p class="key-q task">택한 학생이 <span class="em">안경을 쓰고 있지 않을 확률</span>을 구해 보자.</p>
         <div class="fline"><span class="lab">(안경을 쓰고 있지 않을 확률)</span> = ${probHTML('s1df')}</div>`,
        [{prob:'s1df', ans:[7,10]}], s1dOk), 's1d');
    }), 's1c', 'choice');
}
function s1dOk(){
  S1.strip = true;
  stageBox('L',1).innerHTML = s1Left();
  flashL('s1StripBox');
  // 팝업 ①: 두 확률의 합 = 1  →  팝업 ②: 7/10 = 1 − 3/10
  setTimeout(()=>{ if(viewing===1 && !$('s1Sum')) openCalcPop(POP1); }, 900);
}
const LAB_G = '(안경을 쓴 학생을<br>뽑을 확률)', LAB_N = '(안경을 쓰지 않은 학생을<br>뽑을 확률)';
const POP1 = { qid:'pop1', tag:'📘 두 확률을 더하면?', ask:'왼쪽 띠를 보고 빈칸에 알맞은 수를 써 보세요.',
  html:()=>calcRow([[sfrac(3,10), LAB_G], ['+'], [sfrac(7,10), LAB_N], ['='], [probHTML('cp1'), '']]),
  items:[{prob:'cp1', ans:[1,1]}],
  after:()=>{
    S1.whole = true; stageBox('L',1).innerHTML = s1Left(); flashL('s1StripBox');
    setTimeout(()=>{ if(viewing===1 && !$('s1Sum')) openCalcPop(POP2); }, 900);
  } };
const POP2 = { qid:'pop2', tag:'📘 그렇다면?', ask:'안경을 쓰지 않은 학생을 뽑을 확률을 다른 방법으로 나타내 보세요.',
  html:()=>`<div class="calc-head">(안경을 쓰지 않은 학생을 뽑을 확률)</div>`+calcRow([['='], [sfrac(7,10), ''], ['='], ['1', ''], ['−'], [probHTML('cp2'), LAB_G]]),
  items:[{prob:'cp2', ans:[3,10]}],
  after:()=>s1PopsDone() };
function s1PopsDone(){
  if($('s1Sum')) return;
  stageBox('R',1).insertAdjacentHTML('beforeend', `<div class="qblock" id="s1SumBlock"><div class="def-box" id="s1Sum"><div class="dt">안경을 쓴 학생과 쓰지 않은 학생</div>
    (안경을 쓴 학생을 뽑을 확률) + (안경을 쓰지 않은 학생을 뽑을 확률) = ${sfrac(3,10)} + ${sfrac(7,10)} = <b class="kw">1</b><br>
    (안경을 쓰지 않은 학생을 뽑을 확률) = ${sfrac(7,10)} = <b class="kw">1 − ${sfrac(3,10)}</b> = 1 − (안경을 쓴 학생을 뽑을 확률)</div></div>`);
  flashRef($('s1Sum'));
  nextBlock('s1', `10명을 한 줄로 세운 띠 <b>전체 = 1</b>이 <b style="color:#2563eb">안경 쓴 3칸</b>과 <b style="color:#ea580c">안경 쓰지 않은 7칸</b>으로 나뉘어요.<br>다른 예에서도 띠를 그려 볼까요?`,
    '다음: 띠로 나눠 볼까? →', 'stage2');
}
// 계산 팝업: 칸마다 [값, 아래 이름표] (원소가 하나면 연산 기호)
function calcRow(cols){
  return `<table class="calc"><tr>${cols.map(c=>`<td class="${c.length===1?'op':'v'}">${c[0]}</td>`).join('')}</tr>
    <tr>${cols.map(c=>`<td class="cl">${c[1]||''}</td>`).join('')}</tr></table>`;
}
let popCfg = null;
function openCalcPop(cfg){
  popCfg = cfg; clearTimeout(termTimer); termCfg = null;
  $('termBox').innerHTML = `<div class="term-tag">${cfg.tag}</div><div class="modal-text" style="margin-bottom:8px">${cfg.ask}</div>
    <div class="def-box calc-box">${cfg.html()}</div>${PROB_NOTE}
    <div class="feedback" id="cpFb"></div>
    <div class="btn-row"><button class="modal-btn" id="cpBtn" onclick="calcPopCheck()">확인</button></div>`;
  $('termModal').classList.add('show');
  $('termBox').querySelectorAll('input').forEach(x=>x.addEventListener('keydown', e=>{ if(e.key==='Enter') calcPopCheck(); }));
  try{ $('termBox').querySelector('input').focus(); }catch(e){}
}
function calcPopCheck(){
  if(!popCfg || $('cpBtn').disabled) return;
  const cfg = popCfg;
  if(!graded(cfg.qid, checkItems(cfg.items, 'cpFb'))) return;
  firstTry(cfg.qid, true);
  $('cpBtn').disabled = true;
  setFb('cpFb', true, '✅ 맞아요!');
  setTimeout(()=>{ closeTermPop(); cfg.after(); }, 600);
}

/* ════════════════════════════════
   3단계: 띠로 나눠 볼까? (주사위)
   6칸 띠에서 3의 배수 칸 직접 칠하기 → 두 확률 → 띠 전체는 확률 1
════════════════════════════════ */
const S2 = { picked:new Set(), phase:'', rest:false, labels:false, whole:false };
function s2Strip(){
  return stripHTML({ id:'st2', n:6, a:2, click:'s2Cell', whole:S2.whole,
    kind:i=>S2.picked.has(i+1) ? 'a' : (S2.rest ? 'n pop' : ''),
    inner:i=>dieSVG(i+1, 40),
    labA: S2.labels ? sfrac(1,3) : null, labN: S2.labels ? sfrac(2,3) : null });
}
// 띠에서 파란 칸이 앞으로 오도록 순서를 바꾸지 않고, 칸 위치 그대로 보여 줌 → 라벨은 칸 아래 대신 범례로
function s2Left(){
  return `<div class="exp-head"><span class="exp-badge">함께 탐구</span><span>한 개의 주사위를 던질 때 나오는 눈</span></div>
    <div class="fig" id="s2Fig">${S2.labels ? s2SortedStrip() : s2Strip()}
      ${S2.rest ? LEGEND : '<div class="fig-cap">눈 1, 2, 3, 4, 5, 6을 한 칸씩 늘어놓은 띠</div>'}</div>`;
}
// 확률을 구한 뒤: 파란 칸끼리, 주황 칸끼리 모아서 다시 그림 (두 부분이 한눈에 보이게)
function s2SortedStrip(){
  const order = [3,6,1,2,4,5];
  return stripHTML({ id:'st2', n:6, a:2, whole:S2.whole, kind:i=>i<2?'a':'n', inner:i=>dieSVG(order[i], 40),

/* ════════════════════════════════
   4단계: 하나하나 다 셀까? (생일)
   여름 6명 → 6/25 → 여름 아닌 달 막대 9개를 하나씩 눌러 더하기(시간 잼) vs 25 − 6 → 19/25
════════════════════════════════ */
const BDAY = [2,3,2,1,3,2,3,1,2,2,3,1];   // 1월~12월, 합 25, 여름(6~8월) 6
const SUMMER = [5,6,7];
const S3 = { summer:false, counted:[], phase:'', t0:0, tAdd:0, strip:false };
function bdaySVG(){
  const x0 = 30, bw = 26, gap = 6.5, base = 150, unit = 34;
  let s = `<svg viewBox="0 0 420 196" style="width:100%;height:auto;display:block">`;
  [1,2,3].forEach(v=>{ const y = base-v*unit; s += `<line x1="${x0-6}" y1="${y}" x2="412" y2="${y}" stroke="#e5e7eb" stroke-width="1"/><text x="${x0-10}" y="${y+4}" text-anchor="end" font-size="11" font-weight="700" fill="#9090b0">${v}</text>`; });
  s += `<line x1="${x0-6}" y1="${base}" x2="412" y2="${base}" stroke="#1a1a2e" stroke-width="1.6"/>`;
  BDAY.forEach((n,i)=>{
    const x = x0 + i*(bw+gap), h = n*unit;
    const isS = SUMMER.includes(i);
    const fill = (isS && S3.summer) ? '#3b82f6' : S3.counted.includes(i) ? '#fb923c' : '#c7d2fe';
    s += `<g class="bar${S3.phase==='add'&&!isS?' clickable':''}" id="bar${i}" onclick="barClick(${i})"><rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="3" fill="${fill}" stroke="#4f46e5" stroke-width="1.2"/>`+
      `<rect x="${x-3}" y="${base-102}" width="${bw+6}" height="${102+20}" fill="transparent"/>`+
      `<text x="${x+bw/2}" y="${base-h-5}" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1a2e">${n}</text>`+
      `<text x="${x+bw/2}" y="${base+15}" text-anchor="middle" font-size="11" font-weight="800" fill="${isS?'#1d4ed8':'#4a4a6a'}">${i+1}월</text></g>`;
  });
  const sx0 = x0 + 5*(bw+gap) - 2, sx1 = x0 + 7*(bw+gap) + bw + 2;
  s += `<path d="M${sx0} ${base+21} L${sx0} ${base+26} L${sx1} ${base+26} L${sx1} ${base+21}" fill="none" stroke="#1d4ed8" stroke-width="1.6"/><text x="${(sx0+sx1)/2}" y="${base+41}" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">여름</text>`;
  s += `<text x="${x0-6}" y="14" font-size="11" font-weight="800" fill="#4a4a6a">(명)</text>`;
  return s + `</svg>`;
}
function s3SumLine(){
  if(!S3.counted.length) return S3.phase==='add' ? '<span class="sub">여름이 아닌 달의 막대를 눌러 봐요.</span>' : '';
  const sum = S3.counted.reduce((a,i)=>a+BDAY[i],0);
  return `${S3.counted.map(i=>BDAY[i]).join(' + ')} = <b>${sum}</b>` + (S3.tAdd ? ` <span class="sub">(${S3.counted.length}번 누르고 ${S3.tAdd}초)</span>` : '');
}
function s3Strip(){
  return stripHTML({ id:'st3', n:25, a:6, kind:i=>i<6?'a':'n', labA:sfrac(6,25), labN:sfrac(19,25) });
}
function s3Left(){
  return `<div class="exp-head"><span class="exp-badge">함께 탐구</span><span>어느 반 학생 25명의 생일</span></div>
    <div class="fig" id="s3Fig">${bdaySVG()}<div class="sumline" id="s3Sum">${s3SumLine()}</div></div>
    ${S3.strip ? `<div class="fig" id="s3StripBox"><div class="fig-cap" style="margin:0 0 6px">25명을 한 줄로 세워 보면</div>${s3Strip()}${LEGEND}</div>` : ''}`;
}

function stage3(){
  enterStage(3);

  R(`<div class="panel-title"><span class="step-badge">4</span>하나하나 다 셀까?</div>

  appendQ(chkBlock('s3a',
    `<p class="key-q task">뽑은 학생의 <span class="em">생일이 여름일 확률</span>을 구해 보자.</p>
     <div class="count-row">생일이 여름인 학생 수: ${numIn('s3a1')}</div>

}
function barClick(i){

  if(!S3.t0) S3.t0 = Date.now();

    appendQ(chkBlock('s3c',
      `<p class="key-q task">더 빠른 방법은 없을까? 이번엔 <span class="em">전체 25명에서 여름인 학생 수를 빼서</span> 구해 보자.</p>
       <div class="fline">25 − ${numIn('s3c1')} = ${numIn('s3c2')}</div>`,

function s3cOk(){
  appendQ(`<div class="qblock" id="s3cmpBlock"><div class="cmp">
      <div class="cmp-i slow"><b>하나하나 더하기</b><span>막대 9개를 누르고<br>덧셈 8번 · ${S3.tAdd}초</span></div>
      <div class="cmp-i fast"><b>전체에서 빼기</b><span>뺄셈 한 번<br>25 − 6 = 19</span></div></div>
      <p class="lead" style="margin-top:8px">답은 같은 19명이에요. 어느 쪽이 더 편한가요? <b>일어나는 쪽(6명)</b>을 알면, 일어나지 않는 쪽은 전체에서 빼면 돼요.</p></div>`, 's3cmp');
  appendQ(chkBlock('s3d',
    `<p class="key-q task">뽑은 학생의 <span class="em">생일이 여름이 아닐 확률</span>을 구해 보자.</p>
     <div class="fline"><span class="lab">(생일이 여름이 아닐 확률)</span> = ${probHTML('s3df')}</div>`,
    [{prob:'s3df', ans:[19,25]}], s3dOk), 's3d');
}
function s3dOk(){
  S3.strip = true; s3Redraw(); flashL('s3StripBox');
  nextBlock('s3', `세 이야기 모두 띠 하나가 두 부분으로 나뉘었어요. 이제 세 띠를 나란히 놓고 비교해 봐요.`, '다음: 두 부분을 합치면? →', 'stage4');

/* ════════════════════════════════
   5단계: 두 부분을 합치면? (규칙 찾기 → 1 − p)
   같은 길이 띠 3개 → 두 확률의 합 = 1 → 1 − (일어날 확률) → 파란 부분 잘라 내기 → 개념 정리 팝업
════════════════════════════════ */
const STRIPS = [
  { nm:'👓 안경', n:10, a:3, A:[3,10], N:[7,10] },
  { nm:'🎲 3의 배수', n:6, a:2, A:[1,3], N:[2,3] },
  { nm:'🎂 여름 생일', n:25, a:6, A:[6,25], N:[19,25] }];
const S4 = { sum:false, cutting:false, cut:false };
function s4Left(){

    <div class="fig" id="s4Fig">${STRIPS.map((s,k)=>`<div class="s4row"><div class="s4nm">${s.nm}</div>`+
      stripHTML({ id:'st4_'+k, n:s.n, a:s.a, kind:i=>i<s.a?'a':'n', cut:S4.cutting||S4.cut,
        eq: S4.sum ? '= 1' : '',
        labA: S4.cut ? '' : sfrac(...s.A),
        labN: S4.cut ? `1 − ${sfrac(...s.A)} = ${sfrac(...s.N)}` : sfrac(...s.N) })+`</div>`).join('')}
      ${LEGEND}</div>`;
}
function s4Redraw(){ stageBox('L',4).innerHTML = s4Left(); }
function stage4(){
  enterStage(4);
  S4.sum = false; S4.cutting = false; S4.cut = false;
  L(s4Left());
  R(`<div class="panel-title"><span class="step-badge">5</span>두 부분을 합치면?</div>
    <p class="lead">왼쪽은 지금까지 만든 띠 세 개예요. 파란 부분은 <b>일어날 확률</b>, 주황 부분은 <b>일어나지 않을 확률</b>이에요.</p>`);
  appendQ(chkBlock('s4a',
    `<p class="key-q task">세 띠에서 <span class="em">(파란 부분의 확률) + (주황 부분의 확률)</span>을 각각 계산해 보자.</p>
     ${STRIPS.map((s,k)=>`<div class="fline" style="justify-content:flex-start"><span class="lab" style="min-width:84px;text-align:left">${s.nm}</span> ${sfrac(...s.A)} + ${sfrac(...s.N)} = ${probHTML('s4s'+k)}</div>`).join('')}
     ${PROB_NOTE}`,
    STRIPS.map((s,k)=>({prob:'s4s'+k, ans:[1,1]})), s4aOk, '✅ 맞아요! 세 띠 모두 합이 1이에요. 왼쪽을 봐요.'), 's4a');
}
function s4aOk(){
  S4.sum = true; s4Redraw(); flashL('s4Fig');
  appendQ(choiceBlock('s4b',
    `<p class="key-q">(일어날 확률) + (일어나지 않을 확률) = 1이에요.<br>그렇다면 <span class="em">어떤 사건이 일어나지 않을 확률</span>은 어떻게 구할 수 있을까?</p>`,
    [{key:'ok', label:'1 − (그 사건이 일어날 확률)'}, {key:'m1', label:'(그 사건이 일어날 확률) − 1'},
     {key:'p1', label:'1 + (그 사건이 일어날 확률)'}, {key:'same', label:'(그 사건이 일어날 확률)과 같아요.'}],
    'ok', '✅ 맞아요! 전체 1에서 일어날 확률만큼 빼면 돼요.',
    ()=>appendQ(`<div class="qblock" id="s4cBlock">
        <p class="key-q task">눈으로 확인해 보자. 버튼을 눌러 <span class="em">전체 1에서 파란 부분을 잘라 내 보자.</span></p>
        <div class="btn-row"><button class="btn" id="s4cBtn" onclick="s4Cut()">✂️ 파란 부분 잘라 내기</button></div>
        <div class="feedback" id="s4cFb"></div></div>`, 's4c')), 's4b', 'choice');
}
function s4Cut(){
  if($('s4cBtn').disabled) return;

  document.querySelectorAll('#s4Fig .strip-wrap').forEach(w=>w.classList.add('cut'));
  setTimeout(()=>{

    stageBox('R',4).insertAdjacentHTML('beforeend', `<div class="qblock" id="s4dBlock">

        사건 ${itv('A')}가 일어날 확률을 ${itp()}라고 하면<br>(사건 ${itv('A')}가 일어나지 않을 확률) = <b class="kw">1 − ${itp()}</b></div>
      <div id="s4After"></div></div>`);

    `<p class="key-q task">처음의 발표자 뽑기를 기억하나요? 내가 뽑힐 확률은 ${sfrac(1,25)}이었어요.<br>이번에는 하나하나 세지 말고 <span class="em">1 − ${itp()}</span>로 내가 뽑히지 않을 확률을 구해 보자.</p>
     <div class="fline"><span class="lab">(내가 뽑히지 않을 확률)</span> = 1 − ${sfrac(1,25)} = ${probHTML('s4ef')}</div>`,
    [{prob:'s4ef', ans:[24,25]}],
    ()=>nextBlock('s4', `24명을 하나하나 생각하지 않아도 <span class="kw">1에서 빼서</span> 바로 구했어요!`, '다음: 비가 오지 않을 확률은? →', 'stage5'),

/* ════════════════════════════════
   6단계: 비가 오지 않을 확률은? (문제 3)
   슬라이더로 10칸 띠에 0.8 칠하기 → 1 − 0.8 → 거꾸로(눈이 오지 않을 확률 → 눈이 올 확률, 0.05 단위라 띠 없이)
════════════════════════════════ */
const S5 = { v:0, ok:false, labN:false, k2:65 };
function rainCells(){
  return [...Array(10)].map((_,i)=>`<div class="cell ${i<S5.v?'a':'g'}" id="st5c${i}">${i<S5.v?'🌧️':''}</div>`).join('');
}
function s5Left(){

    ${weatherSVG('비','0.8')}
    <div class="fig" id="s5Fig" style="margin-top:8px">
      <div class="fig-cap" style="margin:0 0 6px">띠 전체 = 1 (한 칸 = 0.1)</div>
      <div class="strip-wrap"><div class="strip" id="st5" style="grid-template-columns:repeat(10,1fr)">${rainCells()}</div>
        <div class="strip-lab" id="s5Lab">${s5LabHTML()}</div></div>
      <input type="range" class="slider" id="s5Range" min="0" max="10" step="1" value="${S5.v}" oninput="s5Slide(this.value)" ${S5.ok?'disabled':''}>
      <div class="s5read" id="s5Read">${s5ReadHTML()}</div>
    </div>`;
}
function s5ReadHTML(){ return `파란 칸 ${S5.v}칸 = <b>${S5.v===10?'1':S5.v===0?'0':'0.'+S5.v}</b>`; }
function s5LabHTML(){
  if(!S5.ok) return '';
  return `<span class="la" style="flex:8 1 0">비가 올 확률 0.8</span><span class="ln" style="flex:2 1 0;color:#6b7280">${S5.labN?'0.2':'?'}</span>`;

/* ════════════════════════════════

   레벨1: 일어나지 않을 확률 (확률이 주어진 문제는 일어날 ↔ 일어나지 않을 바꿔치기 섞음, 소수 문제 포함)

const PIPS = {1:[[.5,.5]],2:[[.28,.28],[.72,.72]],3:[[.27,.27],[.5,.5],[.73,.73]],4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],5:[[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]],6:[[.28,.24],[.72,.24],[.28,.5],[.72,.5],[.28,.76],[.72,.76]]};
function dieSVG(n,s,fill){
  const r=s*0.085;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="display:block"><rect x="1.5" y="1.5" width="${s-3}" height="${s-3}" rx="${(s*.18).toFixed(1)}" fill="${fill||'#fff'}" stroke="#1a1a2e" stroke-width="1.4"/>`+
    PIPS[n].map(([x,y])=>`<circle cx="${(x*s).toFixed(1)}" cy="${(y*s).toFixed(1)}" r="${(n===1?r*1.6:r).toFixed(1)}" fill="${n===1?'#dc2626':'#1a1a2e'}"/>`).join('')+`</svg>`;
}
function weatherSVG(word, val){
  return `<svg viewBox="0 0 300 130" style="width:100%;max-width:300px;height:auto;display:block;margin:0 auto">
    <rect x="4" y="4" width="292" height="122" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <g transform="translate(26,20)"><circle cx="40" cy="40" r="22" fill="#cbd5e1"/><circle cx="66" cy="34" r="26" fill="#cbd5e1"/><circle cx="90" cy="44" r="18" fill="#cbd5e1"/><rect x="34" y="40" width="70" height="22" rx="10" fill="#cbd5e1"/>
      ${word==='눈' ? '<text x="42" y="88" font-size="16">❄</text><text x="64" y="96" font-size="16">❄</text><text x="86" y="88" font-size="16">❄</text>'
        : '<line x1="46" y1="70" x2="40" y2="86" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/><line x1="66" y1="70" x2="60" y2="88" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/><line x1="86" y1="70" x2="80" y2="86" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>'}</g>
    <text x="210" y="56" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">내일 ${josa(word,'이','가')} 올 확률</text>
    <text x="210" y="94" text-anchor="middle" font-size="30" font-weight="900" fill="#1d4ed8">${val}</text></svg>`;

function coprimeFrac(lo, hi){ let a,b; do { b = randInt(lo,hi); a = randInt(1,b-1); } while(gcd(a,b)!==1); return [a,b]; }
const PCTX = [
  { subj:'어느 농구 선수가 자유투를 던질 때,', ev:'자유투를 성공할', not:'자유투를 성공하지 못할' },
  { subj:'어떤 씨앗 한 개를 심었을 때,', ev:'싹이 틀', not:'싹이 트지 않을' },
  { subj:'어느 양궁 선수가 화살을 한 발 쏠 때,', ev:'10점 과녁에 맞힐', not:'10점 과녁에 맞히지 못할' },
  { subj:'어느 축구 선수가 승부차기를 할 때,', ev:'골을 넣을', not:'골을 넣지 못할' }
];
function genPGiven(){
  const c = pick1(PCTX), [a,b] = coprimeFrac(5,12), swap = Math.random()<0.5;

  return { gen:'pGiven', swap, text:`${c.subj} ${given} 확률이 ${sfrac(a,b)}이다. 이때 ${ask} 확률을 구하시오.`, p:[b-a,b], label:`(${ask} 확률)`, fig:null };
}
function genDec(){

  const wj = josa(w,'이','가');   // 비가 / 눈이
  const given = swap ? `${wj} 오지 않을` : `${wj} 올`, ask = swap ? `${wj} 올` : `${wj} 오지 않을`;
  return { gen:'dec', swap, dec:true, text:`일기 예보에서 어느 지역에 내일 ${given} 확률이 ${decRago(k)} 했을 때, 이 지역에 내일 ${ask} 확률을 구하시오.`, val:(100-k)/100, label:`(${ask} 확률)`,
    fig:{kind:'weather', w, val: swap ? '?' : decStr(k)} };
}
function genBagNot(){
  const c = { r:randInt(2,6), b:randInt(2,6), y:randInt(1,5) }, total = c.r+c.b+c.y;
  const col = pick1(['r','b','y']), nm = {r:'빨간 공', b:'파란 공', y:'노란 공'}[col];

    p:reduce(total-c[col], total), label:`(${josa(nm,'이','가')} 나오지 않을 확률)`, fig:{kind:'bag', ...c} };

function genLottery(){
  const n = pick1([10,12,15,20,24,30]), a = randInt(2, Math.floor(n/3));

    p:reduce(n-a, n), label:'(당첨 제비가 아닐 확률)', fig:{kind:'lottery', n} };
}
const DICE_EV = [
  ['짝수의 눈', v=>v%2===0], ['3의 배수의 눈', v=>v%3===0], ['4 이상의 눈', v=>v>=4], ['2 이하의 눈', v=>v<=2],
  ['6의 약수의 눈', v=>6%v===0], ['소수의 눈', isPrime], ['5 이상의 눈', v=>v>=5], ['1의 눈', v=>v===1]
];
function genDiceNot(){
  const [nm,f] = pick1(DICE_EV), fav = [1,2,3,4,5,6].filter(f).length;
  return { gen:'diceNot', text:`한 개의 주사위를 던질 때, ${josa(nm,'이','가')} 나오지 않을 확률을 구하시오.`, p:reduce(6-fav,6), label:`(${josa(nm,'이','가')} 나오지 않을 확률)`, fig:{kind:'dice'} };

function genCardNot(){
  const N = pick1([10,12,15,20]), k = pick1([3,4,5,6].filter(x=>x<N/2)), fav = Math.floor(N/k);
  return { gen:'cardNot', text:`1부터 ${N}까지의 자연수가 각각 하나씩 적힌 ${N}장의 카드 중에서 한 장을 뽑을 때, ${k}의 배수가 아닌 수가 적힌 카드가 나올 확률을 구하시오.`,
    p:reduce(N-fav, N), label:`(${k}의 배수가 아닌 수가 나올 확률)`, fig:{kind:'cards', N} };

const ROLES = [['발표자','기록자'],['회장','부회장'],['반장','부반장']];
function genRoles(){

    p:reduce(n*(n-1) - k*(k-1), n*(n-1)), label:`(적어도 한 명은 ${askGirl?'여학생':'남학생'}이 뽑힐 확률)`, fig:{kind:'kids', m, f}, note:`모든 경우 ${n}×${n-1}=${n*(n-1)}, 모두 ${askGirl?'남':'여'}학생 ${k}×${k-1}=${k*(k-1)}` };

const DICE2 = [

function genCoin2(){

function makeLevel(levelIdx){
  if(levelIdx===0) return shuffle([pick1([genPGiven, genDec])(), pick1([genBagNot, genLottery])(), pick1([genDiceNot, genCardNot])()]);
  const d = genDice2();
  return shuffle([genRoles(), d, Math.random()<0.5 ? pick1([genCoin2, genCoin3])() : genDice2(d.ev)]);
