  else if(f.kind==='cards'){ body = `<div class="cardg">${[...Array(f.N)].map((_,i)=>`<span>${i+1}</span>`).join('')}</div>`; cap = `1부터 ${f.N}까지의 카드 ${f.N}장`; }
  else if(f.kind==='bag'){ body = `<div class="pouch">${'<i class="ball red"></i>'.repeat(f.r)}${'<i class="ball blue"></i>'.repeat(f.b)}${'<i class="ball yel"></i>'.repeat(f.y)}</div>`; cap = `<b style="color:#dc2626">빨간 공 ${f.r}개</b> · <b style="color:#2563eb">파란 공 ${f.b}개</b> · <b style="color:#ca8a04">노란 공 ${f.y}개</b>`; }
  else if(f.kind==='lottery'){ body = `<div class="lots">${'<i></i>'.repeat(f.n)}</div>`; cap = `제비 ${f.n}개 (당첨 제비는 겉으로 보이지 않아요)`; }
  else if(f.kind==='weather'){ body = weatherSVG(f.w, f.val); cap = '일기 예보'; }
  else if(f.kind==='dice2'){ body = `<div class="fig-dice">${dieSVG(randInt(1,6),56,'#fff')}${dieSVG(randInt(1,6),56,'#fde68a')}</div>`; cap = '서로 다른 두 개의 주사위'; }
  else if(f.kind==='coin2'){ body = `<div class="fig-dice">${coinHTML('앞')}${coinHTML('뒤')}</div>`; cap = '서로 다른 두 개의 동전'; }
  else if(f.kind==='coin3'){ body = `<div class="fig-dice">${coinHTML('앞')}<span style="font-size:20px">→</span>${coinHTML('?')}<span style="font-size:20px">→</span>${coinHTML('?')}</div>`; cap = '한 개의 동전을 세 번 던지기'; }
  else if(f.kind==='kids'){
    body = `<div class="kidrow">${'<span class="kc m">👦<small>남</small></span>'.repeat(f.m)}${'<span class="kc f">👧<small>여</small></span>'.repeat(f.f)}</div>`;
    cap = `<b class="nm">남학생 ${f.m}명</b> · <b class="nf">여학생 ${f.f}명</b>`;
  }
  return `<div class="fig">${body}<div class="fig-cap">${cap}</div></div>`;
}

/* ════════════════════════════════
   9단계: 문제풀이 — 레벨마다 3문제, 2문제 이상 맞히면 통과
   한 문제에 두 번까지 입력 가능 (첫 오답은 봐줌). 두 번째도 틀리면 틀린 것으로 하고 다음 문제로. 정답은 보여 주지 않음
════════════════════════════════ */
const LEVELS = [ { label:'레벨1 · 일어나지 않을 확률', passNeeded:2 }, { label:"레벨2 · '적어도'가 나오는 확률", passNeeded:2 } ];
const pst = { levelIdx:0, idx:0, correct:0, order:[], tries:0, passedLevels:{} };
function goToPractice(){ startLevel(0); }
function updateLevelTabs(){
  $('levelTabs').innerHTML = LEVELS.map((lv,i)=>`<div class="level-tab ${i===pst.levelIdx?'active':(pst.passedLevels[i]?'done':'')}">${lv.label}</div>`).join('');
}
function pgLeftHTML(){
  return `<div id="pgFig"></div><div class="hint-card"><div style="font-weight:800;margin-bottom:6px">📌 어떤 사건이 일어나지 않을 확률</div>
    사건 ${itv('A')}가 일어날 확률을 ${itp()}라고 하면<br>(사건 ${itv('A')}가 일어나지 않을 확률) = 1 − ${itp()}</div>
    <p class="board-tip">한 문제에 두 번까지 답을 쓸 수 있어요.</p>`;
}
function startLevel(levelIdx){
  frontier = PRACTICE; built[PRACTICE] = true; viewing = PRACTICE; practiceScreen = 'scPractice';
  pst.levelIdx = levelIdx; pst.idx = 0; pst.correct = 0;
  pst.order = makeLevel(levelIdx);
  $('pgLeft').innerHTML = pgLeftHTML();
  showScreen('scPractice'); renderStepper(); updateLevelTabs(); renderPQuestion();
}
function renderPQuestion(){
  const lv = LEVELS[pst.levelIdx], q = pst.order[pst.idx];
  pst.tries = 0;
  $('pgProgress').textContent = `${lv.label} · ${pst.idx+1} / ${pst.order.length}`;
  const ansHTML = q.dec ? `${decHTML('pgd')}` : probHTML('pgf');
  $('pgArea').innerHTML = `<div class="try-tag" id="pgTry">✍️ 첫 번째 기회</div>
    <div class="prob-box">${q.text}</div>
    <p class="key-q task">확률을 구해 보자.</p>
    <div class="fline"><span class="lab">${q.label}</span> = ${ansHTML}</div>
    ${q.dec ? '<p class="sub">소수로 써요.</p>' : PROB_NOTE}
    <div class="btn-row"><button class="btn btn-check" id="pgBtn" onclick="pgCheck()">확인</button></div>
    <div class="feedback" id="pgFb"></div><div class="btn-row" id="pgNextRow"></div>`;
  $('pgArea').querySelectorAll('input').forEach(x=>x.addEventListener('keydown', e=>{ if(e.key==='Enter') pgCheck(); }));
  $('pgFig').innerHTML = figHTML(q.fig);
}
function pgItems(q){ return q.dec ? [{dec:'pgd', val:q.val}] : [{prob:'pgf', ans:q.p}]; }
function pgNextBtn(){
  $('pgNextRow').innerHTML = `<button class="btn" id="pgNextBtn" onclick="this.disabled=true;pgNext()">${pst.idx<pst.order.length-1?'다음 문제 →':'결과 보기 →'}</button>`;
}
function pgCheck(){
  if($('pgBtn').disabled) return;   // 이미 끝난 문제는 다시 채점하지 않음
  const q = pst.order[pst.idx];
  const r = checkItems(pgItems(q), 'pgFb');
  if(r===null || r==='unreduced') return;
  if(r===false){
    if(pst.tries===0){
      pst.tries = 1;
      $('pgTry').textContent = '✍️ 마지막 기회'; $('pgTry').classList.add('last');
      setFb('pgFb',false, RETHINK+'<br><span class="sub">한 번 더 답을 쓸 수 있어요.</span>');
      return;
    }
    $('pgArea').querySelectorAll('input').forEach(x=>x.disabled=true); $('pgBtn').disabled = true;
    setFb('pgFb',false,'❌ 아쉬워요. 이 문제는 틀린 것으로 할게요.');
    pgNextBtn();
    return;
  }
  $('pgBtn').disabled = true;
  pst.correct++;
  setFb('pgFb',true, pst.tries ? '✅ 맞아요! 다시 생각해서 맞혔어요.' : '✅ 정답이에요!');
  pgNextBtn();
}
function pgNext(){ pst.idx++; if(pst.idx < pst.order.length) renderPQuestion(); else levelFinish(); }
function levelFinish(){
  const lv = LEVELS[pst.levelIdx];
  const pass = pst.correct >= lv.passNeeded;
  if(pass) pst.passedLevels[pst.levelIdx] = true;
  updateLevelTabs(); showScreen('scLevelResult'); practiceScreen = 'scLevelResult';
  $('lrIcon').textContent = pass?'🎉':'💪';
  $('lrTitle').textContent = pass ? `${lv.label.split(' ·')[0]} 통과!` : `${lv.label.split(' ·')[0]} 아쉬워요`;
  $('lrScore').textContent = `${pst.correct} / ${pst.order.length}`;
  $('lrMsg').textContent = pass ? '잘했어요! 다음으로 넘어가 볼까요?' : `${pst.order.length}문제 중 ${lv.passNeeded}문제 이상 맞혀야 통과해요. 다시 도전해 볼까요?`;
  $('lrRetryBtn').style.display = pass ? 'none' : '';
  $('lrNextBtn').style.display = pass ? '' : 'none';
  $('lrNextBtn').disabled = false;
  $('lrNextBtn').textContent = (pst.levelIdx < LEVELS.length-1) ? '다음 레벨 →' : '결과 보기 →';
}
function lrRetry(){ startLevel(pst.levelIdx); }
function lrNext(){
  if(pst.levelIdx < LEVELS.length-1){ startLevel(pst.levelIdx+1); }
  else {
    showScreen('scDone'); practiceScreen = 'scDone';
    $('doneStat').innerHTML = stat.total ? `탐구하면서 한 번에 맞힌 질문: ${stat.first} / ${stat.total}` : '';
    if(window._reportHubComplete) window._reportHubComplete();
  }
}

/* ════════════════════════════════
   개념 정리 팝업 (빈칸에 1 − p를 써야 닫힘)
════════════════════════════════ */
let termCfg = null, termTimer = null;
function normTerm(s){ return String(s||'').replace(/[\s'"‘’“”.,!()]/g,'').replace(/[−–—]/g,'-').toLowerCase(); }
function termAfter(cfg, delay){
  clearTimeout(termTimer);
  termTimer = setTimeout(()=>{ if($(cfg.box)) openTermPop(cfg); }, delay==null ? 700 : delay);
}
function openTermPop(cfg){
  termCfg = cfg;
  $('termBox').innerHTML = `<div class="term-tag">📘 개념 정리</div><div class="modal-text" style="margin-bottom:8px">${cfg.title}<br><span style="color:var(--ink2);font-weight:600">${cfg.ask||'빈칸에 알맞은 식을 써 보세요.'}</span></div>
    <div class="def-box">${cfg.html.replace('[[BLANK]]', `<input class="blank" id="termInp" style="width:5.5em" autocomplete="off">`)}</div>
    <div class="feedback" id="termFb"></div>
    <div class="btn-row"><button class="modal-btn" id="termBtn" onclick="termCheck()">확인</button></div>`;
  $('termModal').classList.add('show');
  const inp = $('termInp');
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') termCheck(); });
  try{ inp.focus(); }catch(e){}
}
function closeTermPop(){ clearTimeout(termTimer); $('termModal').classList.remove('show'); termCfg = null; popCfg = null; }
function termCheck(){
  if(!termCfg || $('termBtn').disabled) return;
  const inp = $('termInp'), raw = normTerm(inp.value);
  if(raw===''){ setFb('termFb',false,'빈칸을 채워 주세요.'); return; }
  const ok = termCfg.ans.some(a=>normTerm(a)===raw);
  firstTry(termCfg.qid, ok);
  inp.classList.toggle('wrong',!ok); inp.classList.toggle('correct',ok);
  if(!ok){ setFb('termFb',false,RETHINK); return; }
  setFb('termFb',true,'✅ 맞아요!');
  $('termBtn').disabled = true;
  const cfg = termCfg;
  setTimeout(()=>{
    closeTermPop();
    const el = $(cfg.box); if(!el) return;
    el.classList.remove('term-wait'); flashRef(el); scrollToEl(cfg.box);
    if(cfg.after) cfg.after();
  }, 600);
}

/* ════════════════════════════════
   관리자 모드 (SHA-256 해시 비교 — 가벼운 잠금일 뿐, 보안 장치 아님)
════════════════════════════════ */
const ADMIN_HASH = 'fb9e692b52ad41cd666f83c8175df90569d48192d531e9c94285929bc116891a';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function openAdminModal(){ $('adminPwInput').value=''; $('adminPwErr').textContent=''; $('adminPwModal').classList.add('show'); $('adminPwInput').focus(); }
async function checkAdminPassword(){
  const v = $('adminPwInput').value;
  let ok=false;
  try{ ok = (await sha256Hex(v)) === ADMIN_HASH; }
  catch(e){ $('adminPwErr').textContent='이 브라우저에서는 관리자 모드를 쓸 수 없어요.'; return; }
  if(!ok){ $('adminPwErr').textContent='비밀번호가 틀렸어요.'; return; }
  $('adminPwModal').classList.remove('show');
  showAdminPanel();
}
function showAdminPanel(){
  const btn = (label, fn) => `<button class="modal-btn" style="padding:2px 8px;font-size:10.5px" onclick="${fn}">${label}</button>`;
  const cur = (pst.order && pst.order[pst.idx] && (viewing===PRACTICE)) ? pst.order[pst.idx] : null;
  $('adminPanelBody').innerHTML =
    '<div class="btn-row" style="justify-content:flex-start;margin:0 0 8px">'+
      STAGES.map((s,i)=>btn(`${i+1}.${s}`,`adminGo(${i})`)).join('')+btn('레벨2','adminGo(9)')+btn('정리 팝업 통과','adminPassTerm()')+
    '</div>'+
    '<div><strong>숫자 칸</strong>: 7 (= 7가지 = 7개 = 7번 = 7명 = 7장 = 7회, 띄어쓰기 무시)</div>'+
    '<div><strong>확률 칸</strong>: 분자·분모 따로. 값이 같고 기약분수여야 정답. 답이 1이면 분자=분모인 분수(10/10 등)나 위 칸에 1만 써도 정답. 약분 전이면 오답이 아니라 "약분까지 해야 완벽한 정답이 됩니다!" 안내 후 다시 입력</div>'+
    '<div><strong>소수 칸</strong>: 값이 같은 소수 모두 정답 (0.2 = .2 = 0.20). 분수(1/5)나 백분율(20%)은 미인정</div>'+
    `<div><strong>1. 발표자 뽑기</strong>: 뽑기 5번(내 번호 ${ME}번 — 주소의 num이 1~25면 그 번호, 아니면 7) → 뽑히지 않는 일 → ⏩ 내가 뽑힐 때까지 뽑기(처음 뽑힌 뒤 다음 질문) → 1/25 → 24, 24/25</div>`+
    '<div><strong>2. 안경</strong>: 사진에서 안경 쓴 3명 누르기(위 줄 2번째, 아래 줄 2번째·5번째) → 3/10 → 10 − 3 → 7/10 → 팝업① 3/10 + 7/10 = 1 (1, 10/10 등 분자=분모 모두 정답) → 팝업② 7/10 = 1 − 3/10 (빈칸 3/10, 약분 전이면 안내) · [정리 팝업 통과] 버튼으로 건너뛰기 가능</div>'+
    '<div><strong>3. 주사위 띠</strong>: 3, 6 칸 칠하기 → 1/3, 2/3 → 띠 전체 = 1</div>'+
    '<div><strong>4. 생일</strong>: 6명, 6/25 → 여름 아닌 달 막대 9개 누르기(월별 2,3,2,1,3,2,3,1,2,2,3,1) → 25 − 6 = 19 → 19/25</div>'+
    '<div><strong>5. 두 부분을 합치면</strong>: 합 세 개 모두 1 → 1 − (그 사건이 일어날 확률) → ✂️ 잘라 내기 → 정리 팝업 1-p (1−p, 띄어쓰기·대소문자 무시) → 1 − 1/25 = 24/25</div>'+
    `<div><strong>6. 일기 예보</strong>: 슬라이더 8칸 → 0.2 · (거꾸로) 눈이 오지 않을 확률 ${decStr(S5.k2)} → 눈이 올 확률 ${decStr(100-S5.k2)}</div>`+
    '<div><strong>7. 동전</strong>: 3번 이상 던지기 → 4 → 카드 나누기(뒤뒤만 ✖) → 두 번 모두 뒷면 → 1/4, 3/4 → 세 번: 카드 8장 나누기(뒤뒤뒤만 ✖) → 1 → 7/8</div>'+
    '<div><strong>8. 문제 4</strong>: 20 (🙋 도움: 서로 다른 경우) → 판에서 적어도 한 명 여학생 14칸 → 두 명 모두 남학생 6칸 → 3/10 → 7/10</div>'+
    '<div><strong>레벨1</strong>: [확률이 분수로 주어진 문제 또는 소수(일기 예보) — 일어날↔일어나지 않을 바꿔치기 50%] + [주머니 공 또는 제비] + [주사위 또는 카드]</div>'+
    "<div><strong>레벨2</strong>: 역할 2명 뽑기 + 서로 다른 두 주사위 + (두 동전·동전 세 번 또는 다른 주사위 문제)</div>"+
    '<div><strong>통과</strong>: 레벨마다 3문제 중 2문제 이상. 한 문제에 두 번까지 입력 (첫 오답은 봐줌), 두 번째 오답이면 틀린 것으로 하고 다음 문제. 정답 공개 없음, 힌트 없음</div>'+
    (cur ? `<div style="margin-top:4px;background:#fef3c7;border-radius:6px;padding:3px 6px"><strong>지금 문제 정답</strong>: ${cur.dec ? cur.val : fmtP(cur.p)}${cur.note?` (${cur.note})`:''}</div>` : '')+
    '<div style="color:var(--red);margin-top:6px">미인정: "일곱"처럼 한글 수사 / 분수 답을 소수로 쓴 경우(0.7) / 소수 답을 분수로 쓴 경우 / 정리 팝업에 p 대신 다른 문자</div>'+
    '<div style="margin-top:6px"><strong>찍기 방지</strong>: 질문이 뜬 뒤 1.5~4초 안에 고르면 채점 안 함 · 객관식은 틀리면 3→5→8초 잠금 후 보기 다시 섞기 (정답 공개 안 함)</div>'+
    `<label style="display:block;margin-top:6px"><input type="checkbox" ${GUARD.on?'':'checked'} onchange="GUARD.on=!this.checked"> 시연용: 읽기 확인·잠금 끄기</label>`;
  $('adminPanel').style.display='block';
}
function adminPassTerm(){
  if(popCfg){ const c = popCfg; closeTermPop(); c.after(); return; }
  if(!$('s4def') || !$('s4def').classList.contains('term-wait')) return;
  closeTermPop();
  $('s4def').classList.remove('term-wait');
  s4TermDone();
}
function adminGo(i){
  closeTermPop(); closeHelp(); clearInterval(S7.timer);
  const f = [stage0, stage1, stage2, stage3, stage4, stage5, stage6, stage7, ()=>startLevel(0), ()=>startLevel(1)];
  f[i]();
  if($('adminPanel').style.display==='block') showAdminPanel();
}

stage0();

</script>
