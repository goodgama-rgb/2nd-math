<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>확률의 개념</title>
<style>
:root{
  --ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#9090b0;
  --indigo:#4f46e5;--indigo-l:#e0e7ff;--indigo-ll:#eef2ff;
  --green:#16a34a;--green-l:#dcfce7;--green-ll:#F0FDF4;
  --orange:#e05a20;--red:#dc2626;--red-l:#fee2e2;
  --colA:#2563eb;--colA-l:#dbeafe;--colB:#ea580c;--colB-l:#ffedd5;
  --r:12px;--shadow:0 2px 12px rgba(26,26,46,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--indigo-ll);color:var(--ink);min-height:100vh;padding-bottom:60px}
.hdr{background:var(--indigo);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}
.hdr-title{font-size:16px;font-weight:700}
.main{max-width:1200px;margin:0 auto;padding:20px 16px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:var(--r);border:1px solid #e0e7ff;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
/* 강조 3단계: ① 핵심 질문(.key-q, 한 블록에 1개) ② 핵심어(.kw, 문단에 1~2개) ③ 보충(.sub) — 밑줄은 핵심 질문 안의 .em에만 */
.key-q{display:block;font-size:17px;font-weight:800;line-height:1.7;color:var(--ink);background:#fffbeb;border:1.5px solid #fcd34d;border-left:6px solid #f59e0b;border-radius:10px;padding:9px 14px 10px;margin:10px 0}
.key-q::before{content:'❓ 질문';display:block;font-size:11.5px;font-weight:800;color:#b45309;margin-bottom:1px}
.key-q.task::before{content:'✏️ 해 보기'}
.key-q .em{text-decoration:underline;text-decoration-color:#f59e0b;text-decoration-thickness:3px;text-underline-offset:4px}
.kw{font-weight:800;color:#be123c}
.sub{font-size:12.5px;color:var(--ink3);font-weight:600}
.reread{animation:rereadFlash 1.2s ease-out 2}
@keyframes rereadFlash{0%{box-shadow:0 0 0 5px #f59e0b;background-color:#fef3c7}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.lock-note{display:inline-block;margin-top:4px;font-size:12.5px;color:#b45309;background:#fef3c7;border-radius:8px;padding:2px 10px}
.variant-banner{background:#fef3c7;border:1.5px solid #fcd34d;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;color:#92400e;margin-bottom:8px}
.it{font-style:italic;font-family:'Times New Roman',serif;font-weight:700;font-size:1.08em}

.split-layout{display:flex;gap:18px;align-items:flex-start}
.split-left{flex:0 0 450px;position:sticky;top:16px}
.split-right{flex:1 1 auto;min-width:0}
@media (max-width:980px){
  .split-layout{display:block}
  .split-left{position:static;width:100%;margin-bottom:14px}
  .split-left.board-sticky{position:sticky;top:0;z-index:5;max-height:50vh;overflow-y:auto}
}

.stepper{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.stepper .st{padding:5px 11px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12px;font-weight:700;color:var(--ink3);font-family:inherit}
.stepper .st.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.stepper .st.done{background:var(--green-l);color:#14532d;border-color:var(--green);cursor:pointer}
.stepper .st.done:hover{box-shadow:0 0 0 2px var(--green)}
.stepper .st.viewing{background:#fef3c7;color:#92400e;border-color:#f59e0b}
.stepper .st:disabled{cursor:default}
.back-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fef3c7;border:1.5px solid #fcd34d;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px;font-weight:700;color:#92400e}
.back-banner .btn{padding:6px 14px;font-size:12.5px}

/* 왼쪽 */
.exp-head{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700;line-height:1.6;margin-bottom:10px}
.exp-badge{flex-shrink:0;background:var(--ink);color:#fff;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:12px;margin-top:2px}
.board-tip{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-top:8px}
.coin-stage{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:10px}
.coin-btn{border:none;background:none;cursor:pointer;padding:0}
.coin-btn:disabled{cursor:default;opacity:.85}
.coin-btn svg{display:block}
.coin-btn.flip svg{animation:coinFlip .45s ease-out}
@keyframes coinFlip{0%{transform:rotateY(0) translateY(0)}40%{transform:rotateY(540deg) translateY(-26px)}100%{transform:rotateY(1080deg) translateY(0)}}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:4px}
.strip span{height:30px;border-radius:6px;border:1.5px dashed #d8ddfb;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--ink3);background:#fff}
.strip span.H{border:1.5px solid var(--colA);background:var(--colA-l);color:var(--colA)}
.strip span.T{border:1.5px solid var(--colB);background:var(--colB-l);color:var(--colB)}
.flip-count{font-size:13px;font-weight:800;color:var(--ink2)}
.tbl-wrap{overflow-x:auto;margin:6px 0}
.ftbl{border-collapse:collapse;margin:0 auto;font-size:12.5px}
.ftbl th,.ftbl td{border:1px solid #c7cdf5;padding:5px 7px;text-align:center;white-space:nowrap}
.ftbl th{background:var(--indigo-ll);font-weight:800}
.ftbl td{font-weight:700;min-width:44px}
.ftbl td.q{background:#fef3c7;color:#b45309}
.ftbl td.na{color:#c7cdf5}
.big .ftbl{font-size:18px}
.big .ftbl th,.big .ftbl td{padding:8px 12px}
.graph-box{background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:12px;padding:6px;margin-top:6px}
.graph-box svg{display:block;width:100%;height:auto}
.live-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--green)}
.live-tag::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);animation:livePulse 1.4s infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
.sim-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.dice-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mbti{border:2px solid #d8ddfb;border-radius:12px;background:#fff;padding:8px 4px 6px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.mbti .tp{font-size:15px;font-weight:800;letter-spacing:1px;color:var(--ink2)}
.mbti .tp b{color:var(--indigo);font-size:17px;text-decoration:underline;text-underline-offset:3px}
.mbti.sel{border-color:var(--indigo);background:var(--indigo-ll);box-shadow:0 0 0 2px var(--indigo)}
.mbti.static{cursor:default}
.mbti-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;font-size:12px;color:var(--ink3);font-weight:700;margin-bottom:10px;background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:10px;padding:8px 10px}
.mbti-legend .hl{color:var(--ink);font-weight:800;background:#fef3c7;border-radius:6px;padding:0 4px}

/* 오른쪽 */
.panel-title{font-weight:800;font-size:15px;color:var(--indigo);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.step-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--indigo);color:#fff;font-size:12px;font-weight:800;flex-shrink:0}
.qblock{border-top:1px dashed #e0e7ff;padding-top:12px;margin-top:12px}
.qblock:first-child{border-top:none;padding-top:0;margin-top:0}
.lead{font-size:14px;line-height:1.8;color:var(--ink2);margin-bottom:8px}
.prob-box{background:#fbfcff;border:1.5px solid var(--indigo-l);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.85;margin-bottom:8px}
.count-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px;font-weight:700}
.blank{display:inline-block;width:56px;border:none;border-bottom:2px solid var(--indigo);background:transparent;text-align:center;font-weight:700;font-size:15px;font-family:inherit;padding:2px 4px;margin:0 2px;color:var(--indigo)}
.blank.wide{width:80px}
.blank:focus{outline:none;border-bottom-color:#3730a3;background:var(--indigo-ll)}
.blank.correct{border-bottom-color:var(--green);background:var(--green-ll);color:#14532d}
.blank.wrong{border-bottom-color:var(--red);background:var(--red-l);color:var(--red)}
/* 분수 입력칸: 분자 / 가로선 / 분모 */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px}
.frac .blank{border:1.5px solid #a5b4fc;border-radius:6px;width:52px;height:30px;margin:1px 0;background:#fff}
.frac .blank.correct{border-color:var(--green);background:var(--green-ll)}
.frac .blank.wrong{border-color:var(--red);background:var(--red-l)}
.frac .fbar{width:100%;min-width:60px;height:2.5px;background:var(--ink);border-radius:2px;margin:2px 0}
.frac .fix{font-size:16px;font-weight:800;line-height:1.3;padding:0 6px}
.sfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.92em;line-height:1.15;margin:0 3px}
.sfrac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 3px}
.sfrac>span:last-child{padding:0 3px}
.fline{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;font-size:15px;font-weight:800}
.fline .lab{font-size:13px;color:var(--ink2);text-align:center;line-height:1.4}
.choice-col{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.choice-btn{padding:9px 16px;border-radius:10px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);font-family:inherit;text-align:left;line-height:1.5}
.choice-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.choice-btn.correct{background:var(--green);color:#fff;border-color:var(--green)}
.choice-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.choice-btn:disabled{cursor:default}
.btn{border:none;border-radius:12px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.btn:hover{background:#4338ca}
.btn:disabled{opacity:.4;cursor:default}
.btn-check{background:var(--green)}
.btn-check:hover{background:#15803d}
.btn-soft{background:#fff;color:var(--indigo);border:1.5px solid var(--indigo)}
.btn-soft:hover{background:var(--indigo-ll)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.feedback{text-align:center;font-size:13.5px;font-weight:700;min-height:20px;margin-top:8px;line-height:1.6}
.feedback.success{color:var(--green)}
.feedback.error{color:var(--red)}
.feedback.info{color:#b45309}
.note-box{background:var(--green-ll);border:1.5px solid #bbf7d0;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.85;margin-top:10px}
.def-box{background:var(--indigo-ll);border:2px solid var(--indigo);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.9;margin-top:12px;text-align:center}
.warn-box{background:#fff7ed;border:1.5px solid #fdba74;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.85;margin-top:10px}
.hint-card{background:#fff;border:1.5px solid #d8ddfb;border-radius:12px;padding:14px;font-size:13.5px;line-height:1.9}
.hint-box{background:#fffbeb;border:1.5px dashed #f59e0b;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.85;margin-top:8px}

/* 계산 연습장 (삼각형의_닮음_조건_형성평가.html과 같은 방식) */
.draw-toolbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.draw-toolbar-label{font-size:12px;color:var(--ink3);font-weight:700;margin-right:2px}
.mode-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink);font-family:inherit}
.mode-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.color-swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #d8ddfb;cursor:pointer;padding:0;flex-shrink:0}
.color-swatch.active{box-shadow:0 0 0 2.5px var(--indigo)}
.eraser-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink);font-family:inherit}
.eraser-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.draw-wrap{position:relative;margin-bottom:6px}
.scratch-area{position:relative;height:300px;background:#fbfcff;border:1px dashed #d8ddfb;border-radius:10px;background-image:repeating-linear-gradient(#fbfcff 0 29px,#eef0fb 29px 30px)}
.ref-area:not(:empty)+.scratch-area{border-top:none;border-radius:0 0 10px 10px;height:170px}
.ref-area:not(:empty){border:1px dashed #d8ddfb;border-bottom:none;border-radius:10px 10px 0 0;padding:6px;background:#fff}
.ink-canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

.progress{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-bottom:6px}
.level-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.level-tab{padding:7px 16px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.level-tab.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.level-tab.done{background:var(--green-l);color:#14532d;border-color:var(--green)}

.result-wrap{text-align:center;padding:24px 10px}
.result-icon{font-size:48px;margin-bottom:10px}
.result-score{font-size:22px;font-weight:800;color:var(--indigo);margin:8px 0}
.primary-btn{padding:11px 26px;border-radius:8px;background:var(--indigo);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;margin-right:8px}
.restart-btn{padding:11px 26px;border-radius:8px;background:var(--ink);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.show{display:flex}
/* 확인 팝업: 뒤의 정리 내용이 보이지 않게 흐리게 */
.modal-overlay.gate{background:rgba(26,26,46,0.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal-box{background:#fff;border-radius:14px;padding:22px 20px;max-width:460px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(26,26,46,0.25);max-height:92vh;overflow-y:auto}
.modal-icon{font-size:34px;margin-bottom:8px}
.modal-text{font-size:14px;line-height:1.7;color:var(--ink);font-weight:600;margin-bottom:16px}
.modal-btn{border:none;border-radius:10px;padding:10px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.gate-tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:#f59e0b;border-radius:10px;padding:2px 10px;margin-bottom:8px}
.gate-q{font-size:15.5px;font-weight:700;line-height:2;text-align:left;background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:10px;padding:10px 12px;margin:6px 0 4px}
.slot-frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 6px}
.slot-frac .sl{min-width:150px;min-height:30px;border:2px dashed #a5b4fc;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:800;color:var(--ink3);display:flex;align-items:center;justify-content:center;line-height:1.4}
.slot-frac .sl.on{border-color:#f59e0b;background:#fffbeb;color:#b45309}
.slot-frac .sl.filled{border-style:solid;border-color:var(--green);color:#14532d;background:var(--green-ll)}
.slot-frac .bar{width:100%;height:2.5px;background:var(--ink);margin:4px 0}

/* 우리 반 그래프 버튼 · 칠판용 화면 */
#classFab{position:fixed;right:16px;bottom:16px;z-index:40;display:none;border:none;border-radius:24px;padding:11px 18px;font-size:14px;font-weight:800;cursor:pointer;background:var(--green);color:#fff;font-family:inherit;box-shadow:0 6px 18px rgba(22,163,74,.35)}
#classFab.show{display:block}
.class-box{max-width:720px;text-align:left}
#boardScreen{position:fixed;inset:0;z-index:70;background:#fff;display:none;flex-direction:column;padding:18px 24px;overflow-y:auto}
#boardScreen.show{display:flex}
.board-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.board-top h2{font-size:22px;color:var(--indigo)}
.cls-pick{display:flex;gap:5px;flex-wrap:wrap}
.cls-pick button{border:1.5px solid #d8ddfb;background:#fff;border-radius:16px;padding:4px 11px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.cls-pick button.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.sender-list{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.sender-list span{background:#eef0ff;color:var(--indigo);border-radius:12px;padding:2px 9px;font-size:12px;font-weight:800}
.board-count{font-size:20px;font-weight:800;color:var(--ink)}
</style>
</head>
<body>

<div class="hdr">
  <a href="index.html" id="hubBackLink" style="background:rgba(255,255,255,.2);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;">← 학습 선택 목록으로 돌아가기</a>
  <span class="hdr-title">확률의 개념</span>
  <button id="adminBtn" onclick="openAdminModal()" style="margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;cursor:pointer;font-family:inherit">🔐 관리자 모드</button>
</div>
<script>document.getElementById('hubBackLink').href = 'index.html' + location.search;</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const s = { cls:p.get('cls'), num:p.get('num'), name:p.get('name'), id:p.get('id')||'prob-concept' };
  window._hubStudent = s;
  let _db=null;
  try{
    firebase.initializeApp({
      apiKey: "AIzaSyDUFYrqaVL12fZ7ZhExVyyjLWSE_XJ_bHs",
      authDomain: "nd-deogi-math-hub.firebaseapp.com",
      projectId: "nd-deogi-math-hub",
      storageBucket: "nd-deogi-math-hub.firebasestorage.app",
      messagingSenderId: "414096731864",
      appId: "1:414096731864:web:a799f9450859c498b6b1ad"
    });
    _db = firebase.firestore();
  }catch(e){ console.warn('hub firebase init:', e); }
  window._hubDb = _db;
  let _reported=false;
  window._reportHubComplete = function(){
    if(_reported || !_db || !s.cls || !s.num) return;
    _reported=true;
    window._pendingQuizComplete = _db.collection('classStudents').doc(String(s.cls)).collection('students').doc(String(s.num))
      .set({ name: s.name||'', itemsOpened: firebase.firestore.FieldValue.arrayUnion(s.id), quizSolveCount: firebase.firestore.FieldValue.increment(1), lastActive: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true})
      .catch(err=>console.warn('hub complete log failed', err));
  };
  // 완료 기록이 서버에 닿기 전에 페이지를 떠나지 않도록 잠깐 기다렸다가 이동
  document.getElementById('hubBackLink').addEventListener('click', function(e){
    if(!window._pendingQuizComplete) return;
    e.preventDefault();
    const href = this.href;
    Promise.race([window._pendingQuizComplete.catch(()=>{}), new Promise(r=>setTimeout(r,800))]).then(()=>{ location.href = href; });
  });
})();
function finishToHub(){ document.getElementById('hubBackLink').click(); }
</script>

<script>
/* ════════════════════════════════
   공용 헬퍼
════════════════════════════════ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function pick1(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(lo,hi){ return lo+Math.floor(Math.random()*(hi-lo+1)); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function $(id){ return document.getElementById(id); }
function setFb(id, ok, msg){ const fb=$(id); fb.className='feedback '+(ok===true?'success':ok==='info'?'info':'error'); fb.innerHTML=msg; }
function parseCount(s){ const m=String(s||'').replace(/\s+/g,'').match(/^(\d+)(가지|개|번|명|장|회)?$/); return m?parseInt(m[1],10):null; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; }
function reduce(n,d){ const g=gcd(n,d)||1; return [n/g, d/g]; }
function sfrac(n,d){ return `<span class="sfrac"><span>${n}</span><span>${d}</span></span>`; }
function itA(){ return '<span class="it">A</span>'; }
function itp(){ return '<span class="it">p</span>'; }
function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
// 받침에 따라 조사 고르기 (낱말, 숫자 모두)
const NUM_BATCHIM = [true,true,false,true,false,false,true,true,true,false];   // 영 일 이 삼 사 오 육 칠 팔 구
function hasBatchim(w){
  if(typeof w==='number' || /^\d+$/.test(String(w))) return NUM_BATCHIM[Number(w)%10];   // 10, 20…은 '십'으로 끝나 받침 있음
  const c = String(w).charCodeAt(String(w).length-1);
  if(c>=0xAC00 && c<=0xD7A3) return (c-0xAC00)%28!==0;
  return false;
}
function josa(w, withB, noB){ return String(w) + (hasBatchim(w)?withB:noB); }
// 반올림하여 소수 아래 셋째 자리까지 (정수 연산으로 오차 없이)
function round3(h, n){ return Math.round(h*1000/n)/1000; }

/* ════════════════════════════════
   읽기 확인 · 찍기 방지 (앞 차시 파일들과 같은 방식)
   - readGate: 질문이 뜨고 읽을 시간도 안 지나 고르면 채점하지 않고 질문을 다시 보게 함
   - wrongLock: 틀리면 몇 초 동안 잠그고(틀릴수록 길게) 보기 순서를 다시 섞음
   - firstTry: 질문마다 첫 시도만 기록 → 완료 화면에 '한 번에 맞힌 질문' 표시
   - 틀려도 정답은 보여 주지 않음
════════════════════════════════ */
const GUARD = { on:true };            // 검증 스크립트·관리자 시연에서만 끔
const LOCK_SECS = [3,5,8];
const stat = { seen:{}, total:0, first:0 };
const shown = {}, tries = {};
function firstTry(qid, ok){ if(qid in stat.seen) return; stat.seen[qid]=ok; stat.total++; if(ok) stat.first++; }
// 빈칸 채점 결과(true/false/null)를 첫 시도에 기록하고, 통과했는지 돌려줌
function graded(qid, r){ if(r===false) firstTry(qid,false); return r===true; }
function flashRef(ref){
  const el = typeof ref==='string' ? $(ref) : ref;
  if(!el) return;
  el.classList.remove('reread'); void el.offsetWidth; el.classList.add('reread');
}
function markShown(qid, blockId){
  const el = $(blockId);
  const len = el ? el.textContent.replace(/\s+/g,'').length : 40;
  shown[qid] = { t:Date.now(), need:Math.min(4000, Math.max(1500, len*25)), block:blockId };
}
function readGate(qid, fbId){
  const s = shown[qid];
  if(!GUARD.on || !s || Date.now()-s.t >= s.need) return true;
  setFb(fbId,false,'✋ 잠깐! 질문을 끝까지 읽고 골라 봐요.');
  const kq = document.querySelector('#'+s.block+' .key-q, #'+s.block+' .gate-q');
  if(kq) flashRef(kq);
  return false;
}
function lockSecs(qid){
  tries[qid] = (tries[qid]||0)+1;
  return GUARD.on ? LOCK_SECS[Math.min(tries[qid],LOCK_SECS.length)-1] : 0;
}
// secs초 동안 안내문에 남은 시간을 보여 준 뒤 onDone. anchor가 화면에서 사라지면 멈춤
function lockTimer(secs, fbId, msg, what, anchor, onDone){
  if(!secs){ onDone(); return; }
  let left = secs;
  const paint = ()=>setFb(fbId,false,`${msg}<br><span class="lock-note">⏳ ${left}초 뒤에 ${what}</span>`);
  paint();
  const t = setInterval(()=>{
    if(!document.body.contains(anchor)){ clearInterval(t); return; }
    left--;
    if(left<=0){ clearInterval(t); onDone(); } else paint();
  }, 1000);
}
// o: {qid,row,fb,msg,refs,noShuffle,after}
function wrongLock(o){
  const row = $(o.row);
  const btns = [...row.querySelectorAll('button')];
  btns.forEach(b=>b.disabled=true);
  (o.refs||[]).forEach(flashRef);
  lockTimer(lockSecs(o.qid), o.fb, o.msg, '다시 고를 수 있어요', row, ()=>{
    btns.forEach(b=>{ b.disabled=false; b.classList.remove('wrong','active'); });
    if(!o.noShuffle) shuffle(btns).forEach(b=>b.parentNode.appendChild(b));
    setFb(o.fb,false,o.msg+'<br><span class="sub">다시 골라 보세요.</span>');
    if(o.after) o.after();
  });
}
// 객관식 한 문항 공통: 읽기 확인 → 첫 시도 기록 → 오답이면 잠금. 정답일 때만 true
function choiceGrade(q, btn, ok, wrongMsg, refs){
  if(btn.disabled || !readGate(q, q+'Fb')) return false;
  firstTry(q, ok);
  markChoice(q+'Row', btn, ok);
  if(!ok){ wrongLock({qid:q, row:q+'Row', fb:q+'Fb', msg:wrongMsg, refs}); return false; }
  return true;
}
const RETHINK = '❌ 다시 한 번 생각해 보세요!';
const UNREDUCED = '🔎 약분까지 해야 완벽한 정답이 됩니다!';

/* ════════════════════════════════
   입력칸: 숫자 · 소수(상대도수) · 분수(분자/분모 따로)
════════════════════════════════ */
function choiceCol(name, opts){
  return `<div class="choice-col" id="${name}Row">`+shuffle(opts).map(o=>`<button class="choice-btn" data-k="${o.key}" onclick="${name}Pick('${o.key}',this)">${o.label}</button>`).join('')+`</div>`;
}
function markChoice(rowId, btn, ok){
  document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.classList.remove('active','wrong'));
  btn.classList.add(ok?'correct':'wrong');
  if(ok) document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.disabled=true);
}
function fracHTML(p){ return `<span class="frac"><input class="blank" id="${p}N" inputmode="numeric"><span class="fbar"></span><input class="blank" id="${p}D" inputmode="numeric"></span>`; }
// 상대도수: 0.533, .533 모두 인정. 소수 아래 셋째 자리까지(0.52처럼 끝의 0은 생략 가능)이고 값이 같아야 정답
function decOk(raw, h, n){
  const s = String(raw||'').replace(/\s+/g,'');
  const m = s.match(/^(0|1)?(?:\.(\d{1,3}))?$/);
  if(!m || s==='' || s==='.') return false;
  return Number(s)===round3(h,n);
}
// 채점 항목 공통: {id,val} 숫자 / {dec:id,h,n} 상대도수 / {frac:p, ans:[n,d]} 분수
// 결과: true / false / null(빈칸) / 'unreduced'(값은 맞지만 약분 안 함 — 오답으로 치지 않음)
function checkItems(items, fbId, prefix){
  let empty=false, wrong=0, unred=false;
  const mark = (el, ok)=>{ el.classList.toggle('wrong',!ok); if(ok) el.classList.remove('wrong'); };
  for(const it of items){
    if(it.frac){
      const nE=$(it.frac+'N'), dE=$(it.frac+'D');
      const nr=nE.value.trim(), dr=dE.value.trim();
      if(nr===''||dr===''){ empty=true; continue; }
      const n=parseCount(nr), d=parseCount(dr);
      if(n===null||d===null||d===0||n*it.ans[1]!==d*it.ans[0]){ wrong++; mark(nE,false); mark(dE,false); continue; }
      mark(nE,true); mark(dE,true);
      if(gcd(n,d)!==1) unred=true;
    } else if(it.dec){
      const el=$(it.dec); const raw=el.value.trim();
      if(raw===''){ empty=true; continue; }
      const ok = decOk(raw, it.h, it.n); if(!ok) wrong++; mark(el, ok);
    } else {
      const el=$(it.id); const raw=el.value.trim();
      if(raw===''){ empty=true; continue; }
      const ok = parseCount(raw)===it.val; if(!ok) wrong++; mark(el, ok);
    }
  }
  if(wrong){ setFb(fbId,false,(prefix||'')+'❌ 빨간 칸을 다시 한 번 생각해 보세요!'); return false; }
  if(empty){ setFb(fbId,false,(prefix||'')+'빈칸을 모두 채워 주세요.'); return null; }
  if(unred){ setFb(fbId,'info',UNREDUCED); return 'unreduced'; }
  items.forEach(it=>{
    const els = it.frac ? [$(it.frac+'N'),$(it.frac+'D')] : [$(it.dec||it.id)];
    els.forEach(el=>{ el.classList.add('correct'); el.disabled=true; });
  });
  return true;
}

/* ════════════════════════════════
   그림: 동전 · 주사위 · 그래프 · 표
════════════════════════════════ */
function coinSVG(face, s){
  s = s||96;
  const front = face!=='T';
  return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${front?'#e5e7eb':'#d1d5db'}" stroke="#6b7280" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2 3"/>`+
    (face===null ? `<text x="50" y="60" text-anchor="middle" font-size="30" font-weight="800" fill="#6b7280">?</text>`
     : front ? `<circle cx="50" cy="42" r="14" fill="#9ca3af"/><path d="M28 74 Q50 52 72 74 Z" fill="#9ca3af"/><text x="50" y="92" text-anchor="middle" font-size="11" font-weight="800" fill="#374151">앞면</text>`
     : `<text x="50" y="60" text-anchor="middle" font-size="30" font-weight="800" fill="#4b5563">100</text><text x="50" y="80" text-anchor="middle" font-size="11" font-weight="800" fill="#374151">뒷면</text>`)+`</svg>`;
}
const PIPS = {1:[[.5,.5]],2:[[.28,.28],[.72,.72]],3:[[.27,.27],[.5,.5],[.73,.73]],4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],5:[[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]],6:[[.28,.24],[.72,.24],[.28,.5],[.72,.5],[.28,.76],[.72,.76]]};
function dieSVG(n,s){
  const r=s*0.085;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="display:block"><rect x="1.5" y="1.5" width="${s-3}" height="${s-3}" rx="${(s*.18).toFixed(1)}" fill="#fff" stroke="#1a1a2e" stroke-width="1.4"/>`+
    PIPS[n].map(([x,y])=>`<circle cx="${(x*s).toFixed(1)}" cy="${(y*s).toFixed(1)}" r="${(n===1?r*1.6:r).toFixed(1)}" fill="${n===1?'#dc2626':'#1a1a2e'}"/>`).join('')+`</svg>`;
}
// 상대도수 꺾은선 그래프. pts:[{x,y}] (x 오름차순), xMax: 가로축 끝
function graphSVG(pts, xMax, opt){
  opt = opt||{};
  const W=420, H=230, L=40, R=12, T=12, B=34, pw=W-L-R, ph=H-T-B;
  const X = x=>L+pw*x/xMax, Y = y=>T+ph*(1-y);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=10;i++){ const y=Y(i/10); s+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${i%5===0?'#c7cdf5':'#eef0fb'}" stroke-width="1"/><text x="${L-5}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#4a4a6a">${i===0?'0':i===10?'1':'0.'+i}</text>`; }
  const step = opt.step || (xMax<=300?30:xMax<=750?150:100);
  for(let x=step; x<=xMax+1e-9; x+=step){ const px=X(x); s+=`<line x1="${px}" y1="${T}" x2="${px}" y2="${T+ph}" stroke="#eef0fb"/><text x="${px}" y="${T+ph+13}" text-anchor="middle" font-size="9.5" fill="#4a4a6a">${x}</text>`; }
  s += `<line x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}" stroke="#4a4a6a" stroke-width="1.4"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="#4a4a6a" stroke-width="1.4"/>`;
  s += `<text x="${L+pw/2}" y="${H-3}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a2e">던진 횟수(번)</text><text x="11" y="${T+ph/2}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a2e" transform="rotate(-90 11 ${T+ph/2})">상대도수</text>`;
  if(pts.length){
    s += `<polyline fill="none" stroke="#4f46e5" stroke-width="${opt.thin?1.4:2}" stroke-linejoin="round" points="${pts.map(p=>X(p.x).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ')}"/>`;
    if(pts.length<=60) s += pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="#4f46e5" stroke="#fff" stroke-width="1"/>`).join('');
  } else s += `<text x="${L+pw/2}" y="${T+ph/2}" text-anchor="middle" font-size="12" font-weight="700" fill="#9090b0">아직 결과가 없어요</text>`;
  return s + `</svg>`;
}
// 도수 표: cols=[{n,h|null, q:true면 상대도수 칸을 '?'로}]
function freqTable(cols){
  return `<div class="tbl-wrap"><table class="ftbl"><tr><th>던진 횟수(번)</th>${cols.map(c=>`<th>${c.n}</th>`).join('')}</tr>
    <tr><th>앞면이 나온 횟수(번)</th>${cols.map(c=>c.h===null?'<td class="na">-</td>':`<td>${c.h}</td>`).join('')}</tr>
    <tr><th>상대도수</th>${cols.map(c=>c.h===null?'<td class="na">-</td>':c.q?'<td class="q">?</td>':`<td>${round3(c.h,c.n)}</td>`).join('')}</tr></table></div>`;
}

/* ════════════════════════════════
   우리 반 결과 (Firestore: coinByClass/{반}_{날짜} 문서 하나)
   - 학생은 30번을 다 던진 뒤 한 번만 기록: subs.{번호} = {h, n:30, at}
     (같은 번호로 다시 보내면 자기 기록만 덮어써서 부풀지 않음)
   - 문서 하나만 실시간으로 지켜봄 (반 학생 컬렉션 전체 listener는 사용량 폭증 위험이라 쓰지 않음)
════════════════════════════════ */
const STU = window._hubStudent || {};
const CLASS = { subs:{}, live:false, err:false, unsub:null, sent:false, hide150:true };
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hasClass(){ return !!(window._hubDb && STU.cls && STU.num); }
function classRef(cls){ return window._hubDb.collection('coinByClass').doc(`${cls}_${todayKey()}`); }
function readSubs(snap){
  const data = snap.exists ? (snap.data({serverTimestamps:'estimate'})||{}) : {};
  return data.subs || {};
}
function startClassListen(){
  if(!hasClass() || CLASS.unsub) return;
  try{
    CLASS.unsub = classRef(STU.cls).onSnapshot(snap=>{ CLASS.subs = readSubs(snap); CLASS.live = true; CLASS.err=false; refreshClassViews(); },
      err=>{ console.warn('class listen', err); CLASS.err = true; refreshClassViews(); });
  }catch(e){ console.warn(e); CLASS.err=true; }
}
function sendMyResult(){
  if(!hasClass()) return Promise.resolve(false);
  const FV = firebase.firestore.FieldValue;
  const nm = String(STU.name||'').trim().slice(0,12);
  return classRef(STU.cls).set({ subs:{ [String(STU.num)]:{ h:FLIP.heads(), n:30, nm, at:FV.serverTimestamp() } } }, {merge:true})
    .then(()=>true).catch(err=>{ console.warn('send', err); return false; });
}
// 보낸 순서대로 누적: [{x:누적 던진 횟수, h:누적 앞면, nm:보낸 학생 이름}]
function classSeries(subs){
  const arr = Object.entries(subs||{}).filter(([k,e])=>e && Number.isInteger(e.h) && e.h>=0 && e.h<=30)
    .map(([k,e])=>({ h:e.h, nm:(typeof e.nm==='string' && e.nm.trim()) ? e.nm.trim() : `${k}번`, t:(e.at && e.at.toMillis) ? e.at.toMillis() : 0 }))
    .sort((a,b)=>a.t-b.t);
  let H=0, N=0;
  return arr.map(e=>{ H+=e.h; N+=30; return {x:N, h:H, nm:e.nm}; });
}
function escHTML(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const CLASS_COLS = [30,150,300,450,600];
function classViewHTML(subs, opt){
  opt = opt||{};
  const ser = classSeries(subs);
  const at = n => { const p = ser.find(q=>q.x===n); return p ? p.h : null; };
  const cols = CLASS_COLS.map(n=>({n, h:at(n), q:opt.hide150 && n===150}));
  const last = ser[ser.length-1];
  if(last && !CLASS_COLS.includes(last.x)) cols.push({n:last.x, h:last.h, q:false});
  const xMax = Math.max(600, Math.ceil(((last&&last.x)||0)/150)*150);
  const status = opt.noLive ? '' : `<span class="live-tag">실시간</span> &nbsp;`;
  if(opt.err) return `<p class="lead" style="color:var(--red)">반 결과를 불러오지 못했어요. 잠시 뒤 다시 열어 보세요.</p>`;
  return `<div style="font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:4px">${status}결과를 보낸 친구: <b style="color:var(--indigo)">${ser.length}명</b> (모두 ${ser.length*30}번)</div>
    ${ser.length ? `<div class="sender-list">${ser.map(p=>`<span>${escHTML(p.nm)}</span>`).join('')}</div>` : ''}
    ${freqTable(cols)}
    <div class="graph-box">${graphSVG(ser.map(p=>({x:p.x, y:p.h/p.x})), xMax, {step:150})}</div>
    <p class="sub" style="margin-top:4px">친구들이 결과를 보낸 순서대로 30번씩 더해 가며 상대도수를 구했어요. 상대도수는 반올림하여 소수 아래 셋째 자리까지 나타냈어요.</p>`;
}
function refreshClassViews(){
  document.querySelectorAll('.class-live').forEach(el=>{ el.innerHTML = classViewHTML(CLASS.subs, {hide150:CLASS.hide150, err:CLASS.err}); });
  if($('classModal').classList.contains('show')) $('classModalBody').innerHTML = classViewHTML(CLASS.subs, {hide150:CLASS.hide150, err:CLASS.err});
  // 내가 보낸 기록이 초기화로 사라졌으면 다시 보낼 수 있게
  const rs = $('resendRow');
  if(rs) rs.style.display = (CLASS.sent && CLASS.live && !(String(STU.num) in CLASS.subs)) ? '' : 'none';
  if(window._afterClassUpdate) window._afterClassUpdate();
}
function openClassModal(){ $('classModalBody').innerHTML = classViewHTML(CLASS.subs, {hide150:CLASS.hide150}); $('classModal').classList.add('show'); }
function closeClassModal(){ $('classModal').classList.remove('show'); }

/* ════════════════════════════════
   단계 이동: 마친 단계는 언제든 다시 볼 수 있음 (안 한 단계는 잠김)
   각 단계의 왼쪽·오른쪽 내용을 따로 보관해서, 돌아가도 풀었던 상태 그대로 보임
════════════════════════════════ */
const STAGES = ['동전 30번 던지기','우리 반 결과','컴퓨터에게 맡기기','경우의 수로 구하기','확률의 뜻','문제 1 (MBTI)','문제풀이'];
const PRACTICE = 6;
let frontier = 0, viewing = 0;
const built = {};
let practiceScreen = 'scPractice';
function stageBox(side, i){
  const id = (side==='L'?'ls':'rs')+i;
  let el = $(id);
  if(!el){
    el = document.createElement('div'); el.id = id; el.style.display='none';
    (side==='L' ? $('actLeft') : $('actRight')).appendChild(el);
  }
  return el;
}
function R(html){ stageBox('R',frontier).innerHTML = html; }
function appendR(html){ stageBox('R',frontier).insertAdjacentHTML('beforeend', html); }
function L(html){ stageBox('L',frontier).innerHTML = html; }
function enterStage(i){
  frontier = i; built[i] = true;
  stageBox('L',i).innerHTML=''; stageBox('R',i).innerHTML='';
  showStage(i);
}
function showStage(i){
  if(!built[i]) return;
  viewing = i;
  if(i===PRACTICE){ showScreen(practiceScreen); renderStepper(); return; }
  showScreen('scAct');
  for(let k=0;k<PRACTICE;k++){ const l=$('ls'+k), r=$('rs'+k); if(l) l.style.display = k===i?'':'none'; if(r) r.style.display = k===i?'':'none'; }
  $('backBanner').innerHTML = i<frontier ? `<div class="back-banner">👀 지난 단계를 다시 보고 있어요. <button class="btn" onclick="showStage(frontier)">지금 하던 단계로 돌아가기 →</button></div>` : '';
  renderStepper();
}
function renderStepper(){
  $('stepper').innerHTML = STAGES.map((s,i)=>{
    const cls = i===viewing ? (i<frontier?'viewing':'active') : i===frontier ? 'active' : (built[i] ? 'done' : '');
    const can = built[i] && i!==viewing;
    return `<button class="st ${cls}" ${can?`onclick="showStage(${i})" style="cursor:pointer"`:'disabled'}>${i+1}. ${s}</button>`;
  }).join('');
}
function scrollToEl(id){ const el=$(id); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),60); }

/* ════════════════════════════════
   확인 팝업 — 맞혀야 닫힘. 틀리면 "다시 한 번 생각해 보세요!"만 (정답 공개 없음)
════════════════════════════════ */
let gateCfg = null;
function openGate(cfg){
  gateCfg = cfg;
  $('gateBox').innerHTML = `<div class="gate-tag">🔑 확인 문제</div><div class="modal-text" style="margin-bottom:6px">${cfg.title}</div>
    <div id="gateBody">${cfg.body||''}</div>
    <div class="feedback" id="gateFb"></div>
    ${cfg.btn?`<div class="btn-row"><button class="modal-btn" id="gateBtn" onclick="gateCheck()">확인</button></div>`:''}`;
  $('gateModal').classList.add('show');
  if(cfg.onOpen) cfg.onOpen();
  const inp = $('gateBox').querySelector('input');
  if(inp){ $('gateBox').querySelectorAll('input').forEach(x=>x.addEventListener('keydown', e=>{ if(e.key==='Enter') gateCheck(); })); try{ inp.focus(); }catch(e){} }
}
function closeGate(){ $('gateModal').classList.remove('show'); gateCfg = null; }
function gatePass(){ const done = gateCfg && gateCfg.onPass; setTimeout(()=>{ closeGate(); if(done) done(); }, 500); }
function gateCheck(){ if(gateCfg && gateCfg.check) gateCfg.check(); }

// 분수 자리 채우기 팝업 (①, ③): 분자 → 분모 차례로 보기에서 고름
function openSlotGate(o){
  const st = { step:0 };
  const render = ()=>{
    const part = st.step===0 ? '분자' : '분모';
    $('gateBody').innerHTML = `<div class="gate-q" id="sgQ" style="text-align:center">${o.lhs} =
      <span class="slot-frac"><span class="sl ${st.step===0?'on':'filled'}">${st.step===0?'분자 ?':o.num}</span><span class="bar"></span><span class="sl ${st.step===1?'on':''}">${st.step===1?'분모 ?':'분모'}</span></span></div>
      <p class="sub" style="margin:4px 0">노란 칸(<b>${part}</b>)에 들어갈 것을 골라 보세요.</p>
      <div class="choice-col" id="sgRow">${shuffle(o.opts).map(x=>`<button class="choice-btn" data-o="${x}" onclick="sgPick(this)">${x}</button>`).join('')}</div>`;
    markShown(o.qid+st.step, 'gateBody');
  };
  window.sgPick = btn=>{
    const q = o.qid+st.step;
    if(btn.disabled || !readGate(q,'gateFb')) return;
    const want = st.step===0 ? o.num : o.den;
    const ok = btn.dataset.o===want;
    firstTry(q, ok);
    markChoice('sgRow', btn, ok);
    if(!ok){ wrongLock({qid:q, row:'sgRow', fb:'gateFb', msg:RETHINK}); return; }
    if(st.step===0){ st.step=1; setFb('gateFb',true,'✅ 맞아요! 이번에는 분모예요.'); render(); return; }
    $('gateBody').querySelector('.slot-frac').innerHTML = `<span class="sl filled">${o.num}</span><span class="bar"></span><span class="sl filled">${o.den}</span>`;
    setFb('gateFb',true,'✅ 맞아요!');
    gatePass();
  };
  openGate({ title:o.title, onPass:o.onPass, onOpen:render });
}
// 팝업 ① 상대도수 (중1 복습)
function openGate1(onPass){
  openSlotGate({ qid:'gate1', title:'중학교 1학년 때 배운 상대도수를 떠올려 봐요.', lhs:'(앞면이 나온 횟수의 상대도수)',
    num:'앞면이 나온 횟수', den:'동전을 던진 횟수', opts:['앞면이 나온 횟수','동전을 던진 횟수','뒷면이 나온 횟수'], onPass });

const HALF_ANS = ['0.5','.5','1/2','½','0.50','0.500'];
function openGate2(onPass){

const FLIP = { res:[], heads(){ return this.res.filter(x=>x==='H').length; } };
function flipLeftHTML(){
  const n = FLIP.res.length, last = n ? FLIP.res[n-1] : null;
  const cells = [...Array(30)].map((_,i)=>{ const r=FLIP.res[i]; return `<span class="${r||''}">${r==='H'?'앞':r==='T'?'뒤':i+1}</span>`; }).join('');

    <div class="coin-stage"><button class="coin-btn" id="coinBtn" onclick="flipCoin()" ${n>=30?'disabled':''}>${coinSVG(last,110)}</button>
      <span class="flip-count">${n<30?`👆 동전을 눌러 던져요 (${n} / 30번)`:'✅ 30번을 모두 던졌어요!'}</span></div>

}

/* ════════════════════════════════

/* ════════════════════════════════
   3단계: 컴퓨터에게 맡기기 (공학 도구) → 팝업 ②
════════════════════════════════ */
const SIM = { cum:[] };   // cum[i] = (i+1)번째까지의 앞면 횟수
function simAdd(k){
  for(let i=0;i<k && SIM.cum.length<1000;i++){ const prev = SIM.cum.length ? SIM.cum[SIM.cum.length-1] : 0; SIM.cum.push(prev + (Math.random()<0.5?1:0)); }
}
function simH(n){ return SIM.cum[n-1]; }
let s2HideCol = true;
function simLeftHTML(){
  const n = SIM.cum.length;
  const cols = [...Array(10)].map((_,i)=>{ const c=(i+1)*100; return { n:c, h: n>=c ? simH(c) : null, q: s2HideCol && c===300 }; });
  const pts = []; for(let i=1;i<=n;i++) pts.push({x:i, y:SIM.cum[i-1]/i});
  return `<div class="exp-head"><span class="exp-badge">공학 도구</span><span>컴퓨터로 한 개의 동전을 여러 번 던지는 실험을 한다.</span></div>
    <div class="sim-btns"><button class="btn btn-soft" id="simBtn100" onclick="simGo(100)" ${n>=1000?'disabled':''}>🪙 100번 더 던지기</button><button class="btn" id="simBtnAll" onclick="simGo(1000)" ${n>=1000?'disabled':''}>🪙 1000번까지 한꺼번에</button></div>
    <div style="text-align:center;font-size:13px;font-weight:800;color:var(--ink2)">지금까지 던진 횟수: ${n}번</div>
    ${freqTable(cols)}
    <div class="graph-box">${graphSVG(pts, 1000, {step:100, thin:true})}</div>
    <p class="sub">상대도수는 반올림하여 소수 아래 셋째 자리까지 나타냈어요.</p>`;
}
function simGo(k){
  if(SIM.cum.length>=1000) return;
  simAdd(k);
  stageBox('L',2).innerHTML = simLeftHTML();
  if(SIM.cum.length>=1000) s2Ready();
}
function stage2(){
  enterStage(2); closeGate();
  L(simLeftHTML());
  R(`<div class="panel-title"><span class="step-badge">3</span>컴퓨터에게 맡기기</div>
    <p class="lead">사람이 1000번을 던지기는 힘들지만, 컴퓨터는 순식간에 던질 수 있어요.</p>
    <div class="qblock" style="border-top:none" id="s2aBlock">
      <p class="key-q task">왼쪽 버튼을 눌러 동전을 <span class="em">1000번</span>까지 던져 보자.</p>
      <p class="sub">100번씩 던지면 그래프가 조금씩 그려지는 모습을 볼 수 있어요.</p>

}
function s2Ready(){
  if($('s2bBlock')) return;
  appendR(`<div class="qblock" id="s2bBlock">
    <p class="lead">컴퓨터가 300번 던졌을 때 앞면은 <b>${simH(300)}번</b> 나왔어요.</p>
    <p class="key-q task">던진 횟수가 300번일 때, 앞면이 나온 횟수의 <span class="em">상대도수</span>를 구해 보자.</p>
    <p class="sub">반올림하여 소수 아래 셋째 자리까지 나타내요. (소수 아래 넷째 자리에서 반올림해요.) 왼쪽 표의 <b style="color:#b45309">?</b> 칸이에요.</p>

    <div class="feedback" id="s2bFb"></div>

  scrollToEl('s2bBlock');
}
function s2bCheck(){
  if($('s2bBtn').disabled) return;
  if(!graded('s2b', checkItems([{dec:'s2b', h:simH(300), n:300}], 's2bFb'))) return;
  firstTry('s2b', true);
  $('s2bBtn').disabled = true;

  setFb('s2bFb',true,'✅ 맞아요!');
  appendR(`<div class="qblock" id="s2cBlock">
    <p class="key-q">왼쪽 그래프를 보면, 던진 횟수가 많아질수록 상대도수는 <span class="em">어떻게 되나요</span>?</p>
    ${choiceCol('s2c',[

  if(!choiceGrade('s2d', btn, k==='near', RETHINK+'<br><span class="sub">왼쪽 표의 상대도수들이 모두 0.5인지 살펴봐요.</span>', ['ls2'])) return;

    <p class="key-q">다음에 던질 때, 뒷면이 나올 가능성이 <span class="em">더 클까요</span>?</p>

/* ════════════════════════════════
   문제 만들기 — 레벨1(한 가지 실험) · 레벨2(곱의 법칙으로 모든 경우의 수)
   모든 문제는 {text, p:[분자,분모] 기약분수, ...}; 확률이 0이나 1인 사건은 만들지 않음
════════════════════════════════ */
const DICE_EV = [
  ['짝수의 눈', v=>v%2===0], ['홀수의 눈', v=>v%2===1], ['3의 배수의 눈', v=>v%3===0], ['4 이상의 눈', v=>v>=4],
  ['2 이하의 눈', v=>v<=2], ['6의 약수의 눈', v=>6%v===0], ['소수의 눈', isPrime], ['5 이상의 눈', v=>v>=5], ['4의 약수의 눈', v=>4%v===0], ['3 이하의 눈', v=>v<=3]
];
function genDice(){
  const [nm,f] = pick1(DICE_EV);
  const fav = [1,2,3,4,5,6].filter(f).length;
  return { gen:'dice', text:`한 개의 주사위를 던질 때, ${josa(nm,'이','가')} 나올 확률을 구하시오.`, total:6, fav, p:reduce(fav,6) };
}
function genCards(){
  const N = pick1([10,12,15,20]);
  const k = randInt(3, N-3);
  const evs = [['짝수', v=>v%2===0], ['홀수', v=>v%2===1], ['3의 배수', v=>v%3===0], ['4의 배수', v=>v%4===0], ['5의 배수', v=>v%5===0], ['소수', isPrime], [`${k} 이하의 수`, v=>v<=k]];
  const [nm,f] = pick1(evs);
  const fav = [...Array(N)].map((_,i)=>i+1).filter(f).length;
  return { gen:'cards', text:`1부터 ${N}까지의 자연수가 각각 하나씩 적힌 ${N}장의 카드 중에서 한 장을 뽑을 때, ${josa(nm,'이','가')} 적힌 카드가 나올 확률을 구하시오.`, total:N, fav, p:reduce(fav,N) };
}
const COLORS = ['빨간','파란','노란'];
function genBag(){
  const cnt = [randInt(2,6), randInt(2,6), pick1([0,0,randInt(1,4)])];
  const kinds = cnt[2] ? 3 : 2;
  const ci = randInt(0, kinds-1);
  const total = cnt[0]+cnt[1]+cnt[2];
  const list = [...Array(kinds)].map((_,i)=>`${COLORS[i]} 공 ${cnt[i]}개`).join(', ');
  return { gen:'bag', text:`주머니 속에 ${list}가 들어 있다. 이 중에서 공 한 개를 꺼낼 때, ${COLORS[ci]} 공이 나올 확률을 구하시오.`, total, fav:cnt[ci], p:reduce(cnt[ci],total) };
}
function genClassP(){
  const m = randInt(8,16), f = randInt(8,16);
  const askF = Math.random()<0.5;
  return { gen:'classP', text:`어느 반 학생은 남학생 ${m}명, 여학생 ${f}명이다. 이 반 학생 중에서 한 명을 임의로 뽑을 때, ${askF?'여학생':'남학생'}이 뽑힐 확률을 구하시오.`, total:m+f, fav:askF?f:m, p:reduce(askF?f:m, m+f) };
}
// 방식2: 확률과 전체 개수를 주고 개수를 구함 (주어진 값 ↔ 미지수 바꿔치기). 약분이 되는 경우만 (그대로 읽으면 안 되게)
function genBagRev(){
  let n, c;
  do { n = randInt(8,20); c = randInt(2,n-2); } while(gcd(n,c)===1);
  const p = reduce(c,n);
  return { gen:'bagRev', rev:true, unit:'개', what:'빨간 공의 개수', total:n, fav:c, p,
    text:`주머니 속에 빨간 공과 파란 공이 모두 ${n}개 들어 있다. 이 중에서 공 한 개를 꺼낼 때 빨간 공이 나올 확률이 ${sfrac(p[0],p[1])}이다. 빨간 공은 몇 개인지 구하시오.` };
}
function genClassRev(){
  let n, c;
  do { n = randInt(20,32); c = randInt(6,n-6); } while(gcd(n,c)===1);
  const p = reduce(c,n);
  return { gen:'classRev', rev:true, unit:'명', what:'여학생 수', total:n, fav:c, p,
    text:`어느 반 학생 ${n}명 중에서 한 명을 임의로 뽑을 때 여학생이 뽑힐 확률이 ${sfrac(p[0],p[1])}이다. 이 반의 여학생은 몇 명인지 구하시오.` };
}
// 레벨2
function genCoin2(){
  const [nm,fav] = pick1([['둘 다 앞면이 나올',1],['둘 다 뒷면이 나올',1],['서로 다른 면이 나올',2],['서로 같은 면이 나올',2]]);
  return { gen:'coin2', text:`서로 다른 동전 두 개를 동시에 던질 때, ${nm} 확률을 구하시오.`, total:4, fav, p:reduce(fav,4),
    hint:'① 두 동전의 결과를 (첫째 동전, 둘째 동전)처럼 짝지어 나타내요.<br>② 모든 경우의 수는 곱의 법칙으로 구해요. 동전 하나에서 나올 수 있는 면은 몇 가지일까요?<br>③ 조건에 맞는 경우를 하나씩 적어 세어 봐요.' };
}
function genCoinDie(){
  const face = pick1(['앞면','뒷면']);
  const [nm,f] = pick1(DICE_EV);
  const fav = [1,2,3,4,5,6].filter(f).length;
  return { gen:'coinDie', text:`동전 한 개와 주사위 한 개를 동시에 던질 때, 동전은 ${josa(face,'이','가')} 나오고 주사위는 ${josa(nm,'이','가')} 나올 확률을 구하시오.`, total:12, fav, p:reduce(fav,12),
    hint:'① 동전의 결과와 주사위의 결과를 짝지어 생각해요.<br>② 모든 경우의 수는 (동전의 경우의 수) × (주사위의 경우의 수)로 구해요.<br>③ 사건이 일어나는 경우의 수도 곱의 법칙으로 구할 수 있어요. 동전 조건에 맞는 면은 몇 가지, 주사위 조건에 맞는 눈은 몇 가지일까요?' };
}
function genDice2(){
  const kind = pick1(['sum','sum','diff','same']);
  let nm, f;
  if(kind==='sum'){ const k = randInt(3,11); nm = `나오는 눈의 수의 합이 ${k}일`; f=(a,b)=>a+b===k; }
  else if(kind==='diff'){ const k = randInt(1,4); nm = `나오는 눈의 수의 차가 ${k}일`; f=(a,b)=>Math.abs(a-b)===k; }
  else { nm = '두 눈의 수가 서로 같을'; f=(a,b)=>a===b; }
  let fav=0; for(let a=1;a<=6;a++) for(let b=1;b<=6;b++) if(f(a,b)) fav++;
  return { gen:'dice2', grid:true, text:`서로 다른 두 개의 주사위를 동시에 던질 때, ${nm} 확률을 구하시오.${kind==='diff'?'<br><span class="sub">(두 수의 차는 큰 수에서 작은 수를 뺀 값이에요.)</span>':''}`, total:36, fav, p:reduce(fav,36),
    hint:'① 두 주사위의 눈을 순서쌍 (첫째 주사위의 눈, 둘째 주사위의 눈)으로 나타내요. 왼쪽 연습장의 표를 써도 좋아요.<br>② 모든 경우의 수는 곱의 법칙으로 구해요.<br>③ 조건에 맞는 순서쌍에 동그라미를 쳐서 세어 봐요.' };
}
function genCards2(){
  let ds, nums, total, cand;
  do {
    const zero = Math.random()<0.5;
    ds = pickN([1,2,3,4,5,6,7,8,9], randInt(3,4)).sort((a,b)=>a-b);
    if(zero) ds = [0, ...ds];
    nums = []; ds.forEach((x,i)=>ds.forEach((y,j)=>{ if(i!==j && x!==0) nums.push(x*10+y); }));
    total = nums.length;
    const tens = Math.floor(pick1(nums)/10)*10;
    const evs = [['짝수일', n=>n%2===0], ['홀수일', n=>n%2===1], [`${tens} 이상일`, n=>n>=tens]];
    cand = evs.map(([nm,f])=>({nm, fav:nums.filter(f).length})).filter(e=>e.fav>0 && e.fav<total);
  } while(!cand.length);
  const e = pick1(cand);
  const last = ds[ds.length-1];
  return { gen:'cards2', text:`숫자 ${ds.slice(0,-1).join(', ')}, ${josa(last,'이','가')} 각각 하나씩 적힌 ${ds.length}장의 카드 중에서 두 장을 동시에 뽑아 두 자리 자연수를 만들 때, 그 수가 ${e.nm} 확률을 구하시오.`, total, fav:e.fav, p:reduce(e.fav,total), digits:ds,
    hint:`① 십의 자리 → 일의 자리 순서로 생각해요.${ds[0]===0?' 0은 십의 자리에 올 수 없어요.':''}<br>② 만들 수 있는 두 자리 자연수의 개수는 곱의 법칙으로 구해요.<br>③ ${e.nm.startsWith('짝')||e.nm.startsWith('홀')?'짝수인지 홀수인지는 일의 자리 숫자를 보면 알 수 있어요.':'십의 자리 숫자를 보면 알 수 있어요.'} 조건에 맞는 수를 직접 적어 세어 봐요.` };
}
function genRps(){
  const [nm,fav] = pick1([['A가 이길',3],['B가 이길',3],['두 사람이 비길',3]]);
  return { gen:'rps', text:`두 사람 A, B가 가위바위보를 한 번 할 때, ${nm} 확률을 구하시오.`, total:9, fav, p:reduce(fav,9),
    hint:'① 두 사람이 내는 것을 (A가 낸 것, B가 낸 것)처럼 짝지어 나타내요.<br>② 모든 경우의 수는 곱의 법칙으로 구해요. 한 사람이 낼 수 있는 것은 몇 가지일까요?<br>③ 조건에 맞는 경우를 하나씩 적어 세어 봐요.' };
}
const GEN = { dice:genDice, cards:genCards, bag:genBag, classP:genClassP, bagRev:genBagRev, classRev:genClassRev, coin2:genCoin2, coinDie:genCoinDie, dice2:genDice2, cards2:genCards2, rps:genRps };

/* ════════════════════════════════
   7단계: 문제풀이 (시작 전 팝업 ④)
   레벨1: 한 가지 실험 — 방식1(확률 구하기) 2문제 + 방식2(확률을 주고 개수 구하기) 2문제
   레벨2: 곱의 법칙으로 모든 경우의 수를 구하는 문제 4문제 (힌트·계산 연습장 있음)
   통과: 4문제 중 3문제 이상 '첫 시도'에 정답 (힌트를 써도 인정). 틀리면 정답 공개 없이 숫자만 바뀐 새 문제
════════════════════════════════ */
const LEVELS = [ { label:'레벨1 · 확률 구하기', passNeeded:3 }, { label:'레벨2 · 곱의 법칙과 함께', passNeeded:3 } ];
const pst = { levelIdx:0, idx:0, correct:0, order:[], firstTry:true, passedLevels:{} };
let practiceOpened = false;
function goToPractice(){
  if(practiceOpened){ startLevel(0); return; }
  openGate4(()=>{ practiceOpened = true; startLevel(0); });
}
function updateLevelTabs(){
  $('levelTabs').innerHTML = LEVELS.map((lv,i)=>`<div class="level-tab ${i===pst.levelIdx?'active':(pst.passedLevels[i]?'done':'')}">${lv.label}</div>`).join('');
}
function startLevel(levelIdx){
  closeGate();
  frontier = PRACTICE; built[PRACTICE] = true; viewing = PRACTICE; practiceScreen = 'scPractice';
  pst.levelIdx = levelIdx; pst.idx=0; pst.correct=0;
  if(levelIdx===0) pst.order = shuffle([pick1(['dice','cards']), pick1(['bag','classP']), 'bagRev', 'classRev']).map(g=>GEN[g]());
  else pst.order = shuffle([...pickN(['coin2','coinDie','rps'],2), 'dice2', 'cards2']).map(g=>GEN[g]());
  showScreen('scPractice'); renderStepper(); updateLevelTabs(); renderPQuestion();
}
function makeVariant(q){
  let v; do { v = GEN[q.gen](); } while(v.text===q.text);
  v.variant = true;
  return v;
}
function diceGridHTML(){
  let s = '<table class="ftbl" style="font-size:11px"><tr><th></th>'+[1,2,3,4,5,6].map(b=>`<th>${b}</th>`).join('')+'</tr>';
  for(let a=1;a<=6;a++){ s += `<tr><th>${a}</th>`+[1,2,3,4,5,6].map(b=>`<td style="min-width:36px;padding:3px">(${a}, ${b})</td>`).join('')+'</tr>'; }
  return `<div class="tbl-wrap">${s}</table></div><p class="sub" style="text-align:center">세로: 첫째 주사위의 눈, 가로: 둘째 주사위의 눈</p>`;
}
function renderPQuestion(keepFail){
  const lv = LEVELS[pst.levelIdx], q = pst.order[pst.idx];

  $('pgProgress').textContent = `${lv.label} · ${pst.idx+1} / ${pst.order.length}`;
  const banner = q.variant ? `<div class="variant-banner">🔁 숫자가 바뀐 새 문제예요. 이 문제를 맞혀야 다음으로 넘어가요. <span class="sub">(점수에는 들어가지 않아요.)</span></div>` : '';
  let body;

    $('pgPen').style.display='none';
    $('pgHintBox').innerHTML = `<div class="hint-card"><div style="font-weight:800;margin-bottom:6px">🔎 확인할 것</div>
      ① 각 경우가 일어날 가능성이 모두 같은지 확인해요.<br>② 일어날 수 있는 모든 경우의 수를 구해요.<br>③ 사건이 일어나는 경우의 수를 구해요.<br>④ ${itp()} = ${sfrac('(사건이 일어나는 경우의 수)','(모든 경우의 수)')}</div>`;
    if(q.rev){
      body = `<div class="prob-box">${q.text}</div>
        <p class="key-q task">빈칸에 알맞은 수를 써 보자.</p>
        <div class="fline">${sfrac(`(${q.what})`, q.total)} = ${sfrac(q.p[0],q.p[1])} 이므로 <span class="lab">${q.what}</span>: <input class="blank" id="pgc"> ${q.unit}</div>`;
    } else {
      body = `<div class="prob-box">${q.text}</div>
        <p class="key-q task">빈칸에 알맞은 수를 써 보자.</p>
        <div class="count-row">일어날 수 있는 모든 경우의 수: <input class="blank" id="pga"></div>
        <div class="count-row">사건이 일어나는 경우의 수: <input class="blank" id="pgb"></div>
        <div class="fline"><span class="lab">확률</span> = ${fracHTML('pgf')}</div>`;
    }
  } else {
    $('pgHintBox').innerHTML = '';
    $('pgPen').style.display='';
    $('pgRef').innerHTML = q.grid ? diceGridHTML() : '';
    body = `<div class="prob-box">${q.text}</div>
      <p class="key-q task">빈칸에 알맞은 수를 써 보자.</p>
      <p class="sub">왼쪽 계산 연습장에 펜으로 직접 적으며 풀어도 좋아요.</p>
      <div class="count-row">일어날 수 있는 모든 경우의 수: <input class="blank" id="pga"></div>
      <div class="count-row">사건이 일어나는 경우의 수: <input class="blank" id="pgb"></div>
      <div class="fline"><span class="lab">확률</span> = ${fracHTML('pgf')}</div>
      <div class="btn-row"><button class="btn btn-soft" id="pgHintBtn" onclick="showHint()">💡 힌트 보기</button></div>
      <div id="pgHint"></div>`;
  }
  $('pgArea').innerHTML = `${banner}${body}
    <div class="btn-row"><button class="btn btn-check" id="pgBtn" onclick="pgCheck()">확인</button></div>
    <div class="feedback" id="pgFb"></div><div class="btn-row" id="pgNextRow"></div>`;
  if(pst.levelIdx===1){ drawBindOnce('pg'); drawSetupCanvas('pg'); }
}
function showHint(){
  const q = pst.order[pst.idx];
  $('pgHint').innerHTML = `<div class="hint-box">💡 <b>힌트</b> <span class="sub">(힌트를 봐도 점수에는 영향이 없어요.)</span><br>${q.hint}</div>`;
  $('pgHintBtn').disabled = true;
}
function pgItems(q){
  if(q.rev) return [{id:'pgc', val:q.fav}];
  return [{id:'pga', val:q.total}, {id:'pgb', val:q.fav}, {frac:'pgf', ans:q.p}];
}
function pgCheck(){
  if($('pgBtn').disabled) return;   // 이미 통과한 문제는 다시 채점하지 않음
  const q = pst.order[pst.idx];
  const r = checkItems(pgItems(q), 'pgFb');
  if(r===false){
    // 정답은 보여 주지 않고, 잠깐 뒤 숫자만 바뀐 새 문제로
    pst.firstTry = false;
    $('pgArea').querySelectorAll('input').forEach(x=>x.disabled=true); $('pgBtn').disabled = true;
    lockTimer(lockSecs('pg'+pst.levelIdx+'-'+pst.idx), 'pgFb', RETHINK, '숫자가 바뀐 새 문제가 나와요', $('pgBtn'), ()=>{
      pst.order[pst.idx] = makeVariant(q);
      renderPQuestion(true);
    });
    return;
  }
  if(r!==true) return;
  $('pgBtn').disabled = true;
  if(pst.firstTry) pst.correct++;
  setFb('pgFb',true, pst.firstTry ? '✅ 정답이에요!' : '✅ 맞아요! (다시 풀어서 맞힌 문제는 점수에 들어가지 않아요.)');
  $('pgNextRow').innerHTML = `<button class="btn" id="pgNextBtn" onclick="this.disabled=true;pgNext()">${pst.idx<pst.order.length-1?'다음 문제 →':'결과 보기 →'}</button>`;
}
function pgNext(){ pst.idx++; if(pst.idx < pst.order.length) renderPQuestion(); else levelFinish(); }
function levelFinish(){
  const lv = LEVELS[pst.levelIdx];
  const pass = pst.correct >= lv.passNeeded;
  if(pass) pst.passedLevels[pst.levelIdx] = true;
  updateLevelTabs(); showScreen('scLevelResult'); practiceScreen = 'scLevelResult';
  $('lrIcon').textContent = pass?'🎉':'💪';
  $('lrTitle').textContent = pass ? `${lv.label.split(' ·')[0]} 통과!` : `${lv.label.split(' ·')[0]} 아쉬워요`;
  $('lrScore').textContent = `${pst.correct} / ${pst.order.length}`;
  $('lrMsg').textContent = pass ? '잘했어요! 다음으로 넘어가 볼까요?' : `한 번에 맞힌 문제가 ${lv.passNeeded}개 이상이어야 통과해요. 다시 도전해 볼까요?`;
  $('lrRetryBtn').style.display = pass ? 'none' : '';
  $('lrNextBtn').style.display = pass ? '' : 'none';
  $('lrNextBtn').textContent = (pst.levelIdx < LEVELS.length-1) ? '다음 레벨 →' : '결과 보기 →';
}
function lrRetry(){ startLevel(pst.levelIdx); }
function lrNext(){
  if(pst.levelIdx < LEVELS.length-1){ startLevel(pst.levelIdx+1); }
  else {
    showScreen('scDone'); practiceScreen = 'scDone';
    $('doneStat').innerHTML = stat.total ? `탐구하면서 한 번에 맞힌 질문: ${stat.first} / ${stat.total}` : '';
    if(window._reportHubComplete) window._reportHubComplete();
  }
}

/* ════════════════════════════════
   계산 연습장 (필기 캔버스) — 삼각형의_닮음_조건_형성평가.html 방식 재사용
════════════════════════════════ */
const drawSt = {};
function drawGetSt(key){ if(!drawSt[key]) drawSt[key]={ color:'#1a1a2e', erasing:false, drawing:false, lastX:0, lastY:0, mode:'pen' }; return drawSt[key]; }
// 펜/마우스 모드 전환 — 휴대폰에서 연습장 위로 화면을 움직이고 싶을 때는 마우스 모드로 바꿈
function drawSetMode(key, mode){
  const d = drawGetSt(key);
  d.mode = mode;
  document.getElementById(key+'PenBtn').classList.toggle('active', mode==='pen');
  document.getElementById(key+'PointerBtn').classList.toggle('active', mode==='pointer');
  document.getElementById(key+'Ink').style.pointerEvents = (mode==='pointer') ? 'none' : 'auto';
}
function drawSetupCanvas(key){
  const wrap = document.getElementById(key+'DrawWrap');
  const canvas = document.getElementById(key+'Ink');
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width*dpr));
  canvas.height = Math.max(1, Math.round(rect.height*dpr));
  canvas.style.width = rect.width+'px';
  canvas.style.height = rect.height+'px';
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
  drawUpdateCursor(key);
}
function drawCanvasPoint(key, evt){
  const canvas = document.getElementById(key+'Ink');
  const rect = canvas.getBoundingClientRect();
  return { x: evt.clientX-rect.left, y: evt.clientY-rect.top };
}
const drawBound = {};
function drawBindOnce(key){
  if(drawBound[key]) return;
  drawBound[key]=true;
  const canvas = document.getElementById(key+'Ink');
  const d = drawGetSt(key);
  canvas.addEventListener('pointerdown', evt=>{
    d.drawing=true; canvas.setPointerCapture(evt.pointerId);
    const p=drawCanvasPoint(key,evt); d.lastX=p.x; d.lastY=p.y;
  });
  canvas.addEventListener('pointermove', evt=>{
    if(!d.drawing) return;
    const p=drawCanvasPoint(key,evt);
    const ctx=canvas.getContext('2d');
    if(!ctx) return;
    ctx.beginPath(); ctx.moveTo(d.lastX,d.lastY); ctx.lineTo(p.x,p.y);
    if(d.erasing){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=24; }
    else{ ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=d.color; ctx.lineWidth=3; }
    ctx.stroke();
    d.lastX=p.x; d.lastY=p.y;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(evtName=>canvas.addEventListener(evtName, ()=>{ d.drawing=false; }));
  window.addEventListener('resize', ()=>{
    if(document.getElementById('scPractice').classList.contains('active') && pst.levelIdx===1) drawSetupCanvas(key);
  });
  drawSetMode(key, d.mode);
}
function drawSelectColor(key, color, btn){
  const d=drawGetSt(key); d.color=color; d.erasing=false; d.lastColorBtn=btn;
  document.querySelectorAll('#scPractice .color-swatch').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById(key+'EraserBtn').classList.remove('active');
  drawUpdateCursor(key);
}
function drawToggleEraser(key){
  const d=drawGetSt(key);
  if(d.erasing){
    d.erasing=false;
    document.getElementById(key+'EraserBtn').classList.remove('active');
    const btn = d.lastColorBtn || document.querySelector('#scPractice .color-swatch');
    if(btn) btn.classList.add('active');
  } else {
    d.erasing=true;
    document.querySelectorAll('#scPractice .color-swatch').forEach(b=>b.classList.remove('active'));
    document.getElementById(key+'EraserBtn').classList.add('active');
  }
  drawUpdateCursor(key);
}
function drawMakeCursorURL(draw, size){
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  const cx = c.getContext('2d'); if(!cx) return '';
  draw(cx, size);
  return c.toDataURL('image/png');
}
function drawUpdateCursor(key){
  const canvas = document.getElementById(key+'Ink');
  if(!canvas) return;
  const d = drawGetSt(key);
  if(d.erasing){
    const size=26, r=11;
    const url = drawMakeCursorURL((cx)=>{
      cx.beginPath(); cx.arc(size/2,size/2,r,0,Math.PI*2);
      cx.fillStyle='rgba(255,255,255,0.4)'; cx.fill();
      cx.lineWidth=2; cx.strokeStyle='#333a4d'; cx.stroke();
    }, size);
    canvas.style.cursor = url ? `url(${url}) ${size/2} ${size/2}, cell` : 'cell';
  } else {
    const size=34;
    const url = drawMakeCursorURL((cx)=>{
      cx.save(); cx.translate(18,18); cx.rotate(135*Math.PI/180);
      cx.fillStyle=d.color; cx.fillRect(-4,-14,8,16);
      cx.fillStyle='#f4c98c'; cx.beginPath(); cx.moveTo(-4,2); cx.lineTo(4,2); cx.lineTo(0,11); cx.closePath(); cx.fill();
      cx.fillStyle='#333a4d'; cx.beginPath(); cx.moveTo(-1.4,7.5); cx.lineTo(1.4,7.5); cx.lineTo(0,11); cx.closePath(); cx.fill();
      cx.restore();
    }, size);
    canvas.style.cursor = url ? `url(${url}) 10 10, crosshair` : 'crosshair';
  }
}

/* ════════════════════════════════

/* ════════════════════════════════
   관리자 모드 (SHA-256 해시 비교 — 가벼운 잠금일 뿐, 보안 장치 아님)
════════════════════════════════ */
const ADMIN_HASH = 'fb9e692b52ad41cd666f83c8175df90569d48192d531e9c94285929bc116891a';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function openAdminModal(){ $('adminPwInput').value=''; $('adminPwErr').textContent=''; $('adminPwModal').classList.add('show'); $('adminPwInput').focus(); }
async function checkAdminPassword(){
  const v = $('adminPwInput').value;
  let ok=false;
  try{ ok = (await sha256Hex(v)) === ADMIN_HASH; }
  catch(e){ $('adminPwErr').textContent='이 브라우저에서는 관리자 모드를 쓸 수 없어요.'; return; }
  if(!ok){ $('adminPwErr').textContent='비밀번호가 틀렸어요.'; return; }
  $('adminPwModal').classList.remove('show');
  showAdminPanel();
}
function showAdminPanel(){
  const btn = (label, fn) => `<button class="modal-btn" style="padding:2px 8px;font-size:10.5px" onclick="${fn}">${label}</button>`;
  $('adminPanelBody').innerHTML =
    `<div class="btn-row" style="justify-content:flex-start;margin:0 0 6px">${btn('📺 칠판용 화면','openBoard()')}</div>`+
    '<div class="btn-row" style="justify-content:flex-start;margin:0 0 8px">'+
      STAGES.map((s,i)=>btn(`${i+1}.${s}`,`adminGo(${i})`)).join('')+btn('레벨2','adminGo(7)')+btn('팝업 통과','adminPassGate()')+
    '</div>'+
    '<div><strong>반 결과 저장</strong>: Firestore <code>coinByClass/{반}_{날짜}</code> 문서 하나 (학생은 30번을 다 던진 뒤 한 번만 보냄, 같은 번호는 덮어씀). 칠판용 화면에서 반별 초기화.</div>'+
    '<div><strong>숫자 칸</strong>: 6 (= 6가지 = 6개 = 6번 = 6명 = 6장 = 6회, 띄어쓰기 무시)</div>'+
    '<div><strong>상대도수 칸</strong>: 반올림하여 소수 아래 셋째 자리까지. 0.533 = .533 인정, 끝의 0은 생략 가능(0.52 = 0.520). 0.53·0.5333처럼 자리가 다르면 오답</div>'+
    '<div><strong>분수 칸</strong>: 분자·분모 따로. 값이 같고 기약분수여야 정답. 약분 전 분수(예: 3/6)는 오답이 아니라 "약분까지 해야 완벽한 정답이 됩니다!" 안내 후 다시 입력</div>'+
    '<div><strong>1단계</strong>: 앞면 횟수(직접 던진 결과) / <b>팝업①</b> 분자=앞면이 나온 횟수, 분모=동전을 던진 횟수 / 상대도수 / 적게 던지면 0.5와 다를 수 있음</div>'+
    '<div><strong>2단계</strong>: 먼저 보낸 5명(150번) 칸의 상대도수 — 5명이 모이기 전에는 질문 없이 다음 단계로 갈 수 있음</div>'+
    '<div><strong>3단계</strong>: 300번 칸 상대도수 / 0.5에 가까워짐 / 정확히 0.5는 아님 / 5번 연속 앞면 뒤에도 가능성 같음 / <b>팝업②</b> 0.5 (.5, 1/2도 인정)</div>'+
    '<div><strong>4단계</strong>: 1, 2, 1/2 / 가능성이 같기 때문</div>'+
    '<div><strong>5단계</strong>: <b>팝업③</b> 분자=사건 A가 일어나는 경우의 수, 분모=모든 경우의 수 / 스스로 확인 1/6</div>'+
    '<div><strong>6단계</strong>: T가 있는 학생 ENTP, ESTJ, ENTJ, ISTP, INTJ / 임의로 = 가능성이 모두 같게 아무나 / 8, 5, 5/8</div>'+
    '<div><strong>팝업④</strong>: 주사위·카드 확률 한 문제 (틀리면 새 문제)</div>'+
    '<div><strong>레벨1</strong>: 주사위/카드 1 + 공/학생 1 (확률 구하기) + 공·학생 개수 구하기 2 (확률은 약분된 꼴로 주어짐)</div>'+
    '<div><strong>레벨2</strong>: 동전 두 개·동전과 주사위·가위바위보 중 2 + 주사위 두 개 1 + 카드 두 자리 수 1 — 모든 경우의 수, 사건의 경우의 수, 확률. 힌트는 풀이 방향만, 힌트를 써도 점수 인정. 계산 연습장(펜) 있음</div>'+
    '<div style="color:var(--red);margin-top:6px">미인정: "다섯"처럼 한글 수사 / 분수를 소수로 쓴 경우(분수 칸이 분자·분모로 나뉘어 있어 소수 입력 불가)</div>'+
    '<div style="margin-top:6px"><strong>찍기 방지</strong>: 질문이 뜬 뒤 1.5~4초 안에 고르면 채점 안 함 · 틀리면 3→5→8초 잠금 후 보기 다시 섞기 · 팝업④와 문제풀이 오답은 숫자만 바뀐 새 문제 (모두 정답 공개 안 함)</div>'+
    `<label style="display:block;margin-top:6px"><input type="checkbox" ${GUARD.on?'':'checked'} onchange="GUARD.on=!this.checked"> 시연용: 읽기 확인·잠금 끄기</label>`;
  $('adminPanel').style.display='block';
}
function adminPassGate(){ if(!gateCfg) return; const done = gateCfg.onPass; closeGate(); if(done) done(); }
function adminGo(i){
  closeGate();
  while(FLIP.res.length<30) FLIP.res.push(Math.random()<0.5?'H':'T');
  if(i>=2 && SIM.cum.length<1000) simAdd(1000);
  const f=[stage0,stage1,stage2,stage3,stage4,stage5,()=>{ practiceOpened=true; goToPractice(); }];
  if(i<7) f[i](); else { practiceOpened=true; startLevel(1); }
}

stage0();
</script>
