<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각형의 무게중심</title>
<style>
:root{
  --ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#9090b0;
  --indigo:#4f46e5;--indigo-l:#e0e7ff;--indigo-ll:#eef2ff;
  --green:#16a34a;--green-l:#dcfce7;--green-ll:#F0FDF4;
  --orange:#e05a20;--red:#dc2626;--red-l:#fee2e2;
  --r:12px;--shadow:0 2px 12px rgba(26,26,46,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--indigo-ll);color:var(--ink);min-height:100vh;padding-bottom:60px}
.seg{text-decoration:overline;text-decoration-thickness:1.2px}
.parasym{display:inline-block;transform:skewX(-16deg);font-weight:400}
.hdr{background:var(--indigo);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}
.hdr-title{font-size:16px;font-weight:700}
.main{max-width:1200px;margin:0 auto;padding:20px 16px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:var(--r);border:1px solid #e0e7ff;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.key-q{font-size:15.5px;font-weight:800;text-decoration:underline;text-decoration-color:var(--indigo);text-decoration-thickness:2.5px;text-underline-offset:3px}
.key-term{color:var(--red);font-weight:800;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:2px}

.split-layout{display:flex;gap:18px;align-items:flex-start}
.split-left{flex:0 0 480px;position:sticky;top:16px}
.split-right{flex:1 1 auto;min-width:0}
@media (max-width:980px){
  .split-layout{display:block}
  .split-left{position:static;width:100%;margin-bottom:14px}
}

.draw-toolbar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.draw-toolbar-label{font-size:12px;color:var(--ink3);font-weight:700;margin-right:2px}
.mode-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink);font-family:inherit}
.mode-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.color-swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #d8ddfb;cursor:pointer;padding:0;flex-shrink:0}
.color-swatch.active{box-shadow:0 0 0 2.5px var(--indigo)}
.eraser-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink);font-family:inherit}
.eraser-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.draw-wrap{position:relative;margin-bottom:10px}
.svg-wrap{background:#fbfcff;border-radius:10px 10px 0 0;border:1px solid #eee;border-bottom:none}
.svg-wrap svg{width:100%;height:auto;display:block;touch-action:none}
.scratch-area{height:70px;background:#fbfcff;border:1px dashed #d8ddfb;border-top:none;border-radius:0 0 10px 10px}
.ink-canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.vlabel{font-size:14px;font-weight:800;text-anchor:middle}
.vlabel-sm{font-size:11.5px;font-weight:800;text-anchor:middle}
.sidecurve{fill:none;stroke:#9098b5;stroke-width:1.4;stroke-dasharray:4 3}
.edgelen{font-size:12px;font-weight:700;text-anchor:middle;fill:#4a5568}

.panel-title{font-weight:800;font-size:15px;color:var(--indigo);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.step-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--indigo);color:#fff;font-size:12px;font-weight:800}
.proof-block{background:#fbfcff;border:1.5px solid var(--indigo-l);border-radius:10px;padding:14px;margin:10px 0;font-size:14.5px;line-height:2.3}
.blank{display:inline-block;width:52px;border:none;border-bottom:2px solid var(--indigo);background:transparent;text-align:center;font-weight:700;font-size:14px;font-family:inherit;padding:2px 4px;margin:0 2px;color:var(--indigo)}
.blank:focus{outline:none;border-bottom-color:#3730a3;background:var(--indigo-ll)}
.blank.correct{border-bottom-color:var(--green);background:var(--green-ll);color:#14532d}
.blank.wrong{border-bottom-color:var(--red);background:var(--red-l);color:var(--red)}
.btn{border:none;border-radius:12px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.btn:hover{background:#4338ca}
.btn:disabled{opacity:.4;cursor:default}
.btn-check{background:var(--green)}
.btn-check:hover{background:#128a3e}
.btn-primary{background:var(--indigo)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.feedback{text-align:center;font-size:13.5px;font-weight:700;min-height:20px;margin-top:8px}
.feedback.success{color:var(--green)}
.feedback.error{color:var(--red)}
.summary-box{background:var(--indigo-ll);border:1.5px solid var(--indigo-l);border-radius:10px;padding:16px;text-align:center;font-size:15px;font-weight:700;color:var(--indigo);line-height:2}

.done-wrap{text-align:center;padding:24px 10px}
.done-icon{font-size:48px;margin-bottom:10px}
.primary-btn{padding:11px 26px;border-radius:8px;background:var(--indigo);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;margin-right:8px}
.restart-btn{padding:11px 26px;border-radius:8px;background:var(--ink);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px 20px;max-width:420px;text-align:center;box-shadow:0 8px 32px rgba(26,26,46,0.25)}
.modal-icon{font-size:34px;margin-bottom:8px}
.modal-text{font-size:14px;line-height:1.7;color:var(--ink);font-weight:600;margin-bottom:16px}
.modal-btn{border:none;border-radius:10px;padding:10px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.modal-btn:hover{background:#4338ca}

/* 도입 파트 전용: 단일 와이드 컬럼 (split-layout 아님) */
.intro-wide{max-width:900px;margin:0 auto}
.intro-svg-wrap{background:#fbfcff;border-radius:10px;border:1px solid #eee;margin-bottom:10px}
.intro-svg-wrap svg{width:100%;height:auto;display:block;touch-action:none}
.choice-btn{padding:9px 20px;border-radius:10px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);font-family:inherit}
.choice-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
</style>
</head>
<body>

<div class="hdr">
  <a href="index.html" id="hubBackLink" style="background:rgba(255,255,255,.2);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;">← 학습 선택 목록으로 돌아가기</a>
  <span class="hdr-title">삼각형의 무게중심</span>
  <button id="adminBtn" onclick="openAdminModal()" style="margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;cursor:pointer;font-family:inherit">🔐 관리자 모드</button>
</div>
<script>document.getElementById('hubBackLink').href = 'index.html' + location.search;</script>

<div class="main">

  <div class="screen active" id="scIntro">
    <div class="intro-wide">
      <div class="card">
        <div class="intro-svg-wrap"><svg id="introSvg" viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div id="introPanel"></div>
      </div>
      <div class="card">
        <div class="draw-toolbar">
          <span class="draw-toolbar-label">✏️ 계산 연습장:</span>
          <button class="mode-btn" id="introPenBtn" onclick="drawSetMode('intro','pen')">✏️ 펜(필기)</button>
          <button class="color-swatch active" style="background:#1a1a2e" onclick="drawSelectColor('intro','#1a1a2e',this)" title="검정"></button>
          <button class="color-swatch" style="background:#dc2626" onclick="drawSelectColor('intro','#dc2626',this)" title="빨강"></button>
          <button class="color-swatch" style="background:#2563eb" onclick="drawSelectColor('intro','#2563eb',this)" title="파랑"></button>
          <button class="color-swatch" style="background:#16a34a" onclick="drawSelectColor('intro','#16a34a',this)" title="초록"></button>
          <button class="color-swatch" style="background:#eab308" onclick="drawSelectColor('intro','#eab308',this)" title="노랑"></button>
        </div>

  <div class="screen" id="scProve">
    <div class="split-layout">

        <div class="draw-toolbar">
          <span class="draw-toolbar-label">✏️ 계산 연습장:</span>
          <button class="mode-btn" id="provePenBtn" onclick="drawSetMode('prove','pen')">✏️ 펜(필기)</button>
          <button class="color-swatch active" style="background:#1a1a2e" onclick="drawSelectColor('prove','#1a1a2e',this)" title="검정"></button>
          <button class="color-swatch" style="background:#dc2626" onclick="drawSelectColor('prove','#dc2626',this)" title="빨강"></button>
          <button class="color-swatch" style="background:#2563eb" onclick="drawSelectColor('prove','#2563eb',this)" title="파랑"></button>
          <button class="color-swatch" style="background:#16a34a" onclick="drawSelectColor('prove','#16a34a',this)" title="초록"></button>
          <button class="color-swatch" style="background:#eab308" onclick="drawSelectColor('prove','#eab308',this)" title="노랑"></button>
        </div>
        <div class="draw-toolbar">
          <button class="eraser-btn" id="proveEraserBtn" onclick="drawToggleEraser('prove')">🧽 지우개</button>
          <button class="mode-btn active" id="provePointerBtn" onclick="drawSetMode('prove','pointer')">🖱️ 마우스</button>
        </div>
        <div class="draw-wrap" id="proveDrawWrap">
          <div class="svg-wrap"><svg id="proveSvg" viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg"></svg></div>
          <div class="scratch-area"></div>
          <canvas id="proveInk" class="ink-canvas"></canvas>

      </div>
      <div class="split-right card">
        <div id="provePanel"></div>
      </div>
    </div>
  </div>

  <div class="screen" id="scSummary">
    <div class="split-layout">
      <div class="split-left card">
        <div class="svg-wrap"><svg id="summarySvg" viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div class="screen" id="scDone">
    <div class="card">

        <h2>학습 완료!</h2>
        <p style="color:var(--ink2);margin-top:8px">삼각형의 무게중심에 대한 탐구와 증명, 정리를 모두 마쳤어요.</p>

        <button class="restart-btn" onclick="location.reload()">🔄 처음부터 다시</button>
      </div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="adminPwModal">
  <div class="modal-box">
    <div class="modal-icon">🔐</div>
    <div class="modal-text">관리자 비밀번호를 입력하세요</div>
    <input type="password" id="adminPwInput" class="blank" style="width:160px;margin-bottom:10px" onkeydown="if(event.key==='Enter')checkAdminPassword()">

      <button class="modal-btn" onclick="checkAdminPassword()">확인</button>
      <button class="modal-btn" style="background:#9090b0" onclick="document.getElementById('adminPwModal').classList.remove('show')">취소</button>
    </div>

</div>
<div id="adminPanel" style="display:none;position:fixed;bottom:16px;right:16px;width:320px;max-height:70vh;overflow-y:auto;background:#fff;border:2px solid var(--indigo);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(26,26,46,0.3);z-index:40;font-size:12px;line-height:1.75">
  <div style="font-weight:800;color:var(--indigo);margin-bottom:8px">🔐 관리자 모드</div>

<div class="modal-overlay" id="segGateModal">

    <div class="modal-icon">📏</div>
    <div class="proof-block" style="text-align:left">선분의 무게중심은 그 선분의 (<input class="blank" id="segGateAns" style="width:60px">)에 있다.</div>
    <div id="segGateErr" style="color:var(--red);font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:4px"></div>

      <button class="modal-btn" onclick="checkSegGate()">확인</button>

<div class="modal-overlay" id="barGateModal">

</div>

  </div>

  let _db=null;
  try{
    firebase.initializeApp({

      authDomain: "nd-deogi-math-hub.firebaseapp.com",
      projectId: "nd-deogi-math-hub",
      storageBucket: "nd-deogi-math-hub.firebasestorage.app",

      .catch(err=>console.warn('hub complete log failed', err));
  };
})();
function finishToHub(){ document.getElementById('hubBackLink').click(); }

<script>
/* ════════════════════════════════
   공용 헬퍼
════════════════════════════════ */
function dist(p,q){ return Math.hypot(p[0]-q[0],p[1]-q[1]); }
function lerp(p,q,t){ return [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t]; }
function unitVec(from,to){ const dx=to[0]-from[0],dy=to[1]-from[1],l=Math.hypot(dx,dy)||1; return [dx/l,dy/l]; }
function bboxCenterOf(pts){ const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); return [(Math.min(...xs)+Math.max(...xs))/2, (Math.min(...ys)+Math.max(...ys))/2]; }
function outwardLabel(p, centroid, d){ const dx=p[0]-centroid[0], dy=p[1]-centroid[1], len=Math.hypot(dx,dy)||1; return [p[0]+dx/len*d, p[1]+dy/len*d]; }
function ptsToStr(pts){ return pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' '); }
function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normText(v){ return String(v||'').trim().replace(/\s+/g,''); }
function tokenizeSeg(s){
  const tokens = [];
  for(let i=0;i<s.length;i++){
    let tok = s[i];
    if(s[i+1]==="'"){ tok+="'"; i++; }
    tokens.push(tok);
  }
  return tokens;
}
function sameSeg(v, correct){
  const nv = normText(v).toUpperCase().replace(/′/g,"'");
  const nc = normText(correct).toUpperCase().replace(/′/g,"'");
  if(nv===nc) return true;
  return tokenizeSeg(nv).slice().reverse().join('')===nc;
}
function samePairEitherOrder(v1, v2, a, b){
  return (sameSeg(v1,a) && sameSeg(v2,b)) || (sameSeg(v1,b) && sameSeg(v2,a));
}
function lockRow(selector){ document.querySelectorAll(selector+' .btn').forEach(b=>b.disabled=true); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active')); document.getElementById(id).classList.add('active'); }

/* ════════════════════════════════
   계산 연습장 (필기 캔버스) — intro/prove 공용
════════════════════════════════ */
const drawSt = {};
function drawGetSt(key){ if(!drawSt[key]) drawSt[key]={ color:'#1a1a2e', erasing:false, drawing:false, lastX:0, lastY:0, mode:'pointer' }; return drawSt[key]; }
function drawSetMode(key, mode){
  const d = drawGetSt(key);
  d.mode = mode;
  document.getElementById(key+'PenBtn').classList.toggle('active', mode==='pen');
  document.getElementById(key+'PointerBtn').classList.toggle('active', mode==='pointer');
  document.getElementById(key+'Ink').style.pointerEvents = (mode==='pointer') ? 'none' : 'auto';
}
function drawSetupCanvas(key){
  const wrap = document.getElementById(key+'DrawWrap');
  const canvas = document.getElementById(key+'Ink');
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width*dpr));
  canvas.height = Math.max(1, Math.round(rect.height*dpr));
  canvas.style.width = rect.width+'px';
  canvas.style.height = rect.height+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
  drawUpdateCursor(key);
}
function drawCanvasPoint(key, evt){
  const canvas = document.getElementById(key+'Ink');
  const rect = canvas.getBoundingClientRect();
  return { x: evt.clientX-rect.left, y: evt.clientY-rect.top };
}
const drawBound = {};
function drawBindOnce(key){
  if(drawBound[key]) return;
  drawBound[key]=true;
  const canvas = document.getElementById(key+'Ink');
  const d = drawGetSt(key);
  canvas.addEventListener('pointerdown', evt=>{
    d.drawing=true; canvas.setPointerCapture(evt.pointerId);
    const p=drawCanvasPoint(key,evt); d.lastX=p.x; d.lastY=p.y;
  });
  canvas.addEventListener('pointermove', evt=>{
    if(!d.drawing) return;
    const p=drawCanvasPoint(key,evt);
    const ctx=canvas.getContext('2d');
    ctx.beginPath(); ctx.moveTo(d.lastX,d.lastY); ctx.lineTo(p.x,p.y);
    if(d.erasing){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=24; }
    else{ ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=d.color; ctx.lineWidth=3; }
    ctx.stroke();
    d.lastX=p.x; d.lastY=p.y;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(evtName=>canvas.addEventListener(evtName, ()=>{ d.drawing=false; }));
  window.addEventListener('resize', ()=>{
    const scrMap = {intro:'scIntro', prove:'scProve'};
    if(document.getElementById(scrMap[key]).classList.contains('active')) drawSetupCanvas(key);
  });
  drawSetMode(key, d.mode);
}
function drawSelectColor(key, color, btn){
  const d=drawGetSt(key); d.color=color; d.erasing=false; d.lastColorBtn=btn;
  const scrMap = {intro:'#scIntro', prove:'#scProve'};
  document.querySelectorAll(scrMap[key]+' .color-swatch').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById(key+'EraserBtn').classList.remove('active');
  drawUpdateCursor(key);
}
function drawToggleEraser(key){
  const d=drawGetSt(key);
  const scrMap = {intro:'#scIntro', prove:'#scProve'};
  if(d.erasing){
    d.erasing=false;
    document.getElementById(key+'EraserBtn').classList.remove('active');
    const btn = d.lastColorBtn || document.querySelector(scrMap[key]+' .color-swatch');
    if(btn) btn.classList.add('active');
  } else {
    d.erasing=true;
    document.querySelectorAll(scrMap[key]+' .color-swatch').forEach(b=>b.classList.remove('active'));
    document.getElementById(key+'EraserBtn').classList.add('active');
  }
  drawUpdateCursor(key);
}
function drawMakeCursorURL(draw, size){
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  draw(c.getContext('2d'), size);
  return c.toDataURL('image/png');
}
function drawUpdateCursor(key){
  const canvas = document.getElementById(key+'Ink');
  if(!canvas) return;
  const d = drawGetSt(key);
  if(d.erasing){
    const size=26, r=11;
    const url = drawMakeCursorURL((cx)=>{
      cx.beginPath(); cx.arc(size/2,size/2,r,0,Math.PI*2);
      cx.fillStyle='rgba(255,255,255,0.4)'; cx.fill();
      cx.lineWidth=2; cx.strokeStyle='#333a4d'; cx.stroke();
    }, size);
    canvas.style.cursor = `url(${url}) ${size/2} ${size/2}, cell`;
  } else {
    const size=34;
    const url = drawMakeCursorURL((cx)=>{
      cx.save(); cx.translate(18,18); cx.rotate(135*Math.PI/180);
      cx.fillStyle=d.color; cx.fillRect(-4,-14,8,16);
      cx.fillStyle='#f4c98c'; cx.beginPath(); cx.moveTo(-4,2); cx.lineTo(4,2); cx.lineTo(0,11); cx.closePath(); cx.fill();
      cx.fillStyle='#333a4d'; cx.beginPath(); cx.moveTo(-1.4,7.5); cx.lineTo(1.4,7.5); cx.lineTo(0,11); cx.closePath(); cx.fill();
      cx.restore();
    }, size);
    canvas.style.cursor = `url(${url}) 10 10, crosshair`;
  }
}

const ADMIN_HASH = 'fb9e692b52ad41cd666f83c8175df90569d48192d531e9c94285929bc116891a';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ════════════════════════════════
   삼각형 ABC(∠A=80°,∠B=60°,∠C=40°) 로컬 좌표 (도형 중심이 원점, SVG y축 기준)
   D=BC중점, E=AC중점, F=AB중점, G=무게중심
════════════════════════════════ */
const TRI = {
  A:[-34.7,-56.5], B:[-100.0,56.5], C:[100.0,56.5],
  D:[0.0,56.5], E:[32.6,0.0], F:[-67.4,0.0], G:[-11.6,18.8]
};
function triAt(cx,cy){
  const out={};
  Object.keys(TRI).forEach(k=>{ out[k]=[TRI[k][0]+cx, TRI[k][1]+cy]; });
  return out;
}
function triOutlineSVG(g, color){
  return `<polygon points="${ptsToStr([g.A,g.B,g.C])}" fill="${color}" fill-opacity="0.06" stroke="${color}" stroke-width="2"></polygon>`;
}
function vlabelsSVG(g, keys, color){
  const cen = bboxCenterOf([g.A,g.B,g.C]);
  let html='';
  keys.forEach(k=>{
    const lp = outwardLabel(g[k], cen, 14);
    html += `<text class="vlabel" x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" fill="${color}">${k}</text>`;
  });
  return html;
}
function dotSVG(p, color, r){ return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r||3}" fill="${color}"></circle>`; }
function barSVG(p1,p2,color){ return `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="${color}" stroke-width="5" stroke-linecap="round" opacity="0.8"></line>`; }
function medianSVG(p1,p2,color){ return `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="${color}" stroke-width="2.4"></line>`; }
function tickSVG(p1,p2,color){
  const mid=lerp(p1,p2,0.5), dir=unitVec(p1,p2);
  const perp=[-dir[1]*4, dir[0]*4];
  return `<line x1="${(mid[0]-perp[0]).toFixed(1)}" y1="${(mid[1]-perp[1]).toFixed(1)}" x2="${(mid[0]+perp[0]).toFixed(1)}" y2="${(mid[1]+perp[1]).toFixed(1)}" stroke="${color}" stroke-width="1.8"></line>`;
}
function barMidpoints(apex, left, right, n){
  const mids=[];
  for(let i=1;i<=n;i++){ const t=i/n; mids.push(lerp(lerp(apex,left,t), lerp(apex,right,t), 0.5)); }
  return mids;
}
function barsBetween(apex, left, right, n){
  const bars=[];
  for(let i=1;i<=n;i++){ const t=i/n; bars.push([lerp(apex,left,t), lerp(apex,right,t)]); }
  return bars;
}

const introSt = { step:0, seg:[], triBOverlapped:false };

/* --- 스텝0: 선분 3개의 무게중심 찾기 --- */
const SEG_DEFS = [
  { len:140, thick:14, y:55, initT:0.22 },
  { len:220, thick:24, y:140, initT:0.74 },
  { len:170, thick:32, y:225, initT:0.33 }
];
function introStep0(){
  introSt.step=0;
  setIntroVB(500,280);
  introSt.seg = SEG_DEFS.map(d=>({ ...d, cx:250, x1:250-d.len/2, x2:250+d.len/2, t:d.initT, correct:false }));
  renderIntroStep0();
  introPanel(`
    <p>선분(막대) 3개가 있어요. 각 막대를 손으로 잡고, <span class="key-term">무게중심</span>이라고 생각하는 위치로 점을 옮긴 뒤 "확인"을 눌러보세요.</p>
    <div class="btn-row" id="seg0Row"><button class="btn btn-check" onclick="checkSeg(0)">① 확인</button></div>
    <div class="btn-row" id="seg1Row"><button class="btn btn-check" onclick="checkSeg(1)">② 확인</button></div>
    <div class="btn-row" id="seg2Row"><button class="btn btn-check" onclick="checkSeg(2)">③ 확인</button></div>
    <div class="feedback" id="seg0fb"></div>
  `);
}
function renderIntroStep0(){
  let html='';
  introSt.seg.forEach((s,i)=>{
    const color = s.correct ? '#16a34a' : '#4f46e5';
    html += `<line x1="${s.x1}" y1="${s.y}" x2="${s.x2}" y2="${s.y}" stroke="${color}" stroke-width="${s.thick}" stroke-linecap="round" opacity="0.85"></line>`;
    const hx = s.x1 + (s.x2-s.x1)*s.t;
    html += `<circle id="segHandle${i}" cx="${hx}" cy="${s.y}" r="13" fill="#fff" stroke="${color}" stroke-width="3" style="cursor:grab;touch-action:none"></circle>`;
    if(s.correct) html += `<text x="${s.x2+28}" y="${s.y+5}" font-size="18" fill="#16a34a">✓</text>`;
  });
  introSvgHTML(html);
  introSt.seg.forEach((s,i)=>bindSegHandle(i));
}
function bindSegHandle(i){
  const handle = document.getElementById('segHandle'+i);
  if(!handle || handle._bound) return;
  handle._bound = true;
  handle.addEventListener('pointerdown', evt=>{
    if(introSt.seg[i].correct) return;
    evt.preventDefault();
    handle.setPointerCapture(evt.pointerId);
    handle._dragging = true;
  });
  handle.addEventListener('pointermove', evt=>{
    if(!handle._dragging) return;
    evt.preventDefault();
    const svg = document.getElementById('introSvg');
    const pt = svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    const s = introSt.seg[i];
    let t = (loc.x - s.x1) / (s.x2 - s.x1);
    t = Math.max(0, Math.min(1, t));
    s.t = t;
    handle.setAttribute('cx', (s.x1+(s.x2-s.x1)*t).toFixed(1));
  });
  ['pointerup','pointercancel'].forEach(evtName=>handle.addEventListener(evtName, ()=>{ handle._dragging=false; }));
}
function checkSeg(i){
  const s = introSt.seg[i];
  const ok = Math.abs(s.t - 0.5) <= 0.08;
  const fb = document.getElementById('seg0fb');
  if(ok){
    s.correct = true; s.t = 0.5;
    renderIntroStep0();
    document.getElementById('seg'+i+'Row').querySelector('button').disabled = true;
    fb.className='feedback success'; fb.textContent='맞아요! 중점이 무게중심이에요.';
    if(introSt.seg.every(x=>x.correct)){
      openSegGate();
    }
  } else {
    fb.className='feedback error'; fb.textContent='아직 중점에서 좀 떨어져 있어요. 막대를 다시 잡고 가운데로 옮겨보세요.';
  }
}

function revealMedian2(){
  document.getElementById('lineBtn2').disabled = true;

  function frame(now){
    const t=Math.min(1,(now-t0)/700);

    const prevLine = document.getElementById('medianBE2');
    const lineHTML = `<line id="medianBE2" x1="${gB.B[0].toFixed(1)}" y1="${gB.B[1].toFixed(1)}" x2="${cur[0].toFixed(1)}" y2="${cur[1].toFixed(1)}" stroke="#1a1a2e" stroke-width="2.6"></line>`;
    if(prevLine) prevLine.outerHTML = lineHTML;
    else document.getElementById('introSvg').insertAdjacentHTML('beforeend', lineHTML);
    if(t<1) requestAnimationFrame(frame);
    else {
      document.getElementById('introSvg').insertAdjacentHTML('beforeend', vlabelsSVG(gB,['E'],'#1a1a2e'));
      appendIntroPanel(`
        <p>이번엔 중선 BE가 만들어졌어요. 이제 두 삼각형을 겹쳐서 비교해볼까요?</p>

function overlapTriangles(){
  document.getElementById('overlapBtn').disabled = true;
  const svg = document.getElementById('introSvg');
  // 오른쪽 삼각형(스텝3) 관련 요소를 하나의 그룹으로 모아 이동 애니메이션
  const gB0 = triAt(520,150);
  const gA0 = triAt(150,150);
  const dx = gA0.A[0]-gB0.A[0]===undefined?0:(150-520);
  // 오른쪽 삼각형과 겹치는 모든 요소를 다시 그려서 그룹화
  const bars = barsBetween(gB0.B, gB0.A, gB0.C, 10);
  const mids = barMidpoints(gB0.B, gB0.A, gB0.C, 10);
  let moveHTML = triOutlineSVG(gB0,'#9098b5') + vlabelsSVG(gB0,['A','B','C'],'#4a4a6a');
  bars.forEach(b=>{ moveHTML += barSVG(b[0],b[1],'#e05a20'); });
  mids.forEach(m=>{ moveHTML += dotSVG(m,'#1a1a2e',3); });
  moveHTML += medianSVG(gB0.B, gB0.E, '#1a1a2e') + vlabelsSVG(gB0,['E'],'#1a1a2e');
  svg.insertAdjacentHTML('beforeend', `<g id="moveGroup">${moveHTML}</g>`);
  // 기존(겹치기 전) 오른쪽 삼각형 전체를 지우기 위해, introStep3 이후 추가된 모든 요소 중 오른쪽 자리 것들을 숨김 처리하는 대신
  // 전체를 다시 그리는 방식: 왼쪽(스텝2) 결과 보존 + moveGroup만 애니메이션
  const t0 = performance.now();
  const shiftX = 150-520;
  function frame(now){
    const t=Math.min(1,(now-t0)/800);
    const e = easeInOut(t);
    document.getElementById('moveGroup').setAttribute('transform', `translate(${(shiftX*e).toFixed(1)},0)`);
    if(t<1) requestAnimationFrame(frame);
    else {
      setIntroVB(400,300);
      introSt.triBOverlapped = true;
      appendIntroPanel(`
        <p class="key-q">두 중선 AD, BE가 한 삼각형 안에서 서로 교차하는 모습이 보이나요?</p>
        <div class="btn-row"><button class="btn btn-primary" onclick="introStep4()">다음 →</button></div>
      `);
    }
  }
  requestAnimationFrame(frame);
}

  const ok2 = normText(document.getElementById('p3_2').value)==='2';
  const ok3 = normText(document.getElementById('p3_3').value)==='1';
  const ok4 = normText(document.getElementById('p3_4').value)==='한';
  [['p3_1',ok1],['p3_2',ok2],['p3_3',ok3],['p3_4',ok4]].forEach(([id,ok])=>{
    document.getElementById(id).classList.toggle('correct',ok); document.getElementById(id).classList.toggle('wrong',!ok);
  });
  const fb = document.getElementById('p3fb');
  if(ok1&&ok2&&ok3&&ok4){
    fb.className='feedback success'; fb.textContent='맞아요! 증명이 완성됐어요.';
    btn.disabled=true;
    const gg = triAt(210,160);
    document.getElementById('proveSvg').innerHTML += medianSVG(gg.B,gg.E,'#e05a20')+medianSVG(gg.C,gg.F,'#16a34a');
    appendProvePanel(`<div class="btn-row"><button class="btn btn-primary" onclick="goToSummary()">정리로 넘어가기 →</button></div>`);
  } else {
    fb.className='feedback error'; fb.textContent='①, ②에서 G와 G′이 AD 위에서 각각 어떤 비율의 점이었는지 다시 확인해보세요.';
  }
}

/* ════════════════════════════════
   정리 파트
════════════════════════════════ */
function goToSummary(){
  showScreen('scSummary');
  window.scrollTo({top:0, behavior:'smooth'});
  renderSummary();
}
function renderSummary(){
  const gg = triAt(210,160);
  let html = triOutlineSVG(gg,'#4f46e5') + vlabelsSVG(gg,['A','B','C'],'#1a1a2e');
  html += dotSVG(gg.D,'#9098b5',2.6) + vlabelsSVG(gg,['D'],'#9098b5');
  html += dotSVG(gg.E,'#9098b5',2.6) + vlabelsSVG(gg,['E'],'#9098b5');
  html += dotSVG(gg.F,'#9098b5',2.6) + vlabelsSVG(gg,['F'],'#9098b5');
  html += medianSVG(gg.A,gg.D,'#4f46e5') + medianSVG(gg.B,gg.E,'#e05a20') + medianSVG(gg.C,gg.F,'#16a34a');
  html += tickSVG(gg.A,gg.G,'#4f46e5') + tickSVG(gg.B,gg.G,'#e05a20') + tickSVG(gg.C,gg.G,'#16a34a');
  html += dotSVG(gg.G,'#1a1a2e',3.4) + `<text class="vlabel" x="${(gg.G[0]-12).toFixed(1)}" y="${(gg.G[1]-8).toFixed(1)}" fill="#1a1a2e">G</text>`;
  document.getElementById('summarySvg').innerHTML = html;
  document.getElementById('summaryPanel').innerHTML = `
    <div class="panel-title"><span class="step-badge">정리</span>삼각형의 무게중심</div>
    <div class="proof-block">
      삼각형의 세 (<input class="blank" id="s_1" style="width:50px">)은 한 점에서 만나고, 이 점을 삼각형의 (<input class="blank" id="s_2" style="width:70px">)이라고 한다.<br>
      이때 이 점은 세 중선을 각 꼭짓점으로부터 그 길이가 각각 (<input class="blank" id="s_3" style="width:30px">):(<input class="blank" id="s_4" style="width:30px">)이 되도록 나눈다.
    </div>
    <div class="btn-row"><button class="btn btn-check" onclick="summaryCheck(this)">확인</button></div>
    <div class="feedback" id="sfb"></div>
  `;
}
function summaryCheck(btn){
  const ok1 = normText(document.getElementById('s_1').value)==='중선';
  const ok2 = normText(document.getElementById('s_2').value)==='무게중심';
  const ok3 = normText(document.getElementById('s_3').value)==='2';
  const ok4 = normText(document.getElementById('s_4').value)==='1';
  [['s_1',ok1],['s_2',ok2],['s_3',ok3],['s_4',ok4]].forEach(([id,ok])=>{
    document.getElementById(id).classList.toggle('correct',ok); document.getElementById(id).classList.toggle('wrong',!ok);
  });
  const fb = document.getElementById('sfb');
  if(ok1&&ok2&&ok3&&ok4){
    fb.className='feedback success'; fb.textContent='맞아요!';
    btn.disabled=true;
    document.getElementById('summaryPanel').insertAdjacentHTML('beforeend', `
      <div class="summary-box">
        삼각형의 세 중선은 한 점(무게중심)에서 만나고,<br>이 점은 세 중선을 각 꼭짓점으로부터 그 길이가 각각 2:1이 되도록 나눈다.<br>
        <span class="seg">AG</span>:<span class="seg">GD</span>=<span class="seg">BG</span>:<span class="seg">GE</span>=<span class="seg">CG</span>:<span class="seg">GF</span>=2:1
      </div>
      <div class="btn-row"><button class="btn btn-primary" onclick="showScreen('scDone')">학습 마무리 →</button></div>
    `);
  } else {
    fb.className='feedback error'; fb.textContent='교과서 정리 박스 문장을 다시 떠올려보세요.';
  }
}
