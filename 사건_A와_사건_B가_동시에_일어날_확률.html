<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사건 A와 사건 B가 동시에 일어날 확률</title>
<style>
:root{
  --ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#9090b0;
  --indigo:#4f46e5;--indigo-l:#e0e7ff;--indigo-ll:#eef2ff;
  --green:#16a34a;--green-l:#dcfce7;--green-ll:#F0FDF4;
  --orange:#e05a20;--red:#dc2626;--red-l:#fee2e2;
  --bean:#7c2d12;--cream:#b45309;
  --r:12px;--shadow:0 2px 12px rgba(26,26,46,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--indigo-ll);color:var(--ink);min-height:100vh;padding-bottom:60px}
.hdr{background:var(--indigo);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}
.hdr-title{font-size:16px;font-weight:700}
.main{max-width:1200px;margin:0 auto;padding:20px 16px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:var(--r);border:1px solid #e0e7ff;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
/* 강조 3단계: ① 핵심 질문(.key-q, 한 블록에 1개) ② 핵심어(.kw, 문단에 1~2개) ③ 보충(.sub) — 밑줄은 핵심 질문 안의 .em에만 */
.key-q{display:block;font-size:17px;font-weight:800;line-height:1.7;color:var(--ink);background:#fffbeb;border:1.5px solid #fcd34d;border-left:6px solid #f59e0b;border-radius:10px;padding:9px 14px 10px;margin:10px 0}
.key-q::before{content:'❓ 질문';display:block;font-size:11.5px;font-weight:800;color:#b45309;margin-bottom:1px}
.key-q.task::before{content:'✏️ 해 보기'}
.key-q .em{text-decoration:underline;text-decoration-color:#f59e0b;text-decoration-thickness:3px;text-underline-offset:4px}
.kw{font-weight:800;color:#be123c}
.sub{font-size:12.5px;color:var(--ink3);font-weight:600}
.reread{animation:rereadFlash 1.2s ease-out 2}
@keyframes rereadFlash{0%{box-shadow:0 0 0 5px #f59e0b;background-color:#fef3c7}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.lock-note{display:inline-block;margin-top:4px;font-size:12.5px;color:#b45309;background:#fef3c7;border-radius:8px;padding:2px 10px}
.it{font-style:italic;font-family:'Times New Roman',serif;font-weight:700;font-size:1.08em}

.split-layout{display:flex;gap:18px;align-items:flex-start}
.split-left{flex:0 0 450px;position:sticky;top:16px}
.split-right{flex:1 1 auto;min-width:0}
@media (max-width:980px){
  .split-layout{display:block}
  .split-left{position:static;width:100%;margin-bottom:14px}
  .split-left.board-sticky{position:sticky;top:0;z-index:5;max-height:50vh;overflow-y:auto}
}

.stepper{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.stepper .st{padding:5px 11px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12px;font-weight:700;color:var(--ink3);font-family:inherit}
.stepper .st.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.stepper .st.done{background:var(--green-l);color:#14532d;border-color:var(--green);cursor:pointer}
.stepper .st.done:hover{box-shadow:0 0 0 2px var(--green)}
.stepper .st.viewing{background:#fef3c7;color:#92400e;border-color:#f59e0b}
.stepper .st:disabled{cursor:default}
.back-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fef3c7;border:1.5px solid #fcd34d;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px;font-weight:700;color:#92400e}
.back-banner .btn{padding:6px 14px;font-size:12.5px}

/* 왼쪽 */
.exp-head{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700;line-height:1.6;margin-bottom:10px}
.exp-badge{flex-shrink:0;background:var(--ink);color:#fff;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:12px;margin-top:2px}
.board-tip{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-top:8px}
.graph-box{background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:12px;padding:6px;margin-top:8px}
.graph-box svg{display:block;width:100%;height:auto}
.fig{background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:12px;padding:12px;margin-bottom:10px;text-align:center}
.fig-cap{font-size:13px;font-weight:800;color:var(--ink2);margin-top:8px}
.fig-dice{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cardg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:300px;margin:0 auto}
.cardg span{border:1.5px solid #4f46e5;border-radius:6px;background:#fff;font-weight:800;font-size:14px;padding:5px 0;color:var(--ink)}
.pouch{position:relative;margin:22px auto 4px;width:250px;max-width:100%;min-height:120px;background:#ead2ac;border:2.5px solid #a07a46;border-radius:42% 42% 50% 50% / 26% 26% 74% 74%;padding:28px 22px 34px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-content:center}
.pouch::before{content:'';position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:76px;height:18px;background:#ead2ac;border:2.5px solid #a07a46;border-bottom:none;border-radius:12px 12px 0 0}
.pouch::after{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:92px;height:7px;background:#b45309;border-radius:4px}
.ball{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-style:normal;color:#fff;box-shadow:inset -3px -4px 0 rgba(0,0,0,.18)}
.ball.red{background:#ef4444}.ball.blue{background:#3b82f6}.ball.q{background:#9ca3af}
.peep{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:330px;margin:0 auto}
.nl-legend{display:grid;grid-template-columns:1fr;gap:6px 10px;margin-top:8px;font-size:13px;font-weight:700;color:var(--ink2)}
.nl-legend div{display:flex;align-items:center;gap:6px;line-height:1.4}
.nl-legend .nb{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:800}
.s2-ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.s2-ctrl .btn{padding:8px 14px}
.s2-count{text-align:center;font-size:14px;font-weight:800;color:var(--ink2)}
.s2-count b{font-size:17px}
.s2-count .bn{color:var(--bean)}
.s2-count .cr{color:var(--cream)}
.s2-msg{text-align:center;font-size:13px;font-weight:800;color:var(--red);min-height:20px;margin-top:4px;border-radius:8px}
.phone{max-width:260px;margin:4px auto;border:3px solid #374151;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(26,26,46,.15)}
.ph-top{background:#1e3a8a;color:#fff;font-size:13px;font-weight:800;padding:8px 12px;display:flex;justify-content:space-between}
.ph-head{background:#dbeafe;color:#1e3a8a;text-align:center;font-weight:800;font-size:15px;padding:8px}
.phone ul{list-style:none;padding:8px 14px;min-height:150px}
.phone li{font-size:15px;font-weight:700;padding:6px 0;border-bottom:1px dashed #e5e7eb}
.phone li.sold{color:#9ca3af;text-decoration:line-through}
.ph-foot{background:#e5e7eb;color:#6b7280;text-align:center;font-weight:800;font-size:15px;padding:9px}
.ex-card{border:2px solid #fcd34d;background:#fffbeb;border-radius:12px;padding:10px 14px;margin:8px 0;line-height:1.75}
.ex-card .nm{font-size:18px;font-weight:800;color:var(--ink)}
.ex-card .mean{font-size:13.5px;color:var(--ink2);font-weight:600}
.ex-card .ev{font-size:14px;font-weight:700;margin-top:2px}
.ex-card.done{border-color:#bbf7d0;background:var(--green-ll)}

/* 오른쪽 */
.panel-title{font-weight:800;font-size:15px;color:var(--indigo);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.step-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--indigo);color:#fff;font-size:12px;font-weight:800;flex-shrink:0}
.qblock{border-top:1px dashed #e0e7ff;padding-top:12px;margin-top:12px}
.qblock:first-child{border-top:none;padding-top:0;margin-top:0}
.lead{font-size:14px;line-height:1.8;color:var(--ink2);margin-bottom:8px}
.prob-box{display:block;font-size:16.5px;font-weight:800;line-height:1.75;color:var(--ink);background:#f0fdf4;border:1.5px solid #86efac;border-left:6px solid #16a34a;border-radius:10px;padding:9px 14px 10px;margin:10px 0}
.prob-box::before{content:'📋 문제';display:block;font-size:11.5px;font-weight:800;color:#15803d;margin-bottom:1px}
.prob-box u{text-underline-offset:3px}
.count-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px;font-weight:700}
.blank{display:inline-block;width:56px;border:none;border-bottom:2px solid var(--indigo);background:transparent;text-align:center;font-weight:700;font-size:15px;font-family:inherit;padding:2px 4px;margin:0 2px;color:var(--indigo)}
.blank:focus{outline:none;border-bottom-color:#3730a3;background:var(--indigo-ll)}
.blank.correct{border-bottom-color:var(--green);background:var(--green-ll);color:#14532d}
.blank.wrong{border-bottom-color:var(--red);background:var(--red-l);color:var(--red)}
/* 분수 입력칸: 분자 / 가로선 / 분모 */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px}
.frac .blank{border:1.5px solid #a5b4fc;border-radius:6px;width:52px;height:30px;margin:1px 0;background:#fff}
.frac .blank.correct{border-color:var(--green);background:var(--green-ll)}
.frac .blank.wrong{border-color:var(--red);background:var(--red-l)}
.frac .fbar{width:100%;min-width:60px;height:2.5px;background:var(--ink);border-radius:2px;margin:2px 0}
.sfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.92em;line-height:1.15;margin:0 3px}
.sfrac>span:first-child{border-bottom:1.6px solid currentColor;padding:0 3px}
.sfrac>span:last-child{padding:0 3px}
.fline{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;font-size:15px;font-weight:800}
.fline .lab{font-size:13px;color:var(--ink2);text-align:center;line-height:1.4}
.choice-col{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.choice-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;justify-content:center}
.choice-row .choice-btn{min-width:74px;text-align:center;font-size:16px}
.choice-btn{padding:9px 16px;border-radius:10px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);font-family:inherit;text-align:left;line-height:1.5}
.choice-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.choice-btn.correct{background:var(--green);color:#fff;border-color:var(--green)}
.choice-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.choice-btn:disabled{cursor:default}
.btn{border:none;border-radius:12px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.btn:hover{background:#4338ca}
.btn:disabled{opacity:.4;cursor:default}
.btn-check{background:var(--green)}
.btn-check:hover{background:#15803d}
.btn-soft{background:#fff;color:var(--indigo);border:1.5px solid var(--indigo)}
.btn-soft:hover{background:var(--indigo-ll)}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.feedback{text-align:center;font-size:13.5px;font-weight:700;min-height:20px;margin-top:8px;line-height:1.6}
.feedback.success{color:var(--green)}
.feedback.error{color:var(--red)}
.feedback.info{color:#b45309}
.note-box{background:var(--green-ll);border:1.5px solid #bbf7d0;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.85;margin-top:10px}
.def-box{background:var(--indigo-ll);border:2px solid var(--indigo);border-radius:12px;padding:14px 16px;font-size:15px;line-height:2;margin-top:12px;text-align:left}
.def-box .dt{font-weight:800;color:var(--indigo);margin-bottom:2px}
.def-box.term-wait{visibility:hidden}
.hint-card{background:#fff;border:1.5px solid #d8ddfb;border-radius:12px;padding:14px;font-size:13.5px;line-height:1.9}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.chip{font-size:12.5px;font-weight:800;border-radius:14px;padding:3px 11px;background:#f3f4f6;color:var(--ink3);border:1.5px dashed #d1d5db}
.chip.on{background:var(--green-l);color:#14532d;border:1.5px solid var(--green)}
.ox-row{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1.5px solid #e0e7ff;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px;font-weight:700;line-height:1.6;background:#fff}
.ox-btns{display:flex;gap:6px;flex-shrink:0}
.ox-b{width:42px;height:36px;border-radius:9px;border:1.5px solid #d8ddfb;background:#fff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.ox-b.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.ox-b:disabled{cursor:default}
/* 용어 팝업 (빈칸 + 둘 중 하나 고르기) */
.modal-overlay.termpop{background:rgba(26,26,46,0.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal-box.term-box{max-width:660px;width:100%}
.pp-line{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:4px 0}
.pp-line .nw{white-space:nowrap}
.term-tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--indigo);border-radius:10px;padding:2px 10px;margin-bottom:8px}
.term-box .def-box{margin-top:0;line-height:2.3}
.term-box .def-box .blank{font-size:16px;color:#be123c;border:1.5px solid #a5b4fc;border-radius:6px;background:#fff;width:46px}
.pp{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle;background:#fff;border:2px dashed #a5b4fc;border-radius:10px;padding:3px}
.pp button{border:1.5px solid #d8ddfb;background:#fff;border-radius:8px;padding:3px 9px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.pp button.on{background:#be123c;color:#fff;border-color:#be123c}
.pp.wrong{border-color:var(--red);background:var(--red-l)}
.pp.correct{border-color:var(--green);background:var(--green-ll)}

.progress{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-bottom:6px}
.level-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.level-tab{padding:7px 16px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.level-tab.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.level-tab.done{background:var(--green-l);color:#14532d;border-color:var(--green)}
.try-tag{display:inline-block;font-size:12px;font-weight:800;border-radius:10px;padding:2px 10px;background:#eef2ff;color:var(--indigo);margin-bottom:6px}
.try-tag.last{background:#fef3c7;color:#92400e}

.result-wrap{text-align:center;padding:24px 10px}
.result-icon{font-size:48px;margin-bottom:10px}
.result-score{font-size:22px;font-weight:800;color:var(--indigo);margin:8px 0}
.primary-btn{padding:11px 26px;border-radius:8px;background:var(--indigo);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;margin-right:8px}
.restart-btn{padding:11px 26px;border-radius:8px;background:var(--ink);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:22px 20px;max-width:460px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(26,26,46,0.25);max-height:92vh;overflow-y:auto}
.modal-icon{font-size:34px;margin-bottom:8px}
.modal-text{font-size:14px;line-height:1.7;color:var(--ink);font-weight:600;margin-bottom:16px}
.modal-btn{border:none;border-radius:10px;padding:10px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
/* 이번 차시: 사건 A 또는 사건 B가 일어날 확률 */
@keyframes nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes popIn{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
.help-btn{border:1.5px solid #f59e0b;background:#fffbeb;color:#92400e;border-radius:16px;padding:4px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.help-btn:hover{background:#fef3c7}
.cb{color:#1d4ed8}.co{color:#c2410c}.cj{color:#1d4ed8}.ch{color:#be185d}
/* 인물 말풍선 */
.talk{display:flex;gap:8px;align-items:flex-end;margin:6px 0 10px}
.talk img{height:84px;flex-shrink:0}
.talk.r{flex-direction:row-reverse}
.bub{position:relative;background:#fff;border:2px solid #c7d2fe;border-radius:14px;padding:7px 12px 8px;font-size:14px;line-height:1.7;font-weight:600;color:var(--ink)}
.bub .who{display:block;font-size:11.5px;font-weight:800;margin-bottom:1px}
.talk.j .bub{border-color:#fcd34d;background:#fffdf3}.talk.j .who{color:#b45309}
.talk.h .bub{border-color:#f9a8d4;background:#fff7fb}.talk.h .who{color:#be185d}
/* 지도 */
.map svg{display:block;width:100%;height:auto}
.pin{cursor:default}
.pin.live{cursor:pointer}
.pin.live:hover path{stroke:#312e81;stroke-width:2.6}
.pin.hl path{stroke:#f59e0b;stroke-width:4}
.pin.bad path{stroke:#dc2626;stroke-width:4}
.pin.pick{animation:pinBounce .6s ease-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pinBounce{0%{transform:translateY(0)}40%{transform:translateY(-12px) scale(1.25)}100%{transform:translateY(0) scale(1)}}
.brushes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px}
.brush{border:2px solid #d8ddfb;background:#fff;border-radius:20px;padding:6px 14px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink2)}
.brush.a.on{background:#3b82f6;border-color:#1d4ed8;color:#fff}
.brush.c.on{background:#fb923c;border-color:#c2410c;color:#fff}
.brush.j.on{background:#3b82f6;border-color:#1d4ed8;color:#fff}
.brush.h.on{background:#ec4899;border-color:#be185d;color:#fff}
.brush:disabled{opacity:.45;cursor:default}
.pstat{text-align:center;font-size:13.5px;font-weight:700;color:var(--ink2);min-height:22px;margin-top:6px;line-height:1.6;border-radius:8px}
.pstat b{font-size:16px}
.dlog{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px;min-height:24px}
.dlog span{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px}
.dlog .ok{background:#dcfce7;color:#14532d}.dlog .no{background:#f3f4f6;color:#6b7280}
.mini-tbl{border-collapse:collapse;margin:6px auto 0;font-size:13.5px}
.mini-tbl th,.mini-tbl td{border:1.5px solid #c7d2fe;padding:4px 10px;text-align:center}
.mini-tbl th{background:#eef2ff;font-weight:800}
.mini-tbl td{font-weight:700;background:#fff}
/* 띠 */
.strip-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.strip-name{flex:0 0 92px;font-size:12px;font-weight:800;color:var(--ink2);line-height:1.3;text-align:right}
.strip{flex:1 1 auto;display:grid;border:2px solid #1a1a2e;border-radius:6px;overflow:hidden;background:#fff}
.cell{height:30px;background:#f3f4f6;border-right:1px solid #fff}
.cell:last-child{border-right:none}
.cell.a{background:#3b82f6}
.cell.c{background:#fb923c}
.cell.slide{animation:slideIn .9s ease-out}

.strip-val{flex:0 0 52px;font-size:15px;font-weight:800;text-align:center}
.merge-arrow{text-align:center;font-size:13px;font-weight:800;color:#16a34a;margin:2px 0}
/* 공 */
.bagfig{position:relative;text-align:center}
.bagfig img{height:70px}
.balls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:330px;margin:6px auto 0}
.bl{position:relative;width:46px;height:46px;border-radius:50%;margin:0 auto;border:2px solid #94a3b8;background:#fff;font-size:17px;font-weight:800;color:var(--ink);font-family:inherit;display:flex;align-items:center;justify-content:center;box-shadow:inset -3px -4px 0 rgba(0,0,0,.08)}
.bl.live{cursor:pointer}
.bl.live:hover{border-color:var(--indigo)}
.bl.a{background:#3b82f6;border-color:#1d4ed8;color:#fff}
.bl.c{background:#fb923c;border-color:#c2410c;color:#fff}
.bl.ac{background:linear-gradient(90deg,#3b82f6 50%,#fb923c 50%);border-color:#7c2d12;color:#fff}
.bl.ac::after{content:'두 번';position:absolute;top:-9px;right:-14px;background:#dc2626;color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:1px 5px;white-space:nowrap}
.bl.bad{border-color:#dc2626;border-width:3px;animation:nope .45s}
.bl.dim{opacity:.35}
.meter svg{display:block;width:100%;height:auto}
.meter.shake{animation:nope .5s 2}
/* 분류 */
.ox-row .ox-b{width:auto;padding:0 10px;font-size:13px}

.refs{display:flex;flex-direction:column;gap:8px}
.ref{border:1.5px solid #e0e7ff;border-radius:10px;padding:6px 8px;background:#fff}
.ref-h{font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:4px;text-align:left}
.ref-b{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.ref-b span{min-width:28px;border:1.5px solid #c7d2fe;border-radius:6px;font-weight:800;font-size:13.5px;padding:2px 4px;text-align:center}
/* 달걀 */

.ebk{border:2px solid #e5e7eb;background:#fff;border-radius:12px;padding:4px 2px;font-family:inherit;text-align:center;cursor:pointer;transition:transform .2s}

.giftbox{margin-top:10px;border:2.5px dashed #f59e0b;border-radius:14px;background:#fffbeb;padding:6px;display:flex;align-items:center;gap:8px;min-height:84px}

.ebar span.rest{background:#fb923c;color:#fff}

<div class="hdr">
  <a href="index.html" id="hubBackLink" style="background:rgba(255,255,255,.2);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;">← 학습 선택 목록으로 돌아가기</a>
  <span class="hdr-title">사건 A와 사건 B가 동시에 일어날 확률</span>
  <button id="adminBtn" onclick="openAdminModal()" style="margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;cursor:pointer;font-family:inherit">🔐 관리자 모드</button>
</div>
<script>
document.getElementById('hubBackLink').href = 'index.html' + location.search;
(function(){
  var _hb = document.getElementById('hubBackLink');
  var _urlNum = new URLSearchParams(location.search).get('num');
  var _isPreview = !_urlNum || _urlNum === '99'; // 관리자 미리보기(파라미터 없음 또는 99번) 때는 나가기 경고 안 띄움
  _hb.addEventListener('click', function(e){
    if(!_isPreview && !window._activityDone && !confirm('아직 다 끝내지 않았어요! 지금 나가면 처음부터 다시 해야 해요. 그래도 나갈까요?')){
      e.preventDefault();
    }
  });
  if(!_isPreview){
    window.addEventListener('beforeunload', function(e){
      if(!window._activityDone){ e.preventDefault(); e.returnValue=''; }
    });
  }
})();
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const s = { cls:p.get('cls'), num:p.get('num'), name:p.get('name'), id:p.get('id')||'prob-and' };
  window._hubStudent = s;
  let _db=null;
  try{
    firebase.initializeApp({
      apiKey: "AIzaSyDUFYrqaVL12fZ7ZhExVyyjLWSE_XJ_bHs",
      authDomain: "nd-deogi-math-hub.firebaseapp.com",
      projectId: "nd-deogi-math-hub",
      storageBucket: "nd-deogi-math-hub.firebasestorage.app",
      messagingSenderId: "414096731864",
      appId: "1:414096731864:web:a799f9450859c498b6b1ad"
    });
    _db = firebase.firestore();
  }catch(e){ console.warn('hub firebase init:', e); }
  window._hubDb = _db;
  let _reported=false;
  window._reportHubComplete = function(){
    window._activityDone = true;
    if(_reported || !_db || !s.cls || !s.num) return;
    _reported=true;
    window._pendingQuizComplete = _db.collection('classStudents').doc(String(s.cls)).collection('students').doc(String(s.num))
      .set({ name: s.name||'', itemsOpened: firebase.firestore.FieldValue.arrayUnion(s.id), quizSolveCount: firebase.firestore.FieldValue.increment(1), lastActive: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true})
      .catch(err=>console.warn('hub complete log failed', err));
  };
  // 완료 기록이 서버에 닿기 전에 페이지를 떠나지 않도록 잠깐 기다렸다가 이동
  document.getElementById('hubBackLink').addEventListener('click', function(e){
    if(!window._pendingQuizComplete) return;
    e.preventDefault();
    const href = this.href;
    Promise.race([window._pendingQuizComplete.catch(()=>{}), new Promise(r=>setTimeout(r,800))]).then(()=>{ location.href = href; });
  });
})();
function finishToHub(){ document.getElementById('hubBackLink').click(); }
</script>

<script>
/* ════════════════════════════════
   공용 헬퍼
════════════════════════════════ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function pick1(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(lo,hi){ return lo+Math.floor(Math.random()*(hi-lo+1)); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function $(id){ return document.getElementById(id); }
function setFb(id, ok, msg){ const fb=$(id); fb.className='feedback '+(ok===true?'success':ok==='info'?'info':'error'); fb.innerHTML=msg; }
function parseCount(s){ const m=String(s||'').replace(/\s+/g,'').match(/^(\d+)(가지|개|번|명|장|회|석|곳|권)?$/); return m?parseInt(m[1],10):null; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; }
function reduce(n,d){ const g=gcd(n,d)||1; return [n/g, d/g]; }
function sfrac(n,d){ return `<span class="sfrac"><span>${n}</span><span>${d}</span></span>`; }
function pval(p){ return p[1]===1 ? String(p[0]) : sfrac(p[0],p[1]); }    // 확률 값 보여 주기 (정수는 그대로)
function itp(){ return '<span class="it">p</span>'; }
function itv(c){ return `<span class="it">${c}</span>`; }
function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
// 받침에 따라 조사 고르기 (낱말, 숫자 모두)
const NUM_BATCHIM = [true,true,false,true,false,false,true,true,true,false];   // 영 일 이 삼 사 오 육 칠 팔 구
function hasBatchim(w){
  if(typeof w==='number' || /^\d+$/.test(String(w))) return NUM_BATCHIM[Number(w)%10];   // 10, 20…은 '십'으로 끝나 받침 있음
  const c = String(w).charCodeAt(String(w).length-1);
  if(c>=0xAC00 && c<=0xD7A3) return (c-0xAC00)%28!==0;
  return false;
}
function josa(w, withB, noB){ return String(w) + (hasBatchim(w)?withB:noB); }

/* ════════════════════════════════
   읽기 확인 · 찍기 방지 (앞 차시 파일들과 같은 방식)
   - readGate: 질문이 뜨고 읽을 시간도 안 지나 고르면 채점하지 않고 질문을 다시 보게 함
   - wrongLock: 틀리면 몇 초 동안 잠그고(틀릴수록 길게) 보기 순서를 다시 섞음
   - firstTry: 질문마다 첫 시도만 기록 → 완료 화면에 '한 번에 맞힌 질문' 표시
   - 틀려도 정답은 보여 주지 않음
════════════════════════════════ */
const GUARD = { on:true };            // 검증 스크립트·관리자 시연에서만 끔
const LOCK_SECS = [3,5,8];
const stat = { seen:{}, total:0, first:0 };
const shown = {}, tries = {};
function firstTry(qid, ok){ if(qid in stat.seen) return; stat.seen[qid]=ok; stat.total++; if(ok) stat.first++; }
function graded(qid, r){ if(r===false) firstTry(qid,false); return r===true; }
function flashRef(ref){
  const el = typeof ref==='string' ? $(ref) : ref;
  if(!el) return;
  el.classList.remove('reread'); void el.offsetWidth; el.classList.add('reread');
}
function markShown(qid, blockId){
  const el = $(blockId);
  const len = el ? el.textContent.replace(/\s+/g,'').length : 40;
  shown[qid] = { t:Date.now(), need:Math.min(4000, Math.max(1500, len*25)), block:blockId };
}
function readGate(qid, fbId){
  const s = shown[qid];
  if(!GUARD.on || !s || Date.now()-s.t >= s.need) return true;
  setFb(fbId,false,'✋ 잠깐! 질문을 끝까지 읽고 골라 봐요.');
  const kq = document.querySelector('#'+s.block+' .key-q');
  if(kq) flashRef(kq);
  return false;
}
function lockSecs(qid){
  tries[qid] = (tries[qid]||0)+1;
  return GUARD.on ? LOCK_SECS[Math.min(tries[qid],LOCK_SECS.length)-1] : 0;
}
// secs초 동안 안내문에 남은 시간을 보여 준 뒤 onDone. anchor가 화면에서 사라지면 멈춤
function lockTimer(secs, fbId, msg, what, anchor, onDone){
  if(!secs){ onDone(); return; }
  let left = secs;
  const paint = ()=>setFb(fbId,false,`${msg}<br><span class="lock-note">⏳ ${left}초 뒤에 ${what}</span>`);
  paint();
  const t = setInterval(()=>{
    if(!document.body.contains(anchor)){ clearInterval(t); return; }
    left--;
    if(left<=0){ clearInterval(t); onDone(); } else paint();
  }, 1000);
}
function wrongLock(o){
  const row = $(o.row);
  const btns = [...row.querySelectorAll('button')];
  btns.forEach(b=>b.disabled=true);
  lockTimer(lockSecs(o.qid), o.fb, o.msg, '다시 고를 수 있어요', row, ()=>{
    btns.forEach(b=>{ b.disabled=false; b.classList.remove('wrong','active'); });
    shuffle(btns).forEach(b=>b.parentNode.appendChild(b));
    setFb(o.fb,false,o.msg+'<br><span class="sub">다시 골라 보세요.</span>');
  });
}
// 객관식 한 문항 공통: 읽기 확인 → 첫 시도 기록 → 오답이면 잠금. 정답일 때만 true
function choiceGrade(q, btn, ok, wrongMsg){
  if(btn.disabled || !readGate(q, q+'Fb')) return false;
  firstTry(q, ok);
  markChoice(q+'Row', btn, ok);
  if(!ok){ wrongLock({qid:q, row:q+'Row', fb:q+'Fb', msg:wrongMsg}); return false; }
  return true;
}
const RETHINK = '❌ 다시 한 번 생각해 보세요!';
const UNREDUCED = '🔎 약분까지 해야 완벽한 정답이 됩니다!';

/* ════════════════════════════════
   입력칸: 숫자 · 글자 · 확률(분자/분모 따로, 정수는 위 칸에만)
════════════════════════════════ */
function choiceCol(name, opts){
  return `<div class="choice-col" id="${name}Row">`+shuffle(opts).map(o=>`<button class="choice-btn" data-k="${o.key}" onclick="${name}Pick('${o.key}',this)">${o.label}</button>`).join('')+`</div>`;
}
function markChoice(rowId, btn, ok){
  document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.classList.remove('active','wrong'));
  btn.classList.add(ok?'correct':'wrong');
  if(ok) document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.disabled=true);
}
function probHTML(p){ return `<span class="frac"><input class="blank" id="${p}N" inputmode="numeric" autocomplete="off"><span class="fbar"></span><input class="blank" id="${p}D" inputmode="numeric" autocomplete="off"></span>`; }
const PROB_NOTE = '<p class="sub">분수는 위 칸에 분자, 아래 칸에 분모를 써요.</p>';
// 확률 칸 채점: ans는 기약분수 [분자,분모] (정수면 분모 1)
// 답이 0이면 0/6, 0/1처럼 분자가 0이면 모두 정답 · 답이 1이면 6/6, 1/1처럼 분자=분모이면 모두 정답 (약분 안내 없음)
// 답이 0이나 1일 때 분모 칸을 비우고 0, 1만 써도 정답. 그 밖의 답에서 분모 칸이 비어 있으면 빈칸으로 봄
// 'ok' / 'wrong' / 'empty' / 'unreduced'
function gradeProb(p, ans){
  const nr=$(p+'N').value.trim(), dr=$(p+'D').value.trim();
  const isInt = ans[1]===1;
  if(nr==='') return 'empty';
  const n = parseCount(nr);
  if(dr===''){
    if(!isInt) return 'empty';
    return (n!==null && n===ans[0]) ? 'ok' : 'wrong';
  }
  const d = parseCount(dr);
  if(n===null || d===null || d===0 || n*ans[1]!==d*ans[0]) return 'wrong';
  if(isInt) return 'ok';
  return gcd(n,d)===1 ? 'ok' : 'unreduced';
}
function normTxt(s){ return String(s||'').replace(/[\s'"‘’“”.,!]/g,''); }
// 채점 항목: {id,val} 숫자 / {txt:id, acc:[…]} 글자 / {prob:p, ans:[n,d]} 확률
// 결과: true / false / null(빈칸) / 'unreduced'(값은 맞지만 약분 안 함 — 오답으로 치지 않음)
function checkItems(items, fbId){
  let empty=false, wrong=0, unred=null;
  const mark = (el, ok)=>{ el.classList.toggle('wrong',!ok); };
  for(const it of items){
    if(it.prob){
      const r = gradeProb(it.prob, it.ans);
      const nE=$(it.prob+'N'), dE=$(it.prob+'D');
      if(r==='empty'){ empty=true; continue; }
      if(r==='wrong'){ wrong++; mark(nE,false); mark(dE,false); continue; }
      mark(nE,true); mark(dE,true);
      if(r==='unreduced' && !it.eq) unred = it.ans;
    } else if(it.expr){
      const g = gradeExpr(it);
      if(g==='empty'){ empty=true; continue; }
      if(g==='wrong'){ wrong++; continue; }
    } else if(it.txt){
      const el=$(it.txt); const raw=normTxt(el.value);
      if(raw===''){ empty=true; continue; }
      const ok = it.acc.some(a=>normTxt(a)===raw); if(!ok) wrong++; mark(el, ok);
    } else {
      const el=$(it.id); const raw=el.value.trim();
      if(raw===''){ empty=true; continue; }
      const ok = parseCount(raw)===it.val; if(!ok) wrong++; mark(el, ok);
    }
  }
  if(wrong){ setFb(fbId,false,'❌ 빨간 칸을 다시 한 번 생각해 보세요!'); return false; }
  if(empty){ setFb(fbId,false,'빈칸을 모두 채워 주세요.'); return null; }
  if(unred){ setFb(fbId,'info', UNREDUCED); return 'unreduced'; }
  items.forEach(it=>{
    const els = it.expr ? exprEls(it) : it.prob ? [$(it.prob+'N'),$(it.prob+'D')] : [$(it.txt||it.id)];
    els.forEach(el=>{ el.classList.add('correct'); el.disabled=true; });
  });
  return true;
}

// SVG 안의 세로 분수 (가운데가 y)
function svgFrac(x, y, n, d, fs, color){
  const w = Math.max(String(n).length, String(d).length)*fs*0.62 + 6;
  return `<text x="${x}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${color}">${n}</text>`+
    `<line x1="${(x-w/2).toFixed(1)}" y1="${y}" x2="${(x+w/2).toFixed(1)}" y2="${y}" stroke="${color}" stroke-width="1.5"/>`+
    `<text x="${x}" y="${(y+fs-0.5).toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${color}">${d}</text>`;
}
// 0~1 수직선 + 동그라미 표지. marks:[{v, tag, color}] — 표지끼리 겹치면 위로 쌓음 (같은 자리의 값끼리만 겹쳐 쌓임)
const NL = { W:420, X0:40, X1:380, r:12, gap:28 };
function nlLayout(marks){
  const X = v=>NL.X0+(NL.X1-NL.X0)*v;
  const placed = [];
  marks.forEach(m=>{
    const px = X(m.v);
    let r=0; while(placed.some(p=>p.r===r && Math.abs(p.px-px) < NL.r*2+3)) r++;
    placed.push(Object.assign({}, m, {px, r}));
  });
  const nR = 1 + Math.max(0, ...placed.map(p=>p.r));
  const axisY = 8 + nR*NL.gap + 14;
  placed.forEach(p=>{ p.cy = axisY - 24 - p.r*NL.gap; });
  return { placed, axisY, H:axisY+40, X };
}
function nlSVG(marks){
  const { placed, axisY, H, X } = nlLayout(marks);
  let s = `<svg viewBox="0 0 ${NL.W} ${H}">`;
  s += `<line x1="${NL.X0}" y1="${axisY}" x2="${NL.X1}" y2="${axisY}" stroke="#1a1a2e" stroke-width="2.4" stroke-linecap="round"/>`;
  [[0,1],[1,2],[1,1]].forEach(([n,d])=>{
    const x = X(n/d);
    s += `<line x1="${x}" y1="${axisY-6}" x2="${x}" y2="${axisY+6}" stroke="#1a1a2e" stroke-width="2"/>`;
    s += d===1 ? `<text x="${x}" y="${axisY+24}" text-anchor="middle" font-size="15" font-weight="800" fill="#1a1a2e">${n}</text>` : svgFrac(x, axisY+20, n, d, 12, '#1a1a2e');
  });
  placed.forEach(p=>{ s += `<line x1="${p.px.toFixed(1)}" y1="${(p.cy+NL.r).toFixed(1)}" x2="${p.px.toFixed(1)}" y2="${axisY}" stroke="${p.color}" stroke-width="1.8"/>`; });
  placed.forEach(p=>{ s += `<circle cx="${p.px.toFixed(1)}" cy="${axisY}" r="5" fill="${p.color}" stroke="#fff" stroke-width="1.6"/>`; });
  placed.forEach(p=>{
    s += `<circle cx="${p.px.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="${NL.r}" fill="${p.color}" stroke="#fff" stroke-width="2"/>`+
      `<text x="${p.px.toFixed(1)}" y="${(p.cy+4.5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${p.tag}</text>`;
  });
  return s + `</svg>`;

/* ── 식 세우기 칸: [□] (+ − × 고르기) [□] = [답]
   채점 항목 {expr:id, terms:[[n,d],…], op:'×'|'+'} — 칸의 순서는 상관없고 값이 같으면 정답(약분 전 꼴도 됨) */
const OPS = ['+','−','×'];
function opSel(id, ops, wide){
  ops = ops || OPS;
  return `<span class="opsel${wide?' wide':''}" id="${id}" data-v="">${ops.map(o=>`<button type="button" onclick="opPick('${id}','${o}')">${o}</button>`).join('')}</span>`;
}
function opPick(id, o){
  const el = $(id); if(!el || el.classList.contains('done') || el.classList.contains('lock')) return;
  el.dataset.v = o; el.classList.remove('wrong');
  el.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.textContent===o));
}
// labels: 칸 아래 이름표(없으면 빈칸), ansId/ansLab: 답 칸
function exprRow(id, k, labels, ansId, ansLab){
  const cols = [];
  for(let t=0; t<k; t++){
    if(t) cols.push([opSel(id+'o'+t)]);
    cols.push([probHTML(id+'t'+t), (labels&&labels[t])||'']);
  }
  cols.push(['='], [probHTML(ansId), ansLab||'']);
  return `<div class="def-box calc-box expr" style="margin-top:4px">${calcRow(cols)}</div>
    <p class="sub">□에는 확률을, 가운데 ○에서는 알맞은 계산 기호를 골라요.</p>`;
}
function exprEls(it){
  const els = [];
  it.terms.forEach((_,t)=>{ els.push($(it.expr+'t'+t+'N'), $(it.expr+'t'+t+'D')); });
  return els;
}
function gradeExpr(it){
  const k = it.terms.length, vals = [];
  let empty = false;
  for(let t=0; t<k; t++){
    const n = parseCount($(it.expr+'t'+t+'N').value.trim()), d = parseCount($(it.expr+'t'+t+'D').value.trim());
    if($(it.expr+'t'+t+'N').value.trim()==='' || $(it.expr+'t'+t+'D').value.trim()==='') empty = true;
    vals.push(n===null || d===null || d===0 ? null : [n,d]);
  }
  const ops = []; for(let t=1; t<k; t++) ops.push($(it.expr+'o'+t));
  if(empty || ops.some(o=>!o.dataset.v)) return 'empty';
  const left = it.terms.slice(); let wrong = false;
  vals.forEach((v,t)=>{
    const j = v ? left.findIndex(a=>a[0]*v[1]===a[1]*v[0]) : -1;
    const ok = j>=0; if(ok) left.splice(j,1); else wrong = true;
    [$(it.expr+'t'+t+'N'), $(it.expr+'t'+t+'D')].forEach(el=>el.classList.toggle('wrong', !ok));
  });
  const want = it.op || '×';
  ops.forEach(o=>{ const ok = o.dataset.v===want; o.classList.toggle('wrong', !ok); if(!ok) wrong = true; });
  if(!wrong) ops.forEach(o=>o.classList.add('done'));
  return wrong ? 'wrong' : 'ok';
}

/* ── 확률 문제 3단계 (판단 틀)
   '동시에': ① '동시에' 문제인가? → ② 두 사건이 서로 영향을 끼치나? → ③ 곱하기
   '또는'  : ① '또는' 문제인가?  → ② 두 사건이 동시에 일어날 수 있나? → ③ 더하기
   cfg: { kind:'and'|'or', evs:'두 사건(문장)…는', why2:'②의 까닭', target:'구하는 확률', after } 또는 steps를 직접 줌 */
const RT = {};
function rtStd(cfg){
  const and = cfg.kind==='and';
  return [
    { h:'① 무엇을 묻는 문제일까?', q:'이 문제는 어떤 문제일까?',
      opts:[{key:'or', label:`'또는' 문제예요.`}, {key:'and', label:`'동시에' 문제예요.`}], good:cfg.kind,

// 넓이 정사각형: phase 0 전체, 1 세로 3칸(하늘색 줄), 2 가로 2칸까지(6칸)
function areaSVG(phase){
  const X0 = 64, Y0 = 44, S = 270, cw = S/3, rh = S/2;
  let s = `<svg viewBox="0 0 350 330" role="img" aria-label="넓이 그림">`;
  if(phase===0){
    s += `<rect x="${X0}" y="${Y0}" width="${S}" height="${S}" fill="#eef2ff" stroke="#1a1a2e" stroke-width="3"/>
      <text x="${X0+S/2}" y="${Y0+S/2-6}" text-anchor="middle" font-size="22" font-weight="800" fill="#4338ca">전체 = 1</text>
      <text x="${X0+S/2}" y="${Y0+S/2+20}" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">추천 버튼이 고를 수 있는 모든 냉장고</text>`;
    return s + `</svg>`;
  }
  TOPC.forEach((t,i)=>{
    const x = X0 + i*cw;
    s += `<rect x="${x+4}" y="10" width="${cw-8}" height="24" rx="12" fill="${t.c}" stroke="#334155" stroke-width="1.4"/>
      <text x="${x+cw/2}" y="27" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1a1a2e">${t.nm}</text>`;
    BOTC.forEach((b,j)=>{
      const y = Y0 + j*rh, hh = phase>=2 ? rh : S, yy = phase>=2 ? y : Y0;
      if(phase<2 && j>0) return;
      const sky = t.k==='sky', hit = phase>=2 && sky && b.k==='pk';
      const fill = hit ? '#f472b6' : ({br:'#e2c29f', sky:'#bae6fd', wh:'#ffffff'})[t.k];
      s += `<rect x="${x}" y="${yy}" width="${cw}" height="${hh}" fill="${fill}" stroke="#94a3b8" stroke-width="1"/>`;
      if(phase>=2) s += fridgeSVG(t.k, b.k, {w:30, x:x+cw/2-15, y:y+rh/2-26});
    });
  });
  if(phase===1) s += `<rect x="${X0+cw}" y="${Y0}" width="${cw}" height="${S}" fill="none" stroke="#f59e0b" stroke-width="4"/>`;
  if(phase>=2){
    BOTC.forEach((b,j)=>{
      const y = Y0 + j*rh;
      s += `<rect x="6" y="${y+rh/2-13}" width="52" height="26" rx="13" fill="${b.c}" stroke="#334155" stroke-width="1.4"/>
        <text x="32" y="${y+rh/2+5}" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1a2e">${b.nm}</text>`;
    });
    s += `<line x1="${X0}" y1="${Y0+rh}" x2="${X0+S}" y2="${Y0+rh}" stroke="#1a1a2e" stroke-width="2.4" class="slide"/>`;
    s += `<rect x="${X0+cw}" y="${Y0}" width="${cw}" height="${rh}" fill="none" stroke="#f59e0b" stroke-width="4"/>`;
  }
  s += `<line x1="${X0+cw}" y1="${Y0}" x2="${X0+cw}" y2="${Y0+S}" stroke="#1a1a2e" stroke-width="2.4"/><line x1="${X0+2*cw}" y1="${Y0}" x2="${X0+2*cw}" y2="${Y0+S}" stroke="#1a1a2e" stroke-width="2.4"/>`;
  s += `<rect x="${X0}" y="${Y0}" width="${S}" height="${S}" fill="none" stroke="#1a1a2e" stroke-width="3"/>`;
  return s + `</svg>`;
}

// 원판: k등분, lose = 꽝 칸 번호 집합, winTxt = 당첨 칸 글자
function spinLose(k, w){ const s = new Set(); for(let i=0;i<k;i++){ if(Math.floor((i+1)*(k-w)/k) > Math.floor(i*(k-w)/k)) s.add(i); } return s; }
function spinSVG(k, lose, o){
  o = o || {};
  const c = 110, r = 100, W = ['#fde68a','#bae6fd','#bbf7d0','#fbcfe8'];
  let s = `<svg viewBox="0 0 220 236" role="img" aria-label="원판"${o.w?` width="${o.w}"`:''} style="display:block;margin:0 auto;max-width:100%;height:auto">`;
  let wi = 0;
  for(let i=0;i<k;i++){
    const a0 = (-90 + i*360/k)*Math.PI/180, a1 = (-90 + (i+1)*360/k)*Math.PI/180, am = (a0+a1)/2;
    const x0 = c + r*Math.cos(a0), y0 = c + r*Math.sin(a0), x1 = c + r*Math.cos(a1), y1 = c + r*Math.sin(a1);
    const L = lose.has(i);
    const fill = L ? '#fb923c' : W[(wi++)%W.length];
    s += `<path d="M${c},${c} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${fill}" stroke="#fff" stroke-width="2.5"/>`;
    const tx = c + r*0.64*Math.cos(am), ty = c + r*0.64*Math.sin(am);
    s += L ? `<text x="${tx.toFixed(1)}" y="${(ty+6).toFixed(1)}" text-anchor="middle" font-size="${k>8?13:16}" font-weight="900" fill="#fff">꽝</text>`
           : `<text x="${tx.toFixed(1)}" y="${(ty+6).toFixed(1)}" text-anchor="middle" font-size="${o.icon?20:(k>8?11:13)}" font-weight="800" fill="#78350f">${o.icon?'🍦':'당첨'}</text>`;
  }
  s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#334155" stroke-width="3"/>`;
  if(o.needle) s += `<g id="${o.needle}" style="transform:rotate(${o.rot||0}deg);transform-origin:${c}px ${c}px"><polygon points="${c-7},${c} ${c},${c-r+14} ${c+7},${c}" fill="#1f2937"/></g>`;
  s += `<circle cx="${c}" cy="${c}" r="10" fill="#1f2937" stroke="#fff" stroke-width="2"/>`;
  return s + `</svg>`;
}
const SP_LOSE = new Set([1,5]);     // 교과서 원판: 8칸 중 꽝 2칸
// 8×8 표: 재이(세로) × 해이(가로). mode 'both' | 'miss' | 'atleast' | ''
function grid8SVG(mode){
  const X0 = 66, Y0 = 62, C = 34, n = 8;
  let s = `<svg viewBox="0 0 352 346" role="img" aria-label="두 사람의 결과 표">`;
  s += `<text x="${X0+C*4}" y="16" text-anchor="middle" font-size="12.5" font-weight="800" fill="#be185d">해이가 돌린 결과 →</text>`;
  s += `<text x="14" y="${Y0+C*4}" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1d4ed8" transform="rotate(-90 14 ${Y0+C*4})">재이가 돌린 결과 →</text>`;
  const head = (i)=> SP_LOSE.has(i) ? ['#fb923c','꽝','#fff'] : ['#fde68a','🍦','#78350f'];
  for(let i=0;i<n;i++){
    const [f,t,tc] = head(i);
    s += `<rect x="${X0+i*C+2}" y="${Y0-28}" width="${C-4}" height="24" rx="6" fill="${f}"/><text x="${X0+i*C+C/2}" y="${Y0-11}" text-anchor="middle" font-size="12" font-weight="900" fill="${tc}">${t}</text>`;
    s += `<rect x="${X0-30}" y="${Y0+i*C+2}" width="26" height="${C-4}" rx="6" fill="${f}"/><text x="${X0-17}" y="${Y0+i*C+C/2+5}" text-anchor="middle" font-size="12" font-weight="900" fill="${tc}">${t}</text>`;
  }
  for(let a=0;a<n;a++) for(let b=0;b<n;b++){
    const wa = !SP_LOSE.has(a), wb = !SP_LOSE.has(b);
    let fill = '#f1f5f9';
    if(mode==='both' && wa && wb) fill = '#60a5fa';
    if(mode==='miss' && !wa && !wb) fill = '#f87171';
    if(mode==='atleast') fill = (!wa && !wb) ? '#f87171' : '#34d399';
    s += `<rect x="${X0+b*C+1}" y="${Y0+a*C+1}" width="${C-2}" height="${C-2}" rx="4" fill="${fill}"/>`;
  }
  s += `<rect x="${X0}" y="${Y0}" width="${C*n}" height="${C*n}" fill="none" stroke="#334155" stroke-width="2"/>`;
  return s + `</svg>`;
}

const STAGES = ['냉장고 색은 내 마음대로?','둘 다 원하는 색일 확률은?','더할까, 곱할까?','언제나 곱해도 될까?','동전과 주사위를 함께 던지면?','두 사람 모두 공짜 아이스크림?','더할까, 곱할까? 다시 한 번','문제풀이'];
const PRACTICE = 7;
let frontier = 0, viewing = 0;
const built = {};
let practiceScreen = 'scPractice';
function stageBox(side, i){
  const id = (side==='L'?'ls':'rs')+i;
  let el = $(id);
  if(!el){
    el = document.createElement('div'); el.id = id; el.style.display='none';
    (side==='L' ? $('actLeft') : $('actRight')).appendChild(el);
  }
  return el;
}
function R(html){ stageBox('R',frontier).innerHTML = html; }
function L(html){ stageBox('L',frontier).innerHTML = html; }
function enterStage(i){
  frontier = i; built[i] = true;
  stageBox('L',i).innerHTML=''; stageBox('R',i).innerHTML='';
  showStage(i);
}
function showStage(i){
  if(!built[i]) return;
  viewing = i;
  if(i===PRACTICE){ showScreen(practiceScreen); renderStepper(); return; }
  showScreen('scAct');
  for(let k=0;k<PRACTICE;k++){ const l=$('ls'+k), r=$('rs'+k); if(l) l.style.display = k===i?'':'none'; if(r) r.style.display = k===i?'':'none'; }
  $('backBanner').innerHTML = i<frontier ? `<div class="back-banner">👀 지난 단계를 다시 보고 있어요. <button class="btn" onclick="showStage(frontier)">지금 하던 단계로 돌아가기 →</button></div>` : '';
  renderStepper();
}
function renderStepper(){
  $('stepper').innerHTML = STAGES.map((s,i)=>{
    const cls = i===viewing ? (i<frontier?'viewing':'active') : i===frontier ? 'active' : (built[i] ? 'done' : '');
    const can = built[i] && i!==viewing;
    return `<button class="st ${cls}" ${can?`onclick="showStage(${i})" style="cursor:pointer"`:'disabled'}>${i+1}. ${s}</button>`;
  }).join('');
}

const CHK = {};

function runChk(id){
  const c = CHK[id];
  if(!c || !$(id+'Btn') || $(id+'Btn').disabled) return;
  const items = typeof c.items==='function' ? c.items() : c.items;
  if(!graded(id, checkItems(items, id+'Fb'))) return;
  firstTry(id, true);
  $(id+'Btn').disabled = true;
  setFb(id+'Fb', true, c.msg || '✅ 맞아요!');

function choiceBlock(id, inner, opts, good, okMsg, after){

  };
  return `<div class="qblock" id="${id}Block">${inner}${choiceCol(id, opts)}<div class="feedback" id="${id}Fb"></div></div>`;

function appendQ(html, id, kind){
  stageBox('R',frontier).insertAdjacentHTML('beforeend', html);
  const b = $(id+'Block');
  if(b && kind!=='choice') b.querySelectorAll('input').forEach(x=>x.addEventListener('keydown', ev=>{ if(ev.key==='Enter') runChk(id); }));
  if(kind==='choice') markShown(id, id+'Block');
  scrollToEl(id+'Block');
}
function nextBlock(id, note, label, fn){
  stageBox('R',frontier).insertAdjacentHTML('beforeend', `<div class="qblock" id="${id}End">
    ${note ? `<div class="note-box">${note}</div>` : ''}
    <div class="btn-row"><button class="btn" id="${id}NextBtn" onclick="this.disabled=true;${fn}()">${label}</button></div></div>`);

}
function numIn(id){ return `<input class="blank" id="${id}" inputmode="numeric" autocomplete="off">`; }
function calcRow(cols){
  return `<table class="calc"><tr>${cols.map(c=>`<td class="${c.length===1?'op':'v'}">${c[0]}</td>`).join('')}</tr>
    <tr>${cols.map(c=>`<td class="cl">${c[1]||''}</td>`).join('')}</tr></table>`;
}

/* ════════════════════════════════
   1단계: 냉장고 색은 내 마음대로? — 직접 꾸미기 · 추천 버튼 3번 → 1/3, 1/2
════════════════════════════════ */
const S0 = { t:null, b:null, recs:0, busy:false, log:[] };
const STORE_TXT = `어느 매장에서는 냉장고의 <b>냉장 칸</b> 색을 <b>갈색, 하늘색, 흰색</b> 중 하나로, <b>냉동 칸</b> 색을 <b>분홍색, 회색</b> 중 하나로 고를 수 있다. 냉장 칸 색과 냉동 칸 색은 각각 따로 고르고, <u>각 색을 고를 가능성은 모두 같다</u>.`;
function s0Left(){
  return `<div class="exp-head"><span class="exp-badge">매장</span><span>냉장고 색 고르기 화면</span></div>
    <div class="fig" id="s0Fig">
      <div class="fridge-wrap" id="s0Fridge">${fridgeSVG(S0.t, S0.b, {w:118, lab:true})}</div>
      <div class="sw-row"><span class="sw-lab">냉장 칸</span>${TOPC.map(c=>swBtn('s0Pick','t',c,S0.t===c.k,S0.busy)).join('')}</div>
      <div class="sw-row"><span class="sw-lab">냉동 칸</span>${BOTC.map(c=>swBtn('s0Pick','b',c,S0.b===c.k,S0.busy)).join('')}</div>
    </div>
    <div class="btn-row" style="margin-top:0"><button class="btn" id="recBtn" onclick="s0Rec()"${S0.busy?' disabled':''}>🎲 아무거나 추천</button></div>
    <div class="dlog" id="s0Log">${S0.log.map((x,i)=>`<span class="no">${i+1}회: ${x}</span>`).join('')}</div>`;
}
function s0Redraw(){ stageBox('L',0).innerHTML = s0Left(); }
function s0Pick(side, k){ if(S0.busy) return; S0[side] = k; s0Redraw(); }
function stage0(){
  enterStage(0);
  Object.assign(S0, { t:null, b:null, recs:0, busy:false, log:[] });
  L(s0Left());
  R(`<div class="panel-title"><span class="step-badge">1</span>냉장고 색은 내 마음대로?</div>
    ${talk('j','hi','우리 집 냉장고를 새로 사기로 했어! 이 매장에서는 <b>냉장 칸</b>과 <b>냉동 칸</b>의 색을 따로 고를 수 있대.')}
    <div class="prob-box">${STORE_TXT}</div>
    <div class="qblock" style="border-top:none" id="s0aBlock">
      <p class="key-q task">왼쪽에서 색을 눌러 냉장고를 꾸며 보고, <span class="em">🎲 아무거나 추천</span> 버튼을 3번 눌러 보자.</p>
      <p class="sub">추천 버튼은 냉장 칸 색 하나, 냉동 칸 색 하나를 아무렇게나 골라 줘요.</p>
    </div>`);
}
function s0Rec(){
  if(S0.busy) return;
  S0.busy = true;
  let step = 0;
  const tick = ()=>{
    if(!$('s0Fridge')){ S0.busy = false; return; }
    S0.t = pick1(TOPC).k; S0.b = pick1(BOTC).k;
    if(step < 9){ step++; $('s0Fridge').innerHTML = fridgeSVG(S0.t, S0.b, {w:118, lab:true}); setTimeout(tick, 60+step*12); return; }
    S0.busy = false; S0.recs++;
    S0.log.push(`${colT(S0.t).nm}·${colB(S0.b).nm}`);
    s0Redraw(); flashL('s0Fridge');
    if(S0.recs===3 && !$('s0bBlock')) s0After();
  };
  s0Redraw();
  tick();
}
function s0After(){
  appendQ(choiceBlock('s0b',
    `<p class="lead">추천 결과는 누를 때마다 달라요. 무엇이 나올지 미리 알 수 없지요.</p>
     <p class="key-q">추천 버튼이 냉장 칸 색을 고를 때, <span class="em">하늘색이 나올 가능성</span>은 다른 색과 비교하면 어떨까?</p>`,
    [{key:'same', label:'갈색, 하늘색, 흰색이 나올 가능성이 모두 같아요.'}, {key:'more', label:'하늘색이 다른 색보다 더 잘 나와요.'}, {key:'many', label:'추천을 많이 할수록 하늘색이 더 잘 나와요.'}],
    'same', `✅ 맞아요. 문제에서 <span class="kw">각 색을 고를 가능성은 모두 같다</span>고 했어요. 그래서 경우의 수로 확률을 구할 수 있어요.`,
    ()=>appendQ(chkBlock('s0c',
      `<p class="key-q task">추천 버튼이 고른 냉장고에서 <span class="em">냉장 칸이 하늘색일 확률</span>과 <span class="em">냉동 칸이 분홍색일 확률</span>을 각각 구해 보자.</p>
       <div class="fline"><span class="lab">(냉장 칸이 하늘색일 확률)</span> = ${probHTML('s0c1')}</div>
       <div class="fline"><span class="lab">(냉동 칸이 분홍색일 확률)</span> = ${probHTML('s0c2')}</div>${PROB_NOTE}`,
      [{prob:'s0c1', ans:[1,3], eq:true}, {prob:'s0c2', ans:[1,2], eq:true}],
      ()=>nextBlock('s0', `냉장 칸 색은 3가지 중 하나라서 하늘색일 확률은 ${F(1,3)}, 냉동 칸 색은 2가지 중 하나라서 분홍색일 확률은 ${F(1,2)}이에요.<br>그런데 재이가 원하는 냉장고는 따로 있대요. 다음 단계에서 들어 봐요.`,
        '다음: 둘 다 원하는 색일 확률은? →', 'stage1')), 's0c')), 's0b', 'choice');
}

/* ════════════════════════════════
   진열대 (2단계 매장 A, 4단계 매장 B): 색을 골라 냉장고를 만들어 빠짐없이·중복 없이 진열
════════════════════════════════ */
const BST = {
  1:{ t:null, b:null, shelf:[], done:false, want:false, need:6, store:'A', ban:null, onDone:null },
  3:{ t:null, b:null, shelf:[], done:false, want:false, need:5, store:'B', ban:(t,b)=>t==='wh'&&b==='pk', onDone:null }
};
function bReset(key){ Object.assign(BST[key], { t:null, b:null, shelf:[], done:false, want:false }); }
function shelfHTML(key){
  const s = BST[key];
  if(!s.shelf.length) return `<span class="empty">아직 진열한 냉장고가 없어요.</span>`;
  return s.shelf.map(([t,b],i)=>`<div class="slot${s.want&&t==='sky'&&b==='pk'?' want':''}" id="slot${key}_${i}">${fridgeSVG(t,b,{w:30})}<span>${i+1}</span></div>`).join('');
}
function builderLeft(key){
  const s = BST[key], dis = s.done;
  const tagCls = key===1 ? 'a' : 'b';
  return `<div class="exp-head"><span class="exp-badge"><span class="store-tag ${tagCls}" style="padding:0">매장 ${s.store}</span></span><span>색을 골라 냉장고를 만들고 🛒 진열하기를 눌러요.</span></div>
    <div class="fig" id="bFig${key}" style="padding:8px">
      <div style="display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap">
        <div class="fridge-wrap" id="bPrev${key}">${fridgeSVG(s.t, s.b, {w:62})}</div>
        <div>
          <div class="sw-row"><span class="sw-lab">냉장 칸</span>${TOPC.map(c=>swBtn('bPick'+key,'t',c,s.t===c.k,dis)).join('')}</div>
          <div class="sw-row"><span class="sw-lab">냉동 칸</span>${BOTC.map(c=>{ const ban = s.ban && s.ban(s.t, c.k); return swBtn('bPick'+key,'b',c,s.b===c.k,dis||ban,ban); }).join('')}</div>
        </div>
      </div>
      ${s.ban ? `<div class="rule-note">📢 매장 B 규칙: 냉장 칸이 흰색이면 냉동 칸은 회색만 골라요.</div>` : ''}
      <div class="btn-row"><button class="btn" onclick="bAdd(${key})"${dis?' disabled':''}>🛒 진열하기</button><button class="btn btn-soft" onclick="bFull(${key})"${dis?' disabled':''}>✅ 다 진열했어요</button></div>
      <div class="shelf" id="shelf${key}">${shelfHTML(key)}</div>
      <div class="shelf-msg" id="shelfMsg${key}"></div>
    </div>
    ${key===1 && s.done ? `<div class="fig tree" id="treeFig"><div class="fig-cap" style="margin:0 0 4px">🌳 나뭇가지 그림으로 정리하면</div>${treeSVG(s.want)}</div>` : ''}`;
}
function bRedraw(key, msg, ok){
  stageBox('L',key).innerHTML = builderLeft(key);
  if(msg){ const m = $('shelfMsg'+key); m.className = 'shelf-msg '+(ok?'ok':'bad'); m.innerHTML = msg; }
}
function bPick(key, side, k){
  const s = BST[key]; if(s.done) return;
  s[side] = k;
  let msg = '';
  if(s.ban && s.t && s.b && s.ban(s.t, s.b)){ s.b = null; msg = '매장 B에서는 흰색 냉장 칸에 분홍색 냉동 칸을 고를 수 없어요.'; }
  bRedraw(key, msg, false);
}
function bPick1(side,k){ bPick(1,side,k); }
function bPick3(side,k){ bPick(3,side,k); }
function bAdd(key){
  const s = BST[key]; if(s.done) return;
  if(!s.t || !s.b){ bRedraw(key, '냉장 칸과 냉동 칸 색을 모두 골라요.', false); return; }
  const i = s.shelf.findIndex(([t,b])=>t===s.t && b===s.b);
  if(i>=0){ bRedraw(key, '이미 진열한 냉장고예요! 다른 냉장고를 만들어 봐요.', false); flashRef('slot'+key+'_'+i); return; }
  s.shelf.push([s.t, s.b]);
  s.t = null; s.b = null;
  bRedraw(key, `진열했어요! (지금 ${s.shelf.length}대)`, true);
}
function bFull(key){
  const s = BST[key]; if(s.done) return;
  const ok = s.shelf.length===s.need;
  firstTry('shelf'+key, ok);
  if(!ok){ bRedraw(key, '❌ 아직 만들 수 있는 냉장고가 더 있어요. 다시 한 번 살펴보세요!', false); return; }
  s.done = true;
  const ti = k=>TOPC.findIndex(x=>x.k===k), bi = k=>BOTC.findIndex(x=>x.k===k);
  s.shelf.sort((x,y)=> ti(x[0])-ti(y[0]) || bi(x[1])-bi(y[1]));
  bRedraw(key, '✅ 빠짐없이, 중복 없이 모두 진열했어요! (냉장 칸 색 순서로 다시 정리했어요)', true);
  flashL('shelf'+key);
  if(s.onDone) s.onDone();
}

/* ════════════════════════════════
   2단계: 둘 다 원하는 색일 확률은? — 매장 A 진열 → 나뭇가지 그림 → 6가지 중 1가지 → 1/6
════════════════════════════════ */
function stage1(){
  enterStage(1);
  bReset(1);
  BST[1].onDone = s1Done;
  L(builderLeft(1));
  R(`<div class="panel-title"><span class="step-badge">2</span>둘 다 원하는 색일 확률은?</div>
    ${talk('j','think','나는 <b>냉장 칸은 하늘색, 냉동 칸은 분홍색</b>인 냉장고가 갖고 싶어. 추천 버튼이 딱 이렇게 골라 줄 확률은 얼마일까?')}
    ${talk('h','hi','추천 버튼이 고를 수 있는 냉장고를 <b>모두</b> 늘어놓아 보면 알 수 있지 않을까?', true)}
    <div class="qblock" style="border-top:none" id="s1aBlock">
      <p class="key-q task">왼쪽 진열대에 이 매장에서 만들 수 있는 냉장고를 <span class="em">빠짐없이, 중복 없이</span> 모두 진열해 보자.</p>
      <p class="sub">다 진열했으면 ✅ 다 진열했어요 버튼을 눌러요.</p>
    </div>`);
}
function s1Done(){
  flashL('treeFig');
  appendQ(chkBlock('s1b',
    `<p class="lead">진열대를 정리했더니 왼쪽 아래에 <b>나뭇가지 그림</b>이 생겼어요.</p>
     <p class="key-q task">추천 버튼이 고를 수 있는 냉장고는 모두 몇 가지이고, 그중 <span class="em">재이가 원하는 냉장고</span>는 몇 가지일까? 그리고 그 확률은?</p>
     <div class="count-row">모든 경우의 수: ${numIn('s1b1')} 가지</div>
     <div class="count-row">냉장 칸은 하늘색, 냉동 칸은 분홍색인 경우의 수: ${numIn('s1b2')} 가지</div>
     <div class="fline"><span class="lab">(냉장 칸은 하늘색, 냉동 칸은<br>분홍색일 확률)</span> = ${probHTML('s1bf')}</div>${PROB_NOTE}`,
    [{id:'s1b1', val:6}, {id:'s1b2', val:1}, {prob:'s1bf', ans:[1,6], eq:true}],
    ()=>{
      BST[1].want = true; bRedraw(1); flashL('treeFig');
      nextBlock('s1', `냉장 칸 색 3가지 각각에 냉동 칸 색이 2가지씩 있어서 모든 경우의 수는 <b>3 × 2 = 6</b>(가지)예요. 경우의 수 단원에서 배운 <span class="kw">곱의 법칙</span>이지요.<br>그중 재이가 원하는 냉장고는 1가지라서 확률은 ${F(1,6)}이에요.<br>그럼 앞에서 구한 ${F(1,3)}, ${F(1,2)}과 지금 구한 ${F(1,6)} 사이에는 어떤 관계가 있을까요?`,
        '다음: 더할까, 곱할까? →', 'stage2');
    }), 's1b');
}

/* ════════════════════════════════
   3단계: 더할까, 곱할까? — 기호 고르기 → 넓이 정사각형을 나누어 '1/3의 1/2' 확인
════════════════════════════════ */
const S2 = { phase:0, live:0 };
function s2Left(){
  const cap = S2.phase===0 ? '정사각형 전체 = 추천 버튼이 고를 수 있는 모든 냉장고 (확률 1)'
    : S2.phase===1 ? '냉장 칸 색으로 세로 3줄로 나누었어요 (하늘색 줄 = 냉장 칸이 하늘색인 냉장고)'
    : '하늘색 줄을 냉동 칸 색으로 다시 2칸으로 나누었어요 (분홍 칸 = 재이가 원하는 냉장고)';
  return `<div class="exp-head"><span class="exp-badge">넓이</span><span>정사각형의 넓이로 확률을 나타내 봐요.</span></div>
    <div class="fig area" id="s2Fig">${areaSVG(S2.phase)}<div class="fig-cap">${cap}</div></div>
    <div class="area-tools">
      <button class="btn" id="s2Cut1" onclick="s2Cut(1)"${S2.live===1?'':' disabled'}>① 냉장 칸 색으로 나누기</button>
      <button class="btn" id="s2Cut2" onclick="s2Cut(2)"${S2.live===2?'':' disabled'}>② 냉동 칸 색으로 나누기</button>
    </div>`;
}
function s2Redraw(){ stageBox('L',2).innerHTML = s2Left(); }
function stage2(){
  enterStage(2);
  S2.phase = 0; S2.live = 0;
  L(s2Left());
  const card = (n,d,cap,goal)=>`<div class="op-card${goal?' goal':''}">${F(n,d)}<span class="cap">${cap}</span></div>`;
  R(`<div class="panel-title"><span class="step-badge">3</span>더할까, 곱할까?</div>
    ${talk('h','think',`지금까지 구한 확률을 모아 보자. 세 확률 사이에 어떤 계산이 숨어 있을까?`, true)}
    <div class="qblock" style="border-top:none" id="s2aBlock">
      <div class="op-cards">${card(1,3,'냉장 칸이<br>하늘색일 확률')}${opSel('s2op',['+','−','×','÷'],true)}${card(1,2,'냉동 칸이<br>분홍색일 확률')}<span>=</span>${card(1,6,'냉장 칸은 하늘색, 냉동<br>칸은 분홍색일 확률',true)}</div>
      <p class="key-q">○ 안에 <span class="em">어떤 계산 기호</span>가 들어가야 식이 맞을까?</p>
      <div class="btn-row"><button class="btn btn-check" id="s2aBtn" onclick="s2Check()">확인</button></div>
      <div class="feedback" id="s2aFb"></div>
    </div>`);
}
function s2Check(){
  const btn = $('s2aBtn'); if(!btn || btn.disabled) return;
  const v = $('s2op').dataset.v;
  if(!v){ setFb('s2aFb', false, '○ 안에 들어갈 기호를 골라 주세요.'); return; }
  const ok = v==='×';
  firstTry('s2a', ok);
  if(!ok){
    const val = v==='+' ? F(5,6) : v==='−' ? '−'+F(1,6) : F(2,3);
    $('s2op').classList.add('wrong');
    const msg = `${F(1,3)} ${v} ${F(1,2)} = ${val} 이에요. ${RETHINK}`;
    btn.disabled = true; $('s2op').classList.add('lock');
    lockTimer(lockSecs('s2a'), 's2aFb', msg, '다시 고를 수 있어요', btn, ()=>{ btn.disabled = false; $('s2op').classList.remove('lock'); setFb('s2aFb', false, msg); });
    return;
  }
  btn.disabled = true; $('s2op').classList.add('done');
  setFb('s2aFb', true, `✅ 맞아요! ${F(1,3)} × ${F(1,2)} = ${F(1,6)}이에요.`);
  S2.live = 1; s2Redraw(); flashL('s2Cut1');
  stageBox('R',2).insertAdjacentHTML('beforeend', `<div class="qblock" id="s2bBlock">${talk('j','think','정말 곱하기가 맞을까? 우연히 맞은 건 아닐까?')}
    <p class="key-q task">그림으로 확인해 보자. 왼쪽 <span class="em">① 냉장 칸 색으로 나누기</span> 버튼을 눌러 보자.</p></div>`);
  scrollToEl('s2bBlock');
}
function s2Cut(n){
  if(S2.live!==n) return;
  S2.phase = n; S2.live = 0; s2Redraw(); flashL('s2Fig');
  if(n===1){
    appendQ(chkBlock('s2c',

/* ════════════════════════════════
   5단계: 동전과 주사위를 함께 던지면? (예제 3) — 3단계 → 1/2 × 3/6 = 1/4 → 컴퓨터로 던져 확인
════════════════════════════════ */
const S4 = { n:0, hit:0, pts:[], last:[], simOn:false, asked:false };
function cdFigHTML(){
  return `<div class="fig cd" id="s4Fig"><div style="display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap">
      <div>${coinSVG('앞',38)} ${coinSVG('뒤',38,true)}<div class="fig-cap" style="margin-top:2px">동전: 앞면, 뒷면</div></div>
      <div>${[1,2,3,4,5,6].map(v=>dieSVG(v,28,v%2===0)).join(' ')}<div class="fig-cap" style="margin-top:2px">주사위: 1 ~ 6</div></div>
    </div><div class="fig-cap">초록 테두리 = 동전은 뒷면, 주사위는 짝수의 눈</div></div>`;
}
function simSVG(){
  const W = 400, H = 200, X0 = 40, X1 = 388, Y0 = 14, Y1 = 170, maxN = Math.max(200, S4.n);
  const X = n=>X0+(X1-X0)*n/maxN, Y = r=>Y1-(Y1-Y0)*r;
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  [[0,'0'],[0.25,'1/4'],[0.5,'1/2'],[0.75,'3/4'],[1,'1']].forEach(([v,t])=>{
    s += `<line x1="${X0}" y1="${Y(v)}" x2="${X1}" y2="${Y(v)}" stroke="#e5e7eb" stroke-width="1"/><text x="${X0-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">${t}</text>`;
  });
  s += `<line x1="${X0}" y1="${Y1}" x2="${X1}" y2="${Y1}" stroke="#1a1a2e" stroke-width="1.6"/><line x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y1}" stroke="#1a1a2e" stroke-width="1.6"/>`;
  s += `<text x="${X1}" y="${H-6}" text-anchor="end" font-size="11" font-weight="700" fill="#64748b">던진 횟수 (${maxN}번까지)</text>`;
  if(S4.pts.length) s += `<polyline points="${S4.pts.map(([n,r])=>`${X(n).toFixed(1)},${Y(r).toFixed(1)}`).join(' ')}" fill="none" stroke="#16a34a" stroke-width="2.2"/>`;
  return s + `</svg>`;
}
function s4SimInner(){
  const now = S4.last.length ? S4.last[S4.last.length-1] : null, hitNow = now && now[0]==='뒤' && now[1]%2===0;
  return `<div class="fig-cap" style="margin:0 0 4px">'뒷면이면서 짝수'가 나온 비율</div>
      <div class="sim-now">${now ? `${coinSVG(now[0],34,hitNow)} ${dieSVG(now[1],32,hitNow)} <span class="${hitNow?'ok':'no'}">${hitNow?'뒷면이면서 짝수!':'아니에요'}</span>` : '<span class="no">아직 던지지 않았어요</span>'}</div>
      ${simSVG()}
      <div class="sim-stat">던진 횟수 <b style="color:var(--ink)">${S4.n}</b>번 · 뒷면이면서 짝수 <b>${S4.hit}</b>번${S4.n?` · 비율 약 <b>${(S4.hit/S4.n).toFixed(3)}</b>`:''}</div>
      <div class="dlog">${S4.last.map(([c,d])=>`<span class="${c==='뒤'&&d%2===0?'ok':'no'}">${c}·${d}</span>`).join('')}</div>
      <div class="btn-row"><button class="btn" id="simBtn" onclick="s4Run()"${S4.n>=2000||S4.busy?' disabled':''}>${S4.busy ? `🎲 던지는 중… (${S4.busyK}/200)` : '💻 컴퓨터로 200번 더 던지기'}</button></div>`;
}
function s4Left(){

function stage4(){

  S4.gen = (S4.gen||0) + 1;

    <div class="prob-box">동전 한 개와 주사위 한 개를 동시에 던질 때, 동전은 <u>뒷면</u>이 나오고 주사위는 <u>짝수의 눈</u>이 나올 확률을 구하시오.</div>`);
  appendRoutine('s4r', { kind:'and', evs:'동전에서 나오는 면과 주사위에서 나오는 눈은',
    why2:'동전이 어느 면이 나오든 주사위는 그대로 1부터 6까지의 눈이 똑같이 나올 수 있어요.',

function s4Expr(){
  appendQ(chkBlock('s4b',
    `<p class="key-q task">식을 세워 확률을 구해 보자.</p>
     ${exprRow('s4x', 2, ['(동전이 뒷면이<br>나올 확률)', '(주사위가 짝수의<br>눈이 나올 확률)'], 's4f', '(구하는 확률)')}${PROB_NOTE}`,
    [{expr:'s4x', terms:[[1,2],[3,6]], op:'×'}, {prob:'s4f', ans:[1,4], eq:true}],
    ()=>{
      S4.simOn = true; stageBox('L',4).innerHTML = s4Left(); flashL('s4Sim');

      scrollToEl('s4cBlock');

function s4Run(){
  if(S4.n>=2000 || S4.busy) return;
  S4.busy = true; S4.busyK = 0;
  const gen = S4.gen, box = $('s4Sim');
  if(box) box.innerHTML = s4SimInner();
  const t0 = Date.now();
  const toss = ()=>{
    const c = Math.random()<0.5 ? '앞' : '뒤', d = randInt(1,6);
    S4.n++; S4.busyK++; if(c==='뒤' && d%2===0) S4.hit++;
    if(S4.n%5===0) S4.pts.push([S4.n, S4.hit/S4.n]);
    S4.last.push([c,d]); if(S4.last.length>12) S4.last.shift();
  };
  const tick = ()=>{
    if(gen!==S4.gen) return;                       // 단계를 벗어나면 멈춤
    const goal = Math.min(200, Math.max(S4.busyK+1, Math.ceil((Date.now()-t0)/5000*200)));   // 5초에 걸쳐 200번
    while(S4.busyK<goal) toss();
    const bx = $('s4Sim');
    if(S4.busyK>=200){ S4.busy = false; if(bx) bx.innerHTML = s4SimInner(); s4After(); return; }
    if(bx) bx.innerHTML = s4SimInner();
    setTimeout(tick, 25);
  };
  setTimeout(tick, 25);
}

    appendQ(choiceBlock('s4d',
      `<p class="lead">왼쪽 그래프를 보세요. 600번 넘게 던졌어요.</p>

      [{key:'q', label:`${F(1,4)}에 가까워져요.`}, {key:'h', label:`${F(1,2)}에 가까워져요.`}, {key:'t', label:`${F(3,4)}에 가까워져요.`}],
      'q', `✅ 맞아요. 실제로 많이 던져 보면 계산한 확률 ${F(1,4)}에 가까워져요.`,
      ()=>nextBlock('s4', `동전과 주사위는 서로 영향을 끼치지 않으니 ${F(1,2)} × ${F(3,6)} = ${F(1,4)}로 구할 수 있었어요.`, '다음: 두 사람 모두 공짜 아이스크림? →', 'stage5')), 's4d', 'choice');

const S5 = { rot:0, res:{j:null, h:null}, busy:false, grid:'' };

}
function s5Redraw(){ stageBox('L',5).innerHTML = s5Left(); }
function stage5(){
  enterStage(5);
  Object.assign(S5, { rot:0, res:{j:null, h:null}, busy:false, grid:'' });

    <div class="qblock" style="border-top:none" id="s5aBlock">
      <p class="key-q task">먼저 왼쪽에서 <span class="em">재이와 해이가 한 번씩</span> 원판을 돌려 보자.</p>
    </div>`);

function s5Spin(who){
  if(S5.busy || S5.res[who]!==null) return;

    S5.busy = false; S5.res[who] = !SP_LOSE.has(sec);

    why2:'재이에게 무엇이 나오든 해이가 돌릴 때 원판은 그대로예요.', target:'두 사람 모두 당첨될 확률', after:s5Expr });
}
function s5Expr(){

     ${exprRow('s5x', 2, ['(재이가 당첨될<br>확률)', '(해이가 당첨될<br>확률)'], 's5f', '(두 사람 모두<br>당첨될 확률)')}${PROB_NOTE}`,

         <p class="key-q task">그럼 <span class="em">두 사람 모두 꽝</span>일 확률은 얼마일까?</p>

            `${talk('j','think','가게 사장님이 “두 사람 중 <b>적어도 한 사람은</b> 당첨될 확률도 알려 줄래요?”라고 물어보셨어.')}
             <p class="key-q task"><span class="em">적어도 한 사람은 당첨</span>될 확률을 구해 보자.</p>

             <div class="fline"><span class="lab">(적어도 한 사람은<br>당첨될 확률)</span> = ${probHTML('s5e1')}</div>`,
            [{prob:'s5e1', ans:[15,16], eq:true}],

              nextBlock('s5', `'적어도 한 사람은 당첨'이 일어나지 않는 경우는 <b>'두 사람 모두 꽝'</b> 하나뿐이에요.<br>
                그래서 <span class="kw">1 − ${F(1,16)} = ${F(15,16)}</span>이에요. 초록 칸 60칸을 하나하나 세는 것보다 훨씬 편하지요!`,
                '다음: 더할까, 곱할까? 다시 한 번 →', 'stage6');
            }, '✅ 맞아요!'), 's5e');
        }, `✅ 맞아요! ${F(2,8)} × ${F(2,8)} = ${F(1,16)}이에요.`), 's5d');
    }, `✅ 맞아요! ${F(6,8)} × ${F(6,8)} = ${F(9,16)}이에요.`), 's5c');

/* ════════════════════════════════
   7단계: 더할까, 곱할까? 다시 한 번 — '또는'·'동시에' 섞은 4문제 분류

const MIX6 = {
  or:[ '주사위 한 개를 던질 때, 1의 눈 또는 6의 눈이 나올 확률',
       '1부터 10까지의 수가 적힌 카드 10장 중 한 장을 뽑을 때, 3의 배수 또는 7이 적힌 카드가 나올 확률',
       '우리 반 학생 중 한 명을 뽑을 때, 그 학생의 혈액형이 A형 또는 B형일 확률' ],
  and:[ '주사위 한 개를 두 번 던질 때, 첫 번째에는 1의 눈, 두 번째에는 6의 눈이 나올 확률',
        '동전 두 개를 동시에 던질 때, 두 동전 모두 앞면이 나올 확률',
        '두 상자에서 제비를 각각 한 개씩 뽑을 때, 두 제비 모두 당첨 제비일 확률' ]
};
const S6 = { rows:[], sel:{}, done:false };
function s6Left(){
  return `<div class="exp-head"><span class="exp-badge">정리</span><span>두 가지 3단계를 나란히 놓고 비교해 봐요.</span></div>
    <div class="frames">
      <div class="frame or"><h4>➕ '또는' 문제 3단계</h4>① '또는' 문제인지 확인<br>② 두 사건이 <b>동시에 일어날 수 있는지</b> 판단<br>③ 동시에 일어나지 않으면 <b>확률을 더해요</b></div>
      <div class="frame and"><h4>✖️ '동시에' 문제 3단계</h4>① '동시에' 문제인지 확인<br>② 두 사건이 <b>서로 영향을 끼치는지</b> 판단<br>③ 영향을 끼치지 않으면 <b>확률을 곱해요</b></div>

function stage6(){
  enterStage(6);

    ${talk('j','think',`앞 차시에서는 확률을 <b>더했고</b>, 이번 차시에서는 <b>곱했어</b>. 문제를 보고 어느 쪽인지 헷갈리지 않게 구별할 수 있을까?`)}
    <div class="qblock" style="border-top:none" id="s6aBlock">
      <p class="key-q task">각 확률을 구할 때 두 확률을 <span class="em">더해야 할지, 곱해야 할지</span> 골라 보자.</p>
      <div id="s6Rows">${s6RowsHTML()}</div>
      <div class="btn-row"><button class="btn btn-check" id="s6aBtn" onclick="s6Check()">확인</button></div>

function s6RowsHTML(){
  return S6.rows.map((r,i)=>{ const v = S6.sel[i]; return `<div class="sort-row" id="s6r${i}"><span>${r.t}</span>
    <span class="ox-btns"><button class="ox-b${v==='add'?' on':''}" onclick="s6Sel(${i},'add')"${S6.done?' disabled':''}>➕ 더해요</button><button class="ox-b${v==='mul'?' on':''}" onclick="s6Sel(${i},'mul')"${S6.done?' disabled':''}>✖️ 곱해요</button></span></div>`; }).join('');

function s6Sel(i, v){ if(S6.done) return; S6.sel[i] = v; $('s6Rows').innerHTML = s6RowsHTML(); }
function s6Check(){
  if(S6.done || $('s6aBtn').disabled) return;
  if(S6.rows.some((_,i)=>!S6.sel[i])){ setFb('s6aFb', false, '모든 줄을 골라 주세요.'); return; }

  firstTry('s6a', ok);
  S6.rows.forEach((_,i)=>$('s6r'+i).classList.toggle('bad', bad[i]));
  if(!ok){ setFb('s6aFb', false, '❌ 빨간 줄을 다시 한 번 생각해 보세요!'); return; }
  S6.done = true; $('s6aBtn').disabled = true;
  $('s6Rows').innerHTML = s6RowsHTML(); S6.rows.forEach((_,i)=>$('s6r'+i).classList.add('good'));
  setFb('s6aFb', true, '✅ 모두 맞아요!');
  nextBlock('s6', `한 번 해서 <b>둘 중 하나</b>가 나오면 되는 '또는' 문제는 확률을 <b>더하고</b>,<br>두 가지를 따로 해서 <b>둘 다</b> 일어나야 하는 '동시에' 문제는 확률을 <b>곱해요</b>.<br>이제 문제풀이에서 3단계로 생각하며 풀어 봐요!`,
    '문제풀이 시작 →', 'goToPractice');
}

/* ════════════════════════════════
   문제풀이 문제 만들기
   레벨1: 두 확률을 구해 곱하기 (동전·주사위 / 두 상자 제비 / 원판 두 사람)
   레벨2: 거꾸로 (빨간 공 개수 / 한쪽 확률) + 두 사람 모두 꽝
   레벨3: '또는'·'동시에' 섞기 (같은 상황에서 묻는 것만 다르게) + 적어도 한 사람
════════════════════════════════ */
const DIEEV = [
  {nm:'짝수의 눈', f:v=>v%2===0}, {nm:'홀수의 눈', f:v=>v%2===1}, {nm:'3의 배수의 눈', f:v=>v%3===0},
  {nm:'4 이상의 눈', f:v=>v>=4}, {nm:'2 이하의 눈', f:v=>v<=2}, {nm:'소수의 눈', f:v=>v===2||v===3||v===5},
  {nm:'6의 약수의 눈', f:v=>6%v===0}, {nm:'5 이상의 눈', f:v=>v>=5}, {nm:'4의 약수의 눈', f:v=>4%v===0}
];
DIEEV.forEach(e=>{ e.c = [1,2,3,4,5,6].filter(e.f).length; });
const DIE_SAME = '주사위에서 어떤 눈이 나오든';
function rtAnd(evs, why2, target){ return { kind:'and', evs, why2, target }; }
function rtOr(evs, why2, target){ return { kind:'or', evs, why2, target }; }

// 레벨1 ① 동전과 주사위 / 서로 다른 두 주사위
function genCoinDie(){
  if(Math.random()<0.5){
    const face = pick1(['앞면','뒷면']), ev = pick1(DIEEV);
    return { gen:'coinDie', text:`동전 한 개와 주사위 한 개를 동시에 던질 때, 동전은 ${face}이 나오고 주사위는 ${ev.nm}이 나올 확률을 구하시오.`,
      p:reduce(ev.c, 12), label:'(구하는 확률)', fig:{kind:'coindie'}, note:`1/2 × ${ev.c}/6`,
      rt:rtAnd('동전에서 나오는 면과 주사위에서 나오는 눈은', '동전이 어느 면이 나오든 주사위의 눈이 나오는 것과는 상관없어요.', `동전은 ${face}, 주사위는 ${ev.nm}이 나올 확률`),
      ex:{ terms:[[1,2],[ev.c,6]], op:'×', labels:[`(${face}이<br>나올 확률)`, `(${ev.nm}이<br>나올 확률)`] } };
  }
  const [e1, e2] = pickN(DIEEV, 2);
  return { gen:'dice2', text:`서로 다른 두 개의 주사위 A, B를 동시에 던질 때, 주사위 A는 ${e1.nm}이 나오고 주사위 B는 ${e2.nm}이 나올 확률을 구하시오.`,
    p:reduce(e1.c*e2.c, 36), label:'(구하는 확률)', fig:{kind:'dice2'}, note:`${e1.c}/6 × ${e2.c}/6`,
    rt:rtAnd('주사위 A의 눈과 주사위 B의 눈은', '주사위 A에서 어떤 눈이 나오든 주사위 B의 눈이 나오는 것과는 상관없어요.', `주사위 A는 ${e1.nm}, 주사위 B는 ${e2.nm}이 나올 확률`),
    ex:{ terms:[[e1.c,6],[e2.c,6]], op:'×', labels:[`(A에서 ${e1.nm}이<br>나올 확률)`, `(B에서 ${e2.nm}이<br>나올 확률)`] } };
}
// 레벨1 ② / 레벨2 두 상자 제비 (mode 'win' 모두 당첨 | 'miss' 모두 당첨 아님)
function boxNums(){
  for(;;){
    const n1 = randInt(4,10), a = randInt(1,n1-1), n2 = randInt(4,10), b = randInt(1,n2-1);
    if(n1===n2 && a===b) continue;
    return { n1, a, n2, b };
  }
}
function genBoxes(mode){
  const { n1, a, n2, b } = boxNums(), miss = mode==='miss';
  const x = miss ? n1-a : a, y = miss ? n2-b : b;
  const what = miss ? '두 제비 모두 당첨 제비가 아닐' : '두 제비 모두 당첨 제비일';
  return { gen:'boxes', text:`상자 A에는 제비 ${n1}개 중 당첨 제비가 ${a}개, 상자 B에는 제비 ${n2}개 중 당첨 제비가 ${b}개 들어 있다. 두 상자에서 제비를 각각 한 개씩 임의로 뽑을 때, ${what} 확률을 구하시오.`,
    p:reduce(x*y, n1*n2), label:'(구하는 확률)', fig:{kind:'boxes', n1, a, n2, b}, note:`${x}/${n1} × ${y}/${n2}`,
    rt:rtAnd('상자 A에서 뽑은 제비와 상자 B에서 뽑은 제비는', '상자 A에서 무엇을 뽑든 상자 B의 제비는 그대로예요.', `${what} 확률`),

// 레벨3: 같은 상황에서 '또는'과 '동시에'
function numEvents(N){
  const ev = [];
  [6,8,9,10,12,16,18,20].filter(a=>a<=N).forEach(a=>ev.push({k:'d', nm:`${a}의 약수`, f:v=>a%v===0}));
  [3,4,5,6,7,9].forEach(b=>{ if(Math.floor(N/b)>=2) ev.push({k:'m', nm:`${b}의 배수`, f:v=>v%b===0}); });
  [2,3,4].forEach(k=>ev.push({k:'le', nm:`${k} 이하의 수`, f:v=>v<=k}));
  [N-3,N-2,N-1].forEach(k=>ev.push({k:'ge', nm:`${k} 이상의 수`, f:v=>v>=k}));
  return ev;
}

      rt:rtOr(`'${e1.nm}이 나온다'와 '${e2.nm}이 나온다'는`, '주사위 한 개를 한 번 던지면 눈은 하나만 나오고, 두 사건에 모두 들어가는 눈이 없어요.', `${e1.nm} 또는 ${e2.nm}이 나올 확률`),

// 판단 질문은 레벨이 오를수록 줄여요: 레벨1 첫 문제만 3단계 전부 → 레벨2 없음 → 레벨3 질문 하나
function makeLevel(levelIdx){
  let L;
  if(levelIdx===0){ L = shuffle([genCoinDie(), genBoxes('win'), genSpin('win')]); L.forEach((q,i)=>q.rtMode = i===0 ? 'full' : 'none'); return L; }
  if(levelIdx===1){ L = shuffle([genSwapCount(), genSwapProb(), pick1([()=>genBoxes('miss'), ()=>genSpin('miss')])()]); L.forEach(q=>q.rtMode='none'); return L; }
  const ctx = pick1(['card','die']);
  L = shuffle([genOr(ctx), genAnd(ctx), genAtLeast()]); L.forEach(q=>q.rtMode='one'); return L;
}
function rtFor(q){
  if(q.rtMode==='none') return null;
  if(q.rtMode==='full') return q.rt;
  if(q.atl){
    const s0 = q.rt.steps[0];
    return { head:'🧭 거꾸로 생각하기', steps:[ Object.assign({}, s0, { h:'반대로 생각하기',
      ok: s0.ok + ` 그러니 <span class="kw">반대 사건의 확률을 곱해서 구한 뒤 1에서 빼요</span>.` }) ] };
  }
  const and = q.rt.kind==='and';
  return { head:'🧭 판단하기', steps:[ { h:'더할까, 곱할까?', q:'이 문제는 두 확률을 <span class="em">어떻게 해야</span> 할까?',
    opts:[{key:'add', label:'두 확률을 더해요.'}, {key:'mul', label:'두 확률을 곱해요.'}], good: and?'mul':'add',
    ok: and ? `두 사건이 모두 일어나야 하는 '동시에' 문제이고, ${q.rt.why2} 서로 영향을 끼치지 않으니 <span class="kw">곱해요</span>.`
            : `둘 중 하나만 일어나도 되는 '또는' 문제이고, ${q.rt.why2} 동시에 일어나지 않으니 <span class="kw">더해요</span>.` } ] };
}

function drawSetupCanvas(key){
  const wrap = $(key+'DrawWrap'), canvas = $(key+'Ink');
  const rect = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width*dpr)); canvas.height = Math.max(1, Math.round(rect.height*dpr));
  canvas.style.width = rect.width+'px'; canvas.style.height = rect.height+'px';
  const ctx = canvas.getContext('2d'); if(!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round'; ctx.lineJoin='round';
  drawUpdateCursor(key);
}
function drawCanvasPoint(key, evt){ const rect = $(key+'Ink').getBoundingClientRect(); return { x: evt.clientX-rect.left, y: evt.clientY-rect.top }; }
let drawResizeOn = false;
function drawBindOnce(key){
  const canvas = $(key+'Ink'), d = drawGetSt(key);
  if(!canvas || canvas._bound) return;      // 레벨마다 왼쪽 판을 새로 그리므로 캔버스마다 한 번씩 연결
  canvas._bound = true;
  canvas.addEventListener('pointerdown', evt=>{ d.drawing=true; canvas.setPointerCapture(evt.pointerId); const p=drawCanvasPoint(key,evt); d.lastX=p.x; d.lastY=p.y; });
  canvas.addEventListener('pointermove', evt=>{
    if(!d.drawing) return;
    const p=drawCanvasPoint(key,evt), ctx=canvas.getContext('2d'); if(!ctx) return;
    ctx.beginPath(); ctx.moveTo(d.lastX,d.lastY); ctx.lineTo(p.x,p.y);
    if(d.erasing){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=24; }
    else{ ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=d.color; ctx.lineWidth=3; }
    ctx.stroke(); d.lastX=p.x; d.lastY=p.y;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(n=>canvas.addEventListener(n, ()=>{ d.drawing=false; }));
  if(!drawResizeOn){ drawResizeOn = true; window.addEventListener('resize', ()=>{ if($('pgInk') && $('scPractice').classList.contains('active')) drawSetupCanvas('pg'); }); }
  drawSetMode(key, d.mode);
}
function drawSelectColor(key, color, btn){

function drawToggleEraser(key){

function drawMakeCursorURL(draw, size){ const c=document.createElement('canvas'); c.width=size; c.height=size; const cx = c.getContext('2d'); if(!cx) return ''; draw(cx, size); return c.toDataURL('image/png'); }
function drawUpdateCursor(key){
  const canvas = $(key+'Ink'); if(!canvas) return;
  const d = drawGetSt(key);
  if(d.erasing){
    const size=26, r=11;
    const url = drawMakeCursorURL(cx=>{ cx.beginPath(); cx.arc(size/2,size/2,r,0,Math.PI*2); cx.fillStyle='rgba(255,255,255,0.4)'; cx.fill(); cx.lineWidth=2; cx.strokeStyle='#333a4d'; cx.stroke(); }, size);
    canvas.style.cursor = url ? `url(${url}) ${size/2} ${size/2}, cell` : 'cell';
  } else {
    const size=34;
    const url = drawMakeCursorURL(cx=>{
      cx.save(); cx.translate(18,18); cx.rotate(135*Math.PI/180);
      cx.fillStyle=d.color; cx.fillRect(-4,-14,8,16);
      cx.fillStyle='#f4c98c'; cx.beginPath(); cx.moveTo(-4,2); cx.lineTo(4,2); cx.lineTo(0,11); cx.closePath(); cx.fill();
      cx.fillStyle='#333a4d'; cx.beginPath(); cx.moveTo(-1.4,7.5); cx.lineTo(1.4,7.5); cx.lineTo(0,11); cx.closePath(); cx.fill();
      cx.restore();
    }, size);
    canvas.style.cursor = url ? `url(${url}) 10 10, crosshair` : 'crosshair';
  }
}

/* ════════════════════════════════
   관리자 모드 (SHA-256 해시 비교 — 가벼운 잠금일 뿐, 보안 장치 아님)
════════════════════════════════ */
const ADMIN_HASH = 'fb9e692b52ad41cd666f83c8175df90569d48192d531e9c94285929bc116891a';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function openAdminModal(){ $('adminPwInput').value=''; $('adminPwErr').textContent=''; $('adminPwModal').classList.add('show'); $('adminPwInput').focus(); }
async function checkAdminPassword(){
  const v = $('adminPwInput').value;
  let ok=false;
  try{ ok = (await sha256Hex(v)) === ADMIN_HASH; }
  catch(e){ $('adminPwErr').textContent='이 브라우저에서는 관리자 모드를 쓸 수 없어요.'; return; }
  if(!ok){ $('adminPwErr').textContent='비밀번호가 틀렸어요.'; return; }
  $('adminPwModal').classList.remove('show');
  showAdminPanel();
}

    '</div>'+
    '<div><strong>숫자 칸</strong>: 6 (= 6가지 = 6개, 띄어쓰기 무시)</div>'+

    '<div><strong>정리 팝업</strong>: 4단계 [p×q] (q×p, p*q, pxq, pq 모두 정답, 띄어쓰기·대소문자 무시)</div>'+
    '<div><strong>1. 냉장고</strong>: 추천 버튼 3번 → 가능성이 모두 같아요 → 1/3, 1/2</div>'+
    '<div><strong>2. 진열대(매장 A)</strong>: 6대 진열(중복이면 "이미 진열") → 6, 1, 1/6 → 나뭇가지 그림</div>'+
    '<div><strong>3. 더할까 곱할까</strong>: ○ = × (틀리면 그 기호로 계산한 값만 보여 줌) → ① 나누기 1/3 → ② 나누기 1/2, 1/6</div>'+
    '<div><strong>4. 매장 B</strong>: 흰색이면 회색만 → 5대 → 5, 1/5 → 영향을 끼치기 때문 → 분류(동전·주사위 X, 원판 두 사람 X, 매장 B O, 다시 넣지 않고 O, 다시 넣고 X) → 팝업 p×q</div>'+
    '<div><strong>5. 예제 3</strong>: 3단계(동시에 → 끼치지 않아요 → 곱해요) → 1/2 × 3/6 = 1/4 → 200번씩 던지기, 600번 넘으면 질문(1/4)</div>'+
    '<div><strong>6. 문제 7 원판</strong>: 8칸 중 꽝 2칸. 두 사람 돌리기 → 3단계 → 6/8 × 6/8 = 9/16 → 모두 꽝 1/16 → 적어도 한 사람 15/16</div>'+
    '<div><strong>7. 분류</strong>: \'또는\' 2개 더해요, \'동시에\' 2개 곱해요</div>'+
    '<div><strong>레벨1</strong>: 동전·주사위(또는 두 주사위) / 두 상자 제비 모두 당첨 / 원판 두 사람 모두 당첨</div>'+
    '<div><strong>레벨2</strong>: 모두 빨간 공일 확률을 주고 주머니 B 빨간 공 개수 / 두 사람 모두 성공할 확률과 재이 확률을 주고 해이 확률 / 두 사람(두 제비) 모두 꽝</div>'+
    '<div><strong>레벨3</strong>: 같은 상황(카드 또는 주사위)에서 \'또는\'(더하기) 1문제 + \'동시에\'(곱하기) 1문제 + 적어도 한 사람(1 − 모두 꽝)</div>'+
    '<div><strong>통과</strong>: 레벨마다 3문제 중 2문제 이상. 한 문제에 두 번까지 입력 (첫 오답은 봐줌), 두 번째 오답이면 틀린 것으로 하고 다음 문제. 정답 공개 없음, 힌트 없음</div>'+
    (cur ? `<div style="margin-top:4px;background:#fef3c7;border-radius:6px;padding:3px 6px"><strong>지금 문제 정답</strong>: ${cur.num ? cur.val+cur.unit : fmtP(cur.p)}${cur.atl?` (모두 꽝 ${fmtP(cur.m)})`:''}${cur.note?` (${cur.note})`:''}</div>` : '')+
    '<div style="color:var(--red);margin-top:6px">미인정: "여섯"처럼 한글 수사 / 확률을 소수로 쓴 경우 / 정리 팝업에 p, q 대신 다른 문자</div>'+
    '<div style="margin-top:6px"><strong>찍기 방지</strong>: 질문이 뜬 뒤 1.5~4초 안에 고르면 채점 안 함 · 객관식은 틀리면 3→5→8초 잠금 후 보기 다시 섞기 (정답 공개 안 함)</div>'+
    `<label style="display:block;margin-top:6px"><input type="checkbox" ${GUARD.on?'':'checked'} onchange="GUARD.on=!this.checked"> 시연용: 읽기 확인·잠금 끄기</label>`;
  $('adminPanel').style.display='block';
}
function adminPassTerm(){
  if(termCfg){
    const c = termCfg; closeTermPop();
    const el = $(c.box); if(el) el.classList.remove('term-wait');
    if(c.after) c.after();
  }
}
function closeHelp(){ $('helpModal').classList.remove('show'); }
function adminGo(i){
  closeTermPop(); closeHelp();
  const f = [stage0, stage1, stage2, stage3, stage4, stage5, stage6, ()=>startLevel(0), ()=>startLevel(1), ()=>startLevel(2)];
  f[i]();
  if($('adminPanel').style.display==='block') showAdminPanel();
}
