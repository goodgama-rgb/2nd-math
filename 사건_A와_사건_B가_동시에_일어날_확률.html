</script>
<script>
(function(){
  const _p = new URLSearchParams(location.search);
  const _cls = _p.get('cls'), _num = _p.get('num');
  if(!_cls || !_num || _num === '99') return; // 실제 학생 세션이 아니면(미배치/관리자 미리보기) 감지 안 함

  const FOCUS_LOCK_HASH = 'c99fabb46223864d27d154016c6f3eeb7406c61baa05d3e26999fd17e36acee5';
  const FOCUS_MIN_AWAY_MS = 3000; // 3초 미만의 짧은 전환(탭 깜빡임, 주소창 클릭 등)은 '딴짓'으로 안 침
  const MSG_TITLE = "다른 화면에 접속하여 수업 시간 외 활동을 한 것이 감지되었습니다.";
  function msgFor(n){
    if(n >= 3) return "이 내용은 '수업 태도 일지'에 기록됩니다. 시험 기간 동안 크롬북 사용이 제한됩니다.";
    if(n === 2) return "선생님 비밀번호를 입력해야 계속할 수 있어요. 한 번 더 반복되면 '수업 태도 일지'에 기록되고, 시험 기간 동안 크롬북 사용이 제한됩니다.";
    return "선생님 비밀번호를 입력해야 계속할 수 있어요. 두 번 더 반복되면 '수업 태도 일지'에 기록되고, 시험 기간 동안 크롬북 사용이 제한됩니다.";
  }

  function _loadScript(src){
    return new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  async function ensureDb(){
    if(typeof firebase === 'undefined'){
      await _loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
      await _loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
    }
    try{
      if(!firebase.apps.some(a=> a.name === 'hub')){
        firebase.initializeApp({
          apiKey: "AIzaSyDUFYrqaVL12fZ7ZhExVyyjLWSE_XJ_bHs",
          authDomain: "nd-deogi-math-hub.firebaseapp.com",
          projectId: "nd-deogi-math-hub",
          storageBucket: "nd-deogi-math-hub.firebasestorage.app",
          messagingSenderId: "414096731864",
          appId: "1:414096731864:web:a799f9450859c498b6b1ad"
        }, 'hub');
      }
    }catch(e){ /* 이미 존재하면 무시 */ }
    return firebase.app('hub').firestore();
  }
  async function sha256Hex(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b=> b.toString(16).padStart(2,'0')).join('');
  }
  function todayStr(){ return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul' }).format(new Date()); }
  function studentRef(db){ return db.collection('classStudents').doc(String(_cls)).collection('students').doc(String(_num)); }

  // ---- 잠금 화면 UI ----
  const overlay = document.createElement('div');
  overlay.id = 'focusLockOverlay';
  overlay.style.cssText = 'display:none;position:fixed;inset:0;z-index:999999;background:rgba(20,10,10,.92);color:#fff;align-items:center;justify-content:center;padding:24px;font-family:"Noto Sans KR",sans-serif;';
  overlay.innerHTML =
    '<div style="max-width:420px;width:100%;text-align:center;background:#2a1414;border:2px solid #e05a5a;border-radius:18px;padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,.5);">' +
      '<div style="font-size:40px;margin-bottom:10px;">\u{1F6AB}</div>' +
      '<div style="font-size:17px;font-weight:800;margin-bottom:10px;line-height:1.5;">' + MSG_TITLE + '</div>' +
      '<div id="focusLockSub" style="font-size:14px;color:#ffd6d6;margin-bottom:18px;line-height:1.6;"></div>' +
      '<input type="text" id="focusLockPw" placeholder="선생님 비밀번호" autocomplete="off" style="width:100%;padding:12px 14px;border-radius:10px;border:none;font-size:15px;margin-bottom:10px;box-sizing:border-box;-webkit-text-security:disc;">' +
      '<div id="focusLockErr" style="color:#ffb3b3;font-size:13px;min-height:18px;margin-bottom:8px;"></div>' +
      '<button type="button" id="focusLockBtn" style="width:100%;padding:12px;border:none;border-radius:10px;background:#e05a5a;color:#fff;font-weight:800;font-size:15px;cursor:pointer;">확인</button>' +
    '</div>';
  document.body.appendChild(overlay);

  function showLock(n){
    document.getElementById('focusLockSub').textContent = msgFor(n);
    document.getElementById('focusLockErr').textContent = '';
    document.getElementById('focusLockPw').value = '';
    overlay.style.display = 'flex';
    setTimeout(()=> document.getElementById('focusLockPw').focus(), 0);
  }
  function hideLock(){ overlay.style.display = 'none'; }

  async function unlockCheck(){
    const v = document.getElementById('focusLockPw').value;
    let ok = false;
    try{ ok = (await sha256Hex(v)) === FOCUS_LOCK_HASH; }
    catch(e){ document.getElementById('focusLockErr').textContent = '이 브라우저에서는 잠금 해제를 할 수 없어요.'; return; }
    if(ok){
      hideLock();
      ensureDb().then(db=> studentRef(db).set({ locked:false }, {merge:true}).catch(()=>{}));
    }else{
      document.getElementById('focusLockErr').textContent = '비밀번호가 틀렸어요.';
    }
  }
  overlay.querySelector('#focusLockBtn').addEventListener('click', unlockCheck);
  overlay.querySelector('#focusLockPw').addEventListener('keydown', function(e){ if(e.key === 'Enter') unlockCheck(); });

  // ---- 서버의 잠금 상태를 실시간 구독(문서 1개짜리라 비용 부담 적음) ----
  // 선생님이 관리자 페이지에서 원격으로 잠금 해제하면 학생 화면에서 새로고침 없이 바로 닫힘.
  // 학생이 탭을 몰래 닫았다 다시 열어도 구독이 다시 걸리며 현재 서버 상태를 그대로 반영.
  ensureDb().then((db)=>{
    studentRef(db).onSnapshot(function(snap){
      const data = snap.exists ? snap.data() : {};
      if(data.locked){
        const today = todayStr();
        const n = (data.focusLossByDate && data.focusLossByDate[today]) || 1;
        showLock(n);
      }else{
        hideLock();
      }
    }, function(err){ console.warn('focus-lock subscribe failed', err); });
  });

  // ---- 포커스 이탈 감지 ----
  // 탭이 완전히 가려지는 경우(visibilitychange)와, 창을 부분화면으로 띄워둔 채 다른 창으로
  // 포커스만 옮기는 경우(blur/focus)를 둘 다 감지함. 둘 다 FOCUS_MIN_AWAY_MS 이상 지속돼야 집계.
  let _awaySince = null;
  function _markAway(){ if(_awaySince === null) _awaySince = Date.now(); }
  function _markBack(){
    if(_awaySince === null) return;
    const elapsed = Date.now() - _awaySince;
    _awaySince = null;
    if(elapsed < FOCUS_MIN_AWAY_MS) return;
    ensureDb().then((db)=>{
      const ref = studentRef(db);
      const today = todayStr();
      ref.set({ locked:true, focusLossByDate: { [today]: firebase.firestore.FieldValue.increment(1) } }, { merge:true })
        .catch(function(e){ console.warn('focus-loss log failed', e); showLock(1); });
    });
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden') _markAway();
    else if(document.visibilityState === 'visible') _markBack();
  });
  window.addEventListener('blur', _markAway);
  window.addEventListener('focus', _markBack);

  // ---- 접속 현황용 하트비트: 화면이 보이는 동안만 45초마다 lastActive 갱신
  // (관리자 페이지 "지금 접속 중인 학생만 보기" 판정 기준) ----
  function _sendHeartbeat(){
    if(document.visibilityState !== 'visible') return;
    ensureDb().then((db)=> studentRef(db).set({ lastActive: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true }).catch(function(){}));
  }
  _sendHeartbeat();
  setInterval(_sendHeartbeat, 45000);
})();
</script>
