<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사건 A와 사건 B가 동시에</title>
<style>
:root{
  --ink:#1a1a2e;--ink2:#4a4a6a;--ink3:#9090b0;
  --indigo:#4f46e5;--indigo-l:#e0e7ff;--indigo-ll:#eef2ff;
  --green:#16a34a;--green-l:#dcfce7;--green-ll:#F0FDF4;
  --orange:#e05a20;--red:#dc2626;--red-l:#fee2e2;
  --colA:#2563eb;--colA-l:#dbeafe;--colB:#ea580c;--colB-l:#ffedd5;
  --r:12px;--shadow:0 2px 12px rgba(26,26,46,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--indigo-ll);color:var(--ink);min-height:100vh;padding-bottom:60px}
.hdr{background:var(--indigo);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px}
.hdr-title{font-size:16px;font-weight:700}
.main{max-width:1200px;margin:0 auto;padding:20px 16px}
.screen{display:none}
.screen.active{display:block}
.card{background:#fff;border-radius:var(--r);border:1px solid #e0e7ff;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
/* 강조 3단계: ① 핵심 질문(.key-q, 한 블록에 1개) ② 핵심어(.kw, 문단에 1~2개) ③ 보충(.sub) — 밑줄은 핵심 질문 안의 .em에만 */
.key-q{display:block;font-size:17px;font-weight:800;line-height:1.7;color:var(--ink);background:#fffbeb;border:1.5px solid #fcd34d;border-left:6px solid #f59e0b;border-radius:10px;padding:9px 14px 10px;margin:10px 0}
.key-q::before{content:'❓ 질문';display:block;font-size:11.5px;font-weight:800;color:#b45309;margin-bottom:1px}
.key-q.task::before{content:'✏️ 해 보기'}
.key-q .em{text-decoration:underline;text-decoration-color:#f59e0b;text-decoration-thickness:3px;text-underline-offset:4px}
.kw{font-weight:800;color:#be123c}
.sub{font-size:12.5px;color:var(--ink3);font-weight:600}
.reread{animation:rereadFlash 1.2s ease-out 2}
@keyframes rereadFlash{0%{box-shadow:0 0 0 5px #f59e0b;background-color:#fef3c7}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.lock-note{display:inline-block;margin-top:4px;font-size:12.5px;color:#b45309;background:#fef3c7;border-radius:8px;padding:2px 10px}
.ans-tag{font-size:12px;font-weight:800;color:#fff;background:var(--red);border-radius:8px;padding:2px 8px;line-height:1.6}
.hint-tag{display:block;margin-top:4px;font-size:12.5px;font-weight:700;color:#b45309}
.variant-banner{background:#fef3c7;border:1.5px solid #fcd34d;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;color:#92400e;margin-bottom:8px}
.it{font-style:italic;font-family:'Times New Roman',serif;font-weight:700;font-size:1.08em}

.split-layout{display:flex;gap:18px;align-items:flex-start}
.split-left{flex:0 0 450px;position:sticky;top:16px}
.split-right{flex:1 1 auto;min-width:0}
@media (max-width:980px){
  .split-layout{display:block}
  .split-left{position:static;width:100%;margin-bottom:14px}
  .split-left.board-sticky{position:sticky;top:0;z-index:5;max-height:50vh;overflow-y:auto}
}

.stepper{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.stepper .st{padding:5px 11px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12px;font-weight:700;color:var(--ink3)}
.stepper .st.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.stepper .st.done{background:var(--green-l);color:#14532d;border-color:var(--green)}

/* 왼쪽: 고르기 보드(옷·글자·떡볶이) */
.exp-head{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700;line-height:1.6;margin-bottom:10px}
.exp-badge{flex-shrink:0;background:var(--ink);color:#fff;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:12px;margin-top:2px}
.combo-top{display:flex;gap:12px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.preview{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:150px;min-height:120px;background:#fbfcff;border:1.5px dashed #d8ddfb;border-radius:12px;padding:8px}
.preview .big{font-size:58px;font-weight:800;line-height:1.1;color:var(--indigo)}
.preview .ph{font-size:12.5px;color:var(--ink3);font-weight:700;text-align:center;line-height:1.6}
.groups{display:flex;flex-direction:column;gap:10px;flex:1 1 180px}
.grp-title{display:inline-block;font-size:12px;font-weight:800;padding:2px 12px;border-radius:10px;color:#fff;margin-bottom:5px}
.grp-title.g0{background:var(--colA)}
.grp-title.g1{background:var(--colB)}
.grp-items{display:flex;gap:6px;flex-wrap:wrap}
.item{border:2px solid #d8ddfb;border-radius:10px;background:#fff;padding:4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;font-size:12px;font-weight:700;color:var(--ink2);min-width:44px}
.item.txt{font-size:15px;padding:6px 10px}
.item.sel0{border-color:var(--colA);background:var(--colA-l);color:var(--colA);box-shadow:0 0 0 2px var(--colA)}
.item.sel1{border-color:var(--colB);background:var(--colB-l);color:var(--colB);box-shadow:0 0 0 2px var(--colB)}
.item.static{cursor:default}
.combo-msg{text-align:center;font-size:13px;font-weight:800;min-height:20px;margin:8px 0 2px}
.combo-msg.new{color:var(--green)}
.combo-msg.dup{color:#b45309}
.gallery{margin-top:6px;background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:12px;padding:8px 10px}
.gallery .g-head{font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.gallery .g-list{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.g-item{display:flex;align-items:flex-end;gap:1px;border:1.5px solid #c7cdf5;border-radius:8px;background:#fff;padding:3px 5px;font-size:12px;font-weight:800;color:var(--ink2)}
.g-item.txt{font-size:16px;padding:3px 9px}
.board-tip{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-top:8px}
/* 나뭇가지 그림 */
.tree-wrap{display:flex;justify-content:center}
.tree-wrap svg{max-width:100%;height:auto}
.tree-wrap.flash svg{animation:boardFlash 1s ease-out}
@keyframes boardFlash{0%{filter:drop-shadow(0 0 6px #f59e0b)}100%{filter:none}}
/* 카드 보드 */
.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.ncard{width:46px;height:60px;border-radius:9px;border:2px solid #1a1a2e;font-size:24px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:0 2px 0 #1a1a2e}
.ncard.used{opacity:.3;cursor:default}
.slots{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin-bottom:6px}
.slot-box{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--ink2)}
.slot-box .sb{width:58px;height:70px;border:2.5px dashed #a5b4fc;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;background:#fbfcff}
.slot-box .sb.filled{border-style:solid;border-color:var(--indigo);background:#fff}
.card-msg{text-align:center;font-size:13px;font-weight:800;min-height:20px;margin:6px 0}
.card-msg.new{color:var(--green)}
.card-msg.dup{color:#b45309}
.card-msg.zero{color:var(--red)}
.made-rows{display:flex;flex-direction:column;gap:5px}
.made-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:700}
.made-row .lab{flex:0 0 auto;font-size:11.5px;color:var(--ink2);background:var(--indigo-l);border-radius:8px;padding:2px 8px}
.made-row .num{border:1.5px solid #c7cdf5;border-radius:6px;padding:1px 7px;background:#fff;font-weight:800}

/* 오른쪽 */
.panel-title{font-weight:800;font-size:15px;color:var(--indigo);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.step-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--indigo);color:#fff;font-size:12px;font-weight:800;flex-shrink:0}
.qblock{border-top:1px dashed #e0e7ff;padding-top:12px;margin-top:12px}
.qblock:first-child{border-top:none;padding-top:0;margin-top:0}
.lead{font-size:14px;line-height:1.8;color:var(--ink2);margin-bottom:8px}
.prob-box{background:#fbfcff;border:1.5px solid var(--indigo-l);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.85;margin-bottom:8px}
.count-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px;font-weight:700}
.blank{display:inline-block;width:56px;border:none;border-bottom:2px solid var(--indigo);background:transparent;text-align:center;font-weight:700;font-size:15px;font-family:inherit;padding:2px 4px;margin:0 2px;color:var(--indigo)}
.blank:focus{outline:none;border-bottom-color:#3730a3;background:var(--indigo-ll)}
.blank.correct{border-bottom-color:var(--green);background:var(--green-ll);color:#14532d}
.blank.wrong{border-bottom-color:var(--red);background:var(--red-l);color:var(--red)}
.formula{display:flex;align-items:flex-start;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0;font-size:16px;font-weight:800}
.formula .fcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.formula .fcol small{font-size:11.5px;font-weight:700;color:var(--ink2);text-align:center;max-width:130px;line-height:1.4}
.formula .op{padding-top:4px}
.formula .fixed{display:inline-block;min-width:56px;text-align:center;border-bottom:2px solid #c7cdf5;padding:2px 4px}
.choice-col{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.choice-btn{padding:9px 16px;border-radius:10px;border:1.5px solid #d8ddfb;background:#fff;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);font-family:inherit;text-align:left;line-height:1.5}
.choice-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.choice-btn.correct{background:var(--green);color:#fff;border-color:var(--green)}
.choice-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.choice-btn:disabled{cursor:default}
.btn{border:none;border-radius:12px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.btn:hover{background:#4338ca}
.btn:disabled{opacity:.4;cursor:default}
.btn-check{background:var(--green)}
.btn-check:hover{background:#15803d}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.feedback{text-align:center;font-size:13.5px;font-weight:700;min-height:20px;margin-top:8px;line-height:1.6}
.feedback.success{color:var(--green)}
.feedback.error{color:var(--red)}
.note-box{background:var(--green-ll);border:1.5px solid #bbf7d0;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.85;margin-top:10px}
.def-box{background:var(--indigo-ll);border:2px solid var(--indigo);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.9;margin-top:12px;text-align:center}
.modal-overlay.termpop{background:rgba(26,26,46,0.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.term-box{max-width:480px;width:100%}
.term-tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--indigo);border-radius:10px;padding:2px 10px;margin-bottom:8px}
.term-box .def-box{margin-top:0;text-align:left}
.term-box .def-box .blank{font-size:15px;color:#be123c}
.def-box.term-wait{visibility:hidden}
.def-box u{text-decoration-color:#f59e0b;text-decoration-thickness:3px;text-underline-offset:4px}
.warn-box{background:#fff7ed;border:1.5px solid #fdba74;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.85;margin-top:10px}
.sit-cards{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.sit-card{flex:1 1 200px;border:2px solid #d8ddfb;border-radius:12px;padding:12px;background:#fff;font-size:14px;font-weight:700;line-height:1.7;color:var(--ink)}
.sit-card .no{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:0 8px;font-size:12px;margin-bottom:4px}
.cls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 10px;border:1.5px solid #e0e7ff;border-radius:10px;margin-bottom:8px;background:#fff}
.cls-row.wrong{border-color:var(--red);background:var(--red-l)}
.cls-row.right{border-color:var(--green);background:var(--green-ll)}
.cls-row .ct{flex:1 1 240px;font-size:13.5px;font-weight:700;line-height:1.7}
.cls-row .cb{display:flex;gap:6px;flex-wrap:wrap}
.cls-row .cb .choice-btn{padding:5px 11px;font-size:12.5px}
.hint-card{background:#fff;border:1.5px solid #d8ddfb;border-radius:12px;padding:14px;font-size:13.5px;line-height:1.9}
.hint-card .hq{background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:10px;padding:8px 10px;margin-top:8px}
/* 정리 표 */
.cmp{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;font-size:14px;line-height:1.6;border:2px solid var(--indigo);border-radius:12px;overflow:hidden}
.cmp th,.cmp td{padding:9px 10px;text-align:center;border-bottom:1px solid #e0e7ff}
.cmp tr:last-child td,.cmp tr:last-child th{border-bottom:none}
.cmp thead th{background:var(--indigo-ll);font-weight:800}
.cmp tbody th{background:#fbfcff;font-size:12.5px;color:var(--ink2);font-weight:800;white-space:nowrap}
.cmp .calc{font-size:18px;font-weight:800}
.cmp td+td,.cmp th+td,.cmp thead th+th{border-left:1px solid #e0e7ff}
@media (max-width:600px){
  .cmp thead{display:none}
  .cmp,.cmp tbody,.cmp tr,.cmp th,.cmp td{display:block;width:100%}
  .cmp td::before{content:attr(data-h);display:block;font-size:12px;color:var(--indigo);font-weight:800}
  .cmp td+td,.cmp th+td{border-left:none}
}

.progress{text-align:center;font-size:12.5px;color:var(--ink3);font-weight:700;margin-bottom:6px}
.level-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.level-tab{padding:7px 16px;border-radius:20px;border:1.5px solid #d8ddfb;background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.level-tab.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.level-tab.done{background:var(--green-l);color:#14532d;border-color:var(--green)}

.result-wrap{text-align:center;padding:24px 10px}
.result-icon{font-size:48px;margin-bottom:10px}
.result-score{font-size:22px;font-weight:800;color:var(--indigo);margin:8px 0}
.primary-btn{padding:11px 26px;border-radius:8px;background:var(--indigo);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;margin-right:8px}
.restart-btn{padding:11px 26px;border-radius:8px;background:var(--ink);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.show{display:flex}
/* 확인 팝업: 뒤의 정리 내용이 보이지 않게 흐리게 */
.modal-overlay.gate{background:rgba(26,26,46,0.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal-box{background:#fff;border-radius:14px;padding:22px 20px;max-width:440px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(26,26,46,0.25)}
.modal-icon{font-size:34px;margin-bottom:8px}
.modal-text{font-size:14px;line-height:1.7;color:var(--ink);font-weight:600;margin-bottom:16px}
.modal-btn{border:none;border-radius:10px;padding:10px 22px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--indigo);color:#fff;font-family:inherit}
.gate-tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:#f59e0b;border-radius:10px;padding:2px 10px;margin-bottom:8px}
.gate-q{font-size:15.5px;font-weight:700;line-height:2;text-align:left;background:#fbfcff;border:1.5px solid #e0e7ff;border-radius:10px;padding:10px 12px;margin:6px 0 4px}
</style>
</head>
<body>

<div class="hdr">
  <a href="index.html" id="hubBackLink" style="background:rgba(255,255,255,.2);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;">← 학습 선택 목록으로 돌아가기</a>
  <span class="hdr-title">사건 A와 사건 B가 동시에 일어나는 경우의 수</span>
  <button id="adminBtn" onclick="openAdminModal()" style="margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;cursor:pointer;font-family:inherit">🔐 관리자 모드</button>
</div>
<script>document.getElementById('hubBackLink').href = 'index.html' + location.search;</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const s = { cls:p.get('cls'), num:p.get('num'), name:p.get('name'), id:p.get('id')||'event-and' };
  let _db=null;
  try{
    firebase.initializeApp({
      apiKey: "AIzaSyDUFYrqaVL12fZ7ZhExVyyjLWSE_XJ_bHs",
      authDomain: "nd-deogi-math-hub.firebaseapp.com",
      projectId: "nd-deogi-math-hub",
      storageBucket: "nd-deogi-math-hub.firebasestorage.app",
      messagingSenderId: "414096731864",
      appId: "1:414096731864:web:a799f9450859c498b6b1ad"
    });
    _db = firebase.firestore();
  }catch(e){ console.warn('hub firebase init:', e); }
  let _reported=false;
  window._reportHubComplete = function(){
    if(_reported || !_db || !s.cls || !s.num) return;
    _reported=true;
    window._pendingQuizComplete = _db.collection('classStudents').doc(String(s.cls)).collection('students').doc(String(s.num))
      .set({ name: s.name||'', itemsOpened: firebase.firestore.FieldValue.arrayUnion(s.id), quizSolveCount: firebase.firestore.FieldValue.increment(1), lastActive: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true})
      .catch(err=>console.warn('hub complete log failed', err));
  };
  // 완료 기록이 서버에 닿기 전에 페이지를 떠나지 않도록 잠깐 기다렸다가 이동
  document.getElementById('hubBackLink').addEventListener('click', function(e){
    if(!window._pendingQuizComplete) return;
    e.preventDefault();
    const href = this.href;
    Promise.race([window._pendingQuizComplete.catch(()=>{}), new Promise(r=>setTimeout(r,800))]).then(()=>{ location.href = href; });
  });
})();
function finishToHub(){ document.getElementById('hubBackLink').click(); }
</script>

<div class="main">

  <div class="stepper" id="stepper"></div>

  <div class="screen active" id="scAct">
    <div class="split-layout">
      <div class="split-left card" id="actLeft"></div>
      <div class="split-right card"><div id="actRight"></div></div>
    </div>
  </div>

  <div class="screen" id="scPractice">
    <div class="level-tabs" id="levelTabs"></div>
    <div class="split-layout">
      <div class="split-left card" id="pgLeft"></div>
      <div class="split-right card">
        <div class="progress" id="pgProgress"></div>
        <div id="pgArea"></div>
      </div>
    </div>
  </div>

  <div class="screen" id="scLevelResult">
    <div class="card">
      <div class="result-wrap">
        <div class="result-icon" id="lrIcon">🎉</div>
        <h2 id="lrTitle">통과했어요!</h2>
        <div class="result-score" id="lrScore">3 / 4</div>
        <p id="lrMsg" style="color:var(--ink2)"></p>
        <button class="restart-btn" id="lrRetryBtn" onclick="lrRetry()" style="display:none">🔄 다시 도전하기</button>
        <button class="primary-btn" id="lrNextBtn" onclick="lrNext()">다음 →</button>
      </div>
    </div>
  </div>

  <div class="screen" id="scDone">
    <div class="card">
      <div class="result-wrap">
        <div class="result-icon">🏁</div>
        <h2>학습 완료!</h2>
        <p style="color:var(--ink2);margin-top:8px;line-height:1.8">사건 A와 사건 B가 동시에 일어나는 경우의 수를 구하는 방법을 알아보고, 문제풀이까지 모두 마쳤어요.</p>
        <div class="result-score" id="doneStat" style="font-size:17px"></div>
        <button class="primary-btn" onclick="finishToHub()">✅ 학습 완료</button>
        <button class="restart-btn" onclick="location.reload()">🔄 처음부터 다시</button>
      </div>
    </div>
  </div>

</div>

<!-- 확인 팝업: 맞혀야 닫히고 활동이 이어짐 -->
<div class="modal-overlay gate" id="gateModal">
  <div class="modal-box" id="gateBox"></div>
</div>

<!-- 용어 팝업: 파란 정리 상자의 핵심 용어를 써야 닫힘 -->
<div class="modal-overlay termpop" id="termModal">
  <div class="modal-box term-box" id="termBox"></div>

<div class="modal-overlay" id="adminPwModal">
  <div class="modal-box">
    <div class="modal-icon">🔐</div>
    <div class="modal-text">관리자 비밀번호를 입력하세요</div>
    <input type="password" id="adminPwInput" class="blank" style="width:160px;margin-bottom:10px" onkeydown="if(event.key==='Enter')checkAdminPassword()">
    <div id="adminPwErr" style="color:var(--red);font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:4px"></div>

<div id="adminPanel" style="display:none;position:fixed;bottom:16px;left:16px;width:360px;max-height:70vh;overflow-y:auto;background:#fff;border:2px solid var(--indigo);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(26,26,46,0.3);z-index:60;font-size:12px;line-height:1.75">
  <div style="font-weight:800;color:var(--indigo);margin-bottom:8px">🔐 관리자 모드</div>
  <div id="adminPanelBody"></div>
  <button onclick="document.getElementById('adminPanel').style.display='none'" style="margin-top:8px;background:none;border:none;color:var(--ink3);font-size:11px;cursor:pointer;text-decoration:underline;font-family:inherit">숨기기</button>
</div>

<script>
/* ════════════════════════════════
   공용 헬퍼
════════════════════════════════ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr,n){ return shuffle(arr).slice(0,n); }
function randInt(lo,hi){ return lo+Math.floor(Math.random()*(hi-lo+1)); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function $(id){ return document.getElementById(id); }
function setFb(id, ok, msg){ const fb=$(id); fb.className='feedback '+(ok?'success':'error'); fb.innerHTML=msg; }
function parseCount(s){ const m=String(s||'').replace(/\s+/g,'').match(/^(\d+)(가지|개|권|벌|종류|장|명)?$/); return m?parseInt(m[1],10):null; }
// 받침에 따라 조사 고르기 (낱말, 숫자 모두)
const NUM_BATCHIM = [true,true,false,true,false,false,true,true,true,false];   // 영 일 이 삼 사 오 육 칠 팔 구
function hasBatchim(w){
  if(typeof w==='number' || /^\d+$/.test(String(w))){ return NUM_BATCHIM[Number(w)%10]; }   // 10, 20…은 '십'으로 끝나 받침 있음
  const c = String(w).charCodeAt(String(w).length-1);
  if(c>=0xAC00 && c<=0xD7A3) return (c-0xAC00)%28!==0;
  return 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ'.includes(String(w).slice(-1));
}
function josa(w, withB, noB){ return String(w) + (hasBatchim(w)?withB:noB); }
function itA(){ return '<span class="it">A</span>'; }
function itB(){ return '<span class="it">B</span>'; }
function ita(){ return '<span class="it">a</span>'; }
function itb(){ return '<span class="it">b</span>'; }

/* ════════════════════════════════
   읽기 확인 · 찍기 방지 (사건의_뜻.html, 사건_A_또는_사건_B.html과 같은 방식)
   - readGate: 질문이 뜨고 읽을 시간도 안 지나 고르면 채점하지 않고 질문을 다시 보게 함
   - wrongLock: 틀리면 몇 초 동안 잠그고(틀릴수록 길게) 보기 순서를 다시 섞음
   - firstTry: 질문마다 첫 시도만 기록 → 완료 화면에 '한 번에 맞힌 질문' 표시
   - 틀려도 정답은 보여 주지 않음
════════════════════════════════ */
const GUARD = { on:true };            // 검증 스크립트·관리자 시연에서만 끔
const LOCK_SECS = [3,5,8];
const stat = { seen:{}, total:0, first:0 };
const shown = {}, tries = {};
function firstTry(qid, ok){ if(qid in stat.seen) return; stat.seen[qid]=ok; stat.total++; if(ok) stat.first++; }
// 빈칸 채점 결과(true/false/null)를 첫 시도에 기록하고, 통과했는지 돌려줌
function graded(qid, r){ if(r===false) firstTry(qid,false); return r===true; }
function flashRef(ref){
  const el = typeof ref==='string' ? $(ref) : ref;
  if(!el) return;
  el.classList.remove('reread'); void el.offsetWidth; el.classList.add('reread');
}
function markShown(qid, blockId){
  const el = $(blockId);
  const len = el ? el.textContent.replace(/\s+/g,'').length : 40;
  shown[qid] = { t:Date.now(), need:Math.min(4000, Math.max(1500, len*25)), block:blockId };
}
function readGate(qid, fbId){
  const s = shown[qid];
  if(!GUARD.on || !s || Date.now()-s.t >= s.need) return true;
  setFb(fbId,false,'✋ 잠깐! 질문을 끝까지 읽고 골라 봐요.');
  const kq = document.querySelector('#'+s.block+' .key-q, #'+s.block+' .gate-q');
  if(kq) flashRef(kq);
  return false;
}
function lockSecs(qid){
  tries[qid] = (tries[qid]||0)+1;
  return GUARD.on ? LOCK_SECS[Math.min(tries[qid],LOCK_SECS.length)-1] : 0;
}
// secs초 동안 안내문에 남은 시간을 보여 준 뒤 onDone. anchor가 화면에서 사라지면(단계 이동) 멈춤
function lockTimer(secs, fbId, msg, what, anchor, onDone){
  if(!secs){ onDone(); return; }
  let left = secs;
  const paint = ()=>setFb(fbId,false,`${msg}<br><span class="lock-note">⏳ ${left}초 뒤에 ${what}</span>`);
  paint();
  const t = setInterval(()=>{
    if(!document.body.contains(anchor)){ clearInterval(t); return; }
    left--;
    if(left<=0){ clearInterval(t); onDone(); } else paint();
  }, 1000);
}
// o: {qid,row,fb,msg,refs,noShuffle,after}
function wrongLock(o){
  const row = $(o.row);
  const btns = [...row.querySelectorAll('button')];
  btns.forEach(b=>b.disabled=true);
  (o.refs||[]).forEach(flashRef);
  lockTimer(lockSecs(o.qid), o.fb, o.msg, '다시 고를 수 있어요', row, ()=>{
    btns.forEach(b=>{ b.disabled=false; b.classList.remove('wrong','active'); });
    if(!o.noShuffle) shuffle(btns).forEach(b=>b.parentNode.appendChild(b));
    setFb(o.fb,false,o.msg+'<br><span class="sub">다시 골라 보세요.</span>');
    if(o.after) o.after();
  });
}
// 객관식 한 문항 공통: 읽기 확인 → 첫 시도 기록 → 오답이면 잠금. 정답일 때만 true
function choiceGrade(q, btn, ok, wrongMsg, refs){
  if(btn.disabled || !readGate(q, q+'Fb')) return false;
  firstTry(q, ok);
  markChoice(q+'Row', btn, ok);
  if(!ok){ wrongLock({qid:q, row:q+'Row', fb:q+'Fb', msg:wrongMsg, refs}); return false; }
  return true;
}
const RETHINK = '❌ 다시 한 번 생각해 보세요!';

/* ════════════════════════════════
   그림: 재이와 옷
════════════════════════════════ */
const TOPS = [
  { name:'초록 맨투맨', short:'맨투맨', c:'#8fdcc4', d:'#2f9c7d', style:'sweat' },
  { name:'보라 점퍼',   short:'점퍼',   c:'#d9ccf5', d:'#7c63c9', style:'jacket' },
  { name:'빨간 셔츠',   short:'셔츠',   c:'#f2836b', d:'#b83e27', style:'shirt' }
];
const BOTTOMS = [
  { name:'베이지 바지', short:'베이지 바지', tag:'베이지', c:'#d9b98f', d:'#9a7447' },
  { name:'청바지',     short:'청바지',     tag:'청바지', c:'#40598a', d:'#22365c' }
];
const P_TOP = 'M20 3 L9 8 L2 22 L10 27 L15 20 L15 47 L45 47 L45 20 L50 27 L58 22 L51 8 L40 3 Q30 11 20 3 Z';
const P_BOT = 'M6 2 L34 2 L36 54 L23 54 L20 16 L17 54 L4 54 Z';
function topInner(t){
  let s = `<path d="${P_TOP}" fill="${t.c}" stroke="${t.d}" stroke-width="1.6" stroke-linejoin="round"/>`;
  if(t.style==='sweat') s += `<path d="M15 42 L45 42 M3.6 19.5 L10.6 23.5 M56.4 19.5 L49.4 23.5" stroke="${t.d}" stroke-width="1.3" fill="none"/><path d="M21 4.5 Q30 11.5 39 4.5" fill="none" stroke="${t.d}" stroke-width="1.3"/>`;
  if(t.style==='jacket') s += `<path d="M20 3 Q30 11 40 3 L42 6.5 Q30 15.5 18 6.5 Z" fill="#facc15" stroke="${t.d}" stroke-width="1"/><line x1="30" y1="11" x2="30" y2="47" stroke="#ca8a04" stroke-width="1.8"/><rect x="15" y="43" width="30" height="4" fill="#facc15" stroke="${t.d}" stroke-width="1"/>`;
  if(t.style==='shirt') s += `<path d="M20 3 L25 12 L30 8 L35 12 L40 3" fill="#fff" stroke="${t.d}" stroke-width="1.2" stroke-linejoin="round"/><line x1="30" y1="8" x2="30" y2="47" stroke="${t.d}" stroke-width="1"/>`+[17,26,35].map(y=>`<circle cx="30" cy="${y}" r="1.6" fill="#fff" stroke="${t.d}" stroke-width=".8"/>`).join('');
  return s;
}
function bottomInner(b){
  return `<path d="${P_BOT}" fill="${b.c}" stroke="${b.d}" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 8 L34 8" stroke="${b.d}" stroke-width="1.2"/>`;
}
function topSVG(t, w){ return `<svg width="${w}" height="${(w*50/60).toFixed(1)}" viewBox="0 0 60 50" style="display:block">${topInner(t)}</svg>`; }
function bottomSVG(b, h){ return `<svg width="${(h*40/56).toFixed(1)}" height="${h}" viewBox="0 0 40 56" style="display:block">${bottomInner(b)}</svg>`; }
// 재이: 고른 상의(t)·하의(b)를 입은 모습 (안 고른 쪽은 점선 자리)
function jaeSVG(t, b){
  const ghost = d => `<path d="${d}" fill="#fff" stroke="#a5b4fc" stroke-width="1.4" stroke-dasharray="4 3"/>`;
  return `<svg width="140" height="222" viewBox="0 0 140 222" style="display:block">
    <ellipse cx="58" cy="190" rx="11" ry="5.5" fill="#334155"/><ellipse cx="82" cy="190" rx="11" ry="5.5" fill="#334155"/>
    <g transform="translate(46,118) scale(1.2)">${b?bottomInner(b):ghost(P_BOT)}</g>
    <rect x="64" y="54" width="12" height="12" fill="#fde0c4" stroke="#1a1a2e" stroke-width="1.2"/>
    <g transform="translate(25,62) scale(1.5)">${t?topInner(t):ghost(P_TOP)}</g>
    <circle cx="31" cy="106" r="6" fill="#fde0c4" stroke="#1a1a2e" stroke-width="1.2"/><circle cx="109" cy="106" r="6" fill="#fde0c4" stroke="#1a1a2e" stroke-width="1.2"/>
    <circle cx="70" cy="36" r="22" fill="#fde0c4" stroke="#1a1a2e" stroke-width="1.4"/>
    <path d="M47.5 36 Q46 12 70 12 Q94 12 92.5 36 Q90 25 80 22 Q72 27 58 24 Q50 27 47.5 36 Z" fill="#3b2a20"/>
    <circle cx="62" cy="39" r="2.3" fill="#1a1a2e"/><circle cx="78" cy="39" r="2.3" fill="#1a1a2e"/>
    <circle cx="57" cy="46" r="3" fill="#fca5a5" opacity=".6"/><circle cx="83" cy="46" r="3" fill="#fca5a5" opacity=".6"/>
    <path d="M64 47 Q70 52.5 76 47" fill="none" stroke="#1a1a2e" stroke-width="1.6" stroke-linecap="round"/>
    <text x="70" y="214" text-anchor="middle" font-size="13" font-weight="800" fill="#4f46e5">재이</text>
  </svg>`;
}

/* ════════════════════════════════
   고르기 보드 (왼쪽): 두 묶음에서 하나씩 골라 만든 것을 모음
   kind: 'cloth'(재이 옷) | 'letter'(자음·모음) | 'tteok'(떡볶이)
════════════════════════════════ */
const CHO = { 'ㄱ':0, 'ㄴ':2, 'ㄷ':3 };
const JUNG = { 'ㅏ':0, 'ㅓ':4, 'ㅗ':8, 'ㅜ':13, 'ㅣ':20 };
function syllable(c, v){ return String.fromCharCode(0xAC00 + (CHO[c]*21 + JUNG[v])*28); }
const COMBO = {
  cloth:{ instr:'재이에게 상의와 하의를 각각 하나씩 골라 입힌다.', unit:'옷차림', groups:[{title:'상의', items:TOPS},{title:'하의', items:BOTTOMS}] },
  letter:{ instr:'자음 ㄱ, ㄴ, ㄷ과 모음 ㅏ, ㅓ, ㅗ, ㅜ, ㅣ 중에서 자음과 모음을 각각 하나씩 골라 글자를 만든다.', unit:'글자', groups:[{title:'자음', items:Object.keys(CHO)},{title:'모음', items:Object.keys(JUNG)}] },
  tteok:{ instr:'떡과 소스를 각각 하나씩 골라 떡볶이를 주문한다.', unit:'떡볶이', groups:[{title:'떡', items:['밀떡','쌀떡']},{title:'소스', items:['고추장','간장','짜장','크림']}] }
};
const cb = { key:'act', kind:null, sel:[null,null], made:[], msg:'', locked:false };
function setCombo(key, kind, opts){
  opts = opts||{};
  Object.assign(cb, { key, kind, sel:[null,null], made:[], msg:'', locked:!!opts.locked });
  renderCombo();
}
function itemFace(kind, g, it){
  if(kind==='cloth') return g===0 ? topSVG(it,46)+`<span>${it.short}</span>` : bottomSVG(it,40)+`<span>${it.short}</span>`;
  return it;
}
function madeFace(kind, i, j){
  const G = COMBO[kind].groups;
  if(kind==='cloth') return `<span class="g-item">${topSVG(G[0].items[i],24)}${bottomSVG(G[1].items[j],22)}</span>`;
  if(kind==='letter') return `<span class="g-item txt">${syllable(G[0].items[i],G[1].items[j])}</span>`;
  return `<span class="g-item">${G[0].items[i]}·${G[1].items[j]}</span>`;
}
function previewHTML(){
  const G = COMBO[cb.kind].groups, [i,j] = cb.sel;
  if(cb.kind==='cloth') return jaeSVG(i===null?null:G[0].items[i], j===null?null:G[1].items[j]);
  if(i===null || j===null){
    const want = i===null && j===null ? `${josa(G[0].title,'과','와')} ${josa(G[1].title,'을','를')}` : josa(i===null?G[0].title:G[1].title,'을','를');
    return `<div class="ph">${i!==null?`<b style="color:var(--colA);font-size:22px">${G[0].items[i]}</b><br>`:''}${j!==null?`<b style="color:var(--colB);font-size:22px">${G[1].items[j]}</b><br>`:''}${want} 골라 보세요</div>`;
  }
  if(cb.kind==='letter') return `<div class="big">${syllable(G[0].items[i],G[1].items[j])}</div>`;
  return `<div class="ph" style="color:var(--ink);font-size:15px">🍢<br><b>${G[0].items[i]}</b> + <b>${G[1].items[j]}</b><br>떡볶이</div>`;
}
function renderCombo(){
  const D = COMBO[cb.kind], left = $(cb.key+'Left');
  left.classList.add('board-sticky');
  const stc = cb.locked ? ' static' : '';
  const groups = D.groups.map((g,gi)=>`<div><span class="grp-title g${gi}">${g.title}</span><div class="grp-items">${g.items.map((it,ii)=>
    `<button class="item${cb.kind==='cloth'?'':' txt'}${cb.sel[gi]===ii?' sel'+gi:''}${stc}" onclick="pickItem(${gi},${ii})">${itemFace(cb.kind,gi,it)}</button>`).join('')}</div></div>`).join('');
  const msg = cb.msg==='new' ? `✨ 새로운 ${josa(D.unit,'이에요','예요')}!` : cb.msg==='dup' ? `이미 만든 ${josa(D.unit,'이에요','예요')}.` : '';
  const made = cb.made.map(k=>{ const [i,j]=k.split('-').map(Number); return madeFace(cb.kind,i,j); }).join('');
  left.innerHTML = `<div class="exp-head"><span class="exp-badge">${cb.kind==='cloth'?'함께 탐구':'고르기'}</span><span>${D.instr}</span></div>
    <div class="combo-top"><div class="preview">${previewHTML()}</div><div class="groups">${groups}</div></div>
    ${cb.locked?'':`<div class="combo-msg ${cb.msg}">${msg}</div>`}
    <div class="gallery" id="${cb.key}Gallery"><div class="g-head">📸 만든 ${D.unit}: ${cb.made.length}가지</div><div class="g-list">${made||'<span class="sub">아직 없어요.</span>'}</div></div>
    ${cb.locked?'':`<div class="board-tip">👆 ${josa(D.groups[0].title,'과','와')} ${josa(D.groups[1].title,'을','를')} 하나씩 누르면 만든 ${josa(D.unit,'이','가')} 아래에 모여요.</div>`}`;
}
function pickItem(g, i){
  if(cb.locked) return;
  cb.sel[g] = i;
  cb.msg = '';
  if(cb.sel[0]!==null && cb.sel[1]!==null){
    const k = cb.sel[0]+'-'+cb.sel[1];
    if(cb.made.includes(k)) cb.msg='dup'; else { cb.made.push(k); cb.msg='new'; }
  }
  renderCombo();
}

/* ════════════════════════════════
   나뭇가지 그림 (재이 옷)
   shown: 하의 가지를 그린 상의 번호 목록
════════════════════════════════ */
function treeSVG(shown){
  const W=400, H=280;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><text x="40" y="16" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">상의</text><text x="190" y="16" text-anchor="middle" font-size="12" font-weight="800" fill="#ea580c">하의</text>`;
  TOPS.forEach((t,i)=>{
    const y = 60 + i*88;
    s += `<g transform="translate(14,${y-22}) scale(.87)">${topInner(t)}</g>`;
    s += `<text x="40" y="${y+30}" text-anchor="middle" font-size="11" font-weight="700" fill="#4a4a6a">${t.short}</text>`;
    if(shown.includes(i)){
      BOTTOMS.forEach((b,j)=>{
        const by = y + (j===0?-24:24);
        s += `<line x1="76" y1="${y}" x2="170" y2="${by}" stroke="#4a4a6a" stroke-width="1.6"/>`;
        s += `<g transform="translate(174,${by-13}) scale(.46)">${bottomInner(b)}</g>`;
        s += `<text x="198" y="${by+4}" font-size="12" font-weight="700" fill="#1a1a2e">${b.tag}</text>`;
        s += `<text x="252" y="${by+4}" font-size="11.5" font-weight="700" fill="#4f46e5">→ (${t.short}, ${b.tag})</text>`;
      });
    } else {
      s += `<line x1="76" y1="${y}" x2="150" y2="${y}" stroke="#c7cdf5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="158" y="${y+4}" font-size="11.5" font-weight="700" fill="#9090b0">아직 안 그렸어요</text>`;
    }
  });
  return s + `</svg>`;
}
function setTree(key, shown, title){
  const left = $(key+'Left'); left.classList.add('board-sticky');
  const closet = `<div class="gallery" style="margin:0 0 10px"><div class="g-head">👕 재이의 옷장</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">

/* ════════════════════════════════
   숫자 카드 보드 (왼쪽): 십의 자리 → 일의 자리 차례로 카드를 놓아 두 자리 자연수 만들기
════════════════════════════════ */
const CARD_COLORS = ['#fef3c7','#dbeafe','#dcfce7','#fce7f3','#ede9fe','#ffedd5','#e0f2fe','#f1f5f9'];
const cd = { key:'act', digits:[], tens:null, ones:null, made:[], msg:'', locked:false, title:'' };
function setCards(key, digits, title, opts){
  opts = opts||{};
  Object.assign(cd, { key, digits:digits.slice(), tens:null, ones:null, made:[], msg:'', locked:!!opts.locked, title });
  renderCards();
}
function renderCards(){
  const left = $(cd.key+'Left'); left.classList.add('board-sticky');
  const used = i => cd.tens===i && cd.ones===null;
  const cards = cd.digits.map((d,i)=>`<button class="ncard${used(i)?' used':''}" style="background:${CARD_COLORS[i%CARD_COLORS.length]}" onclick="pickCard(${i})">${d}</button>`).join('');
  const sv = i => i===null ? '' : cd.digits[i];
  const num = cd.ones===null ? 0 : cd.digits[cd.tens]*10 + cd.digits[cd.ones];
  const msg = cd.msg==='new' ? `✨ ${josa(num,'을','를')} 만들었어요!`
            : cd.msg==='dup' ? `${josa(num,'은','는')} 이미 만든 수예요.`
            : cd.msg==='zero' ? '⚠️ 0이 십의 자리에 오면 두 자리 자연수가 되지 않아요.'
            : cd.tens!==null && cd.ones===null ? '이제 일의 자리에 놓을 카드를 눌러요.' : '';
  const tensDigits = [...new Set(cd.digits.filter(d=>d!==0))].sort((a,b)=>a-b);
  const rows = tensDigits.map(d=>{
    const ns = cd.made.filter(n=>Math.floor(n/10)===d).sort((a,b)=>a-b);
    return `<div class="made-row"><span class="lab">십의 자리 ${d}</span>${ns.map(n=>`<span class="num">${n}</span>`).join('')||'<span class="sub">-</span>'}</div>`;
  }).join('');
  left.innerHTML = `<div class="exp-head"><span class="exp-badge">카드</span><span>${cd.title}</span></div>
    ${cd.locked?'':`<div class="cards">${cards}</div>
    <div class="slots"><div class="slot-box"><div class="sb${cd.tens!==null?' filled':''}">${sv(cd.tens)}</div>십의 자리</div><div class="slot-box"><div class="sb${cd.ones!==null?' filled':''}">${sv(cd.ones)}</div>일의 자리</div></div>
    <div class="card-msg ${cd.msg}">${msg}</div>`}
    <div class="gallery" id="${cd.key}Made"><div class="g-head">📸 만든 두 자리 자연수: ${cd.made.length}개</div><div class="made-rows">${rows}</div></div>
    ${cd.locked?'':'<div class="board-tip">👆 십의 자리 → 일의 자리 순서로 카드를 눌러요. 한 장의 카드는 한 번만 쓸 수 있어요.</div>'}`;
}
function pickCard(i){
  if(cd.locked) return;
  if(cd.tens!==null && cd.ones!==null){ cd.tens=null; cd.ones=null; }
  if(cd.tens===null){
    if(cd.digits[i]===0){ cd.msg='zero'; renderCards(); return; }
    cd.tens=i; cd.msg='';
  } else {
    if(i===cd.tens) return;          // 이미 십의 자리에 놓은 카드
    cd.ones=i;
    const n = cd.digits[cd.tens]*10 + cd.digits[i];
    if(cd.made.includes(n)) cd.msg='dup'; else { cd.made.push(n); cd.msg='new'; }
  }
  renderCards();
}

/* ════════════════════════════════
   확인 팝업 — 맞혀야 닫힘. 틀리면 "다시 한 번 생각해 보세요!"만 (정답 공개 없음)
════════════════════════════════ */
const OP_ANS = {
  add:['+','＋','더하기','덧셈','합','더한다','더해요','플러스'],
  mul:['×','x','X','*','✕','곱하기','곱셈','곱','곱한다','곱해요']
};
function normOp(s){ return String(s||'').replace(/\s+/g,''); }
let gateCfg = null;
function openGate(cfg){
  gateCfg = cfg;
  $('gateBox').innerHTML = `<div class="gate-tag">🔑 확인 문제</div><div class="modal-text" style="margin-bottom:6px">${cfg.title}</div>
    <div id="gateBody">${cfg.body}</div>
    <div class="feedback" id="gateFb"></div>
    ${cfg.mc?'':`<div class="btn-row"><button class="modal-btn" id="gateBtn" onclick="gateCheck()">확인</button></div>`}`;
  $('gateModal').classList.add('show');
  if(cfg.onOpen) cfg.onOpen();
  const inp = $('gateBox').querySelector('input');
  if(inp){ inp.addEventListener('keydown', e=>{ if(e.key==='Enter') gateCheck(); }); try{ inp.focus(); }catch(e){} }
}
function closeGate(){ $('gateModal').classList.remove('show'); gateCfg = null; }
function gateCheck(){
  if(!gateCfg || gateCfg.mc) return;
  const inp = $('gateInp'), raw = inp.value.trim();
  if(raw===''){ setFb('gateFb',false,'빈칸을 채워 주세요.'); return; }
  const ok = gateCfg.ok(raw);
  firstTry(gateCfg.qid, ok);
  inp.classList.toggle('wrong',!ok); inp.classList.toggle('correct',ok);
  if(!ok){ setFb('gateFb',false,RETHINK); return; }
  setFb('gateFb',true,'✅ 맞아요!');
  const done = gateCfg.onPass;
  $('gateBtn').disabled = true;
  setTimeout(()=>{ closeGate(); done(); }, 500);
}
// 팝업 ① 지난 시간 떠올리기
function openGate1(onPass){
  openGate({ qid:'gate1', title:'지난 시간에 배운 것을 떠올려 봐요.',
    body:`<div class="gate-q">두 사건 ${itA()}, ${itB()}가 동시에 일어나지 않을 때,<br>(사건 ${itA()} 또는 사건 ${itB()}가 일어나는 경우의 수)<br>= ${ita()} <input class="blank" id="gateInp" style="width:52px"> ${itb()}</div><p class="sub" style="text-align:left">빈칸에 알맞은 기호를 써 보세요.</p>`,
    ok:raw=>OP_ANS.add.includes(normOp(raw)), onPass });
}
// 팝업 ③ 예제 2 핵심
function openGate3(onPass){
  openGate({ qid:'gate3', title:'카드로 두 자리 자연수를 만들 때를 떠올려 봐요.',
    body:`<div class="gate-q">숫자 1, 2, 3, 4가 적힌 카드로 두 자리 자연수를 만들 때,<br>십의 자리 숫자에 따라 일의 자리에 올 수 있는 숫자는 바뀌지만, 그 개수는 항상 <input class="blank" id="gateInp" style="width:52px">이에요.</div>`,
    ok:raw=>parseCount(raw)===3, onPass });
}
// 팝업 ④ 더할까, 곱할까? (객관식 — 틀리면 잠깐 잠근 뒤 새 문장)
const g4 = { item:null, used:new Set() };
function g4Next(){
  const fresh = SENTENCES.filter(x=>!g4.used.has(x));
  const p = pickN(fresh.length?fresh:SENTENCES, 1)[0];
  g4.used.add(p); g4.item = p;
}
function g4Render(){
  $('gateBody').innerHTML = `<div class="gate-q" id="g4Q">${g4.item.s}를 구할 때, <u>더할까요, 곱할까요?</u></div>
    <div class="btn-row" id="g4Row">${shuffle(['add','mul']).map(o=>`<button class="choice-btn" onclick="g4Pick('${o}',this)">${o==='add'?'더하기 (+)':'곱하기 (×)'}</button>`).join('')}</div>`;
  markShown('g4','gateBody');
}
function openGate4(onPass){
  g4.used = new Set(); g4Next();
  openGate({ qid:'g4', mc:true, title:'문제풀이에 들어가기 전, 마지막 점검!', body:'', onPass, onOpen:g4Render });
}
function g4Pick(o, btn){
  if(btn.disabled || !readGate('g4','gateFb')) return;
  const ok = o===g4.item.op;
  firstTry('g4', ok);
  markChoice('g4Row', btn, ok);
  if(ok){
    setFb('gateFb',true,'✅ 맞아요! 이제 문제를 풀어 봐요.');
    const done = gateCfg.onPass;
    setTimeout(()=>{ closeGate(); done(); }, 600);
    return;
  }
  $('g4Row').querySelectorAll('button').forEach(b=>b.disabled=true);
  lockTimer(lockSecs('g4'), 'gateFb', `${RETHINK}<br><span class="sub">${HINT[g4.item.t]}</span>`, '새 문장이 나와요', $('g4Row'), ()=>{
    g4Next(); g4Render();
    setFb('gateFb',false,'🔁 새 문장이에요. 끝까지 읽고 골라 보세요.');
  });
}

const STAGES = ['재이 옷 입히기','나뭇가지 그림','더할까, 곱할까?','정리','떡볶이 주문','두 자리 수 만들기','0 카드가 있으면?','문제풀이'];

function R(html){ $('actRight').innerHTML = html; }
function appendR(html){ $('actRight').insertAdjacentHTML('beforeend', html); }
function scrollToEl(id){ const el=$(id); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),60); }
/* ════════════════════════════════
   용어 팝업 — 파란 정리 상자를 핵심 용어 빈칸으로 먼저 띄우고, 써야 닫힘.
   틀리면 "다시 한 번 생각해 보세요!"만 (정답 공개 없음). 닫히면 화면의 상자가 나타남.
════════════════════════════════ */
let termCfg = null, termTimer = null;
function normTerm(s){ return String(s||'').replace(/[\s'"‘’“”.,!]/g,''); }
function termAfter(cfg, delay){
  clearTimeout(termTimer);
  termTimer = setTimeout(()=>{ if($(cfg.box)) openTermPop(cfg); }, delay==null ? 700 : delay);
}
function openTermPop(cfg){
  termCfg = cfg;
  const w = Math.max(...cfg.ans.map(a=>a.length))*1.1 + 1.6;
  $('termBox').innerHTML = `<div class="term-tag">📘 개념 정리</div><div class="modal-text" style="margin-bottom:8px">${cfg.title}<br><span style="color:var(--ink2);font-weight:600">빈칸에 알맞은 말을 써 보세요.</span></div>
    <div class="def-box">${cfg.html.replace('[[BLANK]]', `<input class="blank" id="termInp" style="width:${w}em" autocomplete="off">`)}</div>
    <div class="feedback" id="termFb"></div>
    <div class="btn-row"><button class="modal-btn" id="termBtn" onclick="termCheck()">확인</button></div>`;
  $('termModal').classList.add('show');
  const inp = $('termInp');
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') termCheck(); });
  try{ inp.focus(); }catch(e){}
}
function closeTermPop(){ clearTimeout(termTimer); $('termModal').classList.remove('show'); termCfg = null; }
function termCheck(){
  if(!termCfg || $('termBtn').disabled) return;
  const inp = $('termInp'), raw = normTerm(inp.value);
  if(raw===''){ setFb('termFb',false,'빈칸을 채워 주세요.'); return; }
  const ok = termCfg.ans.some(a=>normTerm(a)===raw);
  firstTry(termCfg.qid, ok);
  inp.classList.toggle('wrong',!ok); inp.classList.toggle('correct',ok);
  if(!ok){ setFb('termFb',false,'❌ 다시 한 번 생각해 보세요!'); return; }
  setFb('termFb',true,'✅ 맞아요!');
  $('termBtn').disabled = true;
  const box = termCfg.box;
  setTimeout(()=>{
    closeTermPop();
    const el = $(box); if(!el) return;
    el.classList.remove('term-wait'); flashRef(el); scrollToEl(box);
  }, 600);
}

function choiceCol(name, opts){
  return `<div class="choice-col" id="${name}Row">`+shuffle(opts).map(o=>`<button class="choice-btn" data-k="${o.key}" onclick="${name}Pick('${o.key}',this)">${o.label}</button>`).join('')+`</div>`;
}
function markChoice(rowId, btn, ok){
  document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.classList.remove('active','wrong'));
  btn.classList.add(ok?'correct':'wrong');
  if(ok) document.querySelectorAll('#'+rowId+' .choice-btn').forEach(b=>b.disabled=true);
}
// (A쪽) × (B쪽) = (전체). fixed: {a,b,t} 중 이미 주어진 값은 빈칸 대신 수로 보여 줌
function formulaHTML(prefix, labA, labB, labT, fixed){
  fixed = fixed||{};
  const cell = (k,lab) => `<div class="fcol">${k in fixed?`<span class="fixed">${fixed[k]}</span>`:`<input class="blank" id="${prefix}${k}">`}<small>${lab}</small></div>`;
  return `<div class="formula">${cell('a',labA)}<span class="op">×</span>${cell('b',labB)}<span class="op">=</span>${cell('t',labT)}</div>`;
}
// 숫자 빈칸 채점: items=[{id,val}]  true/false/null(빈칸 있음). 틀려도 정답은 보여 주지 않음
function checkNums(items, fbId, prefix){
  let empty=false, wrong=0;
  for(const it of items){
    const inp=$(it.id); const raw=inp.value.trim();
    if(raw===''){ empty=true; continue; }
    const n=parseCount(raw);
    if(n!==it.val){ wrong++; inp.classList.add('wrong'); inp.classList.remove('correct'); }
    else { inp.classList.remove('wrong'); }
  }
  if(wrong){ setFb(fbId,false,(prefix||'')+`❌ 빨간 빈칸을 다시 한 번 생각해 보세요!`); return false; }
  if(empty){ setFb(fbId,false,(prefix||'')+'빈칸을 모두 채워 주세요.'); return null; }
  items.forEach(it=>{ const inp=$(it.id); inp.classList.add('correct'); inp.disabled=true; });
  return true;
}

function s2RowInner(i){
  const p = s2.rows[i];
  return `<span class="ct">${p.t==='choose'?'🛍️':'🎲'} ${p.s}</span><span class="cb">${['add','mul'].map(c=>`<button class="choice-btn" onclick="s2Pick(${i},'${c}',this)">${c==='add'?'더하기 (+)':'곱하기 (×)'}</button>`).join('')}</span>`;
}
// 틀린 줄을 새 문장으로 — 보기가 두 개라 같은 줄을 다시 고르면 반대쪽만 눌러도 맞히게 되므로 바꿈 (더하기·곱하기는 무작위)
function s2NextSentence(){
  const fresh = SENTENCES.filter(x=>!s2.used.has(x));
  const pool = fresh.length ? fresh : SENTENCES.filter(x=>!s2.rows.includes(x));
  const p = pickN(pool,1)[0];
  s2.used.add(p);
  return p;
}
function s2Pick(i, c, btn){
  if($('s2cBtn').disabled || s2.locked || s2.done[i]) return;
  s2.pick[i] = c;
  $('s2r'+i).classList.remove('wrong','right');
  $('s2r'+i).querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function s2cCheck(){
  if($('s2cBtn').disabled || s2.locked) return;
  const pending = s2.rows.map((p,i)=>i).filter(i=>!s2.done[i]);
  const un = pending.filter(i=>!s2.pick[i]).length;
  if(un){ setFb('s2cFb',false,`아직 고르지 않은 줄이 ${un}개 있어요.`); return; }
  const wrongIdx = [];
  pending.forEach(i=>{
    const p = s2.rows[i], row = $('s2r'+i);
    if(s2.pick[i]===p.op){
      s2.done[i] = true; row.classList.remove('wrong'); row.classList.add('right');
      row.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
    } else {
      wrongIdx.push(i); row.classList.add('wrong');
      row.querySelector('.cb').innerHTML = `<span><span class="ans-tag">❌ 틀렸어요</span><span class="hint-tag">${HINT[p.t]}</span></span>`;
    }
  });
  firstTry('s2c', wrongIdx.length===0);
  if(wrongIdx.length){
    s2.locked = true;
    flashRef('s2Hint');
    const msg = `❌ ${wrongIdx.length}개가 틀렸어요. 왼쪽 카드의 질문을 떠올리며 다시 한 번 생각해 보세요!`;
    lockTimer(lockSecs('s2c'), 's2cFb', msg, '틀린 줄이 새 문장으로 바뀌어요', $('s2cBtn'), ()=>{
      wrongIdx.forEach(i=>{
        s2.rows[i] = s2NextSentence(); delete s2.pick[i];
        const row = $('s2r'+i); row.classList.remove('wrong'); row.innerHTML = s2RowInner(i);
      });
      s2.locked = false;
      setFb('s2cFb',false,`🔁 새 문장 ${wrongIdx.length}줄이 나왔어요. 끝까지 읽고 골라 보세요.`);
    });
    return;
  }
  $('s2cBtn').disabled = true;
  setFb('s2cFb',true,'✅ 모두 맞았어요!');
  appendR(`<div class="qblock" id="s2End">
    <div class="note-box">'또는', '동시에' 같은 낱말만 보고 고르면 틀리기 쉬워요. <span class="kw">상황을 떠올려 보고</span> 하나만인지, 둘 다인지 생각해요.</div>
    <div class="btn-row"><button class="btn" id="s2NextBtn" onclick="this.disabled=true;stage3()">다음: 정리하기 →</button></div>
  </div>`);
  scrollToEl('s2End');
}

  { q1:'어느 아이스크림 가게에 서로 다른 맛 {a}가지와 토핑 {b}가지가 있다. 맛과 토핑을 각각 하나씩 골라 주문하는 경우의 수를 구하려고 한다.',
    q2:'어느 아이스크림 가게에서 서로 다른 맛과 토핑을 각각 하나씩 골라 주문하는 경우의 수는 {t}이다. 맛이 {a}가지일 때, 토핑을 고르는 경우의 수를 구하려고 한다.',
    lA:'맛을 고르는<br>경우의 수', lB:'토핑을 고르는<br>경우의 수', lT:'아이스크림을<br>주문하는 경우의 수' }
];
// 방식1: a, b가 주어지고 곱을 구함 / 방식2: 전체와 한쪽이 주어지고 다른 쪽을 구함 (주어진 값 ↔ 미지수 바꿔치기)
function buildL1(tpl, mode){
  let a=randInt(2,6), b=randInt(2,6); while(b===a) b=randInt(2,6);
  const t=a*b;
  const text = (mode===1?tpl.q1:tpl.q2).replace('{a}',a).replace('{b}',b).replace('{t}',t);
  return { kind:'L1', mode, tpl, a, b, t, text };
}
// 레벨2: kind 'no0'(0 없는 카드) | 'with0'(0 있는 카드) | 'rev'(개수가 주어지고 카드 수를 구함)
function sameDigits(a, b){ return a.length===b.length && a.every((v,i)=>v===b[i]); }
function buildL2(kind){
  if(kind==='rev'){
    const n = pickN([3,5,6,7],1)[0];
    return { kind, n, a:n, b:n-1, t:n*(n-1) };
  }
  let ds;
  do {
    const k = kind==='no0' ? randInt(3,6) : randInt(3,5);
    ds = pickN([1,2,3,4,5,6,7,8,9], k).sort((x,y)=>x-y);
    if(kind==='with0') ds = [0, ...ds];
  } while(sameDigits(ds,[1,2,3,4]) || sameDigits(ds,[0,1,2,3,4]));
  const m = ds.length, a = kind==='no0' ? m : m-1, b = m-1;
  return { kind, digits:ds, a, b, t:a*b };
}
function l2Text(q){
  if(q.kind==='rev') return `1부터 □까지의 자연수가 각각 하나씩 적힌 □장의 카드 중에서 두 장을 동시에 뽑아 만들 수 있는 두 자리 자연수가 모두 ${q.t}개일 때, □ 안에 알맞은 수를 구하시오.`;
  return `숫자 ${q.digits.slice(0,-1).join(', ')}, ${josa(q.digits[q.digits.length-1],'이','가')} 각각 하나씩 적힌 ${q.digits.length}장의 카드 중에서 두 장을 동시에 뽑아 만들 수 있는 두 자리 자연수의 개수를 구하시오.`;
}
const LEVELS = [ { label:'레벨1 · 각각 하나씩 고르기', passNeeded:3, n:4 }, { label:'레벨2 · 카드로 두 자리 수', passNeeded:3, n:4 } ];
const pst = { levelIdx:0, idx:0, correct:0, order:[], firstTry:true, passedLevels:{} };
let practiceOpened = false;
function goToPractice(){
  curStage=7; renderStepper();
  if(practiceOpened){ startLevel(0); return; }
  openGate4(()=>{ practiceOpened = true; startLevel(0); });
}
function updateLevelTabs(){
  $('levelTabs').innerHTML = LEVELS.map((lv,i)=>`<div class="level-tab ${i===pst.levelIdx?'active':(pst.passedLevels[i]?'done':'')}">${lv.label}</div>`).join('');
}
function startLevel(levelIdx){
  closeGate();
  pst.levelIdx = levelIdx; pst.idx=0; pst.correct=0;
  if(levelIdx===0){
    const tpls = pickN(L1_TEMPLATES, 4);
    const modes = shuffle([1,1,2,2]);
    pst.order = tpls.map((t,i)=>buildL1(t, modes[i]));
  } else {
    pst.order = shuffle(['no0','with0','with0','rev']).map(buildL2);
  }
  showScreen('scPractice'); updateLevelTabs(); renderPQuestion();
}
// 틀리면 같은 상황·같은 방식으로 숫자만 바꾼 새 문제 (숫자를 바꿔 넣어 보며 맞히는 것을 막음)
function makeVariant(q){
  let v;
  if(q.kind==='L1'){ do { v = buildL1(q.tpl, q.mode); } while(v.a===q.a && v.b===q.b); }
  else if(q.kind==='rev'){ do { v = buildL2('rev'); } while(v.n===q.n); }
  else { do { v = buildL2(q.kind); } while(sameDigits(v.digits, q.digits)); }
  v.variant = true;
  return v;
}
function renderPQuestion(keepFail){
  const lv = LEVELS[pst.levelIdx], q = pst.order[pst.idx];
  pst.firstTry = !keepFail;
  $('pgProgress').textContent = `${lv.label} · ${pst.idx+1} / ${pst.order.length}`;
  const banner = q.variant ? `<div class="variant-banner">🔁 숫자가 바뀐 새 문제예요. 이 문제를 맞혀야 다음으로 넘어가요. <span class="sub">(점수에는 들어가지 않아요.)</span></div>` : '';
  let body;
  if(q.kind==='L1'){
    const left=$('pgLeft'); left.classList.remove('board-sticky');
    left.innerHTML = `<div class="hint-card"><div style="font-weight:800;margin-bottom:6px">🔎 확인할 것</div>
      ① 무엇과 무엇을 고르는지 확인해요.<br>② 하나만 고르면 끝나나요, 둘 다 골라야 끝나나요?<br>③ 둘 다 골라야 끝나면 각각의 경우의 수를 곱해요.</div>`;
    const fixed = q.mode===2 ? {a:q.a, t:q.t} : {};
    body = `<div class="prob-box">${q.text}</div>
      <p class="key-q task">빈칸에 알맞은 수를 써 보자.</p>
      ${formulaHTML('pg', q.tpl.lA, q.tpl.lB, q.tpl.lT, fixed)}`;
  } else {
    if(q.kind==='rev'){
      const left=$('pgLeft'); left.classList.remove('board-sticky');
      left.innerHTML = `<div class="hint-card"><div style="font-weight:800;margin-bottom:6px">🔎 확인할 것</div>
        ① 카드가 □장이면 십의 자리에 올 수 있는 숫자는 몇 가지일까요?<br>② 그 각각에 대하여 일의 자리에 올 수 있는 숫자는 몇 가지일까요?<br>③ 곱한 값이 ${josa(q.t,'이','가')} 되는 □를 찾아요.</div>`;
      body = `<div class="prob-box">${l2Text(q)}</div>
        <p class="key-q task">빈칸에 알맞은 수를 써 보자.</p>
        ${formulaHTML('pg','십의 자리에 올 수 있는<br>숫자의 개수','일의 자리에 올 수 있는<br>숫자의 개수','두 자리 자연수의<br>개수',{t:q.t})}
        <div class="count-row" style="justify-content:center">□ = <input class="blank" id="pgn"></div>`;
    } else {
      setCards('pg', q.digits, `숫자 ${q.digits.slice(0,-1).join(', ')}, ${josa(q.digits[q.digits.length-1],'이','가')} 적힌 ${q.digits.length}장의 카드`);
      body = `<div class="prob-box">${l2Text(q)}</div>
        <p class="key-q task">빈칸에 알맞은 수를 써 보자.</p>
        <p class="sub">왼쪽 카드로 직접 만들어 보며 확인해도 좋아요.</p>
        ${formulaHTML('pg','십의 자리에 올 수 있는<br>숫자의 개수','일의 자리에 올 수 있는<br>숫자의 개수','두 자리 자연수의<br>개수')}`;
    }
  }
  $('pgArea').innerHTML = `${banner}${body}
    <div class="btn-row"><button class="btn btn-check" id="pgBtn" onclick="pgCheck()">확인</button></div>
    <div class="feedback" id="pgFb"></div><div class="btn-row" id="pgNextRow"></div>`;
}
function pgItems(q){
  const items = [];
  if(!(q.kind==='L1' && q.mode===2)) items.push({id:'pga',val:q.a});
  items.push({id:'pgb',val:q.b});
  if(!(q.kind==='L1' && q.mode===2) && q.kind!=='rev') items.push({id:'pgt',val:q.t});
  if(q.kind==='rev') items.push({id:'pgn',val:q.n});
  return items;
}
function pgCheck(){
  if($('pgBtn').disabled) return;   // 이미 통과한 문제는 다시 채점하지 않음
  const q = pst.order[pst.idx];
  const items = pgItems(q);
  const r = checkNums(items, 'pgFb');
  if(r===false){
    // 정답은 보여 주지 않고, 잠깐 뒤 숫자만 바꾼 새 문제로
    pst.firstTry = false;
    items.forEach(it=>$(it.id).disabled=true); $('pgBtn').disabled = true;
    lockTimer(lockSecs('pg'+pst.levelIdx+'-'+pst.idx), 'pgFb', RETHINK, '숫자가 바뀐 새 문제가 나와요', $('pgBtn'), ()=>{
      pst.order[pst.idx] = makeVariant(q);
      renderPQuestion(true);
    });
    return;
  }
  if(r!==true) return;
  $('pgBtn').disabled = true;
  if(pst.firstTry) pst.correct++;
  setFb('pgFb',true, pst.firstTry ? '✅ 정답이에요!' : '✅ 맞아요! (다시 풀어서 맞힌 문제는 점수에 들어가지 않아요.)');
  $('pgNextRow').innerHTML = `<button class="btn" id="pgNextBtn" onclick="this.disabled=true;pgNext()">${pst.idx<pst.order.length-1?'다음 문제 →':'결과 보기 →'}</button>`;
}
function pgNext(){ pst.idx++; if(pst.idx < pst.order.length) renderPQuestion(); else levelFinish(); }
function levelFinish(){
  const lv = LEVELS[pst.levelIdx];
  const pass = pst.correct >= lv.passNeeded;
  if(pass) pst.passedLevels[pst.levelIdx] = true;
  updateLevelTabs(); showScreen('scLevelResult');
  $('lrIcon').textContent = pass?'🎉':'💪';
  $('lrTitle').textContent = pass ? `${lv.label.split(' ·')[0]} 통과!` : `${lv.label.split(' ·')[0]} 아쉬워요`;
  $('lrScore').textContent = `${pst.correct} / ${pst.order.length}`;
  $('lrMsg').textContent = pass ? '잘했어요! 다음으로 넘어가 볼까요?' : `한 번에 맞힌 문제가 ${lv.passNeeded}개 이상이어야 통과해요. 다시 도전해 볼까요?`;
  $('lrRetryBtn').style.display = pass ? 'none' : '';
  $('lrNextBtn').style.display = pass ? '' : 'none';
  $('lrNextBtn').textContent = (pst.levelIdx < LEVELS.length-1) ? '다음 레벨 →' : '결과 보기 →';
}
function lrRetry(){ startLevel(pst.levelIdx); }
function lrNext(){
  if(pst.levelIdx < LEVELS.length-1){ startLevel(pst.levelIdx+1); }
  else {
    curStage = STAGES.length; renderStepper(); showScreen('scDone');
    $('doneStat').innerHTML = stat.total ? `탐구하면서 한 번에 맞힌 질문: ${stat.first} / ${stat.total}` : '';
    if(window._reportHubComplete) window._reportHubComplete();
  }
}

/* ════════════════════════════════
   관리자 모드 (SHA-256 해시 비교 — 가벼운 잠금일 뿐, 보안 장치 아님)
════════════════════════════════ */
const ADMIN_HASH = 'fb9e692b52ad41cd666f83c8175df90569d48192d531e9c94285929bc116891a';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function openAdminModal(){ $('adminPwInput').value=''; $('adminPwErr').textContent=''; $('adminPwModal').classList.add('show'); $('adminPwInput').focus(); }
async function checkAdminPassword(){
  const v = $('adminPwInput').value;
  let ok=false;
  try{ ok = (await sha256Hex(v)) === ADMIN_HASH; }
  catch(e){ $('adminPwErr').textContent='이 브라우저에서는 관리자 모드를 쓸 수 없어요.'; return; }
  if(!ok){ $('adminPwErr').textContent='비밀번호가 틀렸어요.'; return; }
  $('adminPwModal').classList.remove('show');
  const btn = (label, fn) => `<button class="modal-btn" style="padding:2px 8px;font-size:10.5px" onclick="${fn}">${label}</button>`;
  $('adminPanelBody').innerHTML =
    '<div class="btn-row" style="justify-content:flex-start;margin:0 0 8px">'+
      STAGES.map((s,i)=>btn(`${i+1}.${s}`,`adminGo(${i})`)).join('')+btn('레벨2','adminGo(8)')+btn('팝업 통과','adminPassGate()')+
    '</div>'+
    '<div><strong>숫자 빈칸 인정 형식</strong>: 6 (= 6가지 = 6개 = 6벌 = 6권 = 6종류 = 6장 = 6명, 띄어쓰기 무시)</div>'+
    `<div><strong>기호 빈칸</strong>: 더하기 ${OP_ANS.add.join(' ')} / 곱하기 ${OP_ANS.mul.join(' ')}</div>`+
    '<div><strong>1단계</strong>: 6가지 (6가지를 모두 직접 만들어야 통과)</div>'+
    '<div><strong>2단계</strong>: 하의 2 / 어떤 상의든 2가지씩 / 3×2=6 / 2가 3번(2+2+2)</div>'+
    '<div><strong>팝업①</strong> (3단계 시작): a ( + ) b</div>'+
    '<div><strong>3단계</strong>: 상황1 5, 상황2 6 / 하나만 고르면 끝 vs 둘 다 골라야 끝 / 문장 분류(고르기 2 + 던지기 2, 더하기·곱하기 섞음)</div>'+
    '<div style="margin-left:8px">문장 풀:<br>'+SENTENCES.map(x=>`${x.t==='choose'?'🛍️':'🎲'} ${x.s} → ${x.op==='add'?'더하기':'곱하기'}`).join('<br>')+'</div>'+
    '<div><strong>4단계</strong>: 스스로 확인 3×5=15</div>'+
    '<div><strong>5단계</strong>: 2×4=8 / 순서 바꿔도 같다(4×2=8)</div>'+
    '<div><strong>6단계</strong>: 12개 (모두 직접 만들어야 통과) / 4, 3, 3 / 4×3=12 / 쓴 카드는 다시 못 씀</div>'+
    '<div><strong>팝업③</strong> (6단계 끝): 그 개수는 항상 ( 3 )</div>'+
    '<div><strong>7단계</strong>: 0은 십의 자리 불가 / 일의 자리 0 가능 / 4×4=16</div>'+
    '<div><strong>팝업④</strong> (문제풀이 전): 문장 풀에서 한 문장 → 더하기·곱하기</div>'+
    '<div><strong>레벨1</strong>: 상황 6개 × 방식1(a, b 주고 곱)·방식2(전체와 한쪽 주고 다른 쪽) — 빈칸은 (A쪽)×(B쪽)=(전체) 순서 고정, a·b는 2~6 서로 다른 수</div>'+
    '<div><strong>레벨2</strong>: 0 없는 카드 1 + 0 있는 카드 2 + 거꾸로 1 (카드는 무작위, 교과서 예제 2·문제 6과 같은 카드는 제외) — 0 없음 n×(n−1), 0 있음 (n−1)×(n−1), 거꾸로 □=n이고 n×(n−1)=개수</div>'+
    '<div><strong>용어 팝업</strong>: (4단계 정리 상자) a ( × ) b — 기호 빈칸과 같은 형식 인정 (띄어쓰기·따옴표·마침표 무시)</div>'+
    '<div style="color:var(--red);margin-top:6px">미인정: "여섯"처럼 한글 수사 / 곱셈식 두 빈칸의 순서를 바꿔 쓴 경우 (예: 2×3=6)</div>'+
    '<div style="margin-top:6px"><strong>찍기 방지</strong>: 질문이 뜬 뒤 1.5~4초 안에 고르면 채점 안 함 · 틀리면 3→5→8초 잠금 후 보기 다시 섞기 · 문장 분류와 팝업④의 틀린 문장은 새 문장으로 교체 · 문제풀이 오답은 숫자만 바꾼 새 문제 (모두 정답 공개 안 함)</div>'+
    `<label style="display:block;margin-top:6px"><input type="checkbox" ${GUARD.on?'':'checked'} onchange="GUARD.on=!this.checked"> 시연용: 읽기 확인·잠금 끄기</label>`;
  $('adminPanel').style.display='block';
}
function adminPassGate(){ if(!gateCfg) return; const done = gateCfg.onPass; closeGate(); done(); }
function adminGo(i){
  closeTermPop();
  closeGate();
  const f=[stage0,stage1,stage2,stage3,stage4,stage5,stage6,()=>{ practiceOpened=true; goToPractice(); }];
  if(i<8) f[i](); else { curStage=7; renderStepper(); startLevel(1); }
}

stage0();
</script>
